<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WidR School: A Rankingland Story</title>
<style>
:root{
  --ink:#2b2340; --paper:#fff8ee; --pink:#ff6f9f; --pink2:#ffd3e2; --mint:#7fd6c2;
  --sun:#ffc94d; --sky:#8ec5ff; --line:#2b2340;
  --display: "Chalkboard SE","Marker Felt","Comic Sans MS","Trebuchet MS",cursive;
  --body: "Avenir Next","Gill Sans","Trebuchet MS",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fbe7d6;font-family:var(--body);color:var(--ink);overflow:hidden}
#game{position:fixed;inset:0;bottom:52px;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:min(100vw,calc((100vh - 52px)*16/9));aspect-ratio:16/9;max-height:calc(100vh - 52px);overflow:hidden;border-radius:18px;box-shadow:0 0 0 4px var(--line),10px 10px 0 4px var(--line);background:#fff}
#bg{position:absolute;inset:0;transition:opacity .5s}
#bg svg{width:100%;height:100%;display:block}
#cast{position:absolute;inset:0;pointer-events:none}
.char{position:absolute;bottom:-4%;height:92%;aspect-ratio:3/5;transform:translateX(-50%);transition:left .45s cubic-bezier(.5,1.6,.4,1),filter .3s,opacity .4s}
.char svg{width:100%;height:100%;display:block;filter:drop-shadow(4px 4px 0 rgba(43,35,64,.25))}
.char.dim{filter:brightness(.82) saturate(.8)}
.char.enter{animation:pop .45s cubic-bezier(.5,1.7,.4,1)}
@keyframes pop{from{transform:translateX(-50%) translateY(14%);opacity:0}to{transform:translateX(-50%);opacity:1}}
.char.talk svg{animation:bob .5s ease-in-out}
@keyframes bob{50%{transform:translateY(-1.5%)}}

#box{position:absolute;left:3%;right:3%;bottom:3%;min-height:27%;background:var(--paper);border:3px solid var(--line);border-radius:16px;padding:3.2% 3% 2.4%;box-shadow:6px 6px 0 var(--line);cursor:pointer;
  background-image:repeating-linear-gradient(transparent 0 calc(1.6em - 1px),rgba(142,197,255,.35) calc(1.6em - 1px) 1.6em);}
#box::before{content:"";position:absolute;left:5%;top:0;bottom:0;border-left:2px solid rgba(255,111,159,.35)}
#name{position:absolute;top:-1.1em;left:4%;font-family:var(--display);font-size:clamp(14px,2.1vw,26px);padding:.15em .8em;border:3px solid var(--line);border-radius:12px;background:var(--pink);color:#fff;transform:rotate(-2deg);box-shadow:3px 3px 0 var(--line)}
#name:empty{display:none}
#text{font-size:clamp(13px,1.75vw,22px);line-height:1.6;min-height:3.2em;padding-left:3%}
#text.narr{font-style:italic;color:#5c5175}
#next{position:absolute;right:2.2%;bottom:6%;font-size:clamp(12px,1.6vw,20px);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
#choices{position:absolute;inset:0 0 34% 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2%;pointer-events:none}
#choices button{pointer-events:auto;font-family:var(--body);font-weight:600;font-size:clamp(12px,1.6vw,20px);width:62%;padding:1.1% 2%;border:3px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);box-shadow:4px 4px 0 var(--line);cursor:pointer;transition:transform .12s,background .12s;animation:pop2 .35s backwards}
#choices button:nth-child(2){animation-delay:.06s}#choices button:nth-child(3){animation-delay:.12s}#choices button:nth-child(4){animation-delay:.18s}
@keyframes pop2{from{transform:scale(.8);opacity:0}}
#choices button:hover{background:var(--pink2);transform:translate(-2px,-2px) rotate(-.5deg)}
#hud{position:absolute;top:2.5%;right:2%;display:flex;gap:8px;z-index:5}
.hbtn{font-family:var(--display);font-size:clamp(11px,1.3vw,16px);background:#fff;border:3px solid var(--line);border-radius:10px;padding:.25em .7em;box-shadow:3px 3px 0 var(--line);cursor:pointer}
#chapter{position:absolute;top:2.5%;left:2%;z-index:5;font-family:var(--display);font-size:clamp(11px,1.3vw,16px);background:var(--sun);border:3px solid var(--line);border-radius:10px;padding:.25em .8em;transform:rotate(-1.5deg);box-shadow:3px 3px 0 var(--line)}
#chapter:empty{display:none}
#journal{position:absolute;top:12%;right:2%;width:30%;background:var(--paper);border:3px solid var(--line);border-radius:14px;padding:2%;box-shadow:5px 5px 0 var(--line);z-index:6;display:none;font-size:clamp(11px,1.3vw,16px)}
#journal h3{font-family:var(--display);margin:0 0 .5em}
#journal .row{display:flex;justify-content:space-between;margin:.35em 0;align-items:center}
#journal .hearts{letter-spacing:2px;color:var(--pink)}
#journal small{display:block;margin-top:.6em;color:#7a6e8f}

#fx{position:absolute;inset:0;pointer-events:none;z-index:4}
.flash{animation:flash .6s}
@keyframes flash{0%{background:rgba(255,255,255,.95)}100%{background:transparent}}
.shake{animation:shake .5s}
@keyframes shake{20%{transform:translateX(-1.5%)}40%{transform:translateX(1.5%)}60%{transform:translateX(-1%)}80%{transform:translateX(1%)}}
.sparkle span{position:absolute;font-size:3vw;animation:spk 1.4s forwards}
@keyframes spk{from{transform:scale(0) rotate(0);opacity:1}to{transform:scale(1.4) rotate(180deg) translateY(-40%);opacity:0}}
.siren{animation:siren .5s 6 alternate}
@keyframes siren{from{box-shadow:inset 0 0 12vw rgba(255,40,60,.55)}to{box-shadow:inset 0 0 12vw rgba(40,90,255,.55)}}

/* title + ending cards */
.card{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4%;
  background:radial-gradient(circle at 20% 20%,#ffe0ec 0 18%,transparent 19%),radial-gradient(circle at 85% 75%,#d9f3ec 0 22%,transparent 23%),radial-gradient(circle at 80% 15%,#fff1c4 0 10%,transparent 11%),var(--paper)}
.card h1{font-family:var(--display);font-size:clamp(28px,6vw,78px);margin:0;line-height:1;color:var(--pink);text-shadow:4px 4px 0 var(--line);-webkit-text-stroke:2px var(--line);transform:rotate(-3deg)}
.card h2{font-family:var(--display);font-size:clamp(14px,2.2vw,28px);margin:.6em 0 .2em}
.card p{max-width:62%;font-size:clamp(12px,1.6vw,19px);line-height:1.55}
.card .tag{font-family:var(--display);background:var(--mint);border:3px solid var(--line);border-radius:999px;padding:.2em 1em;font-size:clamp(11px,1.4vw,17px);box-shadow:3px 3px 0 var(--line);transform:rotate(2deg);margin-bottom:1em}
.card input{font-family:var(--body);font-size:clamp(13px,1.7vw,20px);padding:.5em 1em;border:3px solid var(--line);border-radius:12px;text-align:center;width:min(320px,50%);margin:1em 0 .6em;box-shadow:3px 3px 0 var(--line)}
.card .big{font-family:var(--display);font-size:clamp(14px,2vw,24px);background:var(--pink);color:#fff;border:3px solid var(--line);border-radius:14px;padding:.4em 1.6em;box-shadow:4px 4px 0 var(--line);cursor:pointer;margin:.3em}
.card .big:hover{transform:translate(-2px,-2px)}
.card .faces{display:flex;gap:1%;height:34%;margin-top:1.5%}
.card .faces div{height:100%;aspect-ratio:3/5;overflow:hidden}
.card .faces svg{width:100%;height:160%;}
.card .sub{font-size:clamp(11px,1.3vw,15px);color:#7a6e8f}
/* ranking board */
#rankboard{position:absolute;inset:0;z-index:8;display:none;align-items:center;justify-content:center;background:rgba(43,35,64,.35);cursor:pointer}
#rankboard .sheet{width:min(56%,620px);max-height:86%;overflow:auto;background:var(--paper);border:3px solid var(--line);border-radius:16px;box-shadow:8px 8px 0 var(--line);padding:2.2% 2.6%;transform:rotate(-1deg);animation:pop2 .35s}
#rankboard h3{font-family:var(--display);margin:0;font-size:clamp(16px,2.4vw,30px);color:var(--pink);text-shadow:2px 2px 0 var(--line);-webkit-text-stroke:1px var(--line)}
#rankboard .why{font-size:clamp(10px,1.2vw,14px);color:#7a6e8f;margin:.3em 0 .7em}
#rankboard ol{list-style:none;margin:0;padding:0;font-size:clamp(11px,1.35vw,17px)}
#rankboard li{display:grid;grid-template-columns:2.2em 1fr auto auto;gap:.6em;align-items:center;padding:.22em .5em;border-radius:8px}
#rankboard li:nth-child(odd){background:rgba(142,197,255,.15)}
#rankboard li.me{background:var(--sun);border:2px solid var(--line);font-weight:700;animation:me 1s ease-in-out 2}
@keyframes me{50%{transform:scale(1.03)}}
#rankboard li .n{font-family:var(--display)}
#rankboard li .tier{font-size:.75em;padding:.05em .5em;border-radius:999px;border:2px solid var(--line)}
.t1{background:var(--pink);color:#fff}.t2{background:var(--mint)}.t3{background:#fff}.t4{background:#ddd}
#rankboard .delta{font-family:var(--display);font-size:clamp(13px,1.7vw,22px);margin-top:.5em}
#rankboard .tap{font-size:clamp(10px,1.1vw,13px);color:#7a6e8f;text-align:right;margin-top:.4em}
/* main menu */
#menu{position:absolute;inset:0;z-index:12;display:none;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);
  background:linear-gradient(90deg,rgba(255,248,238,0) 0 40%,rgba(255,248,238,.94) 58%)}
#menu .hero{position:relative;overflow:hidden}
#menu .logo{position:absolute;top:7%;left:6%;background:var(--paper);border:3px solid var(--line);border-radius:18px;box-shadow:6px 6px 0 var(--line);padding:2.4% 4% 2%;transform:rotate(-3deg);z-index:2;animation:drop .6s cubic-bezier(.5,1.6,.4,1)}
@keyframes drop{from{transform:rotate(-3deg) translateY(-40%);opacity:0}}
#menu .logo .k{font-family:var(--display);font-size:clamp(10px,1.2vw,15px);letter-spacing:.2em;text-transform:uppercase;color:#7a6e8f}
#menu .logo h1{font-family:var(--display);font-size:clamp(30px,6.4vw,84px);margin:.05em 0 0;line-height:.95;color:var(--pink);text-shadow:4px 4px 0 var(--line);-webkit-text-stroke:2px var(--line)}
#menu .logo .s{font-family:var(--display);font-size:clamp(11px,1.4vw,18px);margin-top:.35em}
#menu .lineup{position:absolute;left:-2%;right:-8%;bottom:-10%;height:66%;display:flex;justify-content:center;align-items:flex-end}
#menu .lineup div{height:100%;aspect-ratio:3/5;margin:0 -2.4%;transition:transform .25s;animation:rise .6s backwards;cursor:pointer}
#menu .lineup div:nth-child(2){height:94%;animation-delay:.08s}#menu .lineup div:nth-child(3){animation-delay:.16s}#menu .lineup div:nth-child(4){height:94%;animation-delay:.24s}#menu .lineup div:nth-child(5){animation-delay:.32s}
@keyframes rise{from{transform:translateY(30%);opacity:0}}
#menu .lineup div:hover{transform:translateY(-5%)}
#menu .lineup svg{width:100%;height:100%;filter:drop-shadow(4px 4px 0 rgba(43,35,64,.25))}
#menu .side{display:flex;flex-direction:column;justify-content:center;gap:1.8%;padding:3% 8% 3% 6%}
.mbtn{font-family:var(--display);font-size:clamp(13px,1.85vw,23px);text-align:left;color:var(--ink);background:#fff;border:3px solid var(--line);border-radius:14px;padding:.42em .85em;box-shadow:4px 4px 0 var(--line);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:.6em;transition:transform .12s,box-shadow .12s;animation:pop2 .35s backwards}
.mbtn small{font-family:var(--body);font-size:.58em;opacity:.7;font-weight:600}
.mbtn.primary{background:var(--pink);color:#fff}
.mbtn.mint{background:var(--mint)}
.mbtn:hover{transform:translate(-3px,-3px) rotate(-.6deg);box-shadow:7px 7px 0 var(--line)}
.mbtn[disabled]{opacity:.45;pointer-events:none}
#menu .foot{font-size:clamp(10px,1.1vw,13px);color:#7a6e8f;margin-top:2%}
#panel{position:absolute;inset:5% 5%;z-index:14;background:var(--paper);border:3px solid var(--line);border-radius:18px;box-shadow:8px 8px 0 var(--line);padding:2.6% 3.2%;overflow:auto;display:none;animation:pop2 .3s;font-size:clamp(11px,1.35vw,16px);line-height:1.5}
#panel h2{font-family:var(--display);font-size:clamp(18px,2.8vw,36px);margin:0 0 .4em;color:var(--pink);text-shadow:2px 2px 0 var(--line);-webkit-text-stroke:1px var(--line)}
#panel .x{position:sticky;top:0;float:right;font-family:var(--display);font-size:clamp(12px,1.4vw,17px);background:var(--sun);border:3px solid var(--line);border-radius:10px;padding:.2em .7em;box-shadow:3px 3px 0 var(--line);cursor:pointer}
.profiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.6%;clear:both}
.prof{border:3px solid var(--line);border-radius:14px;background:#fff;overflow:hidden;box-shadow:3px 3px 0 var(--line);margin-bottom:6%}
.prof .pic{height:clamp(80px,13vw,170px);overflow:hidden;border-bottom:3px solid var(--line)}
.prof .pic svg{width:100%;height:auto;display:block;margin-top:-6%}
.prof .inf{padding:.5em .7em .7em}
.prof b{font-family:var(--display);font-size:1.2em}
.prof .tg{display:inline-block;font-size:.72em;border:2px solid var(--line);border-radius:999px;padding:0 .55em;margin-left:.3em;vertical-align:middle}
.prof p{margin:.3em 0 0;font-size:.88em}
.ends{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2%;clear:both}
.endc{border:3px solid var(--line);border-radius:14px;background:#fff;text-align:center;overflow:hidden;box-shadow:3px 3px 0 var(--line)}
.endc .pic{height:clamp(70px,12vw,160px);overflow:hidden}
.endc .pic svg{width:100%;height:auto;margin-top:-4%}
.endc.lock .pic{filter:brightness(0) opacity(.25)}
.endc .inf{padding:.4em .4em .6em;border-top:3px solid var(--line)}
.endc b{font-family:var(--display);display:block}
.rules li{margin:.35em 0}
.seg{display:inline-flex;border:3px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:3px 3px 0 var(--line);margin:.3em 0 1em}
.seg button{font-family:var(--display);font-size:1em;border:0;border-right:3px solid var(--line);background:#fff;padding:.3em .9em;cursor:pointer;color:var(--ink)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--pink);color:#fff}
.pbtn{font-family:var(--display);font-size:1.05em;background:var(--pink);color:#fff;border:3px solid var(--line);border-radius:12px;padding:.35em 1.1em;box-shadow:3px 3px 0 var(--line);cursor:pointer;margin:.2em .5em .2em 0}
.pbtn.alt{background:var(--mint);color:var(--ink)}.pbtn.ghost{background:#fff;color:var(--ink)}
#panel textarea{width:100%;height:9em;font-family:Menlo,monospace;font-size:.75em;border:3px solid var(--line);border-radius:10px;padding:.6em;margin-top:.6em;background:#fff}
#panel .msg{font-weight:700;color:#2e9e5b;min-height:1.4em;margin:.3em 0}
#panel input.nm{font-family:var(--body);font-size:1.3em;padding:.4em .8em;border:3px solid var(--line);border-radius:12px;box-shadow:3px 3px 0 var(--line);width:min(340px,70%);margin:.4em .6em .8em 0}
#pause{position:absolute;inset:0;z-index:11;display:none;align-items:center;justify-content:center;background:rgba(43,35,64,.4)}
#pause .sheet{background:var(--paper);border:3px solid var(--line);border-radius:18px;box-shadow:8px 8px 0 var(--line);padding:2.4% 3%;display:flex;flex-direction:column;gap:10px;min-width:30%;transform:rotate(-1deg);animation:pop2 .3s}
#pause h3{font-family:var(--display);margin:0 0 .2em;font-size:clamp(18px,2.4vw,30px);color:var(--pink);-webkit-text-stroke:1px var(--line);text-shadow:2px 2px 0 var(--line)}
@media print{#hud,#choices,#next{display:none}#game{position:static}html,body{overflow:visible}}
</style>
</head>
<body>
<div id="game">
  <div id="stage">
    <div id="bg"></div>
    <div id="cast"></div>
    <div id="fx"></div>
    <div id="chapter"></div>
    <div id="rankboard"></div>
    <div id="hud"><button class="hbtn" id="rbtn">Ranking</button><button class="hbtn" id="jbtn">Notebook</button><button class="hbtn" id="tbtn">Menu</button></div>
    <div id="pause"></div>
    <div id="menu"></div>
    <div id="panel"></div>
    <div id="journal"></div>
    <div id="choices"></div>
    <div id="box"><div id="name"></div><div id="text"></div><div id="next">▼</div></div>
  </div>
</div>
<script>
// ---------- CHARACTER ART ----------
const CHARS = {
  natan:  {name:'Natan',  color:'#2c3e78', skin:'#f2c7a5', hair:'#5a3a22', hs:'curly',  eye:'#6b4a2b', top:'varsity', tc:'#2c3e78', tc2:'#f3ead6', fw:1, bw:1.05},
  lars:   {name:'Lars',   color:'#3d8fe0', skin:'#f7dcc8', hair:'#8a5a34', hs:'curly',  eye:'#3d8fe0', top:'shirt',   tc:'#ffffff', tc2:'#dfe8f5', fw:.96, bw:.92},
  adam:   {name:'Adam',   color:'#2f8f8a', skin:'#eac09c', hair:'#3b2a1e', hs:'neat',   eye:'#3fa85a', top:'zip',     tc:'#2f8f8a', tc2:'#e9f6f3', fw:1, bw:1},
  fionn:  {name:'Fionn',  color:'#2e9e5b', skin:'#f8dfcf', hair:'#16131a', hs:'short',  eye:'#1c1418', top:'jersey',  tc:'#2e9e5b', tc2:'#ffffff', fw:1.13, bw:1.2, num:'9', braces:true},
  milo:   {name:'Milo',   color:'#1d1a24', skin:'#fae6d8', hair:'#1d1a24', hs:'down',   eye:'#5b3a29', top:'coat',    tc:'#c49a6c', tc2:'#1f1c26', fw:1, bw:1, buds:true},
  daniel: {name:'Daniel', color:'#d2343f', skin:'#c99a6e', hair:'#1b1612', hs:'short',  eye:'#3b2616', top:'jersey',  tc:'#d2343f', tc2:'#ffffff', fw:1, bw:1.05, num:'10'},
  josh:   {name:'Josh',   color:'#f08a3c', skin:'#f4cdb0', hair:'#b98a4e', hs:'messy',  eye:'#6d8a9c', top:'hoodie',  tc:'#f08a3c', tc2:'#ffd9b8', fw:1, bw:1},
  reshman:{name:'Reshman',color:'#b8860b', skin:'#6b4430', hair:'#15110e', hs:'fade',   eye:'#2e1d14', top:'jacket',  tc:'#e6b23a', tc2:'#2b2340', fw:1, bw:1.06, shades:true},
  officer:{name:'Officer Pim',color:'#2a4d8f', skin:'#e8b996', hair:'#4a4a4a', hs:'short', eye:'#3a3a3a', top:'police', tc:'#2a4d8f', tc2:'#ffffff', fw:1.05, bw:1.12, cap:true},
};
const L='#2b2340';

function curlRing(cx,cy,r,a0,a1,step,cr,fill){
  let s='';
  for(let a=a0;a<=a1;a+=step){const t=a*Math.PI/180;
    s+=`<circle cx="${(cx+Math.cos(t)*r).toFixed(1)}" cy="${(cy+Math.sin(t)*r).toFixed(1)}" r="${cr}" fill="${fill}" stroke="${L}" stroke-width="3"/>`;}
  return s;
}
function hairBack(c,form){
  const h=c.hair, w=58*c.fw;
  if(c.hs==='curly'){
    let s=`<ellipse cx="150" cy="150" rx="${w+14}" ry="78" fill="${h}" stroke="${L}" stroke-width="3"/>`;
    s+=curlRing(150,160,w+12,160,380,16,22,h);
    if(form==='girl'){ for(let y=200;y<=330;y+=26){s+=`<circle cx="${150-w-12}" cy="${y}" r="24" fill="${h}" stroke="${L}" stroke-width="3"/><circle cx="${150+w+12}" cy="${y}" r="24" fill="${h}" stroke="${L}" stroke-width="3"/>`;}
      s+=`<rect x="${150-w-30}" y="190" width="${2*w+60}" height="140" rx="40" fill="${h}"/>`;}
    return s;
  }
  if(c.hs==='neat') return `<path d="M${150-w-6} 190 C${150-w-10} 90 ${150+w+10} 90 ${150+w+6} 190 Z" fill="${h}" stroke="${L}" stroke-width="3"/>`;
  if(c.hs==='styled') return `<path d="M${150-w-4} 185 C${150-w-8} 100 ${150+w+8} 100 ${150+w+4} 185 Z" fill="${h}" stroke="${L}" stroke-width="3"/>`;
  if(c.hs==='down') return `<path d="M${150-w-8} 205 C${150-w-14} 92 ${150+w+14} 92 ${150+w+8} 205 L${150+w-4} 205 L${150-w+4} 205Z" fill="${h}" stroke="${L}" stroke-width="3"/>`;
  if(c.hs==='messy') return `<path d="M${150-w-8} 190 L${150-w-14} 130 L${150-w+6} 118 L${150-w+10} 88 L150 96 L${150+w-10} 82 L${150+w+4} 116 L${150+w+16} 130 L${150+w+8} 190 Z" fill="${h}" stroke="${L}" stroke-width="3" stroke-linejoin="round"/>`;
  return `<path d="M${150-w-3} 180 C${150-w-6} 98 ${150+w+6} 98 ${150+w+3} 180 Z" fill="${h}" stroke="${L}" stroke-width="3"/>`;
}
function hairFront(c,form){
  const h=c.hair, w=58*c.fw;
  if(c.hs==='down'){
    // straight fringe falling down over the forehead, no side part
    let tips='';
    for(let i=8;i>=0;i--){const x=150-w-2+i*((2*w+4)/8); tips+=` L${x.toFixed(1)} ${i%2?168:156}`;}
    return `<path d="M${150-w-4} 175 C${150-w-6} 104 ${150+w+6} 104 ${150+w+4} 175${tips} Z" fill="${h}" stroke="${L}" stroke-width="3" stroke-linejoin="round"/>`

const SCENES={};

SCENES.start=[
  {bg:'gate', ch:'Chapter 1 · First Day', cast:[]},
  {t:'Rankingland. A country where everything gets a score: bakeries, bus routes, even the weather.'},
  {t:'And at the top of the school rankings is WidR School, where you, {P}, have just transferred into 5vb VWO.'},
  {cast:[['reshman','smile']]},
  {s:'reshman', t:'Yo. You must be {P}. I\'m Reshman, your official tour guide.'},
  {s:'reshman', e:'smirk', t:'Unofficially? Coolest guy at WidR. That\'s not a ranking. That\'s just a fact.'},
  {choice:[
    {t:'"Is everything here really ranked?"', then:[
      {s:'reshman', e:'grin', t:'Everything. The vending machine has a leaderboard. Fionn has held first place for two years. Don\'t tell him I told you.'}]},
    {t:'"Nice sunglasses. It\'s cloudy, though."', then:[
      {s:'reshman', e:'smirk', t:'The sun is always out when you\'re this cool. You\'ll learn.'}]},
    {t:'"Lead the way, coolest guy."', then:[
      {s:'reshman', e:'grin', t:'See, you get it already. We\'re gonna be friends.'}]},
  ]},
  {s:'reshman', e:'neutral', t:'Real talk though. WidR ranks people too. The WidR Ranking. Top of the list? Everyone wants to date you. Bottom? You have to work your way up.'},
  {s:'reshman', e:'smirk', t:'New students start at the bottom. No offence. Here, look.'},
  {rank:'The WidR Ranking: Week 1'},
  {s:'reshman', e:'neutral', t:'Do cool stuff, help people, win things, and you climb. Rankings lock after Valentine\'s Day, so don\'t wait too long. And never get caught dating two people at once. People have dropped ten places for that.'},
  {s:'reshman', e:'neutral', t:'Quick warning before we go in. Duck if anyone yells "HEADS UP."'},
  {n:'???', t:'HEADS UP!!', fx:'shake'},
  {t:'A baseball whistles past your ear and smacks into the school sign.'},
  {cast:[['reshman','surprised'],['natan','surprised'],['daniel','grin']]},
  {s:'natan', t:'Oh no. Oh no no no. Are you okay?! I was aiming for Daniel!'},
  {s:'daniel', t:'He\'s been aiming for me since Year One. He has never hit me once. I\'m Daniel, by the way.'},
  {s:'daniel', e:'smile', t:'Baseball in spring, football the rest of the year. Back home in Afghanistan I played football in the street every day until the sun went down. Natan\'s the reason I picked up a bat.'},
  {s:'natan', e:'smile', t:'And I\'m Natan. Third base, WidR Rankers. Usually I throw better than that. Promise.'},
  {t:'Natan is seventeen, with a mop of brown curls squashed under nothing, because he lost his cap again. He\'s smiling sheepishly.'},
  {choice:[
    {t:'Pick up the ball and toss it back to him. Nice and easy.', aff:{natan:1}, then:[
      {s:'natan', e:'grin', t:'Ooh, nice wrist! You play? You should come to practice sometime. No pressure. Some pressure. Medium pressure.'}]},
    {t:'"Next time aim for the sign. You\'ll hit Daniel for sure."', aff:{natan:1}, then:[
      {s:'natan', e:'grin', t:'HA! Okay, I like you. That\'s mean, but I like you.'},
      {s:'daniel', e:'smirk', t:'Rude. Accurate, but rude.'}]},
    {t:'Ask Daniel which sport is better, baseball or football.', then:[
      {s:'daniel', e:'grin', t:'Football. Obviously. But don\'t say that near Natan, he\'ll cry.'},
      {s:'natan', e:'sad', t:'I would not cry. I would simply be quietly devastated.'}]},
  ]},
  {s:'reshman', e:'smirk', t:'Alright, alright. Class starts in two minutes. Come on, {P}.'},
  {goto:'homeroom'}
];

  {cast:[['lars','surprised']]},

// ---------- STORY PART 2: Chapters 3–8 ----------
const topChar=G=>ROM.reduce((a,b)=>G.aff[b]>G.aff[a]?b:a,'lars');
// Connection needed before someone says yes. Your WidR Ranking shifts it (see rankMod).
const BASE={natan:9, lars:7, adam:9, fionn:8, milo:12};
const need=k=>BASE[k]+rankMod();
const miloGate=G=>G.flags.phonk && G.flags.milo_trust && !G.flags.milo_called && myRank()<=5;
const canDate=(G,k)=>G.aff[k]>=need(k) && (k!=='milo' || miloGate(G));
const avail=G=>ROM.filter(k=>!G.dating.includes(k) && !G.out.includes(k) && !(G.final && G.tried.includes(k)));
const afterConf=G=>G.ret;
function confessMenu(ret, noneText){
  return G=>avail(G).map(k=>({t:CHARS[k].name, do:G=>{G.ret=ret; if(G.final) G.tried.push(k);}, goto:'conf_'+k}))
    .concat(noneText?[{t:noneText, goto:ret}]:[]);
}

// ---------- STORY PART 3: Confessions, consequences and canon endings ----------
// A "yes" before the ball means you start dating and the story carries on.
// A "yes" at the ball (or the ball with your partner) finishes that person's canon storyline.
const yesThen=k=>[
  {if:G=>G.final?'end_'+k:null},
  {do:G=>{G.dating.push(k);}, eff:{rep:6}},
  {t:G=>G.dating.length>1?`You're now dating ${G.dating.map(d=>CHARS[d].name).join(' AND ')}. Nobody else knows... yet. Valentine's Day is coming.`:`You and ${CHARS[k].name} are officially together. The news reaches the WidR Ranking by Monday.`},
  {goto:afterConf}
];
const outThen=k=>[{do:G=>{G.out.push(k);}},{goto:afterConf}];

  {end:'Bass Drop', kind:'MILO · CANON ENDING (RARE)', sub:'You and Milo', text:`You won over the hardest heart at WidR. Milo still listens to phonk every day, but now there's a soft piano playlist too, and it's only for you. He even says hi to Daniel now without it hurting.`}
];
// ---------- ENGINE ----------
// Snapshot of this page's own HTML, taken before anything changes it, so the game can save a copy of itself.
const SOURCE='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
const $=id=>document.getElementById(id);
const ROM=['natan','lars','adam','fionn','milo'];
// Everyone else on the WidR Ranking (fixed scores). The player moves; they don't.
const NPC_RANK=[
  ['Milo',90],['Reshman',87],['Natan',85],['Sanne',82],['Lars',79],['Daniel',77],
  ['Adam',75],['Femke',71],['Fionn',68],['Josh',60],['Bram',52],['Jeroen',45]];
const CANON=[['natan','Home Run'],['lars',"The Cat's Out of the Bag"],['adam','Perfect Score'],['fionn','Gym Buddies'],['milo','Bass Drop']];
const SAVE_KEY='widr_save2', END_KEY='widr_endings2', SET_KEY='widr_settings';
const SET=Object.assign({speed:'normal'},JSON.parse(localStorage.getItem(SET_KEY)||'{}'));
const SPEEDS={slow:[1,32],normal:[2,18],fast:[4,12],instant:[9999,1]};
let G, queue=[], typing=null, waiting=null, curBg='gate';

function newGame(name){
  G={P:name||'Robin', aff:{natan:0,lars:0,adam:0,fionn:0,milo:0}, flags:{}, ch:'',
     rep:40, lastRank:13, dating:[], out:[], frozen:false, ret:null, tried:[]};
  $('cast').innerHTML=''; hideMenu(); jump('start');
}
function jump(id){ if(!SCENES[id]){console.warn('missing scene',id);return;} save(id); queue=SCENES[id].slice(); step(); }
const fmt=t=>t.replace(/\{P\}/g,G.P);

// ----- save / continue -----
function save(id){
  if(!G) return;
  const cast=[...$('cast').children].map(el=>[el.dataset.id,el.dataset.expr||'neutral',el.dataset.form||'']);
  try{localStorage.setItem(SAVE_KEY,JSON.stringify({id,G,bg:curBg,cast,when:Date.now()}));}catch(e){}
}
const getSave=()=>{try{return JSON.parse(localStorage.getItem(SAVE_KEY));}catch(e){return null;}};
function continueGame(){
  const s=getSave(); if(!s) return;
  G=s.G; hideMenu(); $('bg').innerHTML=BG[s.bg](); curBg=s.bg; $('chapter').textContent=G.ch||'';
  $('cast').innerHTML=''; setCast(s.cast); jump(s.id);
}

// ----- ranking -----
function rankList(){
  return NPC_RANK.map(([n,s])=>({n,s})).concat([{n:G.P,s:G.rep,me:true}]).sort((a,b)=>b.s-a.s || (a.me?1:-1));
}
function myRank(){ return rankList().findIndex(r=>r.me)+1; }
function tier(i){ return i<=3?['Top tier','t1']:i<=6?['Very popular','t2']:i<=9?['Known','t3']:['Unknown','t4']; }
// Lower = easier for people to say yes. Being high on the ranking makes you "desirable".
function rankMod(){ const r=myRank(); return r<=3?-3:r<=6?-2:r<=9?0:2; }
let rbWait=null;
function showRank(title,note){
  const rb=$('rankboard'), list=rankList(), r=myRank(), d=G.lastRank-r;
  const delta = d>0?`<span style="color:#2e9e5b">▲ Up ${d} place${d>1?'s':''}</span>` : d<0?`<span style="color:#e8364f">▼ Down ${-d} place${d<-1?'s':''}</span>`:'No change';
  rb.innerHTML=`<div class="sheet"><h3>${title||'The WidR Ranking'}</h3>
    <div class="why">Who the school thinks is the "best" catch. The higher you are, the more people want to date you. ${G.frozen?'<b>Final rankings are locked. No more climbing.</b>':'You can still climb.'}</div>
    <ol>${list.map((x,i)=>{const [tn,tc]=tier(i+1);return `<li class="${x.me?'me':''}"><span class="n">#${i+1}</span><span>${x.me?x.n+' (you)':x.n}</span><span class="tier ${tc}">${tn}</span><span>${x.s}</span></li>`;}).join('')}</ol>
    ${note!==false?`<div class="delta">You: #${r} · ${delta}</div>`:''}
    <div class="tap">Click to close</div></div>`;
  rb.style.display='flex'; if(note!==false) G.lastRank=r;
}
$('rankboard').onclick=e=>{ e.stopPropagation(); $('rankboard').style.display='none'; if(rbWait){const f=rbWait;rbWait=null;f();} };

// ----- cast -----
function setCast(list){
  const pos={1:[50],2:[30,70],3:[19,50,81]}[list.length]||[];
  const keep=new Set(list.map(x=>x[0]));
  [...$('cast').children].forEach(el=>{if(!keep.has(el.dataset.id)) el.remove();});
  list.forEach((x,i)=>{
    const [id,expr='neutral',form]=x;
    let el=$('cast').querySelector(`[data-id="${id}"]`);
    if(!el){el=document.createElement('div');el.className='char enter';el.dataset.id=id;el.dataset.form='';$('cast').appendChild(el);}
    el.style.left=pos[i]+'%';
    if(x.length>2) el.dataset.form=form||'';
    if(id==='lars' && G.flags.lars_girl && x.length<3) el.dataset.form='girl';
    el.dataset.expr=expr; el.innerHTML=portrait(id,expr,el.dataset.form);
  });
}
function setExpr(id,expr,form){
  const el=$('cast').querySelector(`[data-id="${id}"]`); if(!el) return;
  if(form!==undefined) el.dataset.form=form;
  if(expr) el.dataset.expr=expr;
  el.innerHTML=portrait(id,el.dataset.expr,el.dataset.form);
}
function applyEff(o){
  if(o.aff) for(const k in o.aff) G.aff[k]+=o.aff[k];
  if(o.flag) [].concat(o.flag).forEach(f=>G.flags[f]=true);
  if(o.rep && (!G.frozen || o.force)) G.rep=Math.max(0,Math.min(99,G.rep+o.rep));
}
function fx(kind){
  const f=$('fx'), stg=$('stage');
  if(kind==='flash'){f.className='';void f.offsetWidth;f.className='flash';}
  if(kind==='shake'){stg.classList.remove('shake');void stg.offsetWidth;stg.classList.add('shake');}
  if(kind==='siren'){f.className='';void f.offsetWidth;f.className='siren';}
  if(kind==='sparkle'){f.className='sparkle';f.innerHTML='';
    for(let i=0;i<14;i++){const s=document.createElement('span');s.textContent=['✦','♥','✧','❀'][i%4];
      s.style.left=(10+Math.random()*80)+'%';s.style.top=(10+Math.random()*60)+'%';s.style.color=['#ff6f9f','#ffc94d','#7fd6c2'][i%3];s.style.animationDelay=(i*.06)+'s';f.appendChild(s);}
    setTimeout(()=>{f.innerHTML='';},2000);}
}
function step(){
  while(queue.length){
    const s=queue.shift();
    if(s.bg){ curBg=s.bg; $('bg').innerHTML=BG[s.bg](); }
    if(s.ch!==undefined){ G.ch=s.ch; $('chapter').textContent=s.ch; }
    if(s.cast) setCast(typeof s.cast==='function'?s.cast(G):s.cast);
    if(s.expr) for(const k in s.expr){ const v=[].concat(s.expr[k]); setExpr(k,v[0],v[1]); }
    if(s.eff) applyEff(s.eff);
    if(s.fx) fx(s.fx);
    if(s.do) s.do(G);
    if(s.rank){ rbWait=()=>step(); showRank(s.rank===true?null:s.rank); return; }
    if(s.goto){ return jump(typeof s.goto==='function'?s.goto(G):s.goto); }
    if(s.if){ const r=s.if(G); if(r) return jump(r); continue; }
    if(s.end){ return ending(s); }
    if(s.choice){ return showChoice(typeof s.choice==='function'?s.choice(G):s.choice); }
    if(s.t!==undefined){ return say(s); }
  }
}
function say(s){
  let name='';
  const txtRaw=typeof s.t==='function'?s.t(G):s.t;
  if(s.s==='P') name=G.P;
  else if(s.s && CHARS[s.s]) name=CHARS[s.s].name;
  else if(s.n) name=s.n;
  if(s.s && CHARS[s.s] && s.e) setExpr(s.s,s.e);
  [...$('cast').children].forEach(el=>{
    el.classList.toggle('dim', !!(s.s && s.s!=='P' && el.dataset.id!==s.s && CHARS[s.s]));
    el.classList.remove('talk','enter');
    if(el.dataset.id===s.s){void el.offsetWidth;el.classList.add('talk');}
  });
  $('name').textContent=name;
  $('name').style.background= s.s==='P' ? '#ff6f9f' : (CHARS[s.s]?CHARS[s.s].color:'#7a6e8f');
  const txt=fmt(txtRaw), el=$('text');
  el.className = (!s.s && !s.n) ? 'narr' : '';
  el.textContent=''; $('next').style.visibility='hidden';
  const [per,ms]=SPEEDS[SET.speed]||SPEEDS.normal;
  let i=0; clearInterval(typing);
  typing=setInterval(()=>{ i+=per; el.textContent=txt.slice(0,i); if(i>=txt.length){clearInterval(typing);typing=null;$('next').style.visibility='visible';}},ms);
  waiting=()=>{ if(typing){clearInterval(typing);typing=null;el.textContent=txt;$('next').style.visibility='visible';return;} waiting=null; step(); };
}
function showChoice(opts){
  const box=$('choices'); box.innerHTML=''; waiting=null; $('next').style.visibility='hidden';
  opts.filter(o=>!o.req||o.req(G)).forEach(o=>{
    const b=document.createElement('button'); b.textContent=fmt(o.t);
    b.onclick=e=>{ e.stopPropagation(); box.innerHTML=''; applyEff(o); if(o.do) o.do(G);
      const extra=(o.then||[]).slice(); if(o.goto) extra.push({goto:o.goto});
      queue=extra.concat(queue); step(); };
    box.appendChild(b);
  });
}
const overlayOpen=()=>['menu','panel','pause','rankboard'].some(id=>getComputedStyle($(id)).display!=='none');
$('box').onclick=()=>{ if(waiting && !overlayOpen()) waiting(); };
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if($('panel').style.display==='block') return closePanel(); if(G && $('menu').style.display!=='grid') return togglePause(); }
  if((e.key===' '||e.key==='Enter') && waiting && !overlayOpen() && document.activeElement.tagName!=='INPUT'){e.preventDefault();waiting();}
});

function ending(s){
  localStorage.removeItem(SAVE_KEY);
  const found=JSON.parse(localStorage.getItem(END_KEY)||'[]'); if(!found.includes(s.end)){found.push(s.end);localStorage.setItem(END_KEY,JSON.stringify(found));}
  const c=document.createElement('div'); c.className='card';
  c.innerHTML=`<div class="tag">${s.kind||'ENDING'}</div><h1>${s.end}</h1><h2>${fmt(s.sub||'')}</h2><p>${fmt(s.text||'')}</p>
    <p class="sub">Final WidR Ranking: #${myRank()} of 13 · Storylines completed: ${found.filter(f=>CANON.some(c=>c[1]===f)).length}/5</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="big" id="again">Back to menu</button></div>`;
  $('stage').appendChild(c);
  c.querySelector('#again').onclick=()=>{c.remove();title();};
}
function journal(){
  const j=$('journal');
  if(j.style.display==='block'){j.style.display='none';return;}
  const rows=ROM.map(k=>{const v=Math.max(0,G?G.aff[k]:0), n=Math.min(5,Math.round(v/2.4));
    const tag=G&&G.dating.includes(k)?' 💘':G&&G.out.includes(k)?' ✖':'';
    return `<div class="row"><b style="color:${CHARS[k].color}">${CHARS[k].name}${tag}</b><span class="hearts">${'♥'.repeat(n)}${'♡'.repeat(5-n)}</span></div>`;}).join('');
  j.innerHTML=`<h3>${G?G.P:'Your'}'s Notebook</h3>${rows}
    <small>${G?`WidR Ranking: #${myRank()} of 13${G.dating.length>1?' · <b style="color:#e8364f">Dating '+G.dating.length+' people. Valentine\'s Day is coming…</b>':''}<br>`:''}Connections grow from time spent together, not from flirting.</small>`;
  j.style.display='block';
}
$('jbtn').onclick=e=>{e.stopPropagation(); if(G) journal();};
$('rbtn').onclick=e=>{e.stopPropagation(); if(G) showRank(null,false);};
$('tbtn').onclick=e=>{e.stopPropagation(); togglePause();};

// ----- pause menu -----
function togglePause(){
  const p=$('pause');
  if(p.style.display==='flex'){p.style.display='none';return;}
  p.innerHTML=`<div class="sheet"><h3>Paused</h3>
    <button class="mbtn primary" data-a="resume">Resume <small>Esc</small></button>
    <button class="mbtn" data-a="settings">Settings <small>Text speed</small></button>
    <button class="mbtn" data-a="share">Share the game <small>Download or copy</small></button>
    <button class="mbtn mint" data-a="quit">Save &amp; quit to menu <small>Progress is kept</small></button></div>`;
  p.style.display='flex';
  p.onclick=e=>{e.stopPropagation(); const a=e.target.closest('[data-a]'); if(!a){ if(e.target===p) p.style.display='none'; return;}
    const k=a.dataset.a;
    if(k==='resume') p.style.display='none';
    if(k==='settings') openPanel('settings');
    if(k==='share') openPanel('share');
    if(k==='quit'){ p.style.display='none'; title(); }
  };
}

// ----- main menu -----
function hideMenu(){ $('menu').style.display='none'; closePanel(); $('hud').style.visibility='visible'; }
function title(){
  clearInterval(typing); waiting=null; queue=[];
  G=null; $('choices').innerHTML=''; $('journal').style.display='none'; $('rankboard').style.display='none'; $('pause').style.display='none';
  document.querySelectorAll('.card').forEach(c=>c.remove());
  $('chapter').textContent=''; $('bg').innerHTML=BG.gate(); curBg='gate'; $('cast').innerHTML='';
  $('name').textContent=''; $('text').textContent=''; $('hud').style.visibility='hidden';
  const sv=getSave(), found=JSON.parse(localStorage.getItem(END_KEY)||'[]');
  const done=CANON.filter(c=>found.includes(c[1])).length;
  const m=$('menu');
  m.innerHTML=`<div class="hero">
      <div class="logo"><div class="k">A Rankingland Story</div><h1>WidR<br>School</h1><div class="s">5vb VWO · Five boys · One ranking</div></div>
      <div class="lineup">${['fionn','lars','natan','adam','milo'].map(k=>`<div data-p="${k}" title="${CHARS[k].name}">${portrait(k,'smile')}</div>`).join('')}</div>
    </div>
    <div class="side">
      ${sv?`<button class="mbtn primary" data-a="continue">Continue <small>${sv.G.P} · ${sv.G.ch||'Chapter 1'}</small></button>`:''}
      <button class="mbtn ${sv?'':'primary'}" data-a="new">New Game <small>${sv?'Overwrites save':'Start your first day'}</small></button>
      <button class="mbtn" data-a="chars">Characters <small>Meet 5vb</small></button>
      <button class="mbtn" data-a="ends">Endings <small>${done}/5 found</small></button>
      <button class="mbtn" data-a="how">How to Play</button>
      <button class="mbtn" data-a="settings">Settings</button>
      <button class="mbtn mint" data-a="share">Share the Game <small>Download / copy</small></button>
      <div class="foot">Your progress saves automatically at every scene.</div>
    </div>`;
  m.style.display='grid';
  m.onclick=e=>{ const p=e.target.closest('[data-p]'); if(p) return openPanel('chars',p.dataset.p);
    const a=e.target.closest('[data-a]'); if(!a) return; const k=a.dataset.a;
    if(k==='continue') return continueGame();
    if(k==='new') return openPanel('new');
    openPanel(k);
  };
}

// ----- panels -----
const PROFILES={
  natan:['17','Third base for the WidR Rankers. Curly hair, three different laughs, and terrible aim, but only at Daniel.'],
  lars:['16','Loves cats but can\'t touch them, for reasons. Always has a plan. White shirts, skinny jeans, sharp blue eyes.'],
  adam:['16','Top of the class, and happiest at the table tennis table. Owner of Gianmarco (strawberry) and Giuseppe (green apple).'],
  fionn:['16','Says he doesn\'t care. Cares about everything. Watches every match, makes the best pancakes in Rankingland.'],
  milo:['17','Best-dressed boy at WidR. Phonk every single day. Very hard to impress. The hardest route in the game.'],
  daniel:['17','Baseball in spring, football all year. From Afghanistan. Somehow always in the way of Natan\'s throws.'],
  josh:['16','Calm, clever and organised, until his ADHD kicks in and he talks about five things at once.'],
  reshman:['17','Your tour guide. Self-declared coolest guy at WidR, and he knows exactly how the ranking works.'],
};
function closePanel(){ $('panel').style.display='none'; }
function openPanel(kind,focus){
  const P=$('panel'); let h='<button class="x" data-a="close">Close ✕</button>';
  if(kind==='new'){
    h+=`<h2>New Game</h2><p>What's your name? Everyone at WidR will call you this.</p>
      <input class="nm" id="nm" maxlength="16" placeholder="Your name" value="">
      <div><button class="pbtn" data-a="start">Start the first day</button></div>
      ${getSave()?'<p style="color:#e8364f">Starting a new game replaces your current save.</p>':''}`;
  }
  if(kind==='chars'){
    h+=`<h2>Characters</h2><div class="profiles">${Object.keys(PROFILES).map(k=>{const [age,txt]=PROFILES[k], rom=ROM.includes(k);
      return `<div class="prof" ${focus===k?'style="outline:4px solid #ff6f9f"':''}><div class="pic" style="background:${CHARS[k].color}22">${portrait(k,'smile')}</div>
      <div class="inf"><b style="color:${CHARS[k].color}">${CHARS[k].name}</b><span class="tg" style="background:${rom?'#ffd3e2':'#eee'}">${rom?'Romance':'Friend'}</span><span class="tg">${age}</span><p>${txt}</p></div></div>`;}).join('')}</div>`;
  }
  if(kind==='ends'){
    const found=JSON.parse(localStorage.getItem(END_KEY)||'[]');
    h+=`<h2>Endings</h2><p>Each boy has one canon storyline. The game only ends when you finish one.</p>
      <div class="ends">${CANON.map(([k,n])=>{const ok=found.includes(n);
        return `<div class="endc ${ok?'':'lock'}"><div class="pic">${portrait(k,ok?'happy':'neutral')}</div><div class="inf"><b>${ok?n:'???'}</b><small>${ok?CHARS[k].name:'Not found yet'}</small></div></div>`;}).join('')}</div>`;
  }
  if(kind==='how'){
    h+=`<h2>How to Play</h2><ul class="rules">
      <li><b>Click or press Space</b> to continue dialogue. Press <b>Esc</b> to pause.</li>
      <li><b>Connections:</b> nobody falls for you by accident. Spend time with someone, help them and listen, and your bond grows. Check it in the <b>Notebook</b>.</li>
      <li><b>The WidR Ranking:</b> the school's list of "best catches." You start at the bottom. Big moments (festivals, the school play, tournaments) make you climb. The higher you are, the easier it is for someone to say yes.</li>
      <li><b>The ranking locks on Valentine's Day.</b> Leave it too late and some people are out of reach.</li>
      <li><b>Asking someone out:</b> you get a few chances during the year. If they say no, you weren't close enough yet, so try again later. If <i>you</i> say no, something happens, and the story carries on.</li>
      <li><b>Dating two people at once?</b> Valentine's Day will find out. So will the ranking.</li>
      <li>The game ends when you finish one of the five canon storylines at the End-of-Year Ball.</li></ul>`;
  }
  if(kind==='settings'){
    h+=`<h2>Settings</h2><p><b>Text speed</b></p><div class="seg" id="spd">${Object.keys(SPEEDS).map(k=>`<button data-s="${k}" class="${SET.speed===k?'on':''}">${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div>
      <p><b>Progress</b></p><button class="pbtn ghost" data-a="wipe">Erase save &amp; endings</button><div class="msg" id="msg"></div>`;
  }
  if(kind==='share'){
    h+=`<h2>Share the Game</h2>
      <p>The whole game is one HTML file. Save it, then send it to anyone. They just double-click it to play, no internet needed.</p>
      <button class="pbtn" data-a="dl">Download WidR_School.html</button>
      <button class="pbtn alt" data-a="copy">Copy the game code</button>
      <button class="pbtn ghost" data-a="show">Show the code</button>
      <div class="msg" id="msg"></div>
      <p><b>If the download doesn't start</b> (some previews block downloads):</p>
      <ol><li>Click <b>Copy the game code</b>.</li>
      <li>Open <b>TextEdit</b>, choose <b>Format › Make Plain Text</b>, and paste.</li>
      <li>Save it as <b>WidR_School.html</b>. Double-click to play.</li></ol>
      <p><b>Want a link?</b> Drag that file onto <b>app.netlify.com/drop</b>, or upload it to <b>itch.io</b> as an HTML game.</p>
      <textarea id="code" readonly style="display:none"></textarea>`;
  }
  P.innerHTML=h; P.style.display='block'; P.scrollTop=0;
  const msg=t=>{const m=P.querySelector('#msg'); if(m) m.textContent=t;};
  if(kind==='new'){ const i=P.querySelector('#nm'); setTimeout(()=>i.focus(),50); i.onkeydown=e=>{if(e.key==='Enter') newGame(i.value.trim());}; }
  P.onclick=e=>{ e.stopPropagation();
    const sp=e.target.closest('[data-s]'); if(sp){ SET.speed=sp.dataset.s; localStorage.setItem(SET_KEY,JSON.stringify(SET)); P.querySelectorAll('#spd button').forEach(b=>b.classList.toggle('on',b===sp)); return; }
    const a=e.target.closest('[data-a]'); if(!a) return; const k=a.dataset.a;
    if(k==='close') return closePanel();
    if(k==='start') return newGame(P.querySelector('#nm').value.trim());
    if(k==='wipe'){ if(confirm('Erase your save and all endings found?')){ localStorage.removeItem(SAVE_KEY); localStorage.removeItem(END_KEY); msg('Erased.'); if(!G) setTimeout(title,400);} return; }
    if(k==='dl'){
      try{ const url=URL.createObjectURL(new Blob([SOURCE],{type:'text/html'}));
        const l=document.createElement('a'); l.href=url; l.download='WidR_School.html'; document.body.appendChild(l); l.click(); l.remove();
        setTimeout(()=>URL.revokeObjectURL(url),4000);
        msg('Download started. If nothing appeared, this preview blocks downloads. Use "Copy the game code" instead.');
      }catch(err){ msg('Downloads are blocked here. Use "Copy the game code" instead.'); }
      return;
    }
    if(k==='show'||k==='copy'){
      const ta=P.querySelector('#code'); ta.value=SOURCE; ta.style.display='block';
      if(k==='show'){ ta.focus(); ta.select(); msg('Code shown below. Press Cmd+A then Cmd+C to copy it.'); return; }
      const fallback=()=>{ ta.focus(); ta.select(); let ok=false; try{ok=document.execCommand('copy');}catch(e){}
        msg(ok?'Copied! Now paste it into TextEdit (plain text) and save as WidR_School.html.':'Your browser blocked copying here. The code is selected below. Press Cmd+C.'); };
      if(navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(SOURCE).then(()=>msg('Copied! Now paste it into TextEdit (plain text) and save as WidR_School.html.'),fallback);
      else fallback();
    }
  };
}
title();
</script>
