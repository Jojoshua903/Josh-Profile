<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3b3b"/>
      <stop offset="1" stop-color="#ff7a1f"/>
    </linearGradient>
    <clipPath id="tile"><rect x="2" y="2" width="60" height="60" rx="15"/></clipPath>
  </defs>
  <!-- sticker tile -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)" stroke="#1d1a2f" stroke-width="4"/>
  <!-- checkered flag corner -->
  <g clip-path="url(#tile)" fill="#1d1a2f">
    <rect x="46" y="2" width="8" height="8"/><rect x="54" y="10" width="8" height="8"/>
    <rect x="38" y="2" width="8" height="8" fill="#fff"/><rect x="46" y="10" width="8" height="8" fill="#fff"/>
    <rect x="54" y="2" width="8" height="8" fill="#fff"/><rect x="54" y="18" width="8" height="8" fill="#fff"/>
  </g>
  <!-- speed lines -->
  <g stroke="#fff" stroke-width="3.5" stroke-linecap="round" opacity=".9">
    <line x1="6" y1="24" x2="14" y2="24"/><line x1="4" y1="32" x2="12" y2="32"/><line x1="6" y1="40" x2="14" y2="40"/>
  </g>
  <!-- slanted W -->
  <path d="M15 18 L23 18 L26 36 L31 22 L37 22 L40 36 L45 18 L53 18 L44 47 L37 47 L34 35 L30 47 L23 47 Z"
        fill="#ffd23f" stroke="#1d1a2f" stroke-width="3.5" stroke-linejoin="round" transform="skewX(-10) translate(5 0)"/>
  <!-- turbo bolt -->
  <path d="M44 38 L52 38 L47 47 L55 47 L41 61 L45 50 L38 50 Z" fill="#2f7bff" stroke="#1d1a2f" stroke-width="3" stroke-linejoin="round"/>
</svg>
