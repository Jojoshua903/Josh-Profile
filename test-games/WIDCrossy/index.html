<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>WIDR Crossy: The Rankingstad Crossing</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div id="score">0</div>
  <div id="best">TOP 0</div>
  <div id="coins">🪙 <b>0</b></div>
  <div id="toast"></div>
  <button id="abil"><span id="abIcon"></span><span class="abTxt"><b id="abName"></b><small id="abSub"></small></span><span class="abBar"><span id="abFill"></span></span></button>
</div>

<section id="title" class="screen">
  <div class="logo">
    <div class="kicker">WIDR presents</div>
    <h1><span>WIDR</span><span>CROSSY</span></h1>
    <div class="sub">The Rankingstad Crossing</div>
  </div>
  <div class="menu">
    <button id="btnPlay" class="big">▶ Play</button>
    <button id="btnChars">👥 Characters</button>
    <button id="btnStory">📖 Story</button>
  </div>
  <div class="hint">Arrows / WASD to hop · E or Shift for your power · swipe or tap on phone</div>
  <div class="wallet">🪙 <b id="walletCoins">0</b></div>
</section>

<section id="death" class="screen hidden">
  <div class="card">
    <div class="rank">RANK <b id="deathScore">0</b></div>
    <div id="deathBest" class="small"></div>
    <div class="metaQuip"><span class="ring"></span><p id="deathQuip"></p></div>
    <div class="row">
      <button id="btnRetry" class="big">↻ Again</button>
      <button id="btnDeathChars">👥</button>
      <button id="btnDeathMenu">⌂</button>
    </div>
  </div>
</section>

<section id="select" class="screen hidden">
  <div class="panel">
    <header><h2>The Crew</h2><span id="unlockCount"></span><button class="close" data-close>✕</button></header>
    <div class="selBody">
      <div class="detail">
        <canvas id="preview"></canvas>
        <div class="nameplate"><h3 id="dName"></h3><div id="dTitle"></div></div>
        <p id="dBio"></p>
        <div id="dAbil" class="abilCard"></div>
        <p id="dSecret" class="secret"></p>
        <button id="btnPick" class="big">Pick</button>
      </div>
      <div class="side">
        <div id="grid"></div>
        <button id="btnGacha" class="gacha">🎰 Prize machine · 100 🪙</button>
      </div>
    </div>
  </div>
</section>

<section id="story" class="screen hidden">
  <div class="panel narrow">
    <header><h2>Story</h2><button class="close" data-close>✕</button></header>
    <ol id="chapters"></ol>
  </div>
</section>

<section id="cut" class="hidden">
  <div class="bar top"></div><div class="bar bot"></div>
  <div id="chapterCard"><div id="ccTitle"></div><div id="ccName"></div></div>
  <div id="dialog">
    <div id="who"></div>
    <p id="line"></p>
    <div class="next">click / space ▸</div>
  </div>
  <button id="skip">Skip ⏭</button>
</section>

<div id="unlockPop" class="hidden"><div class="inner"><div class="burst">NEW!</div><h3 id="upName"></h3><div id="upTitle"></div></div></div>

<script type="module" src="game.js"></script>
</body>
</html>
