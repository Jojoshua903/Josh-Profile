<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WidR School: A Rankingland Story</title>
<style>
:root{
  --ink:#2b2340; --paper:#fff8ee; --pink:#ff6f9f; --pink2:#ffd3e2; --mint:#7fd6c2;
  --sun:#ffc94d; --sky:#8ec5ff; --line:#2b2340;
  --display: "Chalkboard SE","Marker Felt","Comic Sans MS","Trebuchet MS",cursive;
  --body: "Avenir Next","Gill Sans","Trebuchet MS",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fbe7d6;font-family:var(--body);color:var(--ink);overflow:hidden}
#game{position:fixed;inset:0;bottom:52px;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:min(100vw,calc((100vh - 52px)*16/9));aspect-ratio:16/9;max-height:calc(100vh - 52px);overflow:hidden;border-radius:18px;box-shadow:0 0 0 4px var(--line),10px 10px 0 4px var(--line);background:#fff}
#bg{position:absolute;inset:0;transition:opacity .5s}
#bg svg{width:100%;height:100%;display:block}
#cast{position:absolute;inset:0;pointer-events:none}
.char{position:absolute;bottom:-4%;height:92%;aspect-ratio:3/5;transform:translateX(-50%);transition:left .45s cubic-bezier(.5,1.6,.4,1),filter .3s,opacity .4s}
.char svg{width:100%;height:100%;display:block;filter:drop-shadow(4px 4px 0 rgba(43,35,64,.25))}
.char.dim{filter:brightness(.82) saturate(.8)}
.char.enter{animation:pop .45s cubic-bezier(.5,1.7,.4,1)}
@keyframes pop{from{transform:translateX(-50%) translateY(14%);opacity:0}to{transform:translateX(-50%);opacity:1}}
.char.talk svg{animation:bob .5s ease-in-out}
@keyframes bob{50%{transform:translateY(-1.5%)}}

#box{position:absolute;left:3%;right:3%;bottom:3%;min-height:27%;background:var(--paper);border:3px solid var(--line);border-radius:16px;padding:3.2% 3% 2.4%;box-shadow:6px 6px 0 var(--line);cursor:pointer;
  background-image:repeating-linear-gradient(transparent 0 calc(1.6em - 1px),rgba(142,197,255,.35) calc(1.6em - 1px) 1.6em);}
#box::before{content:"";position:absolute;left:5%;top:0;bottom:0;border-left:2px solid rgba(255,111,159,.35)}
#name{position:absolute;top:-1.1em;left:4%;font-family:var(--display);font-size:clamp(14px,2.1vw,26px);padding:.15em .8em;border:3px solid var(--line);border-radius:12px;background:var(--pink);color:#fff;transform:rotate(-2deg);box-shadow:3px 3px 0 var(--line)}
#name:empty{display:none}
#text{font-size:clamp(13px,1.75vw,22px);line-height:1.6;min-height:3.2em;padding-left:3%}
#text.narr{font-style:italic;color:#5c5175}
#next{position:absolute;right:2.2%;bottom:6%;font-size:clamp(12px,1.6vw,20px);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
#choices{position:absolute;inset:0 0 34% 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2%;pointer-events:none}
#choices button{pointer-events:auto;font-family:var(--body);font-weight:600;font-size:clamp(12px,1.6vw,20px);width:62%;padding:1.1% 2%;border:3px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);box-shadow:4px 4px 0 var(--line);cursor:pointer;transition:transform .12s,background .12s;animation:pop2 .35s backwards}
#choices button:nth-child(2){animation-delay:.06s}#choices button:nth-child(3){animation-delay:.12s}#choices button:nth-child(4){animation-delay:.18s}
@keyframes pop2{from{transform:scale(.8);opacity:0}}
#choices button:hover{background:var(--pink2);transform:translate(-2px,-2px) rotate(-.5deg)}
#hud{position:absolute;top:2.5%;right:2%;display:flex;gap:8px;z-index:10}
.hbtn{font-family:var(--display);font-size:clamp(11px,1.3vw,16px);background:#fff;border:3px solid var(--line);border-radius:10px;padding:.25em .7em;box-shadow:3px 3px 0 var(--line);cursor:pointer}
#chapter{position:absolute;top:2.5%;left:2%;z-index:10;font-family:var(--display);font-size:clamp(11px,1.3vw,16px);background:var(--sun);border:3px solid var(--line);border-radius:10px;padding:.25em .8em;transform:rotate(-1.5deg);box-shadow:3px 3px 0 var(--line)}
#chapter:empty{display:none}
#journal{position:absolute;inset:0;z-index:11;display:none;overflow:hidden;font-size:clamp(10px,1.2vw,15px);background:rgba(20,14,34,0);transition:background .35s}

#fx{position:absolute;inset:0;pointer-events:none;z-index:4}
.flash{animation:flash .6s}
@keyframes flash{0%{background:rgba(255,255,255,.95)}100%{background:transparent}}
.shake{animation:shake .5s}
@keyframes shake{20%{transform:translateX(-1.5%)}40%{transform:translateX(1.5%)}60%{transform:translateX(-1%)}80%{transform:translateX(1%)}}
.sparkle span{position:absolute;font-size:3vw;animation:spk 1.4s forwards}
@keyframes spk{from{transform:scale(0) rotate(0);opacity:1}to{transform:scale(1.4) rotate(180deg) translateY(-40%);opacity:0}}
.siren{animation:siren .5s 6 alternate}
@keyframes siren{from{box-shadow:inset 0 0 12vw rgba(255,40,60,.55)}to{box-shadow:inset 0 0 12vw rgba(40,90,255,.55)}}

/* title + ending cards */
.card{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4%;
  background:radial-gradient(circle at 20% 20%,#ffe0ec 0 18%,transparent 19%),radial-gradient(circle at 85% 75%,#d9f3ec 0 22%,transparent 23%),radial-gradient(circle at 80% 15%,#fff1c4 0 10%,transparent 11%),var(--paper)}
.card h1{font-family:var(--display);font-size:clamp(28px,6vw,78px);margin:0;line-height:1;color:var(--pink);text-shadow:4px 4px 0 var(--line);-webkit-text-stroke:2px var(--line);transform:rotate(-3deg)}
.card h2{font-family:var(--display);font-size:clamp(14px,2.2vw,28px);margin:.6em 0 .2em}
.card p{max-width:62%;font-size:clamp(12px,1.6vw,19px);line-height:1.55}
.card .tag{font-family:var(--display);background:var(--mint);border:3px solid var(--line);border-radius:999px;padding:.2em 1em;font-size:clamp(11px,1.4vw,17px);box-shadow:3px 3px 0 var(--line);transform:rotate(2deg);margin-bottom:1em}
.card input{font-family:var(--body);font-size:clamp(13px,1.7vw,20px);padding:.5em 1em;border:3px solid var(--line);border-radius:12px;text-align:center;width:min(320px,50%);margin:1em 0 .6em;box-shadow:3px 3px 0 var(--line)}
.card .big{font-family:var(--display);font-size:clamp(14px,2vw,24px);background:var(--pink);color:#fff;border:3px solid var(--line);border-radius:14px;padding:.4em 1.6em;box-shadow:4px 4px 0 var(--line);cursor:pointer;margin:.3em}
.card .big:hover{transform:translate(-2px,-2px)}
.card .faces{display:flex;gap:1%;height:34%;margin-top:1.5%}
.card .faces div{height:100%;aspect-ratio:3/5;overflow:hidden}
.card .faces svg{width:100%;height:160%;}
.card .sub{font-size:clamp(11px,1.3vw,15px);color:#7a6e8f}
/* ranking board */
#rankboard{position:absolute;inset:0;z-index:12;display:none;align-items:center;justify-content:center;background:rgba(43,35,64,.35);cursor:pointer}
#rankboard .sheet{width:min(56%,620px);max-height:86%;overflow:auto;background:var(--paper);border:3px solid var(--line);border-radius:16px;box-shadow:8px 8px 0 var(--line);padding:2.2% 2.6%;transform:rotate(-1deg);animation:pop2 .35s}
#rankboard h3{font-family:var(--display);margin:0;font-size:clamp(16px,2.4vw,30px);color:var(--pink);text-shadow:2px 2px 0 var(--line);-webkit-text-stroke:1px var(--line)}
#rankboard .why{font-size:clamp(10px,1.2vw,14px);color:#7a6e8f;margin:.3em 0 .7em}
#rankboard ol{list-style:none;margin:0;padding:0;font-size:clamp(11px,1.35vw,17px)}
#rankboard li{display:grid;grid-template-columns:2.2em 1fr auto auto;gap:.6em;align-items:center;padding:.22em .5em;border-radius:8px}
#rankboard li:nth-child(odd){background:rgba(142,197,255,.15)}
#rankboard li.me{background:var(--sun);border:2px solid var(--line);font-weight:700;animation:me 1s ease-in-out 2}
@keyframes me{50%{transform:scale(1.03)}}
#rankboard li .n{font-family:var(--display)}
#rankboard li .tier{font-size:.75em;padding:.05em .5em;border-radius:999px;border:2px solid var(--line)}
.t1{background:var(--pink);color:#fff}.t2{background:var(--mint)}.t3{background:#fff}.t4{background:#ddd}
#rankboard .delta{font-family:var(--display);font-size:clamp(13px,1.7vw,22px);margin-top:.5em}
#rankboard .tap{font-size:clamp(10px,1.1vw,13px);color:#7a6e8f;text-align:right;margin-top:.4em}
/* main menu */
#menu{position:absolute;inset:0;z-index:15;display:none;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);
  background:linear-gradient(90deg,rgba(255,248,238,0) 0 40%,rgba(255,248,238,.94) 58%)}
#menu .hero{position:relative;overflow:hidden}
#menu .logo{position:absolute;top:7%;left:6%;background:var(--paper);border:3px solid var(--line);border-radius:18px;box-shadow:6px 6px 0 var(--line);padding:2.4% 4% 2%;transform:rotate(-3deg);z-index:2;animation:drop .6s cubic-bezier(.5,1.6,.4,1)}
@keyframes drop{from{transform:rotate(-3deg) translateY(-40%);opacity:0}}
#menu .logo .k{font-family:var(--display);font-size:clamp(10px,1.2vw,15px);letter-spacing:.2em;text-transform:uppercase;color:#7a6e8f}
#menu .logo h1{font-family:var(--display);font-size:clamp(30px,6.4vw,84px);margin:.05em 0 0;line-height:.95;color:var(--pink);text-shadow:4px 4px 0 var(--line);-webkit-text-stroke:2px var(--line)}
#menu .logo .s{font-family:var(--display);font-size:clamp(11px,1.4vw,18px);margin-top:.35em}
#menu .lineup{position:absolute;left:-2%;right:-8%;bottom:-10%;height:66%;display:flex;justify-content:center;align-items:flex-end}
#menu .lineup div{height:100%;aspect-ratio:3/5;margin:0 -2.4%;transition:transform .25s;animation:rise .6s backwards;cursor:pointer}
#menu .lineup div:nth-child(2){height:94%;animation-delay:.08s}#menu .lineup div:nth-child(3){animation-delay:.16s}#menu .lineup div:nth-child(4){height:94%;animation-delay:.24s}#menu .lineup div:nth-child(5){animation-delay:.32s}
@keyframes rise{from{transform:translateY(30%);opacity:0}}
#menu .lineup div:hover{transform:translateY(-5%)}
#menu .lineup svg{width:100%;height:100%;filter:drop-shadow(4px 4px 0 rgba(43,35,64,.25))}
#menu .side{display:flex;flex-direction:column;justify-content:center;gap:1.8%;padding:3% 8% 3% 6%}
.mbtn{font-family:var(--display);font-size:clamp(13px,1.85vw,23px);text-align:left;color:var(--ink);background:#fff;border:3px solid var(--line);border-radius:14px;padding:.42em .85em;box-shadow:4px 4px 0 var(--line);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:.6em;transition:transform .12s,box-shadow .12s;animation:pop2 .35s backwards}
.mbtn small{font-family:var(--body);font-size:.58em;opacity:.7;font-weight:600}
.mbtn.primary{background:var(--pink);color:#fff}
.mbtn.mint{background:var(--mint)}
.mbtn:hover{transform:translate(-3px,-3px) rotate(-.6deg);box-shadow:7px 7px 0 var(--line)}
.mbtn[disabled]{opacity:.45;pointer-events:none}
#menu .foot{font-size:clamp(10px,1.1vw,13px);color:#7a6e8f;margin-top:2%}
#panel{position:absolute;inset:5% 5%;z-index:21;background:var(--paper);border:3px solid var(--line);border-radius:18px;box-shadow:8px 8px 0 var(--line);padding:2.6% 3.2%;overflow:auto;display:none;animation:pop2 .3s;font-size:clamp(11px,1.35vw,16px);line-height:1.5}
#panel h2{font-family:var(--display);font-size:clamp(18px,2.8vw,36px);margin:0 0 .4em;color:var(--pink);text-shadow:2px 2px 0 var(--line);-webkit-text-stroke:1px var(--line)}
#panel .x{position:sticky;top:0;float:right;font-family:var(--display);font-size:clamp(12px,1.4vw,17px);background:var(--sun);border:3px solid var(--line);border-radius:10px;padding:.2em .7em;box-shadow:3px 3px 0 var(--line);cursor:pointer}
.profiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.6%;clear:both}
.prof{border:3px solid var(--line);border-radius:14px;background:#fff;overflow:hidden;box-shadow:3px 3px 0 var(--line);margin-bottom:6%}
.prof .pic{height:clamp(80px,13vw,170px);overflow:hidden;border-bottom:3px solid var(--line)}
.prof .pic svg{width:100%;height:auto;display:block;margin-top:-6%}
.prof .inf{padding:.5em .7em .7em}
.prof b{font-family:var(--display);font-size:1.2em}
.prof .tg{display:inline-block;font-size:.72em;border:2px solid var(--line);border-radius:999px;padding:0 .55em;margin-left:.3em;vertical-align:middle}
.prof p{margin:.3em 0 0;font-size:.88em}
.ends{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2%;clear:both}
.endc{border:3px solid var(--line);border-radius:14px;background:#fff;text-align:center;overflow:hidden;box-shadow:3px 3px 0 var(--line)}
.endc .pic{height:clamp(70px,12vw,160px);overflow:hidden}
.endc .pic svg{width:100%;height:auto;margin-top:-4%}
.endc.lock .pic{filter:brightness(0) opacity(.25)}
.endc .inf{padding:.4em .4em .6em;border-top:3px solid var(--line)}
.endc b{font-family:var(--display);display:block}
.rules li{margin:.35em 0}
.seg{display:inline-flex;border:3px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:3px 3px 0 var(--line);margin:.3em 0 1em}
.seg button{font-family:var(--display);font-size:1em;border:0;border-right:3px solid var(--line);background:#fff;padding:.3em .9em;cursor:pointer;color:var(--ink)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--pink);color:#fff}
.pbtn{font-family:var(--display);font-size:1.05em;background:var(--pink);color:#fff;border:3px solid var(--line);border-radius:12px;padding:.35em 1.1em;box-shadow:3px 3px 0 var(--line);cursor:pointer;margin:.2em .5em .2em 0}
.pbtn.alt{background:var(--mint);color:var(--ink)}.pbtn.ghost{background:#fff;color:var(--ink)}
#panel textarea{width:100%;height:9em;font-family:Menlo,monospace;font-size:.75em;border:3px solid var(--line);border-radius:10px;padding:.6em;margin-top:.6em;background:#fff}
#panel .msg{font-weight:700;color:#2e9e5b;min-height:1.4em;margin:.3em 0}
#panel input.nm{font-family:var(--body);font-size:1.3em;padding:.4em .8em;border:3px solid var(--line);border-radius:12px;box-shadow:3px 3px 0 var(--line);width:min(340px,70%);margin:.4em .6em .8em 0}
#pause{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(43,35,64,.4)}
#pause .sheet{background:var(--paper);border:3px solid var(--line);border-radius:18px;box-shadow:8px 8px 0 var(--line);padding:2.4% 3%;display:flex;flex-direction:column;gap:10px;min-width:30%;transform:rotate(-1deg);animation:pop2 .3s}
#pause h3{font-family:var(--display);margin:0 0 .2em;font-size:clamp(18px,2.4vw,30px);color:var(--pink);-webkit-text-stroke:1px var(--line);text-shadow:2px 2px 0 var(--line)}
@media print{#hud,#choices,#next{display:none}#game{position:static}html,body{overflow:visible}}
/* smooth scene changes */
#bg .bgl{position:absolute;inset:0;opacity:0;transition:opacity .65s ease}
#bg .bgl.on{opacity:1}
.chcard{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(43,35,64,.55) 25%,rgba(43,35,64,.55) 75%,transparent);animation:chin .5s ease}
.chcard div{text-align:center;color:#fff;animation:chslide .7s cubic-bezier(.3,1.4,.5,1)}
.chcard small{display:block;font-family:var(--display);letter-spacing:.3em;text-transform:uppercase;font-size:clamp(11px,1.5vw,18px);color:var(--sun)}
.chcard b{display:block;font-family:var(--display);font-size:clamp(26px,5vw,64px);color:#fff;text-shadow:4px 4px 0 var(--line);-webkit-text-stroke:2px var(--line)}
.chcard.out{opacity:0;transition:opacity .6s}
@keyframes chin{from{opacity:0}to{opacity:1}}
@keyframes chslide{from{transform:translateX(-30%);opacity:0}to{transform:none;opacity:1}}
/* overlays: special scenes, phone, day card */
.ovl{position:absolute;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;cursor:pointer;animation:chin .45s ease}
.ovl.out{opacity:0;transition:opacity .3s}
.ovl .tapnote{position:absolute;bottom:2.5%;left:0;right:0;text-align:center;font-family:var(--display);font-size:clamp(11px,1.3vw,16px);color:#fff;text-shadow:2px 2px 0 var(--line);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.35}}
.ovl.cg{background:#000}
.cgimg{position:absolute;inset:0;animation:kenburns 9s ease-out forwards}
.cgimg svg{width:100%;height:100%;display:block}
@keyframes kenburns{from{transform:scale(1.08)}to{transform:scale(1)}}
.ovl.phone{background:rgba(43,35,64,.45)}
.ph{width:32%;min-width:240px;height:84%;background:#fff;border:4px solid var(--line);border-radius:28px;box-shadow:8px 8px 0 var(--line);display:flex;flex-direction:column;overflow:hidden;animation:phup .45s cubic-bezier(.3,1.4,.5,1);cursor:default;font-size:clamp(11px,1.3vw,16px)}
@keyframes phup{from{transform:translateY(40%) rotate(4deg);opacity:0}to{transform:none;opacity:1}}
.phtop{display:flex;align-items:center;gap:.6em;padding:.8em 1em;border-bottom:3px solid var(--line);background:var(--paper)}
.phtop span{width:2em;height:2em;border-radius:50%;border:3px solid var(--line);display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--display)}
.phtop b{font-family:var(--display)}
.phmsgs{flex:1;padding:1em;display:flex;flex-direction:column;gap:.5em;overflow:auto;background:#f6f1fb}
.bub{max-width:78%;background:#fff;border:2px solid var(--line);border-radius:14px 14px 14px 4px;padding:.45em .75em;align-self:flex-start;animation:pop2 .3s backwards}
.bub:nth-child(2){animation-delay:.5s}.bub:nth-child(3){animation-delay:1s}
.bub.me{align-self:flex-end;background:var(--pink);color:#fff;border-radius:14px 14px 4px 14px;animation-delay:0s}
.phrep{padding:.7em;border-top:3px solid var(--line);display:flex;flex-direction:column;gap:.4em;text-align:center}
.phrep button{font:inherit;background:#fff;border:3px solid var(--line);border-radius:12px;padding:.4em;cursor:pointer;box-shadow:2px 2px 0 var(--line)}
.phrep button:hover{background:var(--sun)}
.ovl.daycard{background:linear-gradient(160deg,rgba(255,111,159,.82),rgba(43,35,64,.88))}
.dc{color:#fff;text-align:center;font-family:var(--display);width:80%}
.dcw{font-size:clamp(30px,5vw,64px);animation:pop2 .5s}
.dcd small{display:block;letter-spacing:.3em;text-transform:uppercase;color:var(--sun);font-size:clamp(11px,1.4vw,18px)}
.dcd b{display:block;font-size:clamp(30px,6vw,80px);text-shadow:5px 5px 0 var(--line);-webkit-text-stroke:2px var(--line);animation:chslide .6s cubic-bezier(.3,1.4,.5,1)}
.dcs{margin:.4em auto;font-size:clamp(12px,1.6vw,20px);background:rgba(255,255,255,.18);display:inline-block;padding:.25em .9em;border-radius:99px}
.strip{display:flex;justify-content:center;gap:1.2%;margin:1.4em 0 1em}
.cd{width:9%;background:#fff;color:var(--ink);border:3px solid var(--line);border-radius:12px;padding:.3em 0;box-shadow:3px 3px 0 var(--line);position:relative;opacity:.75}
.cd small{display:block;font-size:clamp(9px,1vw,13px)}.cd b{font-size:clamp(14px,2vw,26px)}
.cd.now{opacity:1;background:var(--sun);transform:translateY(-12%) scale(1.12)}
.cd.ev{background:#ffd3e2}
.cd i{position:absolute;top:-.7em;right:-.4em;font-style:normal;color:var(--pink);text-shadow:1px 1px 0 var(--line)}
.dcn{font-size:clamp(13px,1.8vw,22px)}
/* stat & rank banners */
.toast{position:absolute;top:12%;left:50%;transform:translateX(-50%);z-index:13;background:#fff;border:3px solid var(--line);border-radius:12px;padding:.35em 1em;box-shadow:3px 3px 0 var(--line);font-family:var(--display);font-size:clamp(12px,1.5vw,19px);animation:pop2 .3s;pointer-events:none}
.toast.big{background:var(--sun);font-size:clamp(14px,2vw,26px)}
.toast.out,.rankup.out{opacity:0;transition:opacity .5s}
.rankup{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-2deg);z-index:13;background:var(--paper);border:4px solid var(--line);border-radius:20px;box-shadow:8px 8px 0 var(--line);padding:1.2em 3em;text-align:center;font-family:var(--display);pointer-events:none;animation:pop2 .45s cubic-bezier(.3,1.6,.5,1)}
.rankup small{display:block;color:var(--pink);letter-spacing:.2em;font-size:clamp(11px,1.4vw,18px)}
.rankup b{display:block;font-size:clamp(24px,4vw,52px);-webkit-text-stroke:1px var(--line)}
.rankup span{display:block;font-size:clamp(13px,1.7vw,22px)}
.rankup i{display:block;font-style:normal;color:var(--sun);-webkit-text-stroke:1px var(--line);font-size:clamp(16px,2.2vw,28px);letter-spacing:.1em}
/* memories gallery */
.mems{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.mem{aspect-ratio:16/9;border:3px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;box-shadow:3px 3px 0 var(--line);background:#2b2340}
.mem svg{width:100%;height:100%;display:block}
.mem.lock{display:flex;align-items:center;justify-content:center;cursor:default;background:#e6dff0}
.mem.lock span{font-family:var(--display);font-size:2em;color:#7a6e8f}
/* notebook: Persona-style slide-in */
#journal.open{background:rgba(20,14,34,.55)}
#journal .nbslash{position:absolute;top:-20%;bottom:-20%;left:-30%;width:62%;background:var(--pink);transform:skewX(-14deg) translateX(-110%);transition:transform .4s cubic-bezier(.7,0,.2,1);box-shadow:14px 0 0 var(--line),28px 0 0 var(--sun)}
#journal.open .nbslash{transform:skewX(-14deg) translateX(0)}
#journal .nbwrap{position:absolute;top:4%;bottom:4%;right:3%;width:66%;background:var(--paper);border:4px solid var(--line);border-radius:18px;box-shadow:10px 10px 0 var(--line);display:flex;flex-direction:column;padding:1.6% 2%;transform:translateX(120%) rotate(3deg);transition:transform .45s cubic-bezier(.2,1.25,.4,1) .08s}
#journal.open .nbwrap{transform:none}
#journal.closing .nbslash{transform:skewX(-14deg) translateX(-110%);transition-duration:.3s}
#journal.closing .nbwrap{transform:translateX(120%) rotate(3deg);transition:transform .3s cubic-bezier(.7,0,.8,.4)}
.nbhead{display:flex;align-items:center;gap:3%}
.nbtitle{font-family:var(--display);font-size:clamp(22px,3.4vw,44px);line-height:.9;color:var(--pink);-webkit-text-stroke:1.5px var(--line);text-shadow:3px 3px 0 var(--line);transform:rotate(-3deg)}
.nbtitle small{display:block;font-size:.4em;color:var(--ink);-webkit-text-stroke:0;text-shadow:none;letter-spacing:.15em;text-transform:uppercase}
.nbdate{flex:1;min-width:0;font-family:var(--display)}.nbdate span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nbdate b{display:block;font-size:1.35em}.nbdate span{color:#7a6e8f}
.nbx{font-family:var(--display);font-size:1.2em;background:var(--sun);border:3px solid var(--line);border-radius:10px;padding:.15em .6em;box-shadow:3px 3px 0 var(--line);cursor:pointer}
.nbtabs{display:flex;gap:.6em;margin:.8em 0 .7em;align-items:center}
.nbtabs button{font-family:var(--display);font-size:1.1em;background:#fff;color:var(--ink);border:3px solid var(--line);padding:.2em 1.2em;transform:skewX(-12deg);box-shadow:3px 3px 0 var(--line);cursor:pointer;transition:transform .15s,background .15s}
.nbtabs button.on{background:var(--ink);color:#fff;transform:skewX(-12deg) translateY(-3px) scale(1.06)}
.nbtabs button:hover{transform:skewX(-12deg) translateY(-3px)}
.nbkeys{margin-left:auto;color:#7a6e8f;font-size:.85em}
.nbbody{flex:1;min-height:0;overflow:auto;padding:.2em .3em .4em 0}
.nbconf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6em}
.nbc{display:flex;gap:.7em;align-items:center;background:#fff;border:3px solid var(--line);border-left:10px solid var(--c);border-radius:12px;padding:.35em .6em;box-shadow:3px 3px 0 var(--line);animation:nbin .35s backwards}
.nbc:nth-child(2){animation-delay:.04s}.nbc:nth-child(3){animation-delay:.08s}.nbc:nth-child(4){animation-delay:.12s}.nbc:nth-child(5){animation-delay:.16s}.nbc:nth-child(6){animation-delay:.2s}.nbc:nth-child(7){animation-delay:.24s}.nbc:nth-child(8){animation-delay:.28s}
.nbpic{width:3.6em;height:3.6em;flex:none;border-radius:50%;overflow:hidden;border:3px solid var(--line);background:color-mix(in srgb,var(--c) 25%,#fff)}
.nbpic svg{width:100%;height:auto;margin-top:-6%;display:block}
.nbi{flex:1;min-width:0}.nbi b{font-family:var(--display);font-size:1.15em}
.nbi .t{font-style:normal;font-size:.75em;margin-left:.5em;padding:.05em .5em;border-radius:99px;background:#eee}.nbi .t.love{background:#ffd3e2}
.nbstars{color:var(--c);letter-spacing:1px;-webkit-text-stroke:.5px var(--line);line-height:1.1}.nbstars span{color:#e3dcec;-webkit-text-stroke:0}
.nbbar{height:.5em;border:2px solid var(--line);border-radius:99px;background:#fff;overflow:hidden;margin:.2em 0}
.nbbar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--pink));animation:grow .7s ease .3s backwards}
.nbi small{color:#7a6e8f;font-size:.82em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.nbstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8em}
.nbs{background:#fff;border:3px solid var(--line);border-radius:14px;padding:.6em .9em;box-shadow:4px 4px 0 var(--line);animation:nbin .35s var(--d) backwards}
.nbsn{font-family:var(--display);font-size:1.6em;color:var(--pink);-webkit-text-stroke:1px var(--line)}
.nbsl{font-family:var(--display);margin-bottom:.3em}
.nbseg{display:flex;gap:4%}.nbseg i{flex:1;height:.9em;border:2px solid var(--line);transform:skewX(-15deg);background:#fff;position:relative;overflow:hidden}
.nbseg i.on{background:var(--pink)}.nbseg i u{position:absolute;left:0;top:0;bottom:0;background:var(--sun);animation:grow .7s ease .25s backwards}
.nbs small{display:block;color:#7a6e8f;margin-top:.35em}
.nbtip{grid-column:1/-1;color:#7a6e8f;font-size:.85em;margin:.2em 0 0}
.nbme{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8em}
.nbbig{background:#fff;border:3px solid var(--line);border-radius:14px;padding:.7em .9em;box-shadow:4px 4px 0 var(--line);animation:nbin .35s backwards}
.nbbig small{display:block;color:#7a6e8f;text-transform:uppercase;letter-spacing:.1em}.nbbig b{font-family:var(--display);font-size:2.4em;color:var(--pink);-webkit-text-stroke:1px var(--line)}
.nbline{grid-column:1/-1;display:flex;justify-content:space-between;gap:1em;background:#fff;border:3px solid var(--line);border-radius:12px;padding:.5em .9em;flex-wrap:wrap}
.nbwarn{grid-column:1/-1;background:#ffe1e6;border:3px solid #e8364f;border-radius:12px;padding:.5em .9em;font-family:var(--display);color:#e8364f}
@keyframes nbin{from{opacity:0;transform:translateX(30px) skewX(-6deg)}to{opacity:1;transform:none}}
@keyframes grow{from{width:0}}
</style>

<script>
// ---------- CHARACTER ART ----------
const CHARS = {
  natan:  {name:'Natan',  color:'#2c3e78', skin:'#f2c7a5', hair:'#5a3a22', hs:'curly',  eye:'#6b4a2b', top:'varsity', tc:'#2c3e78', tc2:'#f3ead6', fw:1, bw:1.05},
  lars:   {name:'Lars',   color:'#3d8fe0', skin:'#f7dcc8', hair:'#8a5a34', hs:'curly',  eye:'#3d8fe0', top:'shirt',   tc:'#ffffff', tc2:'#dfe8f5', fw:.96, bw:.92},
  adam:   {name:'Adam',   color:'#2f8f8a', skin:'#eac09c', hair:'#3b2a1e', hs:'down', fy:156, hl:'#6a5040', eye:'#3fa85a', top:'zip', tc:'#2f8f8a', tc2:'#e9f6f3', fw:1, bw:1},
  fionn:  {name:'Fionn',  color:'#2e9e5b', skin:'#f8dfcf', hair:'#16131a', hs:'down', fy:162, eye:'#1c1418', top:'jersey',  tc:'#2e9e5b', tc2:'#ffffff', fw:1.13, bw:1.2, num:'9', braces:true},
  milo:   {name:'Milo',   color:'#1d1a24', skin:'#fae6d8', hair:'#1d1a24', hs:'down', fy:170, eye:'#5b3a29', top:'coat',    tc:'#c49a6c', tc2:'#1f1c26', fw:1, bw:1, buds:true},
  mada:   {name:'Mada',   color:'#c2185b', skin:'#eac09c', hair:'#2a1d16', hs:'long', hl:'#5a4030', eye:'#3fa85a', top:'coat', tc:'#e85d75', tc2:'#fff4f6', fw:.95, bw:.9, fem:true, earrings:true},
  gian:   {name:'Gianmarcina', color:'#e84a6f', skin:'#f7dcc8', hair:'#ff6f8f', hs:'bob', hl:'#c94467', eye:'#8a4b2c', top:'hoodie', tc:'#ffb3c6', tc2:'#fff0f4', fw:.95, bw:.9, fem:true, clip:'strawberry'},
  goon:{name:'Goonseppe', color:'#5aa02c', skin:'#f4d6c0', hair:'#7cc24a', hs:'long', hl:'#4f8a2c', eye:'#4a8a2c', top:'zip', tc:'#9ad65c', tc2:'#f2ffe6', fw:.95, bw:.9, fem:true, clip:'apple'},

  josh:   {name:'Josh',   color:'#f08a3c', skin:'#f4cdb0', hair:'#b98a4e', hs:'messy', hl:'#8a6230', eye:'#6d8a9c', top:'hoodie',  tc:'#f08a3c', tc2:'#ffd9b8', fw:1, bw:1},

};
const L='#2b2340';

function curlRing(cx,cy,r,a0,a1,step,cr,fill){
  let s='';
  for(let a=a0;a<=a1;a+=step){const t=a*Math.PI/180;
    s+=`<circle cx="${(cx+Math.cos(t)*r).toFixed(1)}" cy="${(cy+Math.sin(t)*r).toFixed(1)}" r="${cr}" fill="${fill}" stroke="${L}" stroke-width="3"/>`;}
  return s;
}
function hairBack(c,form){
  const h=c.hair, w=58*c.fw, S3=`fill="${h}" stroke="${L}" stroke-width="3" stroke-linejoin="round"`;
  if(c.hs==='curly'){
    let s=`<ellipse cx="150" cy="150" rx="${w+14}" ry="78" fill="${h}" stroke="${L}" stroke-width="3"/>`;
    s+=curlRing(150,160,w+12,160,380,16,22,h);
    if(form==='girl'){ for(let y=200;y<=330;y+=26){s+=`<circle cx="${150-w-12}" cy="${y}" r="24" fill="${h}" stroke="${L}" stroke-width="3"/><circle cx="${150+w+12}" cy="${y}" r="24" fill="${h}" stroke="${L}" stroke-width="3"/>`;}
      s+=`<rect x="${150-w-30}" y="190" width="${2*w+60}" height="140" rx="40" fill="${h}"/>`;}
    return s;
  }
  // full, voluminous shapes that sit well above the head so nobody looks bald
  if(c.hs==='down') return `<path d="M${150-w-13} 218 C${150-w-24} 130 ${150-w-6} 70 150 68 C${150+w+6} 70 ${150+w+24} 130 ${150+w+13} 218 Z" ${S3}/>`;
  if(c.hs==='long') return `<path d="M${150-w-16} 392 C${150-w-34} 230 ${150-w-26} 72 150 70 C${150+w+26} 72 ${150+w+34} 230 ${150+w+16} 392 Q150 410 ${150-w-16} 392Z" ${S3}/>`;
  if(c.hs==='bob') return `<path d="M${150-w-14} 254 C${150-w-26} 132 ${150-w-6} 72 150 70 C${150+w+6} 72 ${150+w+26} 132 ${150+w+14} 254 Q150 268 ${150-w-14} 254Z" ${S3}/>`;
  if(c.hs==='messy') return `<path d="M${150-w-10} 196 L${150-w-20} 128 L${150-w-2} 112 L${150-w+4} 72 L${150-18} 92 L150 60 L${150+20} 88 L${150+w-4} 66 L${150+w+6} 108 L${150+w+22} 124 L${150+w+10} 196 Z" ${S3}/>`;
  if(c.hs==='fade') return `<path d="M${150-w-2} 172 C${150-w-6} 110 ${150-w+2} 82 150 80 C${150+w-2} 82 ${150+w+6} 110 ${150+w+2} 172 Z" ${S3}/>`;
  return `<path d="M${150-w-8} 184 C${150-w-14} 100 ${150-w} 74 150 72 C${150+w} 74 ${150+w+14} 100 ${150+w+8} 184 Z" ${S3}/>`;
}
// Front hair: outer crown, then down the temples, then a jagged fringe edge across the forehead.
function fringe(c,fy,side,top,jag){
  const w=58*c.fw; let tips='';
  for(let i=8;i>=0;i--){const x=150-w+10+i*((2*w-20)/8); tips+=` L${x.toFixed(1)} ${fy-(i%2?0:jag)}`;}
  return `M${150-w-8} ${side} C${150-w-16} 120 ${150-w+6} ${top} 150 ${top} C${150+w-6} ${top} ${150+w+16} 120 ${150+w+8} ${side} L${150+w-3} ${side} L${150+w-6} ${fy-4}${tips} L${150-w+6} ${fy-4} L${150-w+3} ${side} Z`;
}
function hairFront(c,form){
  const h=c.hair, w=58*c.fw, S3=`fill="${h}" stroke="${L}" stroke-width="3" stroke-linejoin="round"`, sh=`stroke="${c.hl||'#4a4458'}" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".7"`;
  if(c.hs==='curly'){
    let s='';
    for(let i=0;i<6;i++){const x=150-w+14+i*((2*w-28)/5); s+=`<circle cx="${x.toFixed(1)}" cy="${118+(i%2)*8}" r="19" fill="${h}" stroke="${L}" stroke-width="3"/>`;}
    s+=`<circle cx="${150-w+2}" cy="150" r="16" fill="${h}" stroke="${L}" stroke-width="3"/><circle cx="${150+w-2}" cy="150" r="16" fill="${h}" stroke="${L}" stroke-width="3"/>`;
    return s;
  }
  if(c.hs==='down'){
    const fy=c.fy||160;
    return `<path d="${fringe(c,fy,206,72,11)}" ${S3}/>`
      +`<path d="M${150-30} 96 L${150-36} ${fy-14} M${150-8} 88 L${150-10} ${fy-12} M${150+14} 90 L${150+16} ${fy-14} M${150+34} 98 L${150+40} ${fy-16} M${150-w+2} 130 L${150-w+4} 196 M${150+w-2} 130 L${150+w-4} 196" ${sh}/>`;
  }
  if(c.hs==='long'){
    return `<path d="M${150-w-8} 246 C${150-w-16} 120 ${150-w+6} 74 150 74 C${150+w-6} 74 ${150+w+16} 120 ${150+w+8} 246 L${150+w-2} 246 C${150+w-4} 190 ${150+w-6} 160 ${150+w-14} 146 C${150+20} 150 ${150-20} 120 ${150-w+18} 150 C${150-w+8} 170 ${150-w+4} 200 ${150-w+2} 246 Z" ${S3}/>`
      +`<path d="M${150-10} 84 C${150+10} 110 ${150+30} 130 ${150+w-16} 146 M${150-w+6} 160 L${150-w+4} 240 M${150+w-6} 160 L${150+w-4} 240" ${sh}/>`;
  }
  if(c.hs==='bob'){
    return `<path d="M${150-w-8} 250 C${150-w-16} 120 ${150-w+6} 76 150 76 C${150+w-6} 76 ${150+w+16} 120 ${150+w+8} 250 L${150+w-2} 250 L${150+w-6} 152 L${150-w+6} 152 L${150-w+2} 250 Z" ${S3}/>`
      +`<path d="M${150-30} 96 L${150-32} 150 M150 88 L150 150 M${150+30} 96 L${150+32} 150" ${sh}/>`;
  }
  if(c.hs==='messy') return `<path d="${fringe(c,150,178,70,16)}" ${S3}/><path d="M${150-24} 84 L${150-30} 130 M${150+18} 80 L${150+22} 132" ${sh}/>`;
  if(c.hs==='fade') return `<path d="M${150-w+2} 158 L${150-w+2} 100 C${150-w+10} 82 ${150+w-10} 82 ${150+w-2} 100 L${150+w-2} 158 C${150+24} 134 ${150-24} 134 ${150-w+2} 158Z" ${S3}/><path d="M${150-w+12} 100 L${150+w-12} 100 M${150-w+12} 116 L${150+w-12} 116" ${sh}/>`;
  // short: textured crop with a little fringe
  return `<path d="${fringe(c,148,176,74,8)}" ${S3}/><path d="M${150-20} 90 L${150-24} 136 M${150+12} 86 L${150+14} 134" ${sh}/>`;
}
function body(c,form){
  const k=c.bw, X=v=>(150+(v-150)*k).toFixed(1);
  const sh=`M${X(30)} 520 C${X(34)} 360 ${X(80)} 312 150 306 C${X(220)} 312 ${X(266)} 360 ${X(270)} 520 Z`;

      s+=`<path d="M122 306 L150 345 L178 306" fill="#fff" stroke="${L}" stroke-width="3"/><line x1="150" y1="345" x2="150" y2="520" stroke="${L}" stroke-width="3"/>`;
      s+=`<text x="${X(112)}" y="415" font-family="Georgia" font-weight="bold" font-size="46" fill="${c.tc2}" stroke="${L}" stroke-width="2" text-anchor="middle">W</text>`;
      break;
    case 'shirt':
      s+=`<path d="M118 304 L150 336 L134 350 Z M182 304 L150 336 L166 350 Z" fill="#fff" stroke="${L}" stroke-width="3" stroke-linejoin="round"/><line x1="150" y1="336" x2="150" y2="520" stroke="#c9d4e6" stroke-width="3"/>`;
      for(let y=370;y<500;y+=40) s+=`<circle cx="156" cy="${y}" r="3.5" fill="#c9d4e6"/>`;
      s+=`<path d="M${X(70)} 520 C${X(72)} 440 ${X(80)} 400 ${X(86)} 380" stroke="#dfe8f5" stroke-width="4" fill="none"/>`;
      break;
    case 'zip':
      s+=`<path d="M128 306 L150 300 L172 306 L172 334 L150 340 L128 334Z" fill="${c.tc}" stroke="${L}" stroke-width="3"/><line x1="150" y1="320" x2="150" y2="520" stroke="${c.tc2}" stroke-width="4"/><rect x="146" y="344" width="8" height="14" rx="2" fill="#ddd" stroke="${L}" stroke-width="2"/>`;
      s+=`<path d="M${X(60)} 400 L${X(240)} 400" stroke="${c.tc2}" stroke-width="6"/>`;
      break;
    case 'jersey':
      s+=`<path d="M124 307 C136 330 164 330 176 307" fill="none" stroke="${c.tc2}" stroke-width="7"/>`;
      s+=`<text x="150" y="450" font-family="Impact,Arial Black" font-size="${c.num.length>1?70:84}" fill="${c.tc2}" stroke="${L}" stroke-width="2.5" text-anchor="middle">${c.num}</text>`;
      break;
    case 'coat':
      s+=`<path d="M128 302 L150 296 L172 302 L176 350 L150 356 L124 350Z" fill="${c.tc2}" stroke="${L}" stroke-width="3"/>`;
      s+=`<path d="M124 306 L108 380 L150 520 L120 520 L${X(70)} 520 Z M176 306 L192 380 L150 520 L180 520 L${X(230)} 520Z" fill="${c.tc}" stroke="${L}" stroke-width="3" stroke-linejoin="round"/>`;
      s+=`<path d="M150 356 L150 520" stroke="${c.tc2}" stroke-width="40"/><path d="M116 330 L100 390 L126 372Z M184 330 L200 390 L174 372Z" fill="#a37d55" stroke="${L}" stroke-width="2.5"/>`;
      break;
    case 'hoodie':
      s+=`<path d="M100 318 C110 290 190 290 200 318 C185 338 115 338 100 318Z" fill="${c.tc2}" stroke="${L}" stroke-width="3"/><line x1="138" y1="330" x2="134" y2="380" stroke="${L}" stroke-width="3"/><line x1="162" y1="330" x2="166" y2="380" stroke="${L}" stroke-width="3"/>`;
      s+=`<path d="M100 440 L200 440 L190 500 L110 500Z" fill="none" stroke="${L}" stroke-width="3" opacity=".5"/>`;
      break;
    case 'jacket':
      s+=`<path d="M126 306 L150 330 L174 306 L172 520 L128 520Z" fill="#fff" stroke="${L}" stroke-width="3"/><path d="M126 306 L112 360 L136 380 L150 330Z M174 306 L188 360 L164 380 L150 330Z" fill="${c.tc}" stroke="${L}" stroke-width="3" stroke-linejoin="round"/>`;
      s+=`<path d="M138 300 L162 300 L156 320 L144 320Z" fill="#c9a227" stroke="${L}" stroke-width="2"/>`;
      break;
    case 'police':
      s+=`<path d="M124 307 L150 336 L176 307" fill="#fff" stroke="${L}" stroke-width="3"/><path d="M146 336 L154 336 L156 400 L150 410 L144 400Z" fill="#1a1a2e"/><path d="M190 370 L214 370 L214 398 L202 408 L190 398Z" fill="#ffd34d" stroke="${L}" stroke-width="2.5"/>`;
      break;
  }

// ---------- STORY PART 2: Chapters 3–8 ----------
const topChar=G=>['natan','lars','adam','fionn','milo'].reduce((a,b)=>G.aff[b]>G.aff[a]?b:a,'lars');
// Connection needed before someone says yes. Your WidR Ranking shifts it (see rankMod).
const BASE={natan:9, lars:7, adam:9, fionn:8, milo:12, mada:11, gian:9, goon:9};
const need=k=>BASE[k]+rankMod();
const miloGate=G=>G.flags.phonk && G.flags.milo_trust && !G.flags.milo_called && myRank()<=5;
const canDate=(G,k)=>G.aff[k]>=need(k) && crOf(k)>=crReq(k) && (k!=='milo' || miloGate(G)) && (k!=='mada' || myRank()<=3);
const avail=G=>ROM.filter(k=>visible(G,k) && !G.friend.includes(k) && !G.dating.includes(k) && !G.out.includes(k) && !(G.final && G.tried.includes(k)));
const afterConf=G=>G.ret;
function confessMenu(ret, noneText){
  return G=>avail(G).map(k=>({t:CHARS[k].name, do:G=>{G.ret=ret; if(G.final) G.tried.push(k);}, goto:'ask_'+k}))
    .concat(noneText?[{t:noneText, goto:ret}]:[]);
}

  ctx.fillStyle='#2b2340';ctx.beginPath();ctx.ellipse(-10,-18,4,6,0,0,7);ctx.ellipse(10,-18,4,6,0,0,7);ctx.fill();
  ctx.restore();
}

  skate:{ title:'Ice Skating', how:'Glide around the rink and collect the stars. Steer with the mouse or arrow keys. Watch out for Fionn, he cannot stop.', dur:30, base:0,

    inRink(x,y){ return ((x-800)/690)**2+((y-470)/330)**2<1; },

        if(!ax&&!ay&&g.mx!=null){ const dx=g.mx-p.x, dy=g.my-p.y, d=Math.hypot(dx,dy); if(d>20){ax=dx/d;ay=dy/d;} }
        p.vx+=ax*900*dt; p.vy+=ay*900*dt; }

      p.x+=p.vx*dt; p.y+=p.vy*dt; if(!this.inRink(p.x,p.y)){ p.x-=p.vx*dt*1.5; p.y-=p.vy*dt*1.5; p.vx*=-.6; p.vy*=-.6; }

// Called by the story: {mini:'pancake'} → plays, then stores G.mini = {pct, pay, win, text} and continues.
function startMini(kind){
  const M=MINIS[kind], wrap=document.createElement('div');
  wrap.id='mini'; wrap.style.cssText='position:absolute;inset:0;z-index:13;background:#fff8ee;display:flex;align-items:center;justify-content:center';
  const cv=document.createElement('canvas'); cv.width=1600; cv.height=900; cv.style.cssText='width:100%;height:100%;display:block;touch-action:none';
  wrap.appendChild(cv); $('stage').appendChild(wrap); const ctx=cv.getContext('2d');
  const g={t:0,keys:{},mx:null,my:null}; M.init(g); let state='intro', last=0, raf=0;
  const toCanvas=e=>{ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/r.width*1600,(e.clientY-r.top)/r.height*900]; };
  const finish=()=>{ state='done'; cancelAnimationFrame(raf);
    const pct=M.score(g), win=M.win?M.win(g):pct>=.5, money=M.base?pay(M.base,pct):0;
    G.mini={pct,win,pay:money,text:M.result(g)}; drawCard(); };
  const btn={x:600,y:640,w:400,h:110};
  function drawCard(){
    ctx.fillStyle='#fff8ee';ctx.fillRect(0,0,1600,900);
    rr(ctx,200,90,1200,720,40,'#fff');
    if(state==='intro'){ txt(ctx,M.title,800,200,70,'#ff6f9f'); wrapText(M.how,800,330,1000,40);
      txt(ctx,M.dur<900?`Time: ${M.dur} seconds`+(M.base?` · Pay: up to €${M.base}`:''):'',800,530,34,'#7a6e8f'); }
    else { txt(ctx,'Done!',800,200,80,'#ff6f9f'); txt(ctx,G.mini.text,800,320,40);
      const stars=Math.round(G.mini.pct*5); txt(ctx,'★'.repeat(stars)+'☆'.repeat(5-stars),800,420,70,'#ffc94d');
      if(M.base) txt(ctx,`You earned €${G.mini.pay}`,800,520,50,'#2e9e5b'); }
    rr(ctx,btn.x,btn.y,btn.w,btn.h,30,'#ff6f9f'); txt(ctx,state==='intro'?'Start':'Continue',800,btn.y+btn.h/2,48,'#fff');
  }
  function wrapText(s,x,y,maxW,size){ ctx.font=`${size}px ${MINI_FONT}`; const words=s.split(' '); let line='', yy=y;
    for(const w of words){ const t=line?line+' '+w:w; if(ctx.measureText(t).width>maxW){ txt(ctx,line,x,yy,size); line=w; yy+=size*1.35; } else line=t; } txt(ctx,line,x,yy,size); }
  function loop(ts){ if(!wrap.isConnected || !G) return; const dt=Math.min(.05,(ts-(last||ts))/1000); last=ts; g.t+=dt;
    M.update(g,dt); M.draw(g,ctx);
    if(M.dur<900){ const left=Math.max(0,M.dur-g.t); rr(ctx,1240,30,320,60,30,'#fff'); txt(ctx,`⏱ ${left.toFixed(0)}s`,1400,60,38); if(left<=0) return finish(); }
    if(g.over) return finish();
    raf=requestAnimationFrame(loop); }
  const inBtn=(x,y)=>x>btn.x&&x<btn.x+btn.w&&y>btn.y&&y<btn.y+btn.h;
  cv.onpointerdown=e=>{ e.stopPropagation(); const [x,y]=toCanvas(e);
    if(state==='intro'){ if(inBtn(x,y)){ state='play'; g.t=0; last=0; raf=requestAnimationFrame(loop); } return; }
    if(state==='done'){ if(inBtn(x,y)){ cleanup(); wrap.remove(); step(); } return; }
    if(M.click) M.click(g,x,y); };
  cv.onpointermove=e=>{ const [x,y]=toCanvas(e); g.mx=x; g.my=y; };
  const kd=e=>{ if(!document.getElementById('mini')) return; g.keys[e.key]=true; if(state==='play'&&(e.key===' '||e.key==='Enter')){ e.preventDefault(); e.stopPropagation(); if(M.click) M.click(g,g.mx||0,g.my||0); } };
  const ku=e=>{ g.keys[e.key]=false; };
  document.addEventListener('keydown',kd,true); document.addEventListener('keyup',ku,true);
  const cleanup=()=>{ document.removeEventListener('keydown',kd,true); document.removeEventListener('keyup',ku,true); };
  drawCard();
}
// For the automatic tester: pretend to play.
function fakeMini(kind){ const M=MINIS[kind], pct=Math.random(); G.mini={pct,win:pct>=.5,pay:M.base?pay(M.base,pct):0,text:'(test)'}; }

function mapTargets(G){
  const t=[], wk=G.mapLabel==='Weekend';
  ROM.forEach(k=>{ if(!visible(G,k) || G.out.includes(k)) return; const p=npcPos(k); t.push({kind:'npc',k,label:'Talk to '+CHARS[k].name,x:p.x,y:p.y,scene:'talk_'+k}); });
  t.push({kind:'npc',k:'reshman',label:'Ask Reshman for ranking tips',x:1400,y:770,scene:'tip_reshman',free:true});
  PLACES.forEach(p=>{ const d=placeDoor(p);
    if(p.job && (!p.weekend||wk)) t.push({kind:'door',label:`Work at ${p.name}`,x:d.x+(p.who?50:0),y:d.y,scene:'job_'+p.job});
    if(p.job && p.weekend && !wk) t.push({kind:'door',label:`${p.name} (weekends only)`,x:d.x,y:d.y,scene:null});
    if(p.shop) t.push({kind:'door',label:`Shop: ${p.name}`,x:d.x+(p.who?50:0),y:d.y,scene:'buy_'+p.shop});
    if(p.home) t.push({kind:'door',label:'Go home (end the day)',x:d.x,y:d.y,scene:'map_home',free:true});
  });
  return t;
}

function openMap(){
  const wrap=document.createElement('div'); wrap.id='walkmap';
  wrap.style.cssText='position:absolute;inset:0;z-index:9;background:#d9f0c8';
  const cv=document.createElement('canvas'); cv.width=1600; cv.height=900; cv.style.cssText='width:100%;height:100%;display:block;touch-action:none';
  wrap.appendChild(cv); $('stage').appendChild(wrap); $('box').style.visibility='hidden'; $('cast').innerHTML=''; $('chapter').textContent=G.mapLabel;
  const ctx=cv.getContext('2d'), targets=mapTargets(G);
  if(!G.mapPos) G.mapPos={x:1190,y:870};
  const P=G.mapPos, keys={}; let goal=null, pend=null, near=null, last=0, raf=0, bump=0;
  const toC=e=>{ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/r.width*1600,(e.clientY-r.top)/r.height*900]; };
  function use(tg){ if(!tg.scene){ bump=1.2; return; }
    cancelAnimationFrame(raf); cleanup(); wrap.remove(); $('box').style.visibility='visible';
    if(!tg.free) G.mapSlotsUsing=true; jump(tg.scene); }
  function frame(ts){ if(!wrap.isConnected || !G){ cleanup(); return; } const dt=Math.min(.05,(ts-(last||ts))/1000); last=ts; bump=Math.max(0,bump-dt);
    let vx=0,vy=0; if(keys.a||keys.arrowleft)vx--; if(keys.d||keys.arrowright)vx++; if(keys.w||keys.arrowup)vy--; if(keys.s||keys.arrowdown)vy++;
    if(vx||vy){ goal=null; pend=null; } else if(goal){ const dx=goal.x-P.x, dy=goal.y-P.y, d=Math.hypot(dx,dy); if(d<8){ goal=null; if(pend){ const t=pend; pend=null; return use(t); } } else { vx=dx/d; vy=dy/d; } }
    const m=Math.hypot(vx,vy)||1; P.x=Math.max(30,Math.min(1570,P.x+vx/m*420*dt)); P.y=Math.max(30,Math.min(880,P.y+vy/m*420*dt));
    near=null; let best=90; targets.forEach(t=>{ const d=Math.hypot(t.x-P.x,t.y-P.y); if(d<best){best=d;near=t;} });
    draw(); raf=requestAnimationFrame(frame); }
  function draw(){
    ctx.fillStyle='#d9f0c8'; ctx.fillRect(0,0,1600,900);
    ctx.fillStyle='#e9dcc7'; [[0,270,1600,70],[0,580,1600,60],[470,0,40,900],[1030,0,30,660],[1300,580,30,320]].forEach(r=>ctx.fillRect(...r));
    ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.setLineDash([24,18]);ctx.beginPath();ctx.moveTo(0,305);ctx.lineTo(1600,305);ctx.moveTo(0,610);ctx.lineTo(1600,610);ctx.stroke();ctx.setLineDash([]);
    PLACES.forEach(p=>{ rr(ctx,p.x,p.y,p.w,p.h,16,p.col); rr(ctx,p.x-6,p.y-6,p.w+12,40,12,shade(p.col,-.15));
      txt(ctx,p.icon,p.x+p.w/2,p.y+p.h/2+10,64); txt(ctx,p.name,p.x+p.w/2,p.y+14,24,'#2b2340');
      const d=placeDoor(p); rr(ctx,d.x-22,p.y+p.h-36,44,36,6,'#8c5a3c'); });
    [[455,240],[1010,240],[455,560],[1180,560],[1320,860],[1560,860],[30,320],[640,320]].forEach(([x,y])=>{ ctx.fillStyle='#5fb85a';ctx.lineWidth=4;ctx.strokeStyle='#2b2340';ctx.beginPath();ctx.arc(x,y,24,0,7);ctx.fill();ctx.stroke(); });
    targets.filter(t=>t.kind==='npc').forEach(t=>{ const c=CHARS[t.k]; chibi(ctx,t.x,t.y,c.hair,c.tc,.8,c.skin);
      txt(ctx,c.name+(G.dating.includes(t.k)?' 💘':''),t.x,t.y+60,20); });
    chibi(ctx,P.x,P.y,G.gender==='m'?'#3b2a1e':'#7a4a2a','#ff6f9f',.9); txt(ctx,'You',P.x,P.y+62,20,'#ff6f9f');
    rr(ctx,20,800,560,80,20,'#fff8ee'); txt(ctx,`${G.mapLabel} · ${G.mapSlots} visit${G.mapSlots===1?'':'s'} left · €${G.money}`,300,840,28);
    if(near){ rr(ctx,P.x-230,P.y-120,460,56,18,'#fff'); txt(ctx,(bump>0&&!near.scene)?'Closed today. Come back at the weekend!':`Press E or click: ${near.label}`,P.x,P.y-92,22); }
    txt(ctx,'Walk: WASD / arrow keys, or click anywhere',1300,880-6,20,'#5c5175');
  }
  cv.onpointerdown=e=>{ e.stopPropagation(); const [x,y]=toC(e);
    const hit=targets.find(t=>Math.hypot(t.x-x,t.y-y)<70);
    if(hit){ if(Math.hypot(hit.x-P.x,hit.y-P.y)<90) return use(hit); goal={x:hit.x,y:hit.y+ (hit.kind==='npc'?0:10)}; pend=hit; }
    else { goal={x,y}; pend=null; } };
  const kd=e=>{ if(!document.getElementById('walkmap')||overlayOpen2()) return; const k=e.key.toLowerCase(); keys[k]=true;
    if((k==='e'||k===' '||k==='enter') && near){ e.preventDefault(); e.stopPropagation(); use(near); } };
  const ku=e=>{ keys[e.key.toLowerCase()]=false; };
  document.addEventListener('keydown',kd,true); document.addEventListener('keyup',ku,true);
  const cleanup=()=>{ document.removeEventListener('keydown',kd,true); document.removeEventListener('keyup',ku,true); };
  raf=requestAnimationFrame(frame);
}

const SPEEDS={slow:[1,32],normal:[2,18],fast:[4,12],instant:[9999,1]};
let G, queue=[], typing=null, waiting=null, curBg='gate', pending=null;

// ----- genetics & charisma -----
const tri=()=>(Math.random()+Math.random())/2;
// Normal curve: boys average 5'9", about 1 in 7 reach 6'0", 6'5" is very rare.
function normH(mean,sd,lo,hi){ let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random(); return Math.max(lo,Math.min(hi,Math.round(mean+sd*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)))); }
function rollGenes(gender){
  return {h: gender==='m' ? normH(69,2.8,60,77) : normH(65,2.6,60,72), looks: 2+Math.round(tri()*7), glow:0};
}
const fmtH=i=>`${Math.floor(i/12)}'${i%12}"`;
// Boys: height carries the most weight, then face. Girls: face matters, height doesn't. Glow-ups help both.
function charisma(g){
  const glow=Math.min(30,g.glow||0);
  if(g.gender==='m') return Math.round(45*(g.h-60)/17 + 3.5*g.looks + glow*0.67);
  return Math.round(7*g.looks + glow);
}
const cha=()=>charisma(Object.assign({gender:G.gender},G.gen));
const score=()=>(G.frozen && G.fscore!=null) ? G.fscore : G.rep+Math.round(cha()*0.25);
const hearts=k=>Math.min(5,Math.round(Math.max(0,G.aff[k])/2.4));

function newGame(name,gender,gen){
  G={P:name||(gender==='m'?'Robin':'Robin'), gender, gen, money:30, aff:{natan:0,lars:0,adam:0,fionn:0,milo:0,mada:0,gian:0,goon:0},
     flags:{}, ch:'', rep:28, lastRank:15, dating:[], out:[], friend:[], frozen:false, ret:null, tried:[], buys:{}};
  G.lastRank=myRank();
  $('cast').innerHTML=''; hideMenu(); jump('start');
}
function jump(id){ if(!SCENES[id]){ reportStuck('missing scene "'+id+'"'); return; } curScene=id; save(id); queue=SCENES[id].slice(); step(); }
let curScene='';
// If a scene runs out of steps without moving on, finish a pending ending or say where it got stuck.
function reportStuck(why){ const d=document.getElementById('widr-err')||document.body.appendChild(Object.assign(document.createElement('pre'),{id:'widr-err'})); d.style.cssText='position:fixed;left:8px;right:8px;top:8px;z-index:99;background:#fff;border:3px solid #e8364f;border-radius:10px;padding:10px;font:12px Menlo,monospace;white-space:pre-wrap;color:#2b2340'; d.textContent+='Game stuck: '+why+'\n'; }
const fmt=t=>t.replace(/\{P\}/g,G.P);

// ----- save / continue -----
function save(id){
  if(!G) return;
  const cast=[...$('cast').children].map(el=>[el.dataset.id,el.dataset.expr||'neutral',el.dataset.form||'']);
  try{localStorage.setItem(SAVE_KEY,JSON.stringify({id,G,bg:curBg,cast,when:Date.now()}));}catch(e){}
}
const getSave=()=>{try{return JSON.parse(localStorage.getItem(SAVE_KEY));}catch(e){return null;}};
function continueGame(){
  const s=getSave(); if(!s) return;
  G=s.G; hideMenu(); setBg(s.bg); curBg=s.bg; $('chapter').textContent=G.ch||'';
  $('cast').innerHTML=''; setCast(s.cast); jump(s.id);
}

// ----- ranking -----
function rankList(){
  return NPC_RANK.filter(r=>!r[2]||G.flags[r[2]]).map(([n,s])=>({n,s})).concat([{n:G.P,s:score(),me:true}]).sort((a,b)=>b.s-a.s || (a.me?1:-1));
}
function myRank(){ return rankList().findIndex(r=>r.me)+1; }
function tier(i){ return i<=3?['Top tier','t1']:i<=6?['Very popular','t2']:i<=10?['Known','t3']:['Unknown','t4']; }
// Lower = easier for people to say yes. Being high on the ranking makes you "desirable".
function rankMod(){ const r=myRank(); return r<=3?-3:r<=6?-2:r<=10?0:2; }
let rbWait=null;
function showRank(title,note){
  const rb=$('rankboard'), list=rankList(), r=myRank(), d=G.lastRank-r;
  const delta = d>0?`<span style="color:#2e9e5b">▲ Up ${d} place${d>1?'s':''}</span>` : d<0?`<span style="color:#e8364f">▼ Down ${-d} place${d<-1?'s':''}</span>`:'No change';
  rb.innerHTML=`<div class="sheet"><h3>${title||'The WidR Ranking'}</h3>
    <div class="why">Who the school thinks is the "best" catch. The higher you are, the more people want to date you. Your charisma (${cha()}) counts too. ${G.frozen?'<b>Final rankings are locked. No more climbing.</b>':'You can still climb.'}</div>
    <ol>${list.map((x,i)=>{const [tn,tc]=tier(i+1);return `<li class="${x.me?'me':''}"><span class="n">#${i+1}</span><span>${x.me?x.n+' (you)':x.n}</span><span class="tier ${tc}">${tn}</span><span>${x.s}</span></li>`;}).join('')}</ol>
    ${note!==false?`<div class="delta">You: #${r} of ${list.length} · ${delta}</div>`:''}
    <div class="tap">Click to close</div></div>`;
  rb.style.display='flex'; if(note!==false) G.lastRank=r;
}
$('rankboard').onclick=e=>{ e.stopPropagation(); $('rankboard').style.display='none'; if(rbWait){const f=rbWait;rbWait=null;f();} };

// ----- cast -----
function setCast(list){
  const pos={1:[50],2:[30,70],3:[19,50,81]}[list.length]||[];
  const keep=new Set(list.map(x=>x[0]));
  [...$('cast').children].forEach(el=>{if(!keep.has(el.dataset.id)) el.remove();});
  list.forEach((x,i)=>{
    const [id,expr='neutral',form]=x;
    let el=$('cast').querySelector(`[data-id="${id}"]`);
    if(!el){el=document.createElement('div');el.className='char enter';el.dataset.id=id;el.dataset.form='';$('cast').appendChild(el);}
    el.style.left=pos[i]+'%';
    if(x.length>2) el.dataset.form=form||'';
    if(id==='lars' && G.flags.lars_girl && x.length<3) el.dataset.form='girl';
    el.dataset.expr=expr; el.innerHTML=portrait(id,expr,el.dataset.form);
  });
}
function setExpr(id,expr,form){
  const el=$('cast').querySelector(`[data-id="${id}"]`); if(!el) return;
  if(form!==undefined) el.dataset.form=form;
  if(expr) el.dataset.expr=expr;
  el.innerHTML=portrait(id,el.dataset.expr,el.dataset.form);
}
function applyEff(o){
  if(o.aff) for(const k in o.aff){ if(k==='adam' && G.flags.adam_mad && o.aff[k]>0) continue; G.aff[k]+=o.aff[k]; }
  if(o.flag) [].concat(o.flag).forEach(f=>G.flags[f]=true);
  // Ranking gains shrink with low charisma: 40% at 0, 100% at 100. Penalties always hit in full.
  if(o.rep && (!G.frozen || o.force)){
    const d = o.rep>0 ? Math.max(1,Math.round(o.rep*(0.4+0.6*cha()/100))) : o.rep;
    G.rep=Math.max(0,Math.min(99,G.rep+d));
  }
  if(o.money) G.money=Math.max(0,G.money+o.money);
}
function fx(kind){
  const f=$('fx'), stg=$('stage');
  if(kind==='flash'){f.className='';void f.offsetWidth;f.className='flash';SFX.poof();}
  if(kind==='shake'){stg.classList.remove('shake');void stg.offsetWidth;stg.classList.add('shake');SFX.thud();}
  if(kind==='siren'){f.className='';void f.offsetWidth;f.className='siren';SFX.siren();}
  if(kind==='sparkle'){f.className='sparkle';f.innerHTML='';SFX.sparkle();
    for(let i=0;i<14;i++){const s=document.createElement('span');s.textContent=['✦','♥','✧','❀'][i%4];
      s.style.left=(10+Math.random()*80)+'%';s.style.top=(10+Math.random()*60)+'%';s.style.color=['#ff6f9f','#ffc94d','#7fd6c2'][i%3];s.style.animationDelay=(i*.06)+'s';f.appendChild(s);}
    setTimeout(()=>{f.innerHTML='';},2000);}
}
function step(){
  while(queue.length){
    const s=queue.shift();
    if(s.music){ G.musLock=curScene; playMood(s.music); }
    if(s.bg){ if(s.bg!==curBg) setBg(s.bg); curBg=s.bg; }
    if(s.ch!==undefined){ G.ch=s.ch; $('chapter').textContent=s.ch; if(/^Chapter/.test(s.ch)) chapterCard(s.ch); }
    if(s.cast) setCast(typeof s.cast==='function'?s.cast(G):s.cast);
    if((s.bg||s.cast) && G.musLock!==curScene) playMood(moodForBg(curBg,[...$('cast').children].map(el=>[el.dataset.id])));
    if(s.expr) for(const k in s.expr){ const v=[].concat(s.expr[k]); setExpr(k,v[0],v[1]); }
    if(s.eff) applyEff(s.eff);
    if(s.fx) fx(s.fx);
    if(s.do) s.do(G);
    if(s.cg){ return showCG(s.cg); }
    if(s.daycard){ const sk=G.calSkip; G.calSkip=null; return showDayCard(G,sk); }
    if(s.phone){ const m=pickText(G); if(m){ return showPhone(m); } continue; }
    if(s.rank){ rbWait=()=>step(); showRank(s.rank===true?null:s.rank); return; }
    if(s.mini){ return startMini(s.mini); }
    if(s.map){ return openMap(); }
    if(s.goto){ return jump(typeof s.goto==='function'?s.goto(G):s.goto); }
    if(s.if){ const r=s.if(G); if(r) return jump(r); continue; }
    if(s.end){
      // Hard rule: endings only exist at the End-of-Year Ball.
      if(!G.final){ console.warn('ending blocked before the ball',s.end); continue; }
      // Whoever you end up with, Adam has his own moment unless he's the one with you.
      if(s.who!=='adam' && !G.flags.adam_epi){ G.flags.adam_epi=true; G.endWho=s.who; G.pendingEnd=s; queue=SCENES.adam_epi.slice(); continue; }
      return ending(s);
    }
    if(s.choice){ return showChoice(typeof s.choice==='function'?s.choice(G):s.choice); }
    if(s.t!==undefined){ return say(s); }
  }
  // Ran out of steps: finish an ending that was waiting on Adam's scene, otherwise report where it got stuck.
  if(G && G.pendingEnd){ const e=G.pendingEnd; G.pendingEnd=null; return ending(e); }
  // Recovery for saves from older versions: Adam's ball epilogue lost track of the ending it came from.
  if(G && G.final && /^(adam_epi|epi_)/.test(curScene)){ const who=G.endWho||G.dating[0]; const e=who&&(SCENES['end_'+who]||[]).find(x=>x.end); if(e) return ending(e); }
  // Anything else: don't leave the player on a dead screen. Before the ball, carry on with the calendar; at the ball, go to the ball menu.
  if(G){ console.warn('scene "'+curScene+'" had no next step, recovering'); return jump(G.final?'ball_menu':(G.calTarget?'cal_next':'map_after')); }
}
function say(s){
  let name='';
  const txtRaw=typeof s.t==='function'?s.t(G):s.t;
  if(s.s==='P') name=G.P;
  else if(s.s && CHARS[s.s]) name=CHARS[s.s].name;
  else if(s.n) name=s.n;
  if(s.s && CHARS[s.s] && s.e) setExpr(s.s,s.e);
  [...$('cast').children].forEach(el=>{
    el.classList.toggle('dim', !!(s.s && s.s!=='P' && el.dataset.id!==s.s && CHARS[s.s]));
    el.classList.remove('talk','enter');
    if(el.dataset.id===s.s){void el.offsetWidth;el.classList.add('talk');}
  });
  $('name').textContent=name;
  $('name').style.background= s.s==='P' ? '#ff6f9f' : (CHARS[s.s]?CHARS[s.s].color:'#7a6e8f');
  const txt=fmt(txtRaw), el=$('text');
  el.className = (!s.s && !s.n) ? 'narr' : '';
  el.textContent=''; $('next').style.visibility='hidden';
  const [per,ms]=SPEEDS[SET.speed]||SPEEDS.normal;
  let i=0; clearInterval(typing);
  const vp=s.s==='P'?VOICE_PITCH.P:s.s&&VOICE_PITCH[s.s]?VOICE_PITCH[s.s]:s.n?360:0;
  typing=setInterval(()=>{ i+=per; el.textContent=txt.slice(0,i); if(vp && /\w/.test(txt[i-1]||'')) SFX.blip(vp); if(i>=txt.length){clearInterval(typing);typing=null;$('next').style.visibility='visible';}},ms);
  waiting=()=>{ if(typing){clearInterval(typing);typing=null;el.textContent=txt;$('next').style.visibility='visible';return;} waiting=null; step(); };
}
function showChoice(opts){
  const box=$('choices'); box.innerHTML=''; waiting=null; $('next').style.visibility='hidden';
  opts.filter(o=>!o.req||o.req(G)).forEach(o=>{
    const b=document.createElement('button'); b.textContent=fmt(typeof o.t==='function'?o.t(G):o.t);
    if(o.off && o.off(G)){ b.disabled=true; b.style.opacity=.45; b.style.pointerEvents='none'; }
    b.onclick=e=>{ e.stopPropagation(); box.innerHTML=""; SFX.click(); applyEff(o); if(o.eff) applyEff(o.eff); if(o.do) o.do(G);
      const extra=(o.then||[]).slice(); if(o.goto) extra.push({goto:o.goto});
      queue=extra.concat(queue); step(); };
    box.appendChild(b);
  });
}
const overlayOpen=()=>['menu','panel','pause','rankboard'].some(id=>getComputedStyle($(id)).display!=='none') || $('journal').classList.contains('open') || !!document.querySelector('#stage > .ovl');
$('box').onclick=()=>{ if(waiting && !overlayOpen()) waiting(); };
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if($('panel').style.display==='block') return closePanel(); if(G && $('menu').style.display!=='grid') return togglePause(); }
  if((e.key===' '||e.key==='Enter') && waiting && !overlayOpen() && document.activeElement.tagName!=='INPUT'){e.preventDefault();waiting();}
});

function ending(s){
  localStorage.removeItem(SAVE_KEY);
  const found=JSON.parse(localStorage.getItem(END_KEY)||'[]'); if(!found.includes(s.end)){found.push(s.end);localStorage.setItem(END_KEY,JSON.stringify(found));}
  const text=typeof s.text==='function'?s.text(G):s.text;
  const c=document.createElement('div'); c.className='card';
  c.innerHTML=`<div class="tag">${s.kind||'ENDING'}</div><h1>${s.end}</h1><h2>${fmt(s.sub||'')}</h2><p>${fmt(text||'')}</p>
    ${G.epiNote?'<p class="sub">'+G.epiNote+'</p>':''}
    <p class="sub">Final WidR Ranking: #${myRank()} · Charisma ${cha()} · Storylines completed: ${found.filter(f=>CANON.some(c=>c[1]===f)).length}/8</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="big" id="again">Back to menu</button></div>`;
  $('stage').appendChild(c);
  c.querySelector('#again').onclick=()=>{c.remove();title();};
}
// ----- notebook: full-screen menu that slides in, three tabs -----
let nbTab='conf';
const nbOpen=()=>$('journal').classList.contains('open');
function closeNotebook(){ const j=$('journal'); if(!nbOpen()) return; j.classList.remove('open'); j.classList.add('closing'); SFX.whoosh(); setTimeout(()=>{ j.classList.remove('closing'); if(!nbOpen()) j.style.display='none'; },380); }
function journal(){
  const j=$('journal');
  if(nbOpen()) return closeNotebook();
  $('pause').style.display='none'; $('rankboard').style.display='none';
  j.classList.remove('closing'); j.style.display='block'; renderNotebook(); void j.offsetWidth; j.classList.add('open'); SFX.whoosh();
}
function renderNotebook(){
  const j=$('journal'), d=dayDate(G.calDay||0), ev=nextEvent(G.calDay||0), c=cha();
  const tabs=[['conf','Confidants'],['stats','Stats'],['me','You']];
  let body='';
  if(nbTab==='conf') body=`<div class="nbconf">${ROM.filter(k=>visible(G,k)).map(k=>{
      const r=crOf(k), mx=CMAX[k], nxt=r<mx?needPts(r+1):null, R=nxt&&RANKS[k][r+1], pct=r>=mx?100:Math.min(100,Math.round(Math.max(0,G.aff[k]-needPts(r))/(nxt-needPts(r))*100));
      const tag=G.dating.includes(k)?'<em class="t love">Dating 💘</em>':G.out.includes(k)?'<em class="t">Moved on</em>':!accepts(G,k)?'<em class="t">Friend</em>':'';
      const hint=r>=mx?'Max rank':G.aff[k]>=nxt?(R.req&&stat(R.req[0])<R.req[1]?`🔒 Needs ${STATS[R.req[0]].n} ${R.req[1]}`:'★ Ready! Go talk to them'):'Spend time together';
      return `<div class="nbc" style="--c:${CHARS[k].color}"><div class="nbpic">${portrait(k,'smile',k==='lars'&&G.flags.lars_girl?'girl':'')}</div>
        <div class="nbi"><b>${CHARS[k].name}</b>${tag}<div class="nbstars">${'★'.repeat(r)}<span>${'★'.repeat(mx-r)}</span></div>
        <div class="nbbar"><i style="width:${pct}%"></i></div><small>Rank ${r}/${mx} · ${hint}</small></div></div>`; }).join('')}</div>`;
  if(nbTab==='stats') body=`<div class="nbstats">${Object.keys(STATS).map((k,i)=>{ const l=stat(k), p=stPts(k), lo=STAT_AT[l-1], hi=STAT_AT[l], pct=hi==null?100:Math.round((p-lo)/(hi-lo)*100);
      return `<div class="nbs" style="--d:${i*.07}s"><div class="nbsn">${STATS[k].n}</div><div class="nbsl">Lv ${l} · ${STATS[k].lv[l-1]}</div>
        <div class="nbseg">${[1,2,3,4,5].map(n=>`<i class="${n<l?'on':n===l?'cur':''}">${n===l?`<u style="width:${pct}%"></u>`:''}</i>`).join('')}</div>
        <small>${hi==null?'Maxed out!':`${hi-p} more to ${STATS[k].lv[l]}`}</small></div>`; }).join('')}
      <p class="nbtip">Library = Knowledge · Park, gym, spicy pancakes = Guts · Glow-ups, mirror = Charm · Cat shelter, café, babysitting = Kindness</p></div>`;
  if(nbTab==='me') body=`<div class="nbme">
      <div class="nbbig"><small>WidR Ranking</small><b>#${myRank()}</b></div>
      <div class="nbbig"><small>Charisma</small><b>${c}</b><div class="nbbar"><i style="width:${c}%"></i></div></div>
      <div class="nbbig"><small>Money</small><b>€${G.money}</b></div>
      <div class="nbline"><span>Height ${fmtH(G.gen.h)}${G.gender==='f'?' (doesn\'t matter)':''}</span><span>Looks ${G.gen.looks}/10</span><span>Glow-up ${Math.min(30,G.gen.glow)}/30</span></div>
      ${G.dating.length>1?`<div class="nbwarn">You're dating ${G.dating.length} people. Valentine's Day is coming…</div>`:''}</div>`;
  j.innerHTML=`<div class="nbslash"></div><div class="nbwrap">
    <div class="nbhead"><div class="nbtitle"><small>${G.P}'s</small>Notebook</div>
      <div class="nbdate"><b>${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}</b>${ev?`<span>★ ${ev.name} in ${ev.day-(G.calDay||0)} days</span>`:''}</div>
      <button class="nbx" data-nb="close">✕</button></div>
    <div class="nbtabs">${tabs.map(([id,n])=>`<button data-tab="${id}" class="${nbTab===id?'on':''}">${n}</button>`).join('')}<span class="nbkeys">← → switch tabs · Esc closes</span></div>
    <div class="nbbody" key="${nbTab}">${body}</div></div>`;
}
$('journal').onclick=e=>{ e.stopPropagation(); const t=e.target.closest('[data-tab]'); if(t){ nbTab=t.dataset.tab; SFX.click(); return renderNotebook(); }
  if(e.target.closest('[data-nb="close"]') || e.target===$('journal') || e.target.classList.contains('nbslash')) closeNotebook(); };
document.addEventListener('keydown',e=>{ if(!nbOpen()){ if((e.key==='n'||e.key==='N') && G && !overlayOpen() && document.activeElement.tagName!=='INPUT'){ e.preventDefault(); journal(); } return; } e.stopImmediatePropagation(); const order=['conf','stats','me'];
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){ e.preventDefault(); e.stopPropagation(); nbTab=order[(order.indexOf(nbTab)+(e.key==='ArrowRight'?1:2))%3]; SFX.click(); renderNotebook(); }
  else if(e.key==='Escape'||e.key==='n'||e.key==='N'){ e.preventDefault(); e.stopPropagation(); closeNotebook(); }
  else if(e.key===' '||e.key==='Enter'){ e.preventDefault(); e.stopPropagation(); } },true);
$('jbtn').onclick=e=>{e.stopPropagation(); if(G) journal();};
$('rbtn').onclick=e=>{e.stopPropagation(); if(G) showRank(null,false);};
$('tbtn').onclick=e=>{e.stopPropagation(); togglePause();};

// ----- pause menu -----
function togglePause(){
  const p=$('pause');
  if(p.style.display==='flex'){p.style.display='none'; SFX.click(); return;}
  if(document.getElementById('mini') || !G) return; // mini-games are short; finish them first
  if(nbOpen()) closeNotebook(); $('rankboard').style.display='none';
  SFX.whoosh();
  p.innerHTML=`<div class="sheet"><h3>Paused</h3>
    <button class="mbtn primary" data-a="resume">Resume <small>Esc</small></button>
    <button class="mbtn" data-a="nb">Notebook <small>Ranks &amp; stats · N</small></button>
    <button class="mbtn" data-a="how">How to Play</button>
    <button class="mbtn" data-a="settings">Settings <small>Speed, music, sound</small></button>
    <button class="mbtn" data-a="share">Share the game <small>Download or copy</small></button>
    <button class="mbtn mint" data-a="quit">Save &amp; quit to menu <small>Progress is kept</small></button></div>`;
  p.style.display='flex';
  p.onclick=e=>{e.stopPropagation(); const a=e.target.closest('[data-a]'); if(!a){ if(e.target===p) p.style.display='none'; return;}
    const k=a.dataset.a;
    if(k==='resume') p.style.display='none';
    if(k==='nb'){ p.style.display='none'; journal(); }
    if(k==='how') openPanel('how');
    if(k==='settings') openPanel('settings');
    if(k==='share') openPanel('share');
    if(k==='quit'){ p.style.display='none'; title(); }
  };
}

// ----- main menu -----
function hideMenu(){ $('menu').style.display='none'; closePanel(); $('hud').style.visibility='visible'; }
function title(){
  clearInterval(typing); waiting=null; queue=[]; ['walkmap','mini'].forEach(id=>{const el=document.getElementById(id); if(el) el.remove();}); $('box').style.visibility='visible';
  G=null; $('choices').innerHTML=''; $('journal').style.display='none'; $('journal').classList.remove('open','closing'); $('rankboard').style.display='none'; $('pause').style.display='none';
  document.querySelectorAll('.card').forEach(c=>c.remove());
  document.querySelectorAll('#stage > .ovl, .toast, .rankup, .chcard').forEach(el=>el.remove()); playMood('menu');
  $('chapter').textContent=''; if(curBg!=='gate'||!$('bg').children.length) setBg('gate'); curBg='gate'; $('cast').innerHTML='';

// ---------- AUDIO: original visual-novel music and sound effects (pure Web Audio, works offline) ----------
const AUD={ctx:null, mus:null, sfx:null, rev:null, mood:null, song:null, stepN:0, next:0, timer:null};
SET.music = SET.music==null?0.55:SET.music; SET.sfxv = SET.sfxv==null?0.7:SET.sfxv;
const N2F=n=>{ const m=/^([A-G])(#|b)?(-?\d)$/.exec(n); const base={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0); return 440*Math.pow(2,(base+(+m[3]+1)*12-69)/12); };
function audioInit(){
  if(AUD.ctx) return; const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
  const ctx=AUD.ctx=new C();
  AUD.mus=ctx.createGain(); AUD.sfx=ctx.createGain(); AUD.mus.gain.value=SET.music*0.5; AUD.sfx.gain.value=SET.sfxv*0.6;
  // small hall reverb from a generated impulse
  const len=ctx.sampleRate*2.6, ir=ctx.createBuffer(2,len,ctx.sampleRate);
  for(let ch=0;ch<2;ch++){ const d=ir.getChannelData(ch); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2); }
  AUD.rev=ctx.createConvolver(); AUD.rev.buffer=ir; const rg=ctx.createGain(); rg.gain.value=.35; AUD.rev.connect(rg); rg.connect(ctx.destination);
  AUD.mus.connect(ctx.destination); AUD.sfx.connect(ctx.destination); AUD.mus.connect(AUD.rev);
  AUD.noise=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate); const nd=AUD.noise.getChannelData(0); for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
  AUD.timer=setInterval(schedule,90);
  if(AUD.want) playMood(AUD.want,true);
}
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>{ audioInit(); if(AUD.ctx&&AUD.ctx.state==='suspended') AUD.ctx.resume(); },{capture:true}));
function setVolumes(){ if(!AUD.ctx) return; AUD.mus.gain.setTargetAtTime(SET.music*0.5,AUD.ctx.currentTime,.1); AUD.sfx.gain.setTargetAtTime(SET.sfxv*0.6,AUD.ctx.currentTime,.05); }

// ----- instruments -----
function env(g,t,a,peak,d,sus,r,end){ g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(Math.max(.0001,peak*sus),t+a+d); g.gain.setValueAtTime(Math.max(.0001,peak*sus),end); g.gain.exponentialRampToValueAtTime(.0001,end+r); }
function osc(type,f,t,end,out,detune){ const o=AUD.ctx.createOscillator(); o.type=type; o.frequency.setValueAtTime(f,t); if(detune) o.detune.value=detune; o.connect(out); o.start(t); o.stop(end+.05); return o; }
const INST={
  keys(n,t,dur,v=.5,bus){ const c=AUD.ctx,f=N2F(n),g=c.createGain(),lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2600; g.connect(lp); lp.connect(bus||AUD.mus);
    env(g,t,.008,.22*v,.5,.25,.9,t+dur); osc('sine',f,t,t+dur+.9,g); const g2=c.createGain(); g2.gain.value=.25; g2.connect(g); osc('triangle',f*2,t,t+dur+.9,g2); },
  pluck(n,t,dur,v=.5){ const c=AUD.ctx,g=c.createGain(),lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.setValueAtTime(3200,t); lp.frequency.exponentialRampToValueAtTime(500,t+.25); g.connect(lp); lp.connect(AUD.mus);
    env(g,t,.004,.16*v,.18,.15,.25,t+Math.min(dur,.2)); osc('triangle',N2F(n),t,t+.6,g); },
  pad(notes,t,dur,v=.5){ const c=AUD.ctx,g=c.createGain(),lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=900; g.connect(lp); lp.connect(AUD.mus);
    env(g,t,.6,.05*v,.3,.8,1.2,t+dur); notes.forEach(n=>{ osc('sawtooth',N2F(n),t,t+dur+1.2,g,-7); osc('sawtooth',N2F(n),t,t+dur+1.2,g,7); }); },
  bass(n,t,dur,v=.5){ const c=AUD.ctx,g=c.createGain(); g.connect(AUD.mus); env(g,t,.01,.28*v,.2,.6,.15,t+dur); osc('sine',N2F(n),t,t+dur+.2,g); },
  bell(n,t,dur,v=.5,bus){ const c=AUD.ctx,g=c.createGain(); g.connect(bus||AUD.mus); env(g,t,.003,.12*v,1.2,.01,.3,t+.05); osc('sine',N2F(n),t,t+1.6,g); const g2=c.createGain(); g2.gain.value=.4; g2.connect(g); osc('sine',N2F(n)*3.01,t,t+1.6,g2); },
  hat(t,v=.5){ const c=AUD.ctx,s=c.createBufferSource(),hp=c.createBiquadFilter(),g=c.createGain(); s.buffer=AUD.noise; hp.type='highpass'; hp.frequency.value=7000; s.connect(hp); hp.connect(g); g.connect(AUD.mus); env(g,t,.002,.08*v,.04,.01,.02,t+.03); s.start(t); s.stop(t+.12); },
  clap(t,v=.5){ const c=AUD.ctx,s=c.createBufferSource(),bp=c.createBiquadFilter(),g=c.createGain(); s.buffer=AUD.noise; bp.type='bandpass'; bp.frequency.value=1500; s.connect(bp); bp.connect(g); g.connect(AUD.mus); env(g,t,.002,.25*v,.12,.01,.05,t+.1); s.start(t); s.stop(t+.3); },
  cowbell(n,t,v=.5){ const c=AUD.ctx,g=c.createGain(),bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=N2F(n)*1.5; bp.Q.value=2; g.connect(bp); bp.connect(AUD.mus); env(g,t,.002,.2*v,.18,.05,.1,t+.12); osc('square',N2F(n),t,t+.4,g); osc('square',N2F(n)*1.48,t,t+.4,g); },
  b808(n,t,dur,v=.5){ const c=AUD.ctx,g=c.createGain(),ws=c.createWaveShaper(),cv=new Float32Array(256); for(let i=0;i<256;i++){const x=i/128-1; cv[i]=Math.tanh(x*2.5);} ws.curve=cv; g.connect(ws); ws.connect(AUD.mus);
    env(g,t,.005,.4*v,.6,.5,.3,t+dur); const o=osc('sine',N2F(n)*2,t,t+dur+.3,g); o.frequency.exponentialRampToValueAtTime(N2F(n),t+.09); },
};
// ----- songs: written for WidR, 16 steps per bar -----
const CH={Fmaj7:['F3','A3','C4','E4'],Em7:['E3','G3','B3','D4'],Dm7:['D3','F3','A3','C4'],Cmaj7:['C3','E3','G3','B3'],
  Bb:['Bb2','D3','F3','Bb3'],Gm7:['G2','Bb2','D3','F3'],Ebmaj7:['Eb3','G3','Bb3','D4'],F:['F2','A2','C3','F3'],
  Am:['A2','C3','E3','A3'],Fadd9:['F2','C3','G3','A3'],C:['C3','E3','G3','C4'],G:['G2','B2','D3','G3'],Dm:['D3','F3','A3','D4'],A:['A2','C#3','E3','A3'],Bbmaj7:['Bb2','D3','F3','A3']};

const SONGS={

function pickText(G){
  const pool=TEXTS.filter(m=>visible(G,m.from) && !G.out.includes(m.from)); if(!pool.length) return null;
  G.textN=G.textN||{}; pool.sort((a,b)=>(G.textN[TEXTS.indexOf(a)]||0)-(G.textN[TEXTS.indexOf(b)]||0)+Math.random()-.5);
  const m=pool[0]; G.textN[TEXTS.indexOf(m)]=(G.textN[TEXTS.indexOf(m)]||0)+1; return m;
}

function isOpen(n){
  if(n%7===6) return false;
  if(n>=47 && n<=69) return n===52||n===61;
  if(n>=103 && n<=234) return (n>=119&&n<=125)||(n>=161&&n<=167)||(n>=203&&n<=209);
  return true;
}
function skipNote(from,to){
  if(from<47 && to>=47 && to<=69) return 'The Christmas break begins.';
  if(from<=52 && to>=61) return 'Christmas comes and goes. Happy New Year!';
  if(from<103 && to>=119) return 'Weeks pass. February turns into March.';
  if(from<=125 && to>=161) return 'Weeks pass. Spring arrives.';
  if(from<=167 && to>=203) return 'Weeks pass. Exams are coming.';
  return null;
}

(()=>{
  const at=(id,pred,stepObj,after)=>{ const sc=SCENES[id]; if(!sc) return; const i=sc.findIndex(pred); if(i>=0) sc.splice(after?i+1:i,0,stepObj); };
  ROM.forEach(k=>{ if(SCENES['yes_'+k]) SCENES['yes_'+k].unshift({cg:'conf_'+k}); at('end_'+k,s=>s.end,{cg:'end_'+k}); });
  at('club_lars',s=>s.expr&&s.expr.lars&&[].concat(s.expr.lars)[1]==='girl',{cg:'lars_poof'},true);
  at('end_lars',s=>s.do&&String(s.do).includes('lars_girl'),{cg:'lars_forever'},true);
  at('val_caught',s=>s.fx==='shake',{do:G=>{G.cgPair=G.dating.slice(0,2);}, cg:'scandal'},true);
  at('no_fionn_chase',s=>s.fx==='siren',{cg:'chase'},true);
  at('gian_born',s=>s.fx==='sparkle',{cg:'gian_born'},true);
  at('goon_born',s=>s.fx==='sparkle',{cg:'goon_born'},true);
  at('tour_win',s=>s.fx==='flash',{cg:'trophy'},true);
  // music cues
  [['val_caught','tense'],['no_fionn_chase','tense'],['fireworks','festival'],['ch8','tender']].forEach(([id,m])=>SCENES[id]&&SCENES[id].unshift({music:m}));
  ROM.forEach(k=>SCENES['conf_'+k]&&SCENES['conf_'+k].unshift({music:'tender'}));
})();

// ----- play one unseen event on some school days -----
function pickEvent(G){
  const d=G.calDay, wk=dayDate(d).getDay(); if(wk===0||wk===6) return null;
  G.evSeen=G.evSeen||[];
  const e=DAYEV.slice().sort((a,b)=>a.from-b.from).find(x=>!G.evSeen.includes(x.id) && d>=x.from && d<=x.to && x.cond(G));
  if(!e || Math.random()>.45) return null;
  G.evSeen.push(e.id); return 'ev_'+e.id;
}
SCENES.cal_day2.unshift({if:G=>pickEvent(G)});
