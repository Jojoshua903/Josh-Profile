<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Who Wants to Be a Hundredaire?</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="studio" aria-hidden="true">
  <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i>
  <i class="beam l"></i><i class="beam r"></i>
  <div class="floor"></div>
</div>
<div id="app">
  <div class="topbar">
    <div class="logo-mini">Hundred<em>$</em>aire</div>
    <div class="chip hidden" id="roundChip">Question <b>1/18</b></div>
    <div class="chip" id="bestChip">High score <b>$0</b></div>
    <div class="chip" id="jokeChip" title="Times Sichen has told the airplane joke">✈️ Jokes told <b>0</b></div>
    <button class="tbtn hidden" id="saveBtn">💾 Save</button>
    <button class="tbtn alt" id="soundBtn">🔊 Sound</button>
    <button class="tbtn alt hidden" id="quitBtn">Menu</button>
  </div>
  <main id="screen"></main>
</div>
<div id="modal"></div>
<div id="toast"></div>
<script src="https://artifactcdn.diabrowser.engineering/ajax/libs/gsap/gsap.min.js"></script>
<script src="questions.js"></script>
<script src="questions2.js"></script>
<script src="characters.js"></script>
<script src="avatar.js"></script>
<script src="content.js"></script>
<script src="engine.js"></script>
<script src="jacques.js"></script>
<script src="creator.js"></script>
<script src="game.js"></script>
<script src="play.js"></script>
<script src="anim.js"></script>
</body>
</html>
