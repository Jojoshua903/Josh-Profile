<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>THOMAS · Lawine</title>
<style>
:root{--ink:#18203a;--coral:#ff4d3d;--mag:#ff2d78;--mint:#4fb3a2;--sun:#ffc23d;
  --disp:"Avenir Next Condensed","Futura","Helvetica Neue",sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#e3ecfa;color:var(--ink);font-family:var(--disp);user-select:none;-webkit-user-select:none;touch-action:none}
canvas{display:block}
.glass{background:rgba(255,255,255,.5);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border:1px solid rgba(255,255,255,.75);border-radius:18px;box-shadow:0 10px 40px rgba(80,40,60,.15)}
#hud{position:fixed;inset:0;pointer-events:none}
#spdBox{position:absolute;left:22px;top:20px;padding:12px 18px 14px;min-width:190px}
#spd{font-size:64px;font-weight:800;font-style:italic;line-height:.9;letter-spacing:-.03em}
#spd small{font-size:14px;letter-spacing:.1em;margin-left:6px;opacity:.6;font-style:normal}
.lab{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;opacity:.65}
.bar{height:6px;border-radius:6px;background:rgba(24,32,58,.12);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--sun),var(--coral))}
.bar.e i{background:linear-gradient(90deg,#7de3c8,var(--mint))}
#progBox{position:absolute;left:50%;top:20px;transform:translateX(-50%);padding:12px 20px;width:min(440px,46vw)}
#track{position:relative;height:6px;border-radius:6px;background:rgba(24,32,58,.12);margin:10px 0 8px}
#recMk{position:absolute;top:-9px;width:3px;height:24px;margin-left:-1.5px;background:#ffb020;border-radius:2px;display:none}
#recMk:after{content:'🏆';position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:12px}
#recMk.beat{background:#2fd3b0}
#fill{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--ink)}
#mw{position:absolute;top:-5px;width:16px;height:16px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 4px rgba(255,77,61,.25);transform:translateX(-50%)}
.r{display:flex;justify-content:space-between;align-items:center}
#combo{position:absolute;right:22px;top:20px;padding:12px 18px;text-align:right}
#combo b{display:block;font-size:44px;font-weight:800;font-style:italic;line-height:.9;transition:color .2s}
#zone{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);padding:8px 16px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
#pops{position:absolute;left:50%;top:36%;transform:translateX(-50%)}
.pop{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;font-weight:800;font-style:italic;letter-spacing:-.02em;animation:pop 1s cubic-bezier(.2,1.6,.4,1) forwards;text-shadow:0 2px 0 #fff,0 6px 24px rgba(255,255,255,.8)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.4) rotate(-6deg)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1) rotate(-3deg)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-140%) scale(1) rotate(-3deg)}}
#danger{position:absolute;inset:0}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(20,24,48,.28) 100%),linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,0) 30%)}
#banner{position:fixed;left:50%;top:24%;transform:translateX(-50%);text-align:center;pointer-events:none;opacity:0;white-space:nowrap}
#banner b{display:block;font-size:76px;font-weight:900;font-style:italic;letter-spacing:-.04em;color:#fff;text-shadow:0 4px 0 rgba(24,32,58,.35),0 10px 40px rgba(24,32,58,.35)}
#banner span{display:inline-block;margin-top:8px;font-family:var(--mono);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#fff;background:rgba(24,32,58,.55);padding:6px 14px;border-radius:999px}
#banner.on{animation:ban 3.2s ease forwards}
@keyframes ban{0%{opacity:0;transform:translate(-50%,20px) scale(.9)}12%{opacity:1;transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}
#flash.on{animation:fl .35s ease-out}
@keyframes fl{0%{opacity:.55}100%{opacity:0}}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(210,225,250,.25)}
#ov.hide{display:none}
.card{padding:34px 40px 30px;max-width:560px;width:calc(100% - 40px);position:relative}
h1{font-size:110px;font-weight:900;font-style:italic;line-height:.85;letter-spacing:-.05em;background:linear-gradient(100deg,#e63946,#ff7a1a 55%,#2b6cff);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:46px;font-weight:900;font-style:italic;line-height:.95;letter-spacing:-.03em}
.sub{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin:12px 0 18px;opacity:.7}
p{font-size:17px;line-height:1.45;margin-bottom:16px;font-family:"Avenir Next","Helvetica Neue",sans-serif}
.keys{display:grid;grid-template-columns:auto 1fr;gap:9px 14px;font-size:15px;margin:4px 0 22px;align-items:center;font-family:"Avenir Next","Helvetica Neue",sans-serif}
kbd{font-family:var(--mono);font-size:11px;background:#fff;border-radius:7px;padding:4px 8px;box-shadow:0 2px 0 rgba(24,32,58,.25);white-space:nowrap}
button{font-family:var(--disp);font-weight:800;font-style:italic;font-size:20px;letter-spacing:.02em;color:#fff;border:none;padding:14px 28px;border-radius:999px;cursor:pointer;background:linear-gradient(100deg,#e63946,#ff7a1a);box-shadow:0 8px 24px rgba(230,57,70,.35);transition:transform .15s}
button:hover{transform:translateY(-2px) scale(1.03)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 22px}
.stats div{background:rgba(255,255,255,.6);border-radius:12px;padding:10px 12px}
.stats b{display:block;font-size:30px;font-style:italic;font-weight:800}
.rank{position:absolute;top:-30px;right:-24px;width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,var(--sun),var(--coral));color:#fff;display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:900;font-style:italic;transform:rotate(10deg);box-shadow:0 10px 30px rgba(255,77,61,.4)}
.hint{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-top:14px;opacity:.55;line-height:1.6}
@media (max-width:700px){#spd{font-size:40px}#spdBox{min-width:0}#combo{display:none}h1{font-size:76px}#progBox{top:auto;bottom:64px}#zone{display:none}}
/* main menu: logo + two big mode tiles over the live scene */
body.inmenu #hud{display:none}
#ov.menu{justify-content:flex-start;align-items:flex-end;padding:0 0 76px 56px;background:linear-gradient(90deg,rgba(227,236,250,.75),rgba(227,236,250,0) 60%)}
.card.menu{background:none;border:none;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;padding:0;max-width:600px;animation:rise .5s cubic-bezier(.2,1.2,.4,1)}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
.card.menu h1{font-size:150px;letter-spacing:-.06em;filter:drop-shadow(0 8px 0 rgba(24,32,58,.12))}
.tag{font-family:var(--mono);font-size:12px;letter-spacing:.32em;text-transform:uppercase;margin:6px 0 28px 8px;opacity:.6}
.modes{display:grid;grid-template-columns:1.3fr 1fr;gap:12px;margin-bottom:22px}
.mode{position:relative;cursor:pointer;padding:18px 20px 16px;border-radius:20px;background:rgba(255,255,255,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.9);box-shadow:0 12px 34px rgba(24,32,58,.12);transition:transform .18s,box-shadow .18s}
.mode:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(24,32,58,.18)}
.mode b{display:block;font-size:34px;font-weight:900;font-style:italic;letter-spacing:-.03em;line-height:1;margin-top:6px;white-space:nowrap}
.mode:first-child{background:linear-gradient(120deg,#e63946,#ff7a1a);color:#fff;border-color:transparent}
.mode.inf{background:linear-gradient(120deg,#2b6cff,#5fb4ff);color:#fff;border-color:transparent}
.mode .lab{opacity:.85}
.mode .go{position:absolute;right:14px;top:14px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;padding:3px 7px;border-radius:6px;background:rgba(255,255,255,.22)}
.arr{position:absolute;right:12px;bottom:12px;display:flex;gap:4px}
.arr i{font-style:normal;font-size:22px;font-weight:800;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.22)}
.arr i:hover{background:rgba(255,255,255,.4)}.arr i.off{opacity:.3;pointer-events:none}
.skins{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.skin{width:34px;height:34px;border-radius:50%;cursor:pointer;box-shadow:0 0 0 3px rgba(255,255,255,.9),0 4px 10px rgba(24,32,58,.15);display:flex;align-items:center;justify-content:center;font-size:13px;transition:transform .15s}
.skin:hover{transform:scale(1.12)}.skin.on{box-shadow:0 0 0 3px #fff,0 0 0 6px #18203a}.skin.locked{cursor:default;opacity:.6}
.skinName{font-weight:800;font-style:italic;font-size:18px;margin-left:6px}
.ctrl{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;letter-spacing:.06em;opacity:.7}
/* open world HUD */
#owhud{display:none}
body.ow #owhud{display:block}
body.ow #spdBox,body.ow #progBox,body.ow #combo,body.ow #zone,body.ow .mh{display:none!important}
#cmp{position:absolute;left:50%;top:18px;transform:translateX(-50%);width:min(620px,70vw);height:34px;overflow:hidden;border-radius:999px;
  background:rgba(255,255,255,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.8);box-shadow:0 8px 24px rgba(24,32,58,.15)}
#cmp span{position:absolute;top:50%;transform:translate(-50%,-50%);white-space:nowrap;font-family:var(--mono);font-size:11px;letter-spacing:.08em}
#cmp span.d{font-weight:800;font-size:13px;opacity:.75}
#cmp span.m{font-size:10px;background:#18203a;color:#fff;padding:2px 7px;border-radius:999px;opacity:.85}
#cmp span.sc{font-size:10px;background:#e63946;color:#fff;padding:2px 7px;border-radius:999px}
#cmp i{position:absolute;left:50%;top:0;bottom:0;width:2px;background:#e63946;margin-left:-1px}
#owReg{position:absolute;left:22px;top:20px;padding:10px 16px}
#owReg b{display:block;font-size:30px;font-weight:900;font-style:italic;letter-spacing:-.03em;line-height:1}
#owReg span{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;opacity:.65}
#owInfo{position:absolute;left:22px;bottom:70px;padding:10px 16px 12px;min-width:200px}
#owInfo b{display:block;font-size:46px;font-weight:800;font-style:italic;line-height:.9;letter-spacing:-.03em}
#owInfo b small{font-size:12px;letter-spacing:.1em;margin-left:5px;opacity:.6;font-style:normal}
#owInfo span{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
#owInfo .bar{margin-top:8px}
#owHint{position:absolute;right:22px;bottom:70px;padding:9px 14px;font-family:var(--mono);font-size:11px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:46vw;justify-content:flex-end}
.mode.ow{background:linear-gradient(120deg,#1f8f86,#7cc7b9);color:#fff;border-color:transparent}
#cmp span.q{font-size:10px;background:#ffcf40;color:#18203a;padding:2px 7px;border-radius:999px;font-weight:700}
#cmp span.g{font-size:11px;background:#ff7a1a;color:#fff;padding:3px 8px;border-radius:999px;font-weight:800;z-index:2}
#owReg em.goal{color:#c14a12;font-weight:700}
#talkHint{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);padding:9px 16px;font-family:var(--mono);font-size:12px;display:none}
#talkHint.on{display:block}
#bub{position:absolute;transform:translate(-50%,-100%);background:#fff;color:var(--ink);padding:7px 13px;border-radius:14px;font-style:italic;font-weight:700;font-size:16px;white-space:nowrap;box-shadow:0 6px 20px rgba(24,32,58,.2);display:none;pointer-events:none}
#bub:after{content:'';position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-top-color:#fff;border-bottom:0}
#dlg{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);width:min(720px,92vw);padding:16px 22px 18px;display:none;background:rgba(255,255,255,.86);pointer-events:auto;cursor:pointer;z-index:5}
#dlg.on{display:block}
#dlg .dh{display:flex;align-items:center;gap:10px;margin-bottom:6px;min-height:40px}
#dlgI{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:21px;font-style:normal}
#dlgN{font-size:24px;font-style:italic;font-weight:900;letter-spacing:-.01em}
#dlgT{font-size:21px;line-height:1.3;min-height:54px;font-weight:600}
#dlgT.nar{font-style:italic;opacity:.7}
#dlgC{display:flex;flex-direction:column;gap:6px;margin-top:4px}
#dlgC span{cursor:pointer;padding:9px 14px;border-radius:12px;background:rgba(24,32,58,.07);font-weight:700;font-size:18px}
#dlgC span.on{background:#18203a;color:#fff}
#dlgC kbd{margin-right:10px}
#dlgE{position:absolute;right:18px;bottom:12px;font-family:var(--mono);font-size:11px;opacity:.55}
/* boss fights */
#bt{position:fixed;inset:0;display:none;pointer-events:none;z-index:6}
#bt.on{display:block}
body.battle #owhud,body.battle #hud{display:none}
#btBoss{position:absolute;right:24px;top:22px;width:min(380px,44vw);padding:14px 18px}
#btBoss b,#btMe b{display:block;font-size:30px;font-style:italic;font-weight:900;letter-spacing:-.02em;line-height:1.05}
#btBoss em{display:block;margin-top:6px;font-family:var(--mono);font-size:11px;font-style:normal;color:#c14a12}
#btMe{position:absolute;left:24px;top:22px;width:min(300px,40vw);padding:14px 18px}
#btMe .row{display:flex;gap:18px}#btMe .sp{color:#2b6cff}#btMe small{font-size:15px;opacity:.55}
.hpb{height:10px;border-radius:6px;background:rgba(24,32,58,.12);overflow:hidden;margin:6px 0 4px}
.hpb i{display:block;height:100%;background:#2fd3b0;transition:width .3s}
#btMenu{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);display:none;gap:10px;pointer-events:auto}
#btMenu.on{display:flex}
#btMenu span{width:118px;padding:12px 12px 10px;border-radius:16px;background:rgba(255,255,255,.82);cursor:pointer;box-shadow:0 8px 24px rgba(24,32,58,.15);transition:transform .12s}
#btMenu span.on{background:#18203a;color:#fff;transform:translateY(-8px)}
#btMenu span.off{opacity:.35}
#btMenu span i{display:block;font-size:26px;font-style:normal}
#btMenu span b{display:block;font-size:18px;font-style:italic;font-weight:900}
#btMenu span em{display:block;font-family:var(--mono);font-size:9.5px;font-style:normal;opacity:.7;margin-top:3px;line-height:1.3}
#btMenu kbd{float:right;font-size:9px}
#btMsg{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);width:min(680px,90vw);padding:16px 22px;display:none;background:rgba(255,255,255,.9);border-radius:18px;pointer-events:auto;cursor:pointer;box-shadow:0 10px 30px rgba(24,32,58,.2)}
#btMsg.on{display:block}
#btMsg b{display:block;font-size:22px;font-style:italic;font-weight:900}
#btMsg span{font-size:20px;font-weight:600;line-height:1.3}
#btMsg em{position:absolute;right:16px;bottom:10px;font-family:var(--mono);font-size:11px;opacity:.5}
#btCmd{position:absolute;left:50%;top:62%;transform:translateX(-50%);display:none;text-align:center;font-family:var(--mono);font-size:13px;color:#18203a}
#btCmd.on{display:block}
#btCmd span{display:inline-block;margin-top:10px;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.85)}
.nb{position:relative;width:340px;height:26px;border-radius:13px;background:rgba(24,32,58,.55);overflow:hidden;border:3px solid #fff}
.nb .g{position:absolute;left:60%;width:30%;top:0;bottom:0;background:#2fd3b0}
.nb .p{position:absolute;left:71%;width:8%;top:0;bottom:0;background:#ff7a1a}
.nb b{position:absolute;top:-4px;bottom:-4px;width:5px;margin-left:-2px;background:#fff;box-shadow:0 0 8px #000}
.mash{width:340px;height:26px;border-radius:13px;background:rgba(24,32,58,.55);overflow:hidden;border:3px solid #fff}
.mash i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5fb4ff,#2b6cff)}
.arw{display:flex;gap:10px;justify-content:center}
.arw i{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-size:32px;font-style:normal;font-weight:900;background:rgba(255,255,255,.9)}
.arw i.ok{background:#2fd3b0;color:#fff}
#btFx{position:absolute;inset:0}
.rg{position:absolute;width:0;height:0}
.rg i,.rg b{position:absolute;left:-46px;top:-46px;width:92px;height:92px;border-radius:50%;box-sizing:border-box}
.rg i{border:4px solid rgba(255,255,255,.9);box-shadow:0 0 0 2px rgba(24,32,58,.3)}
.rg b{border:5px solid var(--c)}
.bn{position:absolute;transform:translate(-50%,-50%);font-size:30px;font-style:italic;font-weight:900;-webkit-text-stroke:1.5px #fff;paint-order:stroke;animation:bn 1.2s ease-out forwards;white-space:nowrap}
.bn.big{font-size:46px}
@keyframes bn{0%{transform:translate(-50%,-30%) scale(.6);opacity:0}15%{transform:translate(-50%,-60%) scale(1.15);opacity:1}100%{transform:translate(-50%,-160%) scale(1);opacity:0}}
#owReg em{display:block;margin-top:6px;font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:.06em;opacity:.8}
#owMap{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:rgba(227,236,250,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:5}
#owMap.on{display:flex}
#mapCv{border-radius:22px;box-shadow:0 20px 60px rgba(24,32,58,.35),0 0 0 6px #fff;cursor:pointer}
#mapInfo{display:flex;gap:16px;align-items:baseline;font-family:var(--mono);font-size:11px;letter-spacing:.08em}
#mapInfo b{font-family:var(--disp);font-size:30px;font-style:italic;font-weight:900;letter-spacing:-.02em}
#mapWipe{position:fixed;right:20px;top:20px;font-size:12px;padding:8px 14px;background:#18203a;box-shadow:none}
.mode.ow b{font-size:28px}
/* 2-player race: one shared view */
#split,.mh,#pops2,.mp{display:none}
body.multi #split{display:none}
body.multi #spdBox,body.multi #combo,body.multi #fill{display:none}
body.multi #pops{left:36%}
body.multi #pops2{display:block;position:absolute;left:64%;top:36%;transform:translateX(-50%)}
body.multi .mh{display:block;position:absolute;top:20px;padding:10px 14px 12px;min-width:170px}
#mh1{left:20px}#mh2{right:20px}
.mh.warn{animation:warn .5s infinite alternate}@keyframes warn{to{background:rgba(230,57,70,.35)}}
.mh i{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;font-style:normal;color:#e63946;margin-top:4px}
.mode.race{background:linear-gradient(120deg,#ff7a1a,#e63946);color:#fff;border-color:transparent}
.mode.race b{font-size:28px}
.mh b{display:block;font-size:40px;font-weight:800;font-style:italic;line-height:.95;letter-spacing:-.03em}
.mh b small{font-size:11px;letter-spacing:.1em;margin-left:5px;opacity:.6;font-style:normal}
#mh1{border-left:5px solid #ff7a1a}#mh2{border-left:5px solid #2b6cff}
.mh.dead{opacity:.6}.mh.dead b{color:#e63946}
body.multi #progBox{top:auto;bottom:70px;width:min(420px,40vw)}
body.multi .mp{display:block;position:absolute;top:-5px;width:16px;height:16px;border-radius:50%;transform:translateX(-50%);border:3px solid #fff;box-shadow:0 2px 6px rgba(24,32,58,.3)}
#mp1{background:#ff7a1a}#mp2{background:#2b6cff}
body.multi #zone{bottom:auto;top:20px}
.ctrl b{font-style:normal;margin-right:6px}
.ctrl kbd{margin-right:4px}
@media (max-width:700px){#ov.menu{padding:0 16px 70px}.card.menu h1{font-size:84px}.modes{grid-template-columns:1fr}.mode b{font-size:26px}}
</style>
</head>

<script type="module">
import * as THREE from 'https://artifactcdn.diabrowser.engineering/ajax/libs/three.js/three.module.js';
const $=id=>document.getElementById(id);

// ---------- renderer / scene ----------
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(2,devicePixelRatio));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(new THREE.Color('#e3ecfa'),120,780);
let camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,3000);
scene.add(camera);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

const SUNDIR=new THREE.Vector3(-.35,.3,-1).normalize();
const sky=new THREE.Mesh(new THREE.SphereGeometry(2000,32,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,
  uniforms:{sd:{value:SUNDIR},top:{value:new THREE.Vector3(.28,.55,.92)},mid:{value:new THREE.Vector3(.62,.80,.98)},hor:{value:new THREE.Vector3(.89,.93,.98)},
    aur:{value:0},stars:{value:0},t:{value:0},sunTint:{value:new THREE.Vector3(1,.8,.5)}},
  vertexShader:`varying vec3 v;void main(){v=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`varying vec3 v;uniform vec3 sd,top,mid,hor,sunTint;uniform float aur,stars,t;
   float hs(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}
   void main(){float h=v.y;
   vec3 c=mix(hor,mid,smoothstep(-.02,.12,h));c=mix(c,top,smoothstep(.1,.6,h));
   float s=max(dot(normalize(v),sd),0.);c+=sunTint*pow(s,8.)*.5+vec3(1.,.95,.8)*smoothstep(.9975,.999,s)*(1.-stars*.6);
   vec3 q=floor(v*320.);float st=step(.996,hs(q))*smoothstep(.05,.3,h)*(.6+.4*sin(t*3.+hs(q+1.)*30.));c+=vec3(st)*stars;
   float band=sin(v.x*5.+sin(v.z*3.+t*.15)*2.+t*.1)*.5+.5;float a=smoothstep(.12,.35,h)*smoothstep(.85,.4,h)*pow(band,3.);
   float curtain=.6+.4*sin(v.x*60.+v.z*40.+t*.6);c+=mix(vec3(.2,1.,.6),vec3(.6,.3,1.),smoothstep(.2,.7,h))*a*curtain*aur*.85;
   gl_FragColor=vec4(c,1.);}`}));
scene.add(sky);
const TMPV=new THREE.Vector3(),TMPC=new THREE.Color();
const hemi=new THREE.HemisphereLight('#d6e8ff','#9fb6d8',1.15);scene.add(hemi);
const sun=new THREE.DirectionalLight('#fff6e8',2.2);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-70,right:70,top:70,bottom:-70,near:1,far:340});sun.shadow.bias=-.0008;
scene.add(sun,sun.target);

// ---------- helpers ----------
let seed=1;const rnd=()=>(seed=(seed*16807)%2147483647,(seed-1)/2147483646),R=(a,b)=>a+rnd()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function glowTex(){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
  const gr=g.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.3,'rgba(255,255,255,.5)');gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr;g.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)}
const GLOW=glowTex();
function cloudTex(){const c=document.createElement('canvas');c.width=256;c.height=128;const g=c.getContext('2d');
  for(let i=0;i<14;i++){const x=40+Math.random()*176,y=50+Math.random()*40,r=20+Math.random()*30;const gr=g.createRadialGradient(x,y,0,x,y,r);
   gr.addColorStop(0,'rgba(255,255,255,.9)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
  return new THREE.CanvasTexture(c)}
const CLOUD=cloudTex();

// ---------- audio (raw WebAudio) ----------
let ac,master,windG,windF,NOISE;
function initAudio(){if(ac)return;try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  master=ac.createGain();master.gain.value=.45;master.connect(ac.destination);
  NOISE=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);const d=NOISE.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const src=ac.createBufferSource();src.buffer=NOISE;src.loop=true;windF=ac.createBiquadFilter();windF.type='bandpass';windF.Q.value=.7;
  windG=ac.createGain();windG.gain.value=0;src.connect(windF).connect(windG).connect(master);src.start()}
function tone(f,d=.2,type='sine',vol=.3,delay=0){if(!ac)return;const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g).connect(master);o.start(t);o.stop(t+d+.05)}
function whoosh(d=.6,vol=.35,f0=300,f1=2500){if(!ac)return;const t=ac.currentTime,s=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();
  s.buffer=NOISE;fl.type='bandpass';fl.Q.value=2;fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(f1,t+d);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl).connect(g).connect(master);s.start(t);s.stop(t+d)}
const PENT=[0,2,4,7,9,12,14,16,19,21,24,26,28];const note=n=>523.25*Math.pow(2,n/12);

// ---------- worlds: palette, sky, light, weather, props and a special mechanic each ----------
// palette c: [shadowed snow, lit snow, highlight, rock/cliff]
const PAL={
  dorp:    {c:['#a9c4e8','#f4f8ff','#ffffff','#6f7f99'],tree:'#2e5e4e',tree2:'#3f7a5f',mtn:'#c4d2ea'},
  woud:    {c:['#9fc2c4','#eef8f4','#ffffff','#5f7a72'],tree:'#1f4a3a',tree2:'#2c6a4c',mtn:'#a9c7c0'},
  kristal: {c:['#6fc0e8','#d9f4ff','#ffffff','#4d7fb0'],tree:'#2e5e66',tree2:'#4b8a8a',mtn:'#9fd3f0'},
  neon:    {c:['#5a5aa8','#b9c3f5','#e8ecff','#2c2f5c'],tree:'#1a1f3d',tree2:'#262c55',mtn:'#3b3f78'},
  vulkaan: {c:['#7d7378','#cfc6c4','#eae2de','#2b2326'],tree:'#2a2224',tree2:'#3a2f30',mtn:'#4a3b3c'},
  kers:    {c:['#e3a9c6','#fff1f6','#ffffff','#9a6f84'],tree:'#ff9ec8',tree2:'#ffc2dc',mtn:'#e8bcd4'},
  storm:   {c:['#a8b2c2','#eceff4','#ffffff','#566070'],tree:'#2f3f3c',tree2:'#405450',mtn:'#b7c0cc'}};
for(const k in PAL){PAL[k].c=PAL[k].c.map(x=>new THREE.Color(x));PAL[k].mtnC=new THREE.Color(PAL[k].mtn)}
// sky: gradient + aurora/stars, light colours, fog distance, exposure
const SKY={
  dag:    {top:[.28,.55,.92],mid:[.62,.80,.98],hor:[.89,.93,.98],fog:'#e3ecfa',near:120,far:780,sun:'#fff6e8',sunI:2.2,hs:'#d6e8ff',hg:'#9fb6d8',aur:0,stars:0,exp:1.05},
  woud:   {top:[.42,.62,.74],mid:[.72,.84,.86],hor:[.88,.93,.92],fog:'#dfeae6',near:40,far:340,sun:'#fff3dc',sunI:1.6,hs:'#dcefe8',hg:'#8fae9f',aur:0,stars:0,exp:1.05},
  aurora: {top:[.06,.14,.36],mid:[.22,.42,.70],hor:[.62,.82,.95],fog:'#a9cfe8',near:120,far:820,sun:'#cfe9ff',sunI:1.5,hs:'#9fd0ff',hg:'#5b7fb0',aur:1,stars:.7,exp:1.15},
  nacht:  {top:[.04,.03,.14],mid:[.14,.09,.32],hor:[.42,.22,.55],fog:'#2e2350',near:90,far:620,sun:'#b9a8ff',sunI:.9,hs:'#7a6cff',hg:'#ff4fd8',aur:.7,stars:1,exp:1.35},
  vulkaan:{top:[.30,.12,.12],mid:[.78,.36,.22],hor:[1,.62,.38],fog:'#d88a64',near:80,far:560,sun:'#ffb37a',sunI:2.1,hs:'#ffb08a',hg:'#7a3020',aur:0,stars:0,exp:1.05},
  kers:   {top:[.55,.48,.85],mid:[1,.70,.78],hor:[1,.86,.80],fog:'#ffd9df',near:110,far:740,sun:'#ffe1c4',sunI:2.2,hs:'#ffd3e6',hg:'#c88fb0',aur:0,stars:0,exp:1.05},
  storm:  {top:[.62,.66,.72],mid:[.80,.83,.87],hor:[.90,.92,.94],fog:'#e4e8ee',near:15,far:210,sun:'#ffffff',sunI:1.1,hs:'#eef2f8',hg:'#a8b2c2',aur:0,stars:0,exp:1.1}};
for(const k in SKY){const S=SKY[k];S.fogC=new THREE.Color(S.fog);S.sunC=new THREE.Color(S.sun);S.hsC=new THREE.Color(S.hs);S.hgC=new THREE.Color(S.hg)}
// weather particles around the camera
const WEATHER={
  sneeuw: {col:'#ffffff',size:.35,fall:5,wind:1,up:0,swirl:1,op:.9,n:1},
  vlokken:{col:'#ffffff',size:.5,fall:3,wind:.5,up:0,swirl:2,op:.9,n:.8},
  glitter:{col:'#bff2ff',size:.3,fall:1,wind:0,up:0,swirl:1.5,op:1,n:.7},
  neon:   {col:'#ff7ae6',size:.32,fall:2.5,wind:0,up:0,swirl:1,op:1,n:.6},
  as:     {col:'#ff8a3d',size:.3,fall:-3,wind:2,up:1,swirl:2.5,op:1,n:.8},
  bloesem:{col:'#ff9ec8',size:.55,fall:2,wind:3,up:0,swirl:3,op:1,n:.7},
  storm:  {col:'#ffffff',size:.4,fall:9,wind:-38,up:0,swirl:.5,op:.95,n:1}};
for(const k in WEATHER)WEATHER[k].colC=new THREE.Color(WEATHER[k].col);
// each world = section mix + look + one gameplay twist
const STYLES=[
  {name:'Alpendorp',      pal:'dorp',   sky:'dag',    wx:'sneeuw', props:'dorp',   mech:null,     w:{golven:5,park:3,slalom:2}},
  {name:'Bevroren Woud',  pal:'woud',   sky:'woud',   wx:'vlokken',props:'woud',   mech:'ijs',    w:{heuvelveld:4,golven:3,slalom:2}},
  {name:'Kristalgletsjer',pal:'kristal',sky:'aurora', wx:'glitter',props:'kristal',mech:'ijs',    w:{couloir:3,mega:2,slalom:2,heuvelveld:2}},
  {name:'Neon Nachtpiste',pal:'neon',   sky:'nacht',  wx:'neon',   props:'neon',   mech:'bogen',  w:{park:4,kickers:3,mega:3}},
  {name:'Vulkaanberg',    pal:'vulkaan',sky:'vulkaan',wx:'as',     props:'vulkaan',mech:'geiser', w:{afdaling:4,kickers:3,couloir:2,mega:1}},
  {name:'Kersentempel',   pal:'kers',   sky:'kers',   wx:'bloesem',props:'kers',   mech:'torii',  w:{golven:4,heuvelveld:3,slalom:2}},
  {name:'Sneeuwstorm',    pal:'storm',  sky:'storm',  wx:'storm',  props:'storm',  mech:'wind',   w:{afdaling:3,couloir:3,golven:3}}];
const MECHTXT={ijs:'IJS = geen wrijving',bogen:'Vlieg door de neonbogen',geiser:'Geisers lanceren je',torii:'Ga onder de poorten door',wind:'Pas op voor windstoten'};
const SECNAME={start:'Start',golven:'Golvende piste',afdaling:'Steile afdaling',park:'Schansenpark',kickers:'Schansenrij',
  heuvelveld:'Heuvelveld',mega:'MEGASCHANS',slalom:'Slalom',couloir:'Couloir',finish:'Finish'};

// ---------- course: generated section by section, built in chunks as you ski ----------
let L,world=new THREE.Group();scene.add(world);
const CH=240,BW=20,DS=2.4;
let NP=[0,0,0];
const hash=(a,b)=>{const v=Math.sin(a*127.1+b*311.7)*43758.5453;return v-Math.floor(v)};
const smooth=t=>t*t*(3-2*t);
function seg(s){let lo=0,hi=L.ks.length-2;while(lo<hi){const m=(lo+hi+1)>>1;if(L.ks[m]<=s)lo=m;else hi=m-1}return lo}
function f(s){const{ks,kh}=L;if(s<=ks[0])return kh[0];if(s>=ks[ks.length-1])return kh[kh.length-1];const i=seg(s);
  const t=clamp((s-ks[i])/(ks[i+1]-ks[i]),0,1);return kh[i]+(kh[i+1]-kh[i])*(1-Math.cos(Math.PI*t))/2}
function secAt(s){const S=L.secs;let lo=0,hi=S.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(S[m].s0<=s)lo=m;else hi=m-1}return S[lo]}
function Wd(s){const sc=secAt(s);if(sc.ty!=='couloir')return 78;return 78-46*smooth(clamp(Math.min(s-sc.s0,sc.s1-s)/45,0,1))}
const noise=(x,s)=>Math.sin(x*.05+s*.031+NP[0])*Math.sin(s*.021-x*.07+NP[1])+.5*Math.sin(x*.13+s*.09+NP[2]);
const chanRaw=s=>38*Math.sin(s*.0055+NP[0])+14*Math.sin(s*.017+NP[1]);
const chanX=s=>chanRaw(s)*clamp((Wd(s)-14)/64,0,1);
const amp=s=>clamp((s-40)/160,0,1)*(L.A0+L.A1*(.5+.5*Math.sin(s*.004+NP[2]))*(.55+.45*Math.sin(s*.009+NP[0])));
function H(x,s,o){if(OW)return owH(x,s,o);
  let h=f(s);const W=Wd(s);
  const dc=(x-chanRaw(s)*clamp((W-14)/64,0,1))/8,g=Math.exp(-dc*dc),A=amp(s);
  const bump=(Math.sin(s*.035+x*.018+1.2*Math.sin(x*.025+NP[0]))+.35*Math.sin(s*.021-x*.03+NP[1]))*A*(1-g*.92);
  let mh=0;const mb=L.mb[Math.floor(s/BW)];
  if(mb)for(const m of mb){const dx=(x-m.x)/m.r,dz=(s-m.s)/m.rs,q=dx*dx+dz*dz;if(q<1){const w=1-q;mh+=m.h*w*w}}
  mh*=(1-g*.9);h+=bump+mh-g*4.5;
  let rh=0;const b=L.rb[Math.floor(s/BW)];
  if(b)for(const r of b){const ds=s-r.s;if(ds<0||ds>r.l+5)continue;const lx=(x-r.x)/r.w;if(lx*lx>=1)continue;
    const lat=(1-lx*lx)**2,pr=ds<=r.l?Math.pow(ds/r.l,1.7):Math.pow(Math.max(0,1-(ds-r.l)/5),2);rh=Math.max(rh,r.h*lat*pr)}
  h+=rh;
  const a=Math.abs(x)-W;if(a>0){const k=Math.min(1,a/25);h+=a*1.1+a*a*.015+noise(x,s)*k*18}
  h+=.0006*x*x;
  if(o){o.r=rh;o.g=g;o.b=(bump+mh)/12}
  return h;
}
function grad(x,s){const e=.3;return[(H(x+e,s)-H(x-e,s))/(2*e),(H(x,s+e)-H(x,s-e))/(2*e)]}
const addB=(B,o,a,b)=>{for(let i=Math.floor(a/BW);i<=Math.floor(b/BW);i++)if(i>=0)(B[i]=B[i]||[]).push(o);return o};
function inB(B,s0,s1){const set=new Set();for(let i=Math.floor(s0/BW);i<=Math.floor(s1/BW);i++)if(B[i])for(const o of B[i])set.add(o);return set}
function palAt(s){const sc=secAt(s),A=PAL[sc.st.pal],t=(s-sc.s0)/70;
  if(t<1&&sc.prev&&sc.prev.st.pal!==sc.st.pal)return{a:PAL[sc.prev.st.pal],b:A,m:smooth(clamp(t,0,1))};return{a:A,b:A,m:0}}

function startCourse(n,inf){
  for(const c of[...(L?.chunks?.keys()||[])])disposeChunk(c);
  seed=1000+(inf?Date.now()%100000:n*7919);NP=[R(0,6),R(0,6),R(0,6)];
  const st=inf?STYLES[0]:STYLES[(n-1)%STYLES.length];
  L={n,inf,len:inf?Infinity:mode==='race'?RACE_LEN:3400+n*550,D:Math.min(1.3,.5+n*.08),A0:1.5,A1:3+Math.min(n,8)*.6,
    ks:[-300,0],kh:[44,44],gs:0,gh:44,secs:[],ramps:[],mounds:[],gates:[],rb:[],mb:[],gb:[],
    style:st,stI:0,stS0:0,fin:false,chunks:new Map(),orbs:[],rocks:[],pads:[],gatesLive:[],ib:[],arches:[],waveSpd:inf?17:16+n*1.5};
  genSection();
  for(let c=-1;c<=3;c++)buildChunk(c);
}
function pickType(st){let tot=0;for(const k in st.w)tot+=st.w[k];let r=rnd()*tot;for(const k in st.w){r-=st.w[k];if(r<=0)return k}return 'golven'}
function genSection(){
  if(L.inf&&L.gs-L.stS0>1300){L.stI=(L.stI+1+(rnd()*(STYLES.length-1)|0))%STYLES.length;L.stS0=L.gs;L.style=STYLES[L.stI]}
  const st=L.style,D=L.inf?Math.min(1.35,.55+L.gs/9000):L.D;
  let s=L.gs,h=L.gh;const s0=s;
  const P=(ds,dh)=>{s+=ds;h+=dh;L.ks.push(s);L.kh.push(h)};
  const ramp=(rs,x,hh=R(4,7),l=R(14,22),w=R(6,9))=>L.ramps.push(addB(L.rb,{s:rs,x,h:hh,l,w},rs,rs+l+5));
  const mound=(ms,x,r,hh)=>{const m={s:ms,x,r,rs:r*R(1.3,1.9),h:hh};addB(L.mb,m,ms-m.rs,ms+m.rs);L.mounds.push(m)};
  let ty;
  if(L.secs.length===0)ty='start';
  else if(!L.inf&&L.gs>=L.len){ty='finish';L.fin=true}
  else ty=pickType(st);
  let dens=1;const Wf=ty==='couloir'?24:70;
  switch(ty){
    case 'start':P(130,-44);dens=0;break;
    case 'finish':P(700,-10);dens=0;break;
    case 'golven':{const k=2+(rnd()*2|0);for(let i=0;i<k;i++){const w=R(100,150),a=R(10,20)*D;P(w,-a*1.6);P(w*.8,a);if(rnd()<.7)ramp(s-R(30,45),R(-55,55))}break}
    case 'afdaling':P(R(110,160),-R(36,62)*D-10);ramp(s0+R(10,30),R(-50,50));dens=.6;break;
    case 'park':{const ln=R(110,170);P(ln,-R(6,12));const k=4+(rnd()*4|0);for(let i=0;i<k;i++)ramp(s0+R(5,ln-25),R(-60,60),R(4,8));dens=.4;break}
    case 'kickers':{P(30,-4);const k=2+(rnd()*2|0);for(let i=0;i<k;i++)ramp(s-24,-50+i*100/(k-1||1)+R(-8,8),R(6,9),R(16,22));P(R(90,120),-R(38,58)*D-8);dens=.5;break}
    case 'heuvelveld':{const ln=R(220,300);P(ln,-ln*.2);dens=0;
      for(let ms=s0+25;ms<s-25;ms+=R(18,26)){const k=2+(rnd()*3|0);for(let i=0;i<k;i++)mound(ms+R(-6,6),R(-68,68),R(18,28),R(9,18)*D+2)}break}

  if(b.B.id==='golem'&&b.armor>0){b.armor=-1;await bw(.4);num(boPos().clone().setY(4.5),'PANTSER KAPOT!','#3fb8ff',true);b.st=b.B.st(b);btHud()}}
async function doDans(){const b=BT,el=$('btCmd'),AR=[['ArrowLeft','←'],['ArrowUp','↑'],['ArrowRight','→'],['ArrowDown','↓']],seq=[];b.sp-=2;btHud();
  for(let i=0;i<5;i++)seq.push(AR[Math.floor(Math.random()*4)]);let i=0,ok=true;
  const draw=()=>{el.innerHTML=`<div class="arw">${seq.map((s,j)=>`<i class="${j<i?'ok':''}">${s[1]}</i>`).join('')}</div><span>Doe de pijltjes na!</span>`};draw();el.classList.add('on');
  await new Promise(res=>{const done=()=>{b.key=null;res()};b.key=c=>{if(!c.startsWith('Arrow'))return;if(c===seq[i][0]){i++;draw();tone(note(PENT[i+2]),.1,'triangle',.1);
    anim(.25,k=>b.th.rotation.y=-Math.PI/2-.45+k*Math.PI*2);if(i>=seq.length)done()}else{ok=false;tone(140,.15,'square',.1);done()}};bw(3.5).then(done)});
  el.classList.remove('on');const h=i+(i===seq.length?3:0);b.php=Math.min(b.pmax,b.php+h);num(thPos(),'+'+h+' HP','#2fd3b0',h>5);btHud();await bw(.5)}
async function enemyTurn(){const b=BT,B=b.B;b.eturn++;
  let pool=[...B.A,...(b.ph2?B.A2:[])],atk=pool[Math.floor(Math.random()*pool.length)];if(pool.length>1&&atk===b.lastA)atk=pool[(pool.indexOf(atk)+1)%pool.length];
  if(B.drop&&b.eturn%3===0)atk=B.drop;b.lastA=atk;await flashMsg(`${B.name}: ${atk.n}!`);
  if(B.tips&&!OWSAVE.bosses.includes(B.id)&&b.eturn===1)await say('',B.tips[1]);
  const t0=b.time,H=atk.h.map(([t,d])=>({t,d,p:null,res:false})),last=H[H.length-1].t,O=b.O,hx=BOX,nx=THX+3.6;let lock=-1;
  b.key=c=>{if(c!=='KeyE'&&c!=='Space')return;const tau=b.time-t0;if(tau<lock)return;const h=H.find(h=>!h.res&&h.p===null&&Math.abs(h.t-tau)<=.16);
    if(h)h.p=tau;else{lock=tau+.4;num(thPos().clone().setY(3.4),'te vroeg','#9aa3ad')}};
  for(const h of H){const st=h.t-.75;if(st<=0)ring(thPos,h.t,B.col);else bw(st).then(()=>{if(BT===b)ring(thPos,.75,B.col)})}
  const spawned=new Set();
  await anim(last+.6,k=>{const tau=k*(last+.6);
    if(atk.a==='lunge'||atk.a==='slam'){const h0=H[0].t;let x,y=0;
      if(tau<h0)x=hx+(nx-hx)*ease(Math.min(1,tau/h0));else if(tau<=last)x=nx;else x=nx+(hx-nx)*ease(Math.min(1,(tau-last)/.6));
      if(atk.a==='lunge')for(const h of H)x+=-.6*Math.exp(-Math.pow((tau-h.t)/.07,2));
      else for(let i=0;i<H.length;i++){const p=i?H[i-1].t:0,u=(tau-p)/(H[i].t-p);if(u>=0&&u<1){y=Math.sin(u*Math.PI)*(i?3:4.5);break}}
      O.position.set(x,y,0)}
    else for(let i=0;i<H.length;i++){const h=H[i],lead=atk.a==='rain'?.6:.5;if(tau>=h.t-lead&&!spawned.has(i)){spawned.add(i);
      const from=atk.a==='rain'?new THREE.Vector3(THX+(Math.random()-.5),11,0):new THREE.Vector3(hx-1.5,3,0);proj(from,new THREE.Vector3(THX,1.5,0),lead,atk.pc||'#ffffff',.45,atk.a==='rain'?0:1.2);
      if(atk.a==='throw')anim(.2,k=>O.position.x=hx+Math.sin(k*Math.PI)*.4)}}
    for(const h of H)if(!h.res&&tau>=h.t+.08){h.res=true;const q=h.p===null?0:Math.abs(h.p-h.t)<=.07?2:1;
      if(q===2){num(thPos().clone().setY(4),'SUPERBLOK!','#ff7a1a',true);tone(note(12),.15,'triangle',.14);hitBoss(1,{pierce:true})}
      else if(q===1){const d=Math.ceil(h.d/2);hurtMe(d,'BLOK −'+d)}else hurtMe(h.d);
      if(atk.a==='slam')b.shake=Math.max(b.shake,1.3)}});
  O.position.set(hx,0,0);b.key=null}
async function btWin(first){const b=BT,B=b.B;b.dead=true;await anim(1.2,k=>{b.O.rotation.z=k*1.4;b.O.position.y=-k*1.5;b.O.scale.setScalar(1-k*.4)});await say(B.name,B.win,B.col);
  if(first){OWSAVE.bosses.push(B.id);owSave();[0,4,7,12,16].forEach((k,i)=>tone(note(k),.35,'triangle',.14,i*.1));
    await say('',`🏆 Thomas wordt sterker! Level ${owLvl()+1} · ${pMax()} HP · ${spMax()} SP${owLvl()%2===0?' · +1 kracht':''}`)}
  endBattle('win')}
async function fight(){const b=BT,B=b.B,first=!OWSAVE.bosses.includes(B.id);await bw(.6);
  for(const l of B.intro)await say(B.name,l,B.col);
  for(;;){b.turn++;if(b.turn>1)b.sp=Math.min(b.spm,b.sp+1);if(B.id==='golem'&&b.armor<1&&b.turn>1)b.armor++;b.st=B.st?B.st(b):null;btHud();
    if(B.tips&&first&&b.turn===1)await say('',B.tips[0]);
    const a=await menu();
    if(a==='weg'){await say('Thomas','Ik ga even… eh… mijn ski\'s smeren.','#ff7a1a');endBattle('flee');return}
    if(a==='klap')await doKlap();else if(a==='bal')await doBal();else if(a==='law')await doLawine();else if(a==='dans')await doDans();
    else if(a==='choc'){b.choc--;b.php=Math.min(b.pmax,b.php+6);num(thPos(),'+6 HP','#2fd3b0');tone(note(9),.3,'triangle',.12);btHud();await bw(.6)}
    if(b.php<=0)break;
    if(b.hp<=0){await btWin(first);return}
    if(!b.ph2&&b.hp<=b.max/2){b.ph2=true;b.st=B.st?B.st(b):null;btHud();await say(B.name,B.p2,B.col)}
    await bw(.4);await enemyTurn();if(b.hp<=0){await btWin(first);return}if(b.php<=0)break;await bw(.3)}
  await anim(.8,k=>{b.th.rotation.z=k*1.5;b.th.position.y=-k*.5});await say(B.name,B.lose,B.col);endBattle('lose')}
// ---------- screens ----------
const card=$('cardc'),ov=$('ov');
function title(){if(OW)owStop();state='title';document.body.classList.add('inmenu');ov.classList.add('menu');card.className='card menu';
  const st=STYLES[(level-1)%STYLES.length];
  card.innerHTML=`<h1>THOMAS</h1><div class="tag">ontsnap aan de lawine</div>
  <div class="modes">
    <div class="mode" id="b"><span class="lab">Piste ${level}</span><b>${st.name}</b>
      <span class="arr"><i id="lp" class="${level>1?'':'off'}">‹</i><i id="ln" class="${level<maxLevel?'':'off'}">›</i></span><span class="go">Enter</span></div>
    <div class="mode inf" id="bi"><span class="lab">∞ Oneindig</span><b>${best.toLocaleString('nl-NL')} m</b><span class="go">I</span></div>
    <div class="mode ow" id="bo"><span class="lab">🗺 Open wereld · ${OWSAVE.disc.length||OWSAVE.posters.length?owProgress():'nieuw avontuur'}</span><b>${OWSAVE.pos?'Verder in de Zeven Bergen':'Zeven Bergen'}</b><span class="go">O</span></div>
    <div class="mode race" id="br"><span class="lab">🏁 Race · 2 spelers</span><b>${STYLES[raceWorld].name}</b><span class="lab" style="opacity:.85">P1 WASD · P2 pijltjes</span>
      <span class="arr"><i id="rp">‹</i><i id="rn">›</i></span><span class="go">R</span></div>
  </div>
  ${skinRow()}
  <div class="ctrl"><span><kbd>Spatie</kbd> duiken</span><span><kbd>← →</kbd> sturen</span><span><kbd>Shift</kbd> boost</span><span><kbd>Q E</kbd> skin</span></div>`;
  $('br').onclick=()=>go('race');$('rp').onclick=e=>{e.stopPropagation();pickRace(-1)};$('rn').onclick=e=>{e.stopPropagation();pickRace(1)};
  $('b').onclick=()=>go('level');$('bi').onclick=()=>go('inf');$('bo').onclick=()=>{initAudio();if(ac&&ac.state==='suspended')ac.resume();owStart()};
  $('lp').onclick=e=>{e.stopPropagation();pickLevel(-1)};$('ln').onclick=e=>{e.stopPropagation();pickLevel(1)};bindSkinRow();
  ov.classList.remove('hide')}
function pickLevel(d){const n=clamp(level+d,1,maxLevel);if(n!==level){level=n;store.set('thomas_level',level);title()}}
function pickRace(d){raceWorld=(raceWorld+d+STYLES.length)%STYLES.length;store.set('thomas_raceworld',raceWorld);title()}
const RACE_CTRL=`<div class="ctrl"><span><b style="color:#ff7a1a">P1</b><kbd>A D</kbd> sturen <kbd>S</kbd> duiken <kbd>W</kbd> boost</span><span><b style="color:#2b6cff">P2</b><kbd>← →</kbd> sturen <kbd>↓</kbd> duiken <kbd>↑</kbd> boost</span></div>`;
// race result: first over the finish, or last one standing
function endMulti(winner,why){document.body.classList.remove('inmenu');ov.classList.remove('menu');card.className='card glass';
  state='lose';const A=act();
  const w=winner||A.reduce((a,b)=>b.P.s>a.P.s?b:a);const col=c=>c.id===1?'#ff7a1a':'#2b6cff';
  const row=c=>`<div style="border-top:4px solid ${col(c)}"><span class="lab">${c.name}${c===w?' · 🏆':''}</span><b>${Math.round(c.P.s).toLocaleString('nl-NL')} m</b>
    <span class="lab">${c.stats.perfect} perfects · ${Math.round(c.stats.maxv*3.6)} km/u</span></div>`;
  card.innerHTML=`<div class="rank" style="background:${col(w)};font-size:40px">${w.name}</div><h2>${w.name} wint!</h2>
    <div class="sub">Race · ${L.style.name} · ${why==='out'?'de ander bleef te ver achter':why==='bury'?'de ander werd bedolven':winner?'eerst over de finish':'verst gekomen'}</div>
    <div class="stats" style="grid-template-columns:1fr 1fr">${A.map(row).join('')}</div>
    <div style="display:flex;gap:10px"><button id="b">Revanche →</button><button id="bm" style="background:#18203a">Menu</button></div><div class="hint">Enter = revanche · M = menu</div>${RACE_CTRL}`;
  $('b').onclick=()=>go();$('bm').onclick=title;ov.classList.remove('hide')}
function end(win){use(PLS[0]);document.body.classList.remove('inmenu');ov.classList.remove('menu');card.className='card glass';
  state=win?'win':'lose';const dist=Math.round(P.s);
  if(L.inf){const rec=dist>best;if(rec){best=dist;store.set('thomas_best',best)}
    card.innerHTML=`${rec?'<div class="rank" style="font-size:26px">RECORD</div>':''}<h2>Bedolven<br>na ${dist} m.</h2><div class="sub">Oneindig · ${L.style.name} · record ${best} m</div>
     <div class="stats"><div><span class="lab">Afstand</span><b>${dist} m</b></div><div><span class="lab">Perfects</span><b>${stats.perfect}</b></div><div><span class="lab">Top km/u</span><b>${Math.round(stats.maxv*3.6)}</b></div></div>
     <div style="display:flex;gap:10px"><button id="b">Opnieuw →</button><button id="bm" style="background:#18203a">Menu</button></div><div class="hint">Enter = opnieuw · M = menu · poorten ${stats.gates} · langste vlucht ${stats.air.toFixed(1)}s</div>`;
    $('b').onclick=()=>go('inf')}
  else if(win){const avg=L.len/time,rank=avg>58?'S':avg>46?'A':avg>35?'B':'C';
    level++;maxLevel=Math.max(maxLevel,level);store.set('thomas_level',level);store.set('thomas_max',maxLevel);
    card.innerHTML=`<div class="rank">${rank}</div><h2>Piste ${level-1}<br>overleefd</h2><div class="sub">${L.style.name} · de lawine kijkt Thomas na</div>
     <div class="stats"><div><span class="lab">Tijd</span><b>${time.toFixed(1)}s</b></div><div><span class="lab">Perfects</span><b>${stats.perfect}</b></div><div><span class="lab">Top km/u</span><b>${Math.round(stats.maxv*3.6)}</b></div></div>
     <div style="display:flex;gap:10px"><button id="b">Piste ${level}: ${STYLES[(level-1)%STYLES.length].name} →</button><button id="bm" style="background:#18203a">Menu</button></div>
     <div class="hint">Enter = verder · kristallen ${stats.orbs} · poorten ${stats.gates} · langste vlucht ${stats.air.toFixed(1)}s · bonks ${stats.bonk}</div>`;
    $('b').onclick=()=>go('level')}
  else{card.innerHTML=`<h2>Bedolven<br>onder de lawine.</h2><div class="sub">Piste ${level} · ${L.style.name} · ${Math.round(P.s/L.len*100)}% gehaald</div>
     <div style="height:8px"></div>
     <div style="display:flex;gap:10px"><button id="b">Graaf hem uit →</button><button id="bm" style="background:#18203a">Menu</button></div><div class="hint">Enter = opnieuw · M = menu</div>`;
    $('b').onclick=()=>go('level')}
  const nu=updateUnlocks();if(nu.length)card.insertAdjacentHTML('afterbegin',`<div style="background:linear-gradient(100deg,#ffcf40,#ff7a1a);color:#fff;border-radius:12px;padding:10px 14px;margin-bottom:16px;font-weight:800;font-style:italic;font-size:20px">🎿 Nieuwe skin: ${nu.map(k=>k.name).join(', ')}! Kies hem in het menu.</div>`);
  $('bm').onclick=title;ov.classList.remove('hide')}
function go(m){if(state==='play')return;if(m){mode=m;nP=m==='race'?2:1}preU=SKINS.filter(skinUnlocked).map(k=>k.id);document.body.classList.remove('inmenu');initAudio();if(ac&&ac.state==='suspended')ac.resume();reset();worldBanner(L.style);state='play';ov.classList.add('hide');clock.getDelta()}
// map: click a discovered camp or summit to travel there
$('mapCv').addEventListener('click',e=>{if(state!=='map')return;const r=e.target.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  let best=null,bd=22;for(const h of OWMAPHIT){const d=Math.hypot(h.x-x,h.y-y);if(d<bd){bd=d;best=h}}if(best)owTravel(best.q)});
$('mapWipe').onclick=e=>{const b=e.target;if(b.dataset.sure){owWipe();drawMap();b.textContent='Gewist';delete b.dataset.sure}else{b.dataset.sure=1;b.textContent='Zeker? Klik nogmaals';setTimeout(()=>{delete b.dataset.sure;b.textContent='Wis voortgang'},3000)}};
addEventListener('resize',()=>{if(state==='map')drawMap()});
applySkin(store.get('thomas_skin','klassiek'));mode='level';reset();title();frame();
</script>
