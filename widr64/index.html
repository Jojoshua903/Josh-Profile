<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Who Wants to Be a Hundredaire?</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="studio.css">
</head>
<body data-scene="title">
<div class="studio" aria-hidden="true">
  <div class="wall"><i class="panel p1"></i><i class="panel p2"></i><i class="panel p3"></i><i class="panel p4"></i><div class="arch"></div></div>
  <div class="truss"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <i class="beam b1"></i><i class="beam b2"></i><i class="beam b3"></i><i class="beam b4"></i>
  <div class="floor"><div class="disc"></div></div>
  <div class="cameras"><i class="cam c1"></i><i class="cam c2"></i></div>
  <div class="audience"><div class="row r1"></div><div class="row r2"></div></div>
</div>
<div id="app">
  <div class="topbar">
    <div class="logo-mini">Hundred<em>$</em>aire</div>
    <div class="chip hidden" id="roundChip">Question <b>1/18</b></div>
    <div class="chip" id="bestChip">High score <b>$0</b></div>
    <div class="chip" id="jokeChip" title="Times Sichen has told the airplane joke">✈️ Jokes told <b>0</b></div>
    <button class="tbtn hidden" id="saveBtn">💾 Save</button>
    <button class="tbtn alt" id="soundBtn">🔊 Sound</button>
    <button class="tbtn alt hidden" id="quitBtn">Menu</button>
  </div>
  <main id="screen"></main>
</div>
<div id="modal"></div>
<div id="toast"></div>
<script src="questions.js"></script>
<script src="questions2.js"></script>
<script src="avatar.js"></script>
<script src="cast.js"></script>
<script src="engine.js"></script>
<script src="creator.js"></script>
<script src="game.js"></script>
<script src="play.js"></script>
<script src="anim.js"></script>
</body>
</html>
