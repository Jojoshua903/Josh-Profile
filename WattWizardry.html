  else if(B.state==='dazed'||B.state==='recover'){ if(B.t<=0) brannTo('walk',0.9+Math.random()*0.9); }
  else if(B.state==='stun'){
    if(!B.frz&&B.stunT-B.t>0.35){ B.frz=true; ISA4.castT=0.6; SFX.unlock(); sparks(B.x,B.y-80,24,'#cfeefc'); isa4Bark(['Nu, Milo! Breek het eraf!','Bevroren! Slaan!','Hebbes! Nu!'][Math.floor(Math.random()*3)],1.8); }
    if(B.t<0.7&&Math.random()<0.5) sparks(B.x+(Math.random()-.5)*80,B.y-60-Math.random()*60,2,'#ffffff');
    if(B.t<=0) brannRise(true); }
  else if(B.state==='fall'){ if(Math.random()<0.3) sparks(B.x+(Math.random()-.5)*80,B.y-Math.random()*100,4,P2.puL);
    if(B.t<=0&&GAME.mode==='play'){ B.state='done'; openDialog({id:'brann',spr:'brann',x:B.x-32,y:B.y-72,lines:DIALOG.brann1,onEnd:()=>{ GATE4_LOCKED=false; GAME.winT=2.2; compBark('Hij leeft. Dat is het belangrijkste.',3); }}); } }
  // kristalpieken uit de grond: eerst een gloed, dan omhoog
  for(const k of SPIKES4){ k.t+=dt; const on=k.t>0.6&&k.t<0.85;

function brannChoose(){
  const B=BR, ph=brannPhase(), px=PL.x+PL.w/2, d=Math.abs(px-B.x);
  const opts=['throw','charge']; if(d<220) opts.push('slam','slam'); if(ph>=2) opts.push('rain'); if(ph>=3) opts.push('quake');
  let o=opts[Math.floor(Math.random()*opts.length)]; if(o===B.last) o=opts[Math.floor(Math.random()*opts.length)]; B.last=o;
  B.face=px<B.x?-1:1;
  if(o==='slam'){ brannTo('slam',ph===3?0.6:0.75); tone('sawtooth',160,90,0.6,0.1); }
  else if(o==='throw'){ B.throwN=ph; brannTo('throw',0.55); }
  else if(o==='charge'){ brannTo('chargeWarn',1.15); isa4Bark('Hij stormt! Spring eroverheen!',1.6); SFX.boss(); tone('sawtooth',300,600,0.7,0.1); }
  else if(o==='rain'){ brannTo('rain',1.6); shake(10); SFX.crumble(); const n=4+ph*2;
    for(let i=0;i<n;i++){ const x=i===0?px:ARENA4.x0+60+Math.random()*(ARENA4.x1-ARENA4.x0-120); HAZ.push({type:'rock',cry:true,x,y:4*T,vy:0,t:-i*0.14,warn:0.85,floor:FLOOR4}); } }
  else { B.quakeN=3; brannTo('quake',0.4); SFX.boss(); }
}
function brannStun(){ const ph=brannPhase(); BR.stunT=ph===1?3.4:ph===2?3.0:2.6; brannTo('stun',BR.stunT); BR.frz=false; BR.dmgStun=0; shake(10); SFX.hit(); }
function hurtCrystal(n){
  const B=BR, c=curCrystal(); if(!c||B.inv>0) return;
  n=Math.min(n,3-B.dmgStun); if(n<=0){ SFX.tink(); return; }
  B.dmgStun+=n; c.hp=Math.max(0,c.hp-n); B.flash=0.15; B.inv=0.22; SFX.hit(); shake(6); sparks(B.x,B.y-90,14,P2.puL);
  if(c.hp<=0){ shake(14); SFX.crumble(); for(let i=0;i<30;i++) PARTS.push({x:B.x+(Math.random()-.5)*80,y:B.y-60-Math.random()*70,vx:(Math.random()-.5)*360,vy:-Math.random()*360,life:0.9,col:i%2?P2.pu:P2.puL,s:4,g:900});
    if(!curCrystal()){ brannTo('fall',2.2); EPROJ=[]; HAZ=[]; SPIKES4=[]; isa4Bark('Hij... is het weer gewoon hem?',2.5); return; }
    toast(brannPhase()===2?'Het eerste kristal breekt! (1/3)':'Nog één kristal! (2/3)'); isa4Bark(brannPhase()===2?'Eén eraf! Die telt voor mij.':'Bijna! Hou vol!',2); brannRise(false); }
  else if(B.dmgStun>=3){ isa4Bark('Het ijs houdt niet langer!',1.4); brannRise(true); }
}
function brannRise(burst){
  const B=BR; brannTo('recover',0.6); B.frz=false;
  for(let i=0;i<18;i++) PARTS.push({x:B.x+(Math.random()-.5)*90,y:B.y-Math.random()*120,vx:(Math.random()-.5)*300,vy:-Math.random()*300,life:0.6,col:i%2?'#ffffff':'#cfeefc',s:4,g:900});
  if(burst){ RINGS.push({x:B.x,y:B.y-60,r:20,life:0.3,max:120}); if(Math.hypot(PL.x+PL.w/2-B.x,PL.y+PL.h/2-(B.y-60))<120) hurtPlayer(1,B.x); }

function w4ResetBoss(){

function cartFollow(m){
  const p=PL, px=p.x+p.w/2; if(!p.onGround||px<m.x0||px>m.x1+m.w) return;

function railEnds(r){ return [r.pts[0], r.pts[r.pts.length-1]]; }
function w5Cast(){
  const p=PL, c=playerCenter();

  let best=null, bd=grateAhead(p)?0:90, rev=false;
  for(const r of RAILS){ if(r.hidden) continue; const [a,b]=railEnds(r);
    const da=Math.hypot(a[0]-c.x,a[1]-c.y), db=Math.hypot(b[0]-c.x,b[1]-c.y);
    if(da<bd){ bd=da; best=r; rev=false; }
    if(!r.pylon&&!r.eye&&db<bd){ bd=db; best=r; rev=true; } }
  p.slam=false; p.castT=0.15; p.ghost=Math.max(p.ghost,0.3); SFX.bolt(); tone('sawtooth',300,1400,0.2,0.08);
  for(let i=0;i<10;i++) PARTS.push({x:c.x,y:c.y,vx:(Math.random()-.5)*200,vy:(Math.random()-.5)*200,life:0.3,col:i%2?PAL.boltC:'#ffffff',s:3,g:0});
  p.hitList=[];
  if(best){ const pts=rev?[...best.pts].reverse():[...best.pts]; p.form={mode:'rail',pts,i:0,cx:c.x,cy:c.y,rail:best,trail:[[c.x,c.y]]}; return; }

}
function w5Form(p,dt){
  const F=p.form; p.ghost=Math.max(p.ghost,0.12); p.vy=0;
  if(F.mode==='rail'){
    let mv=760*dt;
    while(mv>0&&F.i<F.pts.length){ const [tx,ty]=F.pts[F.i], dx=tx-F.cx, dy=ty-F.cy, d=Math.hypot(dx,dy);
      if(d<=mv){ F.cx=tx; F.cy=ty; mv-=d; F.i++; } else { F.cx+=dx/d*mv; F.cy+=dy/d*mv; mv=0; } }
    p.x=F.cx-p.w/2; p.y=F.cy-p.h/2; F.trail.push([F.cx,F.cy]); if(F.trail.length>14) F.trail.shift();
    if(Math.random()<0.7) PARTS.push({x:F.cx,y:F.cy,vx:(Math.random()-.5)*60,vy:(Math.random()-.5)*60,life:0.25,col:Math.random()<.5?PAL.boltC:'#ffffff',s:3,g:0});
    damageArea({x:p.x-6,y:p.y,w:p.w+12,h:p.h},2,'staff');
    if(F.i>=F.pts.length) formEnd(p,true);
    return;
  }
  // gewone schicht vooruit
  const step=4; let mv=950*dt;
  while(mv>0&&F.left>0){ const nx=p.x+F.dir*step, cx=nx+p.w/2, cy=p.y+p.h/2;
    if(rectSolid(nx,p.y,p.w,p.h,'form')){ F.left=0; break; }
    if(tileAt(Math.floor(cx/T),Math.floor(cy/T))==='~'){ F.left=0; fizzle(cx,cy); break; }
    p.x=nx; mv-=step; F.left-=step; }
  F.cx=p.x+p.w/2; F.cy=p.y+p.h/2; F.trail.push([F.cx,F.cy]); if(F.trail.length>10) F.trail.shift();

    if(rectSolid(p.x,p.y,p.w,p.h)) p.x=F.x0;
    formEnd(p,false); }
}
function formEnd(p,rail){

  MAP=[...Array(LH)].map(()=>Array(LW).fill('.'));
  GROUP={}; ENTS=[];
  const fill=(x0,y0,x1,y1,ch,grp)=>{ for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) if(x>=0&&x<LW&&y>=0&&y<LH){ MAP[y][x]=ch; if(grp) GROUP[x+','+y]=grp; } };
  const isl=(x0,x1,top,depth=3)=>fill(x0,top,x1,Math.min(LH-1,top+depth-1),'#');
  const ent=(type,tx,ty,o={})=>ENTS.push({type,tx,ty,...o});
  const decor=(spr,tx,ty)=>ent('decor',tx,ty,{spr});
  const rail=(pts,o={})=>ent('rail',pts[0][0],pts[0][1],{pts,...o});
  const cloud=(x0,x1,y)=>fill(x0,y,x1,y,'-');

  /* 1. De Wolkenpoort */
  isl(0,14,12,8); fill(0,0,0,11,'#');
  ent('player',3,11); decor('spire6',6,11);
  ent('isa6',9,11);
  ent('altar',12,11);
  isl(18,26,12); decor('cloud6',22,12);
  cloud(28,31,10); cloud(34,37,8);
  cloud(30,32,5); ent('shard',31,4,{id:'w6s1'});
  isl(40,50,9); decor('ruin6',44,8);
  ent('altar',48,8);

  /* 2. De Windbrug */
  isl(51,74,9,2);
  ent('storm',54,8,{x1:72,dir:-1}); ent('strikes',58,0,{x1:72});
  ent('anchor',78,5);
  cloud(77,80,13); cloud(81,82,11); ent('heartc',78,12,{id:'h11'});
  isl(83,96,9); decor('spire6',90,8);
  ent('cwisp',88,6); ent('cwisp',93,5);
  ent('altar',94,8);

  /* 3. De Opwaartse Wind */
  ent('updraft',97,1,{x1:99,y1:19});
  isl(100,112,3,17); ent('shard',111,2,{id:'w6s2'}); decor('ruin6',105,2);
  cloud(114,117,6); cloud(120,123,9);
  isl(126,140,11); decor('cloud6',128,11);
  ent('isaMid6',130,10);
  ent('altar',133,10);
  ent('cwisp',137,7);

  /* 4. De Stormtoppen */
  isl(143,147,3,17); rail([[141,10],[141,1],[149,1],[149,10]]);
  isl(148,162,11); ent('strikes',150,0,{x1:176});
  ent('anchor',166,6); cloud(166,168,13);
  isl(171,184,11); rail([[173,10],[173,3],[176,3]]); cloud(175,179,5); ent('shard',178,4,{id:'w6s3'});
  ent('cwisp',180,7);
  ent('updraft',186,4,{x1:189,y1:19}); ent('heartc',187,13,{id:'h12'});
  isl(191,206,10); decor('spire6',195,9);
  cloud(203,205,5); ent('shard',204,4,{id:'w6s4'});
  ent('altar',200,9);

  /* 5. De Laatste Klim */
  cloud(209,212,8); cloud(215,218,6);
  isl(221,232,6); ent('storm',221,5,{x1:250,dir:-1}); ent('strikes',221,0,{x1:250});
  ent('anchor',236,3); cloud(235,236,9);
  isl(239,251,8,12); ent('shard',249,7,{id:'w6s5'});
  fill(244,9,246,10,'.'); fill(244,8,246,8,'f'); ent('shard',245,10,{id:'w6s6'});
  ent('cwisp',229,3); ent('cwisp',244,5);
  ent('altar',241,7);

  /* 6. De Stormkroon */
  fill(252,0,252,5,'#'); fill(252,6,252,14,'H',4);
  isl(252,299,15,5); fill(296,0,299,14,'#');
  ent('altar',255,14);
  ent('isaBoss6',259,14);
  rail([[257,14],[257,4],[271,3]],{eye:true});
  decor('cloud6',266,15); decor('cloud6',288,15);
  ent('mother',280,14);
}

<script>/* js/world6.js */
// world6.js — Wereld 6: De Stormkroon. Opwaartse wind, blikseminslagen, de kleine draak, Isa, de Stormmoeder en de keuze.
let UPDRAFTS=[], SZONES=[], STRK6=[], MOTHER=null, ISA6=null, VONK=null, EYE=null, MPUSH=0, FLASH6=0;
const ARENA6={x0:253*T, x1:296*T}, FLOOR6=15*T, MOM_HP=18, CAPT_T=20;
function w6State(){ if(!GAME.w6) GAME.w6={met:false,mid:false,choice:null}; return GAME.w6; }

function startWorld6(){
  const keep={unlocked:[...PL.unlocked], slots:[...PL.slots], maxHp:PL.maxHp}, w3=GAME.w3;
  GAME.w6=null; WORLD=6; newGame(true); GAME.w3=w3; w3State();
  PL.unlocked=keep.unlocked; PL.slots=keep.slots; PL.maxHp=keep.maxHp; PL.hp=PL.maxHp;
  joinCompanion({x:PL.x-90,y:PL.y+PL.h-72});
  GAME.state='play';
  GAME.banner={title:'WERELD 6',sub:'De Stormkroon',t:3.2,boss:true};
  saveGame();
}

/* ---------- spawnen ---------- */
function w6Init(){ PROJ6=[]; UPDRAFTS=[]; SZONES=[]; STRK6=[]; MOTHER=null; ISA6=null; VONK=null; EYE=null; MPUSH=0; FLASH6=0; }
function w6Spawn(e,fx,fy){
  const S=w6State();
  if(e.type==='player') VONK={x:fx-40,y:fy-90,face:1,t:0};
  if(e.type==='rail') RAILS.push({pts:e.pts.map(([x,y])=>[x*T+16,y*T+16]),pylon:null,eye:!!e.eye,hidden:!!e.eye});
  if(e.type==='updraft') UPDRAFTS.push({x0:e.tx*T,x1:e.x1*T+T,y0:e.ty*T,y1:e.y1*T+T});
  if(e.type==='strikes') SZONES.push({x0:e.tx*T,x1:e.x1*T+T,t:1.4});
  if(e.type==='isa6') ISA6={mode:S.met?'gone':'start',x:fx,y:fy,face:-1,anim:0,bark:'',barkT:0,castT:0,fade:1,vy:0};
  if(e.type==='isaMid6'&&ISA6) ISA6.mid={x:fx,y:fy};
  if(e.type==='isaBoss6'&&ISA6) ISA6.boss={x:fx,y:fy};
  if(e.type==='mother') MOTHER={hx:fx,x:fx,y:FLOOR6-260,face:-1,state:'sleep',t:0,anim:0,hp:MOM_HP,flash:0,dmg:0,last:'',chain:0,beam:null,tgt:{x:0,y:0},claw:0,capT:0};
}
function isa6Bark(s,t=2.5){ if(ISA6){ ISA6.bark=s; ISA6.barkT=t; } }

/* ---------- Milo: opwaartse wind en windstoten ---------- */
function w6PrePhys(p,dt){
  const cx=p.x+p.w/2, cy=p.y+p.h/2;
  for(const u of UPDRAFTS) if(cx>u.x0&&cx<u.x1&&cy>u.y0&&cy<u.y1){ p.vy=Math.max(p.vy-2700*dt,-470); p.leapUsed=false; p.coyote=0; hint('updraft','Opwaartse wind: hij tilt je omhoog. Stuur naar links of rechts om eruit te stappen.'); }
  if(MPUSH&&!(p.shieldT>0)){ p.push=(p.push||0)+MPUSH; p.vx+=MPUSH; }
}

/* ---------- blikseminslagen uit de storm ---------- */
function strike6(x,warn){ STRK6.push({x,t:0,warn:warn||0.9,fired:false}); }
function strikesUpdate(dt){
  const px=PL.x+PL.w/2;
  for(const z of SZONES) if(px>z.x0&&px<z.x1&&GAME.mode==='play'){ z.t-=dt; if(z.t<=0){ z.t=1.3+Math.random()*0.8; strike6(px+(Math.random()-.5)*120); } }
  for(const s of STRK6){ s.t+=dt;
    if(s.t>=s.warn&&!s.fired){ s.fired=true; SFX.bolt(); shake(5); FLASH6=Math.max(FLASH6,0.25); }
    if(s.fired&&!s.done&&s.t<s.warn+0.22&&Math.abs(px-s.x)<26){ s.done=true;
      if(PL.shieldT>0){ SFX.tink(); sparks(px,PL.y,14,PAL.boltC); hint('strikeshield','Je schild vangt de bliksem op.'); } else hurtPlayer(1,s.x); } }
  STRK6=STRK6.filter(s=>s.t<s.warn+0.3);
}

/* ---------- de kleine draak ---------- */
function vonkUpdate(dt){
  const V=VONK; if(!V) return; V.t+=dt;
  let tx=PL.x+PL.w/2-PL.face*36, ty=PL.y-30+Math.sin(V.t*3)*6;
  if(MOTHER&&MOTHER.state==='captive'){ tx=MOTHER.x-MOTHER.face*120; ty=MOTHER.y-160+Math.sin(V.t*6)*8; }
  V.x+=(tx-V.x)*Math.min(1,dt*4); V.y+=(ty-V.y)*Math.min(1,dt*4); V.face=tx>V.x+2?1:tx<V.x-2?-1:PL.face;
}

/* ---------- Isa ---------- */
function isa6Dialog(lines,onEnd){ openDialog({id:'isa',spr:'isa',x:ISA6.x-32,y:ISA6.y-72,lines,onEnd}); }
function isa6Update(dt){
  const I=ISA6; if(!I) return; const S=w6State(), px=PL.x+PL.w/2;
  I.anim+=dt; I.barkT-=dt; I.castT=Math.max(0,I.castT-dt); I.walking=false;
  const walk=(tx,sp)=>{ const d=tx-I.x; I.face=Math.sign(d)||I.face; I.x+=Math.sign(d)*Math.min(Math.abs(d),sp*dt); I.walking=Math.abs(d)>2; return Math.abs(d)<=2; };
  if(I.mode==='start'){ I.face=px<I.x?-1:1; if(Math.abs(px-I.x)<110&&GAME.mode==='play'){ PL.vx=0; isa6Dialog(DIALOG.isa12,()=>{ S.met=true; I.mode='leave'; }); } }
  else if(I.mode==='leave'){ I.fade=Math.max(0,I.fade-dt*1.2); walk(I.x+200,150); if(I.fade<=0){ I.mode='gone'; I.fade=1; } }
  else if(I.mode==='gone'){ if(!S.mid&&I.mid&&px>118*T&&px<I.mid.x+4*T){ I.x=I.mid.x; I.y=I.mid.y; I.mode='mid'; }
    else if(I.boss&&px>253*T){ I.x=I.boss.x; I.y=I.boss.y; I.mode='boss'; } }
  else if(I.mode==='mid'){ I.face=px<I.x?-1:1; if(Math.abs(px-I.x)<110&&GAME.mode==='play'){ PL.vx=0; isa6Dialog(DIALOG.isa13,()=>{ S.mid=true; I.mode='leave'; }); } }
  else if(I.mode==='boss'){ I.face=1; if(px>I.x-120&&GAME.mode==='play'){ PL.vx=0; isa6Dialog(DIALOG.isa14,()=>{ I.mode='ally'; }); } }
  else if(I.mode==='ally'){ const M=MOTHER; if(M) I.face=M.x<I.x?-1:1;
    if(M&&M.state==='down'&&!M.frz){ M.frz=true; I.castT=0.7; SFX.unlock(); isa6Bark(['Hebbes! Nu, Milo!','Vleugels bevroren! Sla!','Ze ligt! Snel!'][Math.floor(Math.random()*3)],1.8); } }
  else if(I.mode==='held'){ const c=clawPos(); I.x=c.x; I.y=c.y+62; I.face=MOTHER.face; }
  else if(I.mode==='freed'){ I.vy=Math.min(900,I.vy+1500*dt); I.y+=I.vy*dt; if(I.y>=FLOOR6){ I.y=FLOOR6; I.mode='safe'; dust(I.x,FLOOR6,12); shake(6); } }
  else if(I.mode==='flung'){ I.vy=Math.max(-900,I.vy-1400*dt); I.y+=I.vy*dt; I.fade=Math.max(0,I.fade-dt*0.6); }
}

/* ---------- de Stormmoeder ---------- */
// drie fases (18 → 14 → 10 → 6), daarna grijpt ze Isa
const STAGE6=[{name:'De Moeder',sub:'Ze wil haar kind terug'},{name:'Stormvleugels',sub:'Ze vecht nu met alles wat ze heeft'},{name:'Het Oog Opent',sub:'Boven haar laadt iets op'}];
let PROJ6=[];
function momPh(){ const h=MOTHER.hp; return h>14?1:h>10?2:3; }
function momFloor(){ return [0,14,10,6][momPh()]; }
function momTo(s,t){ MOTHER.state=s; MOTHER.t=t; }
function mouthPos(){ const M=MOTHER, dn=M.state==='down'||M.state==='fall'; return {x:M.x+M.face*(dn?156:160),y:M.y-(dn?42:118)}; }
function clawPos(){ const M=MOTHER; return {x:M.x+M.face*12,y:M.y-6}; }
function momBox(){ const M=MOTHER; return M.state==='down'?{x:M.x-140,y:M.y-130,w:280,h:130}:{x:M.x-120,y:M.y-160,w:240,h:130}; }
function swoopBand(){ return {x:ARENA6.x0,y:FLOOR6-70,w:ARENA6.x1-ARENA6.x0,h:62}; }
const GRAB6=['enrage','eyeOnIsa','dive','lift','hold'];
function motherUpdate(dt){
  const M=MOTHER; if(!M) return; const px=PL.x+PL.w/2, mid=(ARENA6.x0+ARENA6.x1)/2, ph=momPh();
  M.t-=dt; M.anim+=dt; M.flash=Math.max(0,M.flash-dt); MPUSH=0;
  const fly=(tx,ty,k)=>{ M.x+=(tx-M.x)*Math.min(1,dt*k); M.y+=(ty-M.y)*Math.min(1,dt*k); M.face=tx<M.x-3?-1:tx>M.x+3?1:M.face; };
  proj6Update(dt);
  if(EYE&&EYE.burst>0) EYE.burst-=dt;
  if(M.state==='sleep'){ if(ISA6&&ISA6.mode==='ally'&&px>262*T&&GAME.mode==='play'){ GATE4_LOCKED=true; momTo('intro',2.8); M.x=ARENA6.x1+200; M.y=-60; M.gap=0; SFX.boss(); shake(16); FLASH6=0.6;
      const S=STAGE6[ph-1]; GAME.banner={title:'DE STORMMOEDER',sub:ph===1?'Drieduizend jaar wachten':'Fase '+ph+' · '+S.name,t:3,boss:true}; } return; }
  if(M.state==='intro'){ fly(mid+120,FLOOR6-190,1.4); if(M.t<1&&!M.roared){ M.roared=true; tone('sawtooth',90,40,1.2,0.3); noise(1,0.3,200); shake(20); }
    if(M.t<=0){ M.roared=false; momTo('fly',2.0); M.gap=0; hint('mother','Ontwijk haar aanvallen. Na een paar keer blaast ze bliksemadem: houd dan je Stormschild vast om hem terug te kaatsen.'); isa6Bark('Wacht op haar adem, Milo. Dan je schild!',2.6); } return; }
  if(['fly','gust','breathWarn','breath','strikes','featherWarn','feathers'].includes(M.state)&&overlap(PL,momBox())) hurtPlayer(1,M.x);
  // fase 3: de storm slaat steeds bij je in
  if(ph===3&&['fly','gust','strikes','swoop','feathers'].includes(M.state)){ M.zap=(M.zap||1.8)-dt; if(M.zap<=0){ M.zap=1.9; strike6(px+(Math.random()-.5)*50,1.0); } }
  if(ph===3&&EYE&&EYE.faint) EYE.charge=Math.min(0.25,EYE.charge+dt*0.01);
  if(M.state==='fly'){ const tx=mid+Math.sin(M.anim*0.6)*260, ty=FLOOR6-200+Math.sin(M.anim*1.3)*30; fly(tx,ty,1.4); if(M.t<=0) momChoose(); }
  else if(M.state==='breathWarn'){
    if(M.sweep){ const sx=M.side>0?ARENA6.x0+130:ARENA6.x1-130; fly(sx,FLOOR6-230,2.5); M.face=M.side; M.tgt={x:M.x+M.side*170,y:FLOOR6-20}; }
    else { fly(M.x,FLOOR6-210,1); M.face=px<M.x?-1:1; if(M.t>0.35) M.tgt={x:px,y:PL.y+PL.h/2}; }
    if(M.t<=0){ momTo('breath',M.sweep?1.5:0.55); M.refl=false; M.s0=M.tgt.x; SFX.bolt(); shake(8); } }
  else if(M.state==='breath'){
    if(M.sweep&&!M.refl){ const k=1-Math.max(0,M.t)/1.5, s1=M.side>0?ARENA6.x1-30:ARENA6.x0+30; M.tgt={x:M.s0+(s1-M.s0)*k,y:FLOOR6-20}; }
    const m=mouthPos(), dx=M.tgt.x-m.x, dy=M.tgt.y-m.y, d=Math.hypot(dx,dy)||1, ux=dx/d, uy=dy/d; M.beam={x0:m.x,y0:m.y,ux,uy,len:1400};
    if(!M.refl){ for(let s=30;s<1400;s+=10){ const bx=m.x+ux*s, by=m.y+uy*s;
        if(bx>PL.x-6&&bx<PL.x+PL.w+6&&by>PL.y-6&&by<PL.y+PL.h+6){
          if(PL.shieldT>0){ M.refl=true; M.beam.len=s; M.t=Math.min(M.t,0.45); SFX.unlock(); shake(12); sparks(bx,by,24,'#ffffff'); } else { hurtPlayer(1,m.x); M.beam.len=s; } break; } } }
    else M.beam.len=Math.min(M.beam.len,Math.hypot(PL.x+PL.w/2-m.x,PL.y+PL.h/2-m.y));
    if(M.t<=0){ M.beam=null; M.sweep=false; if(M.refl){ momTo('fall',0.9); M.fx=Math.max(ARENA6.x0+160,Math.min(ARENA6.x1-160,M.x)); M.flash=0.3; SFX.boss(); toast('Haar eigen bliksem raakt haar! Ze valt!'); } else momNext(); } }
  else if(M.state==='swoopWarn'){ const sx=M.side>0?ARENA6.x1+220:ARENA6.x0-220; fly(sx,FLOOR6+30,4); M.face=-M.side; if(M.t<=0){ momTo('swoop',3); M.x=sx; M.y=FLOOR6+30; SFX.bolt(); } }
  else if(M.state==='swoop'){ M.x-=M.side*[0,640,720,780][ph]*dt; M.face=-M.side;
    if(Math.random()<0.6) PARTS.push({x:M.x,y:FLOOR6-4,vx:M.side*120,vy:-Math.random()*90,life:0.4,col:P6.cloudL,s:3,g:300});
    if(overlap(PL,{x:M.x-90,y:FLOOR6-70,w:180,h:62})) hurtPlayer(1,M.x);
    if((M.side>0&&M.x<ARENA6.x0-220)||(M.side<0&&M.x>ARENA6.x1+220)){
      if(M.twice){ M.twice=false; M.side=-M.side; momTo('swoopWarn',0.85); tone('sawtooth',700,1100,0.5,0.1); }
      else { M.x=M.side>0?ARENA6.x0+120:ARENA6.x1-120; M.y=FLOOR6-260; momNext(); } } }
  else if(M.state==='strikes'){ fly(M.x,FLOOR6-230,1); if(M.t<=0) momNext(); }
  else if(M.state==='gust'){ const sx=M.side>0?ARENA6.x1-150:ARENA6.x0+150; fly(sx,FLOOR6-220,2.5); M.face=-M.side;
    if(M.t<1.8){ MPUSH=-M.side*260; if(Math.random()<0.8) PARTS.push({x:M.x,y:FLOOR6-300+Math.random()*300,vx:-M.side*560,vy:(Math.random()-.5)*40,life:0.9,col:'#ffffff',s:3,g:0}); }
    if(M.t<=0){ MPUSH=0; momNext(); } }
  else if(M.state==='featherWarn'){ fly(M.x,FLOOR6-270,1.5); M.face=px<M.x?-1:1; if(M.t<=0){ momTo('feathers',1.3); featherVolley(); } }
  else if(M.state==='feathers'){ fly(M.x,FLOOR6-270,1); if(M.t<=0) momNext(); }
  else if(M.state==='fall'){ M.x+=(M.fx-M.x)*Math.min(1,dt*5); M.y=Math.min(FLOOR6,M.y+700*dt); if(M.y>=FLOOR6){ momTo('down',[0,3.0,2.6,2.3][ph]); M.dmg=0; M.frz=false; shake(18); SFX.crumble(); dust(M.x,FLOOR6,30); } }
  else if(M.state==='down'){ if(M.t<0.7&&Math.random()<0.4) sparks(M.x+(Math.random()-.5)*180,M.y-Math.random()*90,2,'#ffffff'); if(M.dmg>=2||M.t<=0) momRise(); }
  else if(M.state==='rise'){ fly(mid,FLOOR6-220,2.2); if(M.t<=0){ momTo('fly',1.4); M.gap=0; } }
  else if(M.state==='phase'){ fly(mid,FLOOR6-270,1.5); if(Math.random()<dt*3) shake(6); if(M.t<=0){ momTo('fly',1.2); M.gap=0; } }
  // ---- ze grijpt Isa: eerst woede, dan kijkt ze naar Isa, dan duikt ze ----
  else if(M.state==='enrage'){ fly(mid,FLOOR6-300,1.6); M.roarT=(M.roarT||0)-dt; if(M.roarT<=0){ M.roarT=0.8; tone('sawtooth',100,40,0.7,0.25); noise(0.6,0.25,220); shake(14); }
    if(EYE) EYE.charge=Math.min(0.3,EYE.charge+dt*0.05);
    if(M.t<=0){ momTo('eyeOnIsa',2.0); M.face=ISA6.x<M.x?-1:1; tone('sine',900,300,1.6,0.12); isa6Bark('Milo...? Ze kijkt naar mij.',2); compBark('Ze denkt dat Isa haar kind heeft gestolen!',3); } }
  else if(M.state==='eyeOnIsa'){ M.face=ISA6.x<M.x?-1:1; M.y+=Math.sin(M.anim*8)*0.6;
    if(M.t<=0){ momTo('dive',1.1); SFX.boss(); shake(10); ISA6.castT=1.0; isa6Bark('Nee! Blijf weg!',1.4); } }
  else if(M.state==='dive'){ const I=ISA6; fly(I.x-M.face*12,I.y-56,6);
    if(Math.random()<0.5) sparks(I.x+I.face*20,I.y-40,3,'#cfeefc');
    if(Math.hypot(M.x-(I.x-M.face*12),M.y-(I.y-56))<20||M.t<=0){ I.mode='held'; momTo('lift',2.4); shake(22); noise(0.8,0.4,600); tone('sawtooth',90,40,1.4,0.3); isa6Bark('MILO!',2.4); dust(I.x,FLOOR6,20); } }
  else if(M.state==='lift'){ fly(mid,FLOOR6-210,1.3); if(EYE) EYE.charge=Math.min(0.35,EYE.charge+dt*0.05);
    if(M.t<=0){ momTo('hold',99); playCut('w6grab',()=>{ GAME.state='play'; momTo('captive',CAPT_T); M.claw=0; startCaptive(); }); } }

      tr.forEach(([x,y],i)=>{ const j=i&&i<tr.length-1?(Math.random()-.5)*10:0; i?ctx.lineTo(x-cx+j,y-cy+j):ctx.moveTo(x-cx,y-cy); }); ctx.stroke(); }

  if(FLASH6>0){ ctx.fillStyle=`rgba(240,236,255,${Math.min(0.8,FLASH6)})`; ctx.fillRect(0,0,VW,VH); }
  const I=ISA6; if(I&&I.barkT>0&&I.mode!=='gone'&&I.bark){ const X=Math.round(I.x-cx), Y=Math.round(I.y-cy), lines=wrap(I.bark,200,12), w=220, h=lines.length*16+12, bx=Math.max(8,Math.min(VW-w-8,X-w/2)), by=Math.max(60,Y-68-h-6);

<script>/* js/cutscene.js */
// cutscene.js — stripverhalen: een pagina met 4 panelen in pixel art, één voor één onthuld (intro en einde van elke wereld)
let CUT=null;
const CUT_M=16, CUT_G=12, CUT_BOT=26;
function cutRects(layout){
  const W=VW-CUT_M*2, H=VH-CUT_M-CUT_BOT, rh=Math.floor((H-CUT_G)/2), y2=CUT_M+rh+CUT_G;
  if(layout==='wide'){ const sw=Math.floor((W-CUT_G*2)/3);
    return [[CUT_M,CUT_M,W,rh],[CUT_M,y2,sw,rh],[CUT_M+sw+CUT_G,y2,sw,rh],[CUT_M+(sw+CUT_G)*2,y2,W-(sw+CUT_G)*2,rh]]; }
  const hw=Math.floor((W-CUT_G)/2);
  return [[CUT_M,CUT_M,hw,rh],[CUT_M+hw+CUT_G,CUT_M,W-hw-CUT_G,rh],[CUT_M,y2,hw,rh],[CUT_M+hw+CUT_G,y2,W-hw-CUT_G,rh]];
}
function playCut(id,onDone){ CUT={sc:CUTS[id],i:0,t:0,rev:[0],onDone}; GAME.state='cut'; tone('triangle',260,200,0.12,0.05); }
function cutStep(dt){
  CUT.t+=dt;
  if(pressed('esc')) return cutFinish();
  if(pressed('ok')||pressed('jump')||pressed('act')||pressed('staff')){
    if(CUT.t-CUT.rev[CUT.i]<0.25) return;                     // per ongeluk dubbel drukken telt niet
    if(CUT.i<CUT.sc.panels.length-1){ CUT.i++; CUT.rev[CUT.i]=CUT.t; tone('triangle',300+CUT.i*40,220,0.08,0.05); }
    else cutFinish();
  }
}
function cutFinish(){ const f=CUT.onDone; CUT=null; f(); }
function drawCut(){
  // donkere pagina met een raster van inktpuntjes
  ctx.fillStyle='#1b1622'; ctx.fillRect(0,0,VW,VH);
  ctx.fillStyle='rgba(255,255,255,0.03)'; for(let y=0;y<VH;y+=6) for(let x=(y/6)%2*3;x<VW;x+=6) ctx.fillRect(x,y,2,2);
  const R=cutRects(CUT.sc.layout);
  for(let k=0;k<=CUT.i;k++){
    const [x,y,w,h]=R[k], lt=CUT.t-CUT.rev[k], a=Math.min(1,lt/0.3), dy=Math.round((1-a)*14);
    ctx.save(); ctx.globalAlpha=a;
    ctx.fillStyle='#f1e8d6'; ctx.fillRect(x-5,y-5+dy,w+10,h+10); ctx.fillStyle=PAL.ink; ctx.fillRect(x-3,y-3+dy,w+6,h+6);
    ctx.translate(x,y+dy); ctx.beginPath(); ctx.rect(0,0,w,h); ctx.clip();
    try{ CUT.sc.panels[k](w,h,lt); }catch(e){ ERR=e; ctx.filter='none'; }
    ctx.restore();
  }
  const last=CUT.i>=CUT.sc.panels.length-1;
  if(Math.floor(GAME.time*2)%2) txt(last?'ENTER: verder ▸':'ENTER ▸',VW-CUT_M,VH-20,12,'#e6dcc8','right',null);
  txt('ESC: overslaan',CUT_M,VH-20,11,'#7d7388','left',null);
}

/* ---------- tekenhulpjes ---------- */
function csBands(w,h,cols){ const bh=Math.ceil(h/cols.length);
  cols.forEach((c,i)=>{ ctx.fillStyle=c; ctx.fillRect(0,i*bh,w,bh+1);
    if(i){ ctx.fillStyle=cols[i-1]; for(let x=(i%2)*2;x<w;x+=4) ctx.fillRect(x,i*bh,2,2); } }); }
function csTiles(set,x0,x1,gy,h,top='stoneTop',fill='stone'){ const pick=(a,i)=>Array.isArray(a)?a[i%a.length]:a; let i=0;
  for(let x=x0;x<x1;x+=32,i++){ const tp=pick(set[top],i*7); if(tp) ctx.drawImage(tp,x,gy); for(let y=gy+32,j=1;y<h;y+=32,j++){ const f=pick(set[fill],i*7+j*13); if(f) ctx.drawImage(f,x,y); } } }
function csMilo(fr,x,fy,s=1,face=1){ if(Array.isArray(fr)) fr=fr[0]; if(!fr) return; ctx.save(); ctx.translate(Math.round(x),Math.round(fy)); ctx.scale(face*s,s); ctx.drawImage(fr,-48,-68); ctx.restore(); }
function csNpc(img,x,fy,s=1,faceRight=false){ if(Array.isArray(img)) img=img[0]; if(!img) return; ctx.save(); ctx.translate(Math.round(x),Math.round(fy)); ctx.scale((faceRight?-1:1)*s,s); ctx.drawImage(img,-32,-72); ctx.restore(); }
function csImg(img,x,fy,s=1,flip=false){ if(Array.isArray(img)) img=img[0]; if(!img) return; ctx.save(); ctx.translate(Math.round(x),Math.round(fy)); ctx.scale((flip?-1:1)*s,s); ctx.drawImage(img,-img.width/2,-img.height); ctx.restore(); }
function csRnd(seed){ let s=seed; return ()=>{ s=(s*16807)%2147483647; return s/2147483647; }; }
function csBolt(x,y,len,seed,wid=4,cols=['rgba(127,211,255,0.35)',PAL.boltC,'#ffffff']){
  const r=csRnd(seed), pts=[[x,y]]; let cx=x, cy=y;
  while(cy<y+len){ cy+=10+r()*16; cx+=(r()-.5)*34; pts.push([Math.round(cx),Math.round(cy)]); }
  ctx.lineJoin='miter'; [[wid+6,cols[0]],[wid,cols[1]],[Math.max(1,wid-2),cols[2]]].forEach(([lw,c])=>{ ctx.strokeStyle=c; ctx.lineWidth=lw; ctx.beginPath(); pts.forEach(([a,b],i)=>i?ctx.lineTo(a,b):ctx.moveTo(a,b)); ctx.stroke(); });
}
function csRain(w,h,t,col='rgba(170,190,220,0.45)',n=70){ ctx.fillStyle=col; for(let i=0;i<n;i++){ const x=((i*97+t*-120)%w+w)%w, y=((i*53+t*620)%(h+40))-20; ctx.fillRect(Math.round(x),Math.round(y),2,12); } }
function csSnow(w,h,t,n=60,wind=-20){ ctx.fillStyle='rgba(255,255,255,0.85)'; for(let i=0;i<n;i++){ const x=((i*131+t*wind+Math.sin(t+i)*8)%w+w)%w, y=((i*71+t*(30+(i%4)*10))%h); ctx.fillRect(Math.round(x),Math.round(y),i%3?2:3,i%3?2:3); } }
function csCap(s,x,y,w,size=13){ const L=wrap(s,w-18,size), lh=size+5, h=L.length*lh+10;
  ctx.fillStyle=PAL.ink; ctx.fillRect(x-3,y-3,w+6,h+6); ctx.fillStyle='#ecd9a2'; ctx.fillRect(x,y,w,h); ctx.fillStyle='#d6bf80'; ctx.fillRect(x,y+h-3,w,3);
  L.forEach((l,i)=>txt(l,x+9,y+6+i*lh,size,PAL.ink,'left',null)); return h; }
function csBub(s,x,y,w,tx,ty,size=13){ const L=wrap(s,w-20,size), lh=size+5, h=L.length*lh+12, down=ty>y+h;
  const bx=Math.max(x+12,Math.min(x+w-28,tx-8)), by=down?y+h:y;
  P(ctx,PAL.ink,[bx-3,by,bx+19,by,tx,ty]);
  ctx.fillStyle=PAL.ink; ctx.fillRect(x-3,y-3,w+6,h+6); ctx.fillRect(x-1,y-5,w+2,h+10);
  ctx.fillStyle='#ffffff'; ctx.fillRect(x,y,w,h); ctx.fillRect(x+2,y-2,w-4,h+4);
  P(ctx,'#ffffff',[bx+1,by+(down?-2:2),bx+15,by+(down?-2:2),tx+(bx+8-tx)*0.25,ty+(down?-5:5)]);
  L.forEach((l,i)=>txt(l,x+10,y+7+i*lh,size,PAL.ink,'left',null)); }
function csSfx(s,x,y,size,col,rot=-0.12){ ctx.save(); ctx.translate(x,y); ctx.rotate(rot);
  ctx.font=`bold ${size}px Menlo, ui-monospace, monospace`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle=PAL.ink; for(const [dx,dy] of [[-3,0],[3,0],[0,-3],[0,3],[3,3],[5,5]]) ctx.fillText(s,dx,dy); ctx.fillStyle=col; ctx.fillText(s,0,0); ctx.restore(); }
function csShard(x,y,s,t){ const g=0.35+Math.sin(t*4)*0.15;
  ctx.fillStyle=`rgba(182,154,224,${g})`; ctx.beginPath(); ctx.arc(x,y,s*2.2,0,7); ctx.fill();
  P(ctx,PAL.ink,[x,y-s*1.6-3,x+s*0.8+3,y,x,y+s*1.6+3,x-s*0.8-3,y]);
  P(ctx,P2.puD,[x,y-s*1.6,x+s*0.8,y,x,y+s*1.6,x-s*0.8,y]); P(ctx,P2.pu,[x,y-s*1.4,x+s*0.55,y,x,y+s*1.2,x-s*0.3,y-s*0.1]);
  P(ctx,P2.puL,[x,y-s*1.2,x+s*0.25,y-s*0.2,x,y+s*0.6,x-s*0.1,y-s*0.2]); ctx.fillStyle='#ffffff'; ctx.fillRect(Math.round(x-s*0.15),Math.round(y-s*0.9),Math.max(2,Math.round(s*0.15)),Math.round(s*0.6)); }
function csLighthouse(x,base,h,lit,t){ const top=base-h;
  for(let y=top+40;y<base;y+=6){ const k=(y-top)/h, w=Math.round(h*0.16+k*h*0.12), band=Math.floor((y-top)/30)%2;
    ctx.fillStyle=band?'#d6ccba':PAL.terraD; ctx.fillRect(Math.round(x-w/2),y,w,6); ctx.fillStyle='rgba(0,0,0,0.12)'; ctx.fillRect(Math.round(x+w/2-w*0.3),y,Math.round(w*0.3),6); }
  ctx.fillStyle=PAL.ink; ctx.fillRect(x-h*0.13,top+34,h*0.26,6); ctx.fillRect(x-h*0.08,top+10,h*0.16,26); ctx.fillRect(x-h*0.1,top+4,h*0.2,8);
  ctx.fillStyle=lit?'#fff3c4':'#5a5466'; ctx.fillRect(x-h*0.06,top+14,h*0.12,18);
  if(lit){ ctx.fillStyle=`rgba(255,236,170,${0.25+Math.sin(t*3)*0.06})`; P(ctx,ctx.fillStyle,[x,top+22,x-900,top-60,x-900,top+140]); ctx.fillStyle='rgba(255,240,190,0.25)'; ctx.beginPath(); ctx.arc(x,top+22,34,0,7); ctx.fill(); }
}
function csCity(x0,x1,gy,seed,cols){ const r=csRnd(seed); let x=x0;
  while(x<x1){ const bw=22+Math.floor(r()*40), bh=30+Math.floor(r()*70); ctx.fillStyle=cols[Math.floor(r()*cols.length)]; ctx.fillRect(x,gy-bh,bw,bh);
    if(r()<0.4){ ctx.beginPath(); ctx.ellipse(x+bw/2,gy-bh,bw/2,bw/2.4,0,Math.PI,0); ctx.fill(); }
    ctx.fillStyle='rgba(0,0,0,0.25)'; for(let wy=gy-bh+10;wy<gy-8;wy+=14) for(let wx=x+5;wx<x+bw-6;wx+=10) ctx.fillRect(wx,wy,4,6);
    x+=bw+Math.floor(r()*6); } }
function csHand(x,y,s){ // open hand van onderen, palm omhoog
  ctx.fillStyle=PAL.ink; ctx.fillRect(x-s*5-3,y-3,s*10+6,s*9+6);
  ctx.fillStyle=PAL.skinD; ctx.fillRect(x-s*5,y,s*10,s*9); ctx.fillStyle=PAL.skin; ctx.fillRect(x-s*4,y,s*8,s*6);
  for(let i=0;i<4;i++){ ctx.fillStyle=PAL.ink; ctx.fillRect(x-s*5+i*s*2.6-2,y-s*4-2,s*2+4,s*4+4); ctx.fillStyle=PAL.skin; ctx.fillRect(x-s*5+i*s*2.6,y-s*4,s*2,s*4); }
  ctx.fillStyle=PAL.ink; ctx.fillRect(x+s*5-2,y+s*1-2,s*4+4,s*2+4); ctx.fillStyle=PAL.skin; ctx.fillRect(x+s*5,y+s*1,s*4,s*2);
  ctx.fillStyle=PAL.robe; ctx.fillRect(x-s*6,y+s*9,s*12,s*8); ctx.fillStyle=PAL.ink; ctx.fillRect(x-s*6,y+s*9,s*12,3); }
function csStats(w,h){ const m=Math.floor((GAME.finalTime||0)/60), s=Math.floor((GAME.finalTime||0)%60), tx=`WERELD ${WORLD} VOLTOOID · Tijd ${m}:${String(s).padStart(2,'0')} · Scherven ${GAME.finalShards||0}/${SHARDS_TOTAL}`;
  ctx.font='bold 11px Menlo, ui-monospace, monospace'; const tw=ctx.measureText(tx).width+18;
  ctx.fillStyle=PAL.ink; ctx.fillRect(w-tw-8,h-28,tw,22); txt(tx,w-17,h-24,11,PAL.goldL,'right',null); }
function csPines(x0,x1,gy,seed,col){ const r=csRnd(seed); for(let x=x0;x<x1;x+=14+Math.floor(r()*24)){ const ph=30+r()*40; ctx.fillStyle=col; P(ctx,col,[x,gy-ph,x+ph*0.32,gy,x-ph*0.32,gy]); } }
function csPeaks(w,gy,seed,col,hmax,snow){ const r=csRnd(seed); let x=-40; while(x<w+40){ const pw=90+r()*140, ph=hmax*(0.5+r()*0.5);
    P(ctx,col,[x,gy,x+pw/2,gy-ph,x+pw,gy]); if(snow) P(ctx,snow,[x+pw/2-pw*0.12,gy-ph*0.76,x+pw/2,gy-ph,x+pw/2+pw*0.12,gy-ph*0.76,x+pw/2+pw*0.04,gy-ph*0.8,x+pw/2-pw*0.05,gy-ph*0.72]); x+=pw*0.6; } }
function csPurpleSky(w,y0,y1,t){ for(let i=0;i<6;i++){ const yy=y0+(y1-y0)*i/6; ctx.fillStyle=`rgba(122,90,184,${0.18+i*0.05})`; ctx.fillRect(0,yy,w,(y1-y0)/6+1); }
  ctx.fillStyle='rgba(182,154,224,0.35)'; for(let i=0;i<5;i++){ const x=((i*230+t*12)%(w+200))-100; ctx.beginPath(); ctx.ellipse(x,y0+(y1-y0)*0.4+(i%2)*14,90,16,0,0,7); ctx.fill(); } }

/* ---------- de verhalen ---------- */
const CUTS={
  /* WERELD 1 · begin */
  w1in:{layout:'wide',panels:[
    (w,h,t)=>{ csBands(w,h,['#141a30','#1b2340','#232c4c','#2c3558']);
      const fl=(t%2.6)<0.14||(t%2.6>0.3&&t%2.6<0.38); if(fl){ ctx.fillStyle='rgba(200,220,255,0.18)'; ctx.fillRect(0,0,w,h); }
      ctx.fillStyle='#232032'; P(ctx,'#232032',[w-360,h-60,w-300,96,w,70,w,h]); csCity(w-310,w-60,104,9,['#2d2a3d','#35314a']);
      csLighthouse(w-50,110,80,false,t);
      for(let i=0;i<4;i++){ ctx.fillStyle=['#1d2a44','#22324f','#2a3b5a','#1a2640'][i]; ctx.fillRect(0,h-64+i*16,w,16); }
      ctx.fillStyle='rgba(200,220,255,0.25)'; for(let i=0;i<30;i++){ const x=((i*67+t*30)%w), y=h-60+(i%4)*16; ctx.fillRect(Math.round(x),y,14,2); }
      const bx=250, by=h-58+Math.round(Math.sin(t*2)*3);
      ctx.fillStyle=PAL.ink; P(ctx,PAL.ink,[bx-46,by-4,bx+50,by-4,bx+38,by+12,bx-36,by+12]); P(ctx,PAL.woodD,[bx-42,by-2,bx+46,by-2,bx+36,by+9,bx-33,by+9]);
      csImg(OBJ.sail,bx+12,by-2); csMilo(MILO.idle[0],bx-14,by-2,1,1);
      if(fl){ csBolt(w*0.45,0,h-80,7+Math.floor(t/2.6)*13,4); }
      csRain(w,h,t);
      csCap('Milo reisde al jaren met de storm mee. Waar hij kwam, kwam het onweer.',14,14,330);
      csCap('Deze keer bracht de storm hem naar Aurelis.',w-360,h-50,300); },
    (w,h,t)=>{ csBands(w,h,['#8a7a68','#b39a76','#d2b688','#e4cfa2']);
      ctx.fillStyle='rgba(255,250,235,0.35)'; ctx.beginPath(); ctx.arc(w*0.66,78,46,0,7); ctx.fill(); ctx.fillStyle='#f6eedb'; ctx.beginPath(); ctx.arc(w*0.66,78,22,0,7); ctx.fill();
      ctx.fillStyle='rgba(120,100,80,0.5)'; ctx.fillRect(w*0.66-30,70,60,4);
      ctx.fillStyle=PAL.stoneD; P(ctx,PAL.stoneD,[0,h,0,170,40,150,w,140,w,h]); csCity(0,w,152,21,[PAL.stone,PAL.stoneM,PAL.stoneD,'#c7b79c']);
      csCap('Aurelis, de zonnestad. Hun zon werd elke dag zwakker.',10,h-58,w-20); },
    (w,h,t)=>{ csBands(w,h,['#c9c1b2','#ddd2bd','#e8dcc4']); ctx.fillStyle='#9fb3bf'; ctx.fillRect(0,128,w,40);
      csTiles(TILE1,0,w,h-56,h,'sandTop','sand');
      csMilo(MILO.idle[0],62,h-56,1,1); csNpc(NPCSPR.fisher,w-70,h-56,1,false); csNpc(NPCSPR.kid,w-128,h-56,1,true);
      csBub('Hou die vonken bij je, tovenaar.',w-210,70,190,w-80,h-120,12);

      for(let i=0;i<10;i++){ const a=i/10*6.28+t*0.4; ctx.strokeStyle='#ffffff'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(w/2+Math.cos(a)*40,h*0.4+Math.sin(a)*40); ctx.lineTo(w/2+Math.cos(a)*(90+t*30),h*0.4+Math.sin(a)*(90+t*30)); ctx.stroke(); }
      csSfx('KRAK',w-110,24,30,'#5a3a28',0.1);
      csCap('Het stormoog brak.',10,h-40,w-20,12); },
    (w,h,t)=>{ csBands(w,h,['#e8dcc4','#d8c4a0','#b89a6e']);
      const y=Math.min(h-40,30+t*70); csMilo(ISASPR.air,w*0.5,y+60,1.4,1);
      csClouds6(w,h-30,4,'#f6efe2');
      csCap('Isa viel. Ze riep niets. Ze glimlachte.',10,10,w-20,12); },
    (w,h,t)=>{ csBands(w,h,['#e6d2a6','#cfb07a','#a8875c']);
      const k=Math.min(1,t*0.7); csImg(MOM.fly[Math.floor(t*4)%2],w*0.5,h*0.3+k*h*0.7+60,0.55,false);
      csClouds6(w,h-30,8,'#f6efe2');
      csCap('Toen dook de moeder. Recht omlaag, de wolken in. Niemand zag waarom.',10,10,w-20,11); },
    (w,h,t)=>{ csBands(w,h,['#9fc8e0','#c4dcea','#e8eef0']); csClouds6(w,h-30,5,'#ffffff');
      csMilo(MILO.idle[0],w*0.42,h-30,1,1); csNpc(NPCSPR.lyra,w*0.32,h-30,1,true); csBaby6(w*0.5,h-110,0.8,t);
      csBub('We wachten.',w*0.55,14,w*0.3,w*0.42,h-100,12);
      csEnd6(w,h,t); csScore6(w,h,' · de laatste ronde blijft open'); }
  ]}
});

<script>/* js/main.js */
// main.js — spelstatus, camera, tekenen, HUD, dialogen en altaarmenu
const cv=document.getElementById('game'), ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const GAME={state:'title',mode:'play',time:0,sun:0.5,sunTarget:0.5,cam:{x:0,y:100},hints:{},banner:null,toastMsg:'',toastT:0,fade:0,winT:0,area:'',areaT:0};
let BACK=[], HEART=null, HEARTE=null, BACKTILE=null;
const NAMES={tab1:'Gedenksteen',tab2:'Gedenksteen',tab3:'Gedenksteen',lyra:'Lyra',lyra2:'Lyra',fisher:'Visser Doran',elder:'Oudste Helion',kid:'Pip',baker:'Bakker Rosa'};

function toast(m){ GAME.toastMsg=m; GAME.toastT=3.2; }
function hint(key,m,force){ if(GAME.hints[key]&&!force) return; GAME.hints[key]=true; toast(m); }

function setup(){
  buildAllArt(); buildBossArt(); buildW2Art(); buildW3Art(); buildW4Art(); buildW5Art(); buildW6Art();
  HEART=sprite(20,18,g=>{ E(g,PAL.pink,6,6,5,5); E(g,PAL.pink,14,6,5,5); P(g,PAL.pink,[1,7,19,7,10,17]); R(g,'#c9707a',4,3,3,2); });
  HEARTE=sprite(20,18,g=>{ E(g,'#8a7f74',6,6,5,5); E(g,'#8a7f74',14,6,5,5); P(g,'#8a7f74',[1,7,19,7,10,17]); });
  BACKTILE=mk(32,32); const b=BACKTILE.getContext('2d'); b.drawImage(TILE.stone[1],0,0); b.fillStyle='rgba(120,80,60,0.38)'; b.fillRect(0,0,32,32);
  newGame(); GAME.hasSave=hasSave();
}
function newGame(keep){
  applyWorldTiles();
  buildLevel(); GATE4_LOCKED=false; spawnEntities(); resetCompanion();
  if(!keep) PL.maxHp=5; resetPlayer(GAME.start.x,GAME.start.y); if(!keep) initPlayerSpells();
  Object.assign(GAME,{mode:'play',dying:null,checkpoint:{...GAME.start},checkpointAltar:null,sun:WORLD===2?1:0.5,sunTarget:WORLD===2?1:0.5,hints:{},banner:null,winT:0,time:0,seenAltar:false});
  GAME.cam.x=0; GAME.cam.y=100;
  BACK=[...Array(LH)].map(()=>Array(LW).fill(false));
  if(WORLD!==6)   for(let x=0;x<LW;x++){ let seen=false; for(let y=0;y<LH;y++){ const c=MAP[y][x]; if('#SCLGbFfY'.includes(c)) seen=true; else if(seen&&(c==='.'||c==='B'||c==='H')) BACK[y][x]=true; } }
}

/* ---------- update ---------- */
function step(dt){
  GAME.time+=dt;
  if(GAME.state==='title'){
    const tip='A/D of ←/→ lopen · W, Spatie of ↑ springen · [J] staf · [K]/[L] spreuken · [E] praten';
    if(pressed('w2')){ WORLD=1; newGame(); PL.unlocked=['bolt','blink','clap']; PL.slots=['bolt','blink']; GAME.finalShards=0; GAME.finalTime=0; startWorld2(); GAME.hasSave=true; playCut('w2in',()=>{ GAME.state='play'; }); clearPress(); return; }
    if(pressed('w6')){ WORLD=1; newGame(); PL.unlocked=['bolt','blink','clap','shield','grip','leap','charge','form']; PL.slots=['shield','form']; PL.maxHp=9; GAME.w3={race:'milo',duel:true,top:true,score:[17,16]}; startWorld6(); GAME.hasSave=true; playCut('w6in',()=>{ GAME.state='play'; }); clearPress(); return; }
    if(pressed('w5')){ WORLD=1; newGame(); PL.unlocked=['bolt','blink','clap','shield','grip','leap','charge']; PL.slots=['bolt','leap']; PL.maxHp=8; GAME.w3={race:'milo',duel:true,top:true,score:[16,15]}; startWorld5(); GAME.hasSave=true; playCut('w5in',()=>{ GAME.state='play'; }); clearPress(); return; }
    if(pressed('w4')){ WORLD=1; newGame(); PL.unlocked=['bolt','blink','clap','shield','grip','leap']; PL.slots=['bolt','leap']; PL.maxHp=7; GAME.w3={race:'milo',duel:true,top:true,score:[15,14]}; startWorld4(); GAME.hasSave=true; playCut('w4in',()=>{ GAME.state='play'; }); clearPress(); return; }
    if(pressed('w3')){ WORLD=1; newGame(); PL.unlocked=['bolt','blink','clap','shield','grip']; PL.slots=['bolt','shield']; PL.maxHp=6; startWorld3(); GAME.hasSave=true; playCut('w3in',()=>{ GAME.state='play'; }); clearPress(); return; }
    if(GAME.hasSave){
      if(pressed('ok')){ if(loadGame()){ GAME.state='play'; toast('Verder bij het laatste Stormaltaar.'); } else { GAME.hasSave=false; } }
      else if(pressed('new')){ clearSave(); GAME.hasSave=false; newGame(); playCut('w1in',()=>{ GAME.state='play'; GAME.time=0; toast(tip); }); }
    } else if(pressed('ok')||pressed('jump')){ playCut('w1in',()=>{ GAME.state='play'; GAME.time=0; toast(tip); }); }
    clearPress(); return; }
  if(GAME.state==='cut'){ cutStep(dt); clearPress(); return; }
  if(pressed('mute')){ MUTED=!MUTED; toast(MUTED?'Geluid uit':'Geluid aan'); }
  if(GAME.dying){
    // doodsequentie: wereld staat stil, Milo zakt in elkaar, beeld wordt donker en komt terug bij het altaar
    const D=GAME.dying; D.t-=dt;
    if(!D.done){ PL.vy=Math.min(600,PL.vy+900*dt); PL.y+=PL.vy*dt*0.4; if(PL.vy>0) PL.vy*=0.9; }
    for(const p of PARTS){ p.life-=dt; p.vy+=(p.g||0)*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; } PARTS=PARTS.filter(p=>p.life>0);
    if(D.t<0.9&&!D.done){ D.done=true; respawnAfterDeath(); GAME.cam.x=Math.max(0,Math.min(LW*T-VW,PL.x-VW/2)); GAME.cam.y=Math.max(0,Math.min(LH*T-VH,PL.y-300)); }
    if(D.t<=0){ GAME.dying=null; compBark('Rustig. Nog een keer.',2.5); }
    SHAKE=0; clearPress(); return;
  }
  if(GAME.mode==='dialog') updateDialog(dt);
  else if(GAME.mode==='menu') updateMenu();
  else {
    if(pressed('act')&&GAME.mode==='play'){
      const n=NPCS.find(n=>n.near), a=ALTARS.find(a=>a.near);
      if(n) openDialog(n); else if(COMP.active&&COMP.near) openDialog(lyraDialog()); else if(a) openMenu();
    }
    const ly=NPCS.find(n=>n.id==='lyra'&&!n.talked);
    if(ly && PL.x>ly.x+5*T && GAME.mode==='play'){ PL.vx=0; openDialog(ly); }
    if(GAME.mode==='count') w3Count(dt);
    updatePlayer(dt); updateEntities(dt); updateNPCs(dt); updateCompanion(dt);
  }
  if(GAME.banner){ GAME.banner.t-=dt; if(GAME.banner.t<=0) GAME.banner=null; }
  GAME.toastT-=dt; GAME.fade=Math.max(0,GAME.fade-dt); GAME.areaT-=dt;
  GAME.sun+=(GAME.sunTarget-GAME.sun)*dt*0.8;
  if(GAME.winT>0){ GAME.winT-=dt; if(GAME.winT<=0){ GAME.finalTime=GAME.time; GAME.finalShards=shardCount(); if(WORLD===6){ clearSave(); GAME.hasSave=false; } endWorldCut(); } }
  GAME.savedT=(GAME.savedT||0)-dt;
  const a=areaName(PL.x/T); if(a!==GAME.area){ GAME.area=a; GAME.areaT=3; }
  // camera
  const c=GAME.cam; let tx=PL.x+PL.w/2-VW/2+PL.face*70, ty=PL.y-300;
  if(BOSS&&BOSS.active&&BOSS.state!=='dead') tx=Math.max(ARENA.x0-2*T,tx);
  if(WORLD===2) tx=w2Cam(tx);
  if(WORLD===3) tx=w3Cam(tx);
  if(WORLD===4) tx=w4Cam(tx);
  if(WORLD===5) tx=w5Cam(tx);
  if(WORLD===6) tx=w6Cam(tx);
  c.x+=(tx-c.x)*Math.min(1,dt*5); c.y+=(ty-c.y)*Math.min(1,dt*5);
  c.x=Math.max(0,Math.min(LW*T-VW,c.x)); c.y=Math.max(0,Math.min(LH*T-VH,c.y));
  SHAKE=Math.max(0,SHAKE-dt*30);
  clearPress();
}
function areaName(x){ if(WORLD===6) return areaName6(x); if(WORLD===5) return areaName5(x); if(WORLD===4) return areaName4(x); if(WORLD===3) return areaName3(x); if(WORLD===2) return areaName2(x); return x<38?'Zilverstrand':x<101?'Oude Haven':x<158?'Benedenstad':x<213?'Daken van Aurelis':x<257?'Bakkershal':'De Vuurtoren'; }

/* ---------- dialoog ---------- */
let DLG=null;
function openDialog(n){ DLG={n,lines:n.lines||DIALOG[n.id],i:0,c:0}; GAME.mode='dialog'; n.talked=true; }
function updateDialog(dt){
  const line=DLG.lines[DLG.i]; const prev=Math.floor(DLG.c); DLG.c=Math.min(line.length,DLG.c+dt*55); if(Math.floor(DLG.c)!==prev&&prev%3===0) SFX.talk();
  if(pressed('act')||pressed('ok')||pressed('jump')||pressed('staff')){
    if(DLG.c<line.length) DLG.c=line.length;
    else { DLG.i++; DLG.c=0; if(DLG.i>=DLG.lines.length){ const n=DLG.n; GAME.mode='play'; DLG=null; if(n.onEnd) n.onEnd(); if(n.id==='lyra'&&!COMP.active&&NPCS.includes(n)) joinCompanion(n); } }
  }
}
/* ---------- altaarmenu ---------- */
let MENU={cur:0};
function openMenu(){ GAME.mode='menu'; MENU.cur=0; PL.vx=0; SFX.sw(); }
function updateMenu(){
  const u=PL.unlocked;
  if(pressed('left')||pressed('up')) MENU.cur=(MENU.cur+u.length-1)%u.length;
  if(pressed('right')||pressed('down')) MENU.cur=(MENU.cur+1)%u.length;
  const put=i=>{ const id=u[MENU.cur], o=PL.slots.indexOf(id); if(o===i) return; if(o>=0) PL.slots[o]=PL.slots[i]; PL.slots[i]=id; SFX.sw(); };
  if(pressed('s1')) put(0); if(pressed('s2')) put(1);
  if(pressed('act')||pressed('esc')||pressed('ok')) { GAME.mode='play'; }
}

/* ---------- tekenen ---------- */
function txt(s,x,y,size,col,align='left',sh=PAL.ink){
  ctx.font=`bold ${size}px Menlo, "SF Mono", ui-monospace, monospace`; ctx.textAlign=align; ctx.textBaseline='top';
  if(sh){ ctx.fillStyle=sh; ctx.fillText(s,x+2,y+2); } ctx.fillStyle=col; ctx.fillText(s,x,y);
}
function wrap(s,maxW,size){ ctx.font=`bold ${size}px Menlo, ui-monospace, monospace`; const w=s.split(' '), out=[]; let l='';
  for(const word of w){ const t=l?l+' '+word:word; if(ctx.measureText(t).width>maxW){ out.push(l); l=word; } else l=t; } if(l) out.push(l); return out; }
function panel(x,y,w,h,fill='#ece2cf'){
  ctx.fillStyle=PAL.ink; ctx.fillRect(x-3,y-3,w+6,h+6); ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);
  ctx.fillStyle='rgba(143,101,39,0.85)'; ctx.fillRect(x,y,w,3); ctx.fillStyle='rgba(0,0,0,0.08)'; ctx.fillRect(x,y+h-5,w,5);
}

function drawSky(cx,cy){
  const s=GAME.sun;
  const g=ctx.createLinearGradient(0,0,0,360);
  g.addColorStop(0,mix('#5a5768','#7aa3bd',s)); g.addColorStop(0.65,mix('#a88a78','#cdd6cf',s)); g.addColorStop(1,mix('#d39d70','#ecd9b2',s));
  ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
  // zon
  const sx=700-cx*0.02, sy=110-cy*0.1, r=34+30*s;
  for(let i=4;i>0;i--){ ctx.fillStyle=`rgba(240,${170+i*10},110,${0.06*s+0.03})`; ctx.beginPath(); ctx.arc(sx,sy,r+i*18,0,7); ctx.fill(); }
  ctx.save(); ctx.translate(sx,sy); ctx.rotate(GAME.time*0.1); ctx.fillStyle=`rgba(240,200,130,${0.12+0.3*s})`;
  for(let i=0;i<12;i++){ ctx.rotate(Math.PI/6); ctx.fillRect(r+6,-3,14+10*s,6); } ctx.restore();
  ctx.fillStyle=mix('#c98a52','#f3d27a',s); ctx.beginPath(); ctx.arc(sx,sy,r,0,7); ctx.fill();
  ctx.fillStyle=mix('#d9a26a','#f8e2a8',s); ctx.beginPath(); ctx.arc(sx-r*0.3,sy-r*0.3,r*0.4,0,7); ctx.fill();
  // wolken
  for(let i=0;i<7;i++){ const x=((i*310-cx*0.06+GAME.time*6)%2200+2200)%2200-200, y=50+(i*53)%120-cy*0.08;
    ctx.fillStyle='rgba(214,200,186,0.55)'; [[0,0,40],[34,-10,30],[64,4,34],[30,10,40]].forEach(([dx,dy,rr])=>{ ctx.beginPath(); ctx.ellipse(x+dx,y+dy,rr,rr*0.55,0,0,7); ctx.fill(); }); }
  // verre eilanden
  const fy=200-cy*0.15, fo=-((cx*0.1)%1400);
  ctx.drawImage(BGART.far,fo,fy); ctx.drawImage(BGART.far,fo+1400,fy);
  // zee
  const sy2=Math.round(338-cy*0.2);
  const sg=ctx.createLinearGradient(0,sy2,0,VH); sg.addColorStop(0,mix('#5f7d80',PAL.sea,s)); sg.addColorStop(1,PAL.seaD);
  ctx.fillStyle=sg; ctx.fillRect(0,sy2,VW,VH-sy2);
  ctx.fillStyle='rgba(220,214,200,0.3)';
  for(let i=0;i<40;i++){ const x=((i*137-cx*0.2+Math.sin(GAME.time+i)*10)%VW+VW)%VW, y=sy2+6+(i*29)%180; ctx.fillRect(Math.round(x),y,10+(i%3)*6,2); }
  // stad
  const my=Math.round(195-cy*0.3+Math.max(0,1600-cx)*0.16), mo=-((cx*0.3)%1600);
  ctx.drawImage(BGART.mid,Math.round(mo),my); ctx.drawImage(BGART.mid,Math.round(mo)+1600,my);
  for(let i=0;i<4;i++){ const wx0=200+i*400; for(const off of [0,1600]){ const wx=Math.round(mo+off+wx0); if(wx<-60||wx>VW+60) continue;
      const wy=my+150-Math.sin(wx0/260)*60-Math.sin(wx0/90)*12-36; drawMill(wx,wy); } }
}
function drawMill(x,y){
  ctx.fillStyle='#d9cfbd'; ctx.fillRect(x-8,y,16,40); ctx.fillStyle='#bcb09b'; ctx.fillRect(x+4,y,4,40);
  ctx.fillStyle=PAL.terra; ctx.beginPath(); ctx.moveTo(x-10,y); ctx.lineTo(x+10,y); ctx.lineTo(x,y-12); ctx.fill();
  ctx.save(); ctx.translate(x,y-2); ctx.rotate(GAME.time*(0.6+GAME.sun)); for(let k=0;k<4;k++){ ctx.rotate(Math.PI/2); ctx.fillStyle=PAL.woodD; ctx.fillRect(0,-1,30,2); ctx.fillStyle=k%2?'#cfc4b0':'#9c8f7c'; ctx.fillRect(8,1,k%2?22:14,7); } ctx.restore();
}
function mix(a,b,t){ const A=hexRGB(a),B=hexRGB(b); return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')})`; }

function drawLighthouse(cx,cy){
  const bx=288*T-cx, top=1.5*T-cy, base=16*T-cy;
  if(bx>VW+200||bx<-300) return;
  for(let y=top+60;y<base;y+=8){ const t=(y-top)/(base-top), w=96+t*70, band=Math.floor((y-top)/48)%2;
    ctx.fillStyle=band?'#d6ccba':PAL.terraD; ctx.fillRect(Math.round(bx-w/2),Math.round(y),Math.round(w),8);
    ctx.fillStyle='rgba(0,0,0,0.08)'; ctx.fillRect(Math.round(bx+w/2-w*0.25),Math.round(y),Math.round(w*0.25),8); }
  ctx.fillStyle=PAL.ink; ctx.fillRect(bx-62,top+52,124,10);
  ctx.fillStyle=PAL.bronzeD; ctx.fillRect(bx-44,top+6,88,48);
  const glow=GAME.sun;
  ctx.fillStyle=mix('#8c7a5a','#fff3b0',glow); ctx.fillRect(bx-36,top+12,72,38);
  if(glow>0.6){ ctx.fillStyle=`rgba(255,240,160,${(glow-0.6)*0.6})`; ctx.beginPath(); ctx.moveTo(bx,top+30); ctx.lineTo(bx-600,top-60); ctx.lineTo(bx-600,top+140); ctx.fill(); }
  ctx.fillStyle=PAL.terraD; ctx.beginPath(); ctx.moveTo(bx-52,top+8); ctx.lineTo(bx+52,top+8); ctx.lineTo(bx,top-30); ctx.fill();
}

function drawTiles(cx,cy){
  const x0=Math.max(0,Math.floor(cx/T)), x1=Math.ceil((cx+VW)/T), y0=Math.max(0,Math.floor(cy/T)), y1=Math.ceil((cy+VH)/T);
  for(let ty=y0;ty<=y1&&ty<LH;ty++) for(let tx=x0;tx<=x1&&tx<LW;tx++){
    const c=MAP[ty][tx], X=tx*T-cx, Y=ty*T-cy, v=(tx*7+ty*13)%4;
    if(BACK[ty]&&BACK[ty][tx]) ctx.drawImage(BACKTILE,X,Y);
    if(c==='.') continue;
    const above=ty>0?MAP[ty-1][tx]:'.', open=!'#SCLGFfYQIK'.includes(above);
    if(WORLD===2&&w2Tile(c,X,Y,open)) continue;
    if(WORLD===3&&w3Tile(c,X,Y,open)) continue;
    if(WORLD===4&&w4Tile(c,X,Y,open)) continue;
    if(WORLD===5&&w5Tile(c,X,Y,open)) continue;
    if(WORLD===6&&(c==='F'||c==='f')){ ctx.drawImage(TILE.crack,X,Y); continue; }
    if(c==='#') ctx.drawImage(open?TILE.stoneTop[v]:TILE.stone[v],X,Y);
    else if(c==='S') ctx.drawImage(open?TILE.sandTop[v%3]:TILE.sand[v%3],X,Y);
    else if(c==='-') ctx.drawImage(TILE.plank,X,Y);
    else if(c==='b') ctx.drawImage(TILE.bridge,X,Y);
    else if(c==='D'){ ctx.globalAlpha=0.28+Math.sin(GAME.time*3)*0.08; ctx.drawImage(TILE.bridge,X,Y); ctx.globalAlpha=1; }
    else if(c==='B') ctx.drawImage(TILE.bars,X,Y);
    else if(c==='C') ctx.drawImage(TILE.crack,X,Y);
    else if(c==='F'||c==='f'){ ctx.drawImage(c==='f'?(open?TILE.sandTop[v%3]:TILE.sand[v%3]):(open?TILE.stoneTop[v]:TILE.stone[v]),X,Y); ctx.fillStyle='rgba(34,26,43,0.35)'; ctx.fillRect(X+9,Y+13,1,6); ctx.fillRect(X+10,Y+18,4,1); ctx.fillRect(X+21,Y+8,1,4); }
    else if(c==='G') ctx.drawImage(TILE.gate,X,Y);
    else if(c==='H'){ if(GATE4_LOCKED) ctx.drawImage(TILE.gate,X,Y); }
    else if(c==='L'){ ctx.drawImage(TILE.stone[v],X,Y); ctx.drawImage(OBJ.sentinel,X,Y); }
    else if(c==='~'){ ctx.fillStyle='rgba(47,196,201,0.88)'; ctx.fillRect(X,Y,T,T); if(above!=='~'){ ctx.fillStyle=PAL.seaL; for(let i=0;i<4;i++){ const o=Math.round(Math.sin(GAME.time*3+tx+i)*2); ctx.fillRect(X+i*8,Y+o,6,3); } } ctx.fillStyle='rgba(26,143,166,0.6)'; ctx.fillRect(X,Y+20,T,12); }
  }
}
function drawBeams(cx,cy){
  for(const b of BEAMS){ const X=b.x-cx, Y=b.y-cy; if(X<-40||X>VW+40) continue;
    const f=Math.sin(GAME.time*12)*2;
    ctx.fillStyle='rgba(255,236,150,0.35)'; ctx.fillRect(X-6-f,Y,b.w+12+f*2,b.h);
    ctx.fillStyle='rgba(255,246,200,0.85)'; ctx.fillRect(X,Y,b.w,b.h); ctx.fillStyle='#ffffff'; ctx.fillRect(X+5,Y,6,b.h);

    ctx.imageSmoothingEnabled=false;
    if(GAME.state==='title') drawTitle();
    else if(GAME.state==='cut') drawCut();
    else { drawWorld(); drawHUD(); }
    if(ERR){ console.error(ERR); ctx.fillStyle='rgba(34,26,43,0.7)'; ctx.fillRect(0,VH-70,VW,18); txt('fout: '+String(ERR.message||ERR).slice(0,90),8,VH-69,11,'#e6dcc8','left',null); }
  }catch(e){ console.error(e); ERR=e; }
  requestAnimationFrame(frame);
}
setup(); requestAnimationFrame(frame);
</script>
<script>document.getElementById('game').focus();</script>
</body>
