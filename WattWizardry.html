<script>/* js/art.js */
// art.js — alle pixel-art wordt hier procedureel opgebouwd, daarna "gecrispt" (geen anti-aliasing) en voorzien van een outline.
const PAL = {
  ink:'#221a2b',
  robeD:'#1a2045', robe:'#2c3768', robeL:'#47568f',
  gold:'#c99a45', goldD:'#8f6527', goldL:'#e6c57e',
  skin:'#e3b691', skinD:'#bf8b69', hair:'#d9d4c8', hairD:'#a9a397', blush:'#c98b74',
  bolt:'#f4fbff', boltC:'#7fd3ff', boltD:'#3a8de0',
  stone:'#ddd2bf', stoneM:'#cfc2ab', stoneD:'#a8977d', mortar:'#b6a58a',
  terra:'#a95a3e', terraD:'#733a28', terraL:'#c47857',
  sand:'#d2b98a', sandD:'#b39a68', sandL:'#e1cda3',
  wood:'#8a5a36', woodD:'#5c3a22', woodL:'#a8774c',
  bronze:'#9c6a36', bronzeD:'#583619', bronzeL:'#c08a4f', bronzeLL:'#e0b677',
  sea:'#3d8a92', seaD:'#24586a', seaL:'#7ab8b4',
  leaf:'#7a8a4f', leafD:'#55613a', pink:'#a8424f', boot:'#5a3b2b', bootD:'#3f281d'
};

function mk(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function hexRGB(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function crisp(c, outline){
  const x=c.getContext('2d'), W=c.width, H=c.height;
  const d=x.getImageData(0,0,W,H), p=d.data;
  for(let i=3;i<p.length;i+=4) p[i] = p[i]>110 ? 255 : 0;
  if(outline){
    const o=hexRGB(outline), a=new Uint8ClampedArray(p);
    for(let y=0;y<H;y++) for(let X=0;X<W;X++){
      const i=(y*W+X)*4; if(a[i+3]) continue;
      if((X>0&&a[i-1])||(X<W-1&&a[i+7])||(y>0&&a[i-W*4+3])||(y<H-1&&a[i+W*4+3])){
        p[i]=o[0]; p[i+1]=o[1]; p[i+2]=o[2]; p[i+3]=255;
      }
    }
  }
  x.putImageData(d,0,0); return c;
}
function sprite(w,h,fn,outline=PAL.ink){ const c=mk(w,h), g=c.getContext('2d'); fn(g); return crisp(c,outline); }
function R(g,c,x,y,w,h){ g.fillStyle=c; g.fillRect(x,y,w,h); }
function E(g,c,cx,cy,rx,ry){ g.fillStyle=c; g.beginPath(); g.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); g.fill(); }
function P(g,c,pt){ g.fillStyle=c; g.beginPath(); g.moveTo(pt[0],pt[1]); for(let i=2;i<pt.length;i+=2) g.lineTo(pt[i],pt[i+1]); g.closePath(); g.fill(); }
let SEED=1;
function rnd(){ SEED=(SEED*16807)%2147483647; return (SEED-1)/2147483646; }

/* ---------- MILO ---------- */
function staff(g,hx,hy,a){
  g.save(); g.translate(hx,hy); g.rotate(a);
  R(g,PAL.woodD,-1.5,-24,3,38); R(g,PAL.woodL,-1.5,-24,1,36);
  P(g,PAL.gold,[-5,-24,5,-24,3,-21,-3,-21]);
  P(g,PAL.boltC,[0,-37,5,-30,0,-23,-5,-30]); P(g,PAL.bolt,[0,-35,2,-30,0,-27,-2,-31]);
  g.restore();
}
function drawMilo(g,o){
  g.translate(16,6);
  const leg=o.leg||0, bob=o.bob||0, pose=o.pose||'idle', sw=o.sw||0;
  // laarzen
  if(o.air){
    R(g,PAL.robeD,24,50,6,6); R(g,PAL.boot,22,54,9,5);
    R(g,PAL.robeD,35,49,6,5); R(g,PAL.boot,34,52,9,5);
  } else {
    const bB=28-leg*6, bF=35+leg*6;
    R(g,PAL.robeD,bB-3,52,6,6); R(g,PAL.bootD,bB-4,57,9,5);
    R(g,PAL.robeD,bF-3,52,6,6); R(g,PAL.boot,bF-3,57,9,5);
  }
  g.save(); g.translate(0,bob);
  // sjaal
  P(g,PAL.goldD,[26,35,14,38+sw,6,43+sw,11,44+sw,20,41,27,40]);
  P(g,PAL.gold,[26,34,15,36+sw,7,41+sw,12,41+sw,21,38,28,37]);
  // achterste arm
  E(g,PAL.robeD,25,41,3.5,6);
  // gewaad
  P(g,PAL.robe,[23,34,41,34,46,57,18,57]);
  P(g,PAL.robeD,[37,34,41,34,46,57,39,57]);
  P(g,PAL.robeL,[23,34,26,34,23,57,18,57]);
  R(g,PAL.gold,18,55,28,2);
  P(g,PAL.gold,[33,36,36,36,32,44,36,44,29,54,31,46,28,46]);
  // hoofd
  E(g,PAL.hair,26,25,6,7);
  E(g,PAL.skin,33,26,9,8.5);
  E(g,PAL.hair,25,29,3,5);
  P(g,PAL.hair,[24,19,41,19,39,23,35,22,31,24,27,22]);
  if(pose==='hurt'){ R(g,PAL.ink,34,27,3,1); R(g,PAL.ink,38,27,3,1); }
  else {
    R(g,PAL.ink,35,25,2,3); R(g,PAL.ink,39,25,2,3);
    R(g,PAL.hairD,34,23,4,1); R(g,PAL.hairD,38,23,4,1);
  }
  R(g,PAL.skinD,41,27,1,3); R(g,PAL.skinD,37,31,3,1);
  // hoed
  E(g,PAL.robeD,32,19,17,3.5);
  P(g,PAL.robe,[21,18,43,18,35,6]);
  P(g,PAL.robe,[31,11,37,6,30,2,21,1,26,5]);
  P(g,PAL.robeL,[23,17,27,17,33,8,31,9]);
  g.save(); g.beginPath(); g.moveTo(21,18); g.lineTo(43,18); g.lineTo(35,6); g.closePath(); g.clip();
  R(g,PAL.gold,20,13,26,3); g.restore();
  E(g,PAL.goldL,22,1.5,2,2);
  // voorste arm + staf
  if(pose==='cast'){ P(g,PAL.robe,[33,36,38,34,47,37,47,41,35,42]); staff(g,48,39,1.35); E(g,PAL.skin,48,39,3,3); }
  else if(pose==='swing'){ P(g,PAL.robe,[33,36,38,34,45,40,44,44,35,43]); staff(g,45,43,2.2); E(g,PAL.skin,45,43,3,3); }
  else if(pose==='up'){ P(g,PAL.robe,[34,37,38,33,43,30,45,33,38,41]); staff(g,43,31,-0.15); E(g,PAL.skin,43,31,3,3); }
  else if(pose==='slam'){ P(g,PAL.robe,[34,37,39,35,42,44,38,46,34,42]); staff(g,40,45,Math.PI); E(g,PAL.skin,40,45,3,3); }
  else { E(g,PAL.robe,38,41,4,6); staff(g,41,46,0.12); E(g,PAL.skin,41,46,3,3); }
  g.restore();
}
const MILO = {};
function buildMilo(){
  const W=96,H=88, mkF=o=>sprite(W,H,g=>drawMilo(g,o));
  MILO.idle=[mkF({}), mkF({bob:1,sw:1})];
  MILO.run=[]; for(let i=0;i<6;i++){ const ph=i/6*Math.PI*2; MILO.run.push(mkF({leg:Math.sin(ph),bob:-Math.round(Math.abs(Math.cos(ph))*1.5),sw:Math.round(Math.sin(ph)*2)})); }
  MILO.jump=mkF({air:1,sw:-2}); MILO.fall=mkF({air:1,sw:2,pose:'up'});
  MILO.cast=mkF({pose:'cast'}); MILO.castAir=mkF({pose:'cast',air:1});
  MILO.up=mkF({pose:'up'}); MILO.swing=mkF({pose:'swing'}); MILO.swingAir=mkF({pose:'swing',air:1});
  MILO.hurt=mkF({pose:'hurt',air:1}); MILO.slam=mkF({pose:'slam',air:1});
}

/* ---------- VIJANDEN ---------- */
function drawCrab(g,f,arm){
  const lp=f?2:0;
  for(let i=0;i<3;i++){ R(g,PAL.terraD,10+i*4-(i===1?lp:0),25,3,8); R(g,PAL.terraD,32+i*4+(i===1?lp:0),25,3,8); }
  E(g,PAL.terra,6,18+lp,6,5); P(g,PAL.terraL,[1,13,8,11,6,16]); R(g,PAL.terraD,3,18+lp,6,1);
  E(g,PAL.terra,42,18-lp,6,5); P(g,PAL.terraL,[47,13,40,11,42,16]); R(g,PAL.terraD,39,18-lp,6,1);
  E(g,arm?PAL.bronze:PAL.terra,24,22,14,8);
  E(g,arm?PAL.bronzeL:PAL.terraL,21,19,8,3);
  if(arm){
    P(g,PAL.gold,[12,18,15,8,20,16]); P(g,PAL.gold,[20,15,24,5,28,15]); P(g,PAL.gold,[28,16,33,8,36,18]);
    R(g,PAL.bronzeD,12,26,24,2);
  }
  R(g,PAL.terraD,18,8,2,8); R(g,PAL.terraD,28,8,2,8);
  E(g,'#e8e2d4',19,8,2.5,2.5); E(g,'#e8e2d4',29,8,2.5,2.5);
  R(g,PAL.ink,19,7,2,2); R(g,PAL.ink,29,7,2,2);
}
function flipped(fn){ return g=>{ g.translate(24,20); g.rotate(Math.PI); g.translate(-24,-18); fn(g); }; }
function drawWisp(g,f){
  const o=f?2:0;
  P(g,PAL.seaL,[8,22,1,27+o,9,27,4,34-o,15,28]);
  E(g,'#e8fbff',24,20,14,12); E(g,'#ffffff',20,15,8,6); E(g,PAL.seaL,28,27,10,4);
  g.strokeStyle=PAL.seaD; g.lineWidth=2; g.beginPath(); g.arc(31,21,4,0,Math.PI*1.4); g.stroke();
  R(g,PAL.ink,17,17,3,4); R(g,PAL.ink,24,17,3,4); R(g,PAL.ink,16,15,5,1); R(g,PAL.ink,23,15,5,1);
}
const ENEMY={};
function buildEnemies(){
  ENEMY.crab=[sprite(48,36,g=>drawCrab(g,0)),sprite(48,36,g=>drawCrab(g,1))];
  ENEMY.armor=[sprite(48,36,g=>drawCrab(g,0,1)),sprite(48,36,g=>drawCrab(g,1,1))];
  ENEMY.armorFlip=[sprite(48,36,flipped(g=>drawCrab(g,0,1))),sprite(48,36,flipped(g=>drawCrab(g,1,1)))];
  ENEMY.wisp=[sprite(44,40,g=>drawWisp(g,0),PAL.seaD),sprite(44,40,g=>drawWisp(g,1),PAL.seaD)];
}

/* ---------- NPC'S ---------- */
function drawPerson(g,o){
  g.translate(0,6); const lg=o.leg||0;
  R(g,o.pants,25-lg,54,5,7); R(g,o.pants,34+lg,54,5,7);
  R(g,PAL.boot,24-lg,59,7,4); R(g,PAL.boot,33+lg,59,7,4);
  P(g,o.top,[23,36,41,36,43,56,21,56]); P(g,o.topD,[23,36,27,36,25,56,21,56]);
  if(o.overall){ R(g,o.overall,25,42,14,14); R(g,o.overall,26,36,3,7); R(g,o.overall,35,36,3,7); R(g,PAL.gold,27,43,2,2); R(g,PAL.gold,35,43,2,2); }
  if(o.sash) R(g,o.sash,21,46,22,3);
  E(g,o.top,22,44,3,7); E(g,o.top,42,44,3,7);
  E(g,o.skin,22,51,3,3); E(g,o.skin,42,51,3,3);
  if(o.tool==='wrench'){ R(g,'#9aa3ad',19,40,3,12); E(g,'#9aa3ad',20,39,4,3); R(g,o.skin,20,40,2,1); }
  if(o.tool==='cane'){ R(g,PAL.woodD,18,32,3,30); E(g,PAL.gold,19.5,31,3,3); }
  E(g,o.hair,36,24,8,8);
  E(g,o.skin,31,26,9,8.5);
  if(o.style==='bun'){ E(g,o.hair,32,19,10,5); E(g,o.hair,40,25,4,7); E(g,o.hair,39,12,5,5); R(g,'#5b4636',22,19,19,2); E(g,PAL.seaL,27,20,3,2.5); E(g,PAL.seaL,34,20,3,2.5); }
  else if(o.style==='short'){ E(g,o.hair,32,19,10,5); E(g,o.hair,39,25,3,6); }
  else if(o.style==='bald'){ E(g,o.skinD,36,22,5,4); }
  if(o.band){ R(g,PAL.gold,22,20,19,2); E(g,PAL.goldL,31,19,3,3); }
  if(o.beard){ P(g,o.hair,[23,29,35,29,33,40,28,45,25,40]); }
  R(g,PAL.ink,25,25,2,3); R(g,PAL.ink,30,25,2,3);
  R(g,o.hairD||PAL.skinD,24,23,4,1); R(g,o.hairD||PAL.skinD,29,23,4,1);
  if(!o.beard) R(g,PAL.skinD,26,31,3,1);
}
const NPCSPR={};
function buildNPCs(){
  const base={skin:'#cf9f7a',pants:'#5e4a38'};
  const lyra={...base,skin:'#dcae8a',hair:'#a24f2a',hairD:'#7a3a1e',style:'bun',top:'#cfc5b2',topD:'#a99e8a',overall:'#3b6468',tool:'wrench'};
  NPCSPR.lyra=sprite(64,72,g=>drawPerson(g,lyra));
  NPCSPR.lyraWalk=[sprite(64,72,g=>drawPerson(g,{...lyra,leg:2})),sprite(64,72,g=>drawPerson(g,{...lyra,leg:-2}))];
  NPCSPR.elder=sprite(64,72,g=>drawPerson(g,{...base,skin:'#b98560',hair:'#d9d4c8',style:'bald',beard:1,band:1,top:'#d8cdb6',topD:'#b0a48c',sash:PAL.terraD,tool:'cane'}));
  NPCSPR.fisher=sprite(64,72,g=>drawPerson(g,{...base,hair:'#3a2618',style:'short',top:'#4a6a78',topD:'#334c58',sash:'#8a8070'}));
  NPCSPR.kid=sprite(64,72,g=>drawPerson(g,{...base,skin:'#b47e58',hair:'#2a1c14',style:'short',top:'#a88a4a',topD:'#836a36'}));
  NPCSPR.baker=sprite(64,72,g=>drawPerson(g,{...base,skin:'#d6a682',hair:'#6e3f22',style:'bun',top:'#b9a48c',topD:'#94806a',sash:'#e6dcc8'}));
}

/* ---------- OBJECTEN ---------- */
const OBJ={};
function buildObjects(){
  OBJ.altar=sprite(48,64,g=>{
    P(g,PAL.stoneD,[6,62,42,62,38,54,10,54]); P(g,PAL.stone,[8,60,40,60,37,55,11,55]);
    R(g,PAL.stoneM,15,30,18,25); R(g,PAL.stone,15,30,5,25); R(g,PAL.stoneD,29,30,4,25);
    R(g,PAL.stone,9,25,30,6); R(g,PAL.stoneD,9,30,30,1);
    P(g,PAL.boltD,[23,34,27,34,24,41,28,41,21,51,23,43,20,43]);
  });
  OBJ.switchOff=sprite(28,28,g=>{ for(let i=0;i<8;i++){const a=i/8*Math.PI*2; P(g,PAL.bronzeD,[14+Math.cos(a)*13,14+Math.sin(a)*13,14+Math.cos(a+.3)*8,14+Math.sin(a+.3)*8,14+Math.cos(a-.3)*8,14+Math.sin(a-.3)*8]);} E(g,PAL.bronze,14,14,9,9); E(g,PAL.bronzeL,12,12,4,3); E(g,'#5c6b7a',14,14,4,4); });
  OBJ.switchOn=sprite(28,28,g=>{ for(let i=0;i<8;i++){const a=i/8*Math.PI*2; P(g,PAL.gold,[14+Math.cos(a)*13,14+Math.sin(a)*13,14+Math.cos(a+.3)*8,14+Math.sin(a+.3)*8,14+Math.cos(a-.3)*8,14+Math.sin(a-.3)*8]);} E(g,PAL.bronzeL,14,14,9,9); E(g,PAL.boltC,14,14,5,5); E(g,PAL.bolt,13,13,2,2); });
  OBJ.sentinel=sprite(32,32,g=>{ R(g,PAL.bronzeD,1,0,30,6); E(g,PAL.bronze,16,15,12,11); E(g,PAL.bronzeL,12,11,5,4); for(let i=0;i<5;i++) P(g,PAL.gold,[4+i*6,22,7+i*6,29,10+i*6,22]); R(g,PAL.ink,8,15,16,4); E(g,'#fff3b0',16,17,4,2); });
  OBJ.pot=sprite(28,32,g=>{ P(g,PAL.terra,[6,16,22,16,19,30,9,30]); R(g,PAL.terraL,6,16,16,2); R(g,PAL.terraD,12,20,1,6); P(g,PAL.leafD,[9,16,7,6,11,15]); P(g,PAL.leaf,[13,16,14,3,16,16]); P(g,PAL.leafD,[17,16,21,8,19,16]); });
  OBJ.lamp=sprite(20,64,g=>{ R(g,PAL.bronzeD,9,14,3,48); R(g,PAL.bronzeD,4,60,13,3); P(g,PAL.bronze,[3,4,17,4,14,16,6,16]); E(g,PAL.goldL,10,10,4,4); R(g,PAL.bronzeD,3,3,15,2); });
  OBJ.post=sprite(14,128,g=>{ R(g,PAL.woodD,2,0,10,128); R(g,PAL.wood,3,0,4,128); for(let y=10;y<128;y+=22) R(g,PAL.woodD,2,y,10,2); });
  OBJ.sail=sprite(64,72,g=>{ R(g,PAL.woodD,30,0,4,72); P(g,'#ffffff',[34,4,62,40,34,40]); P(g,'#efe6d6',[34,30,62,40,34,40]); P(g,PAL.terra,[28,10,4,38,28,38]); });
  OBJ.palm=sprite(80,128,g=>{ for(let i=0;i<12;i++){ R(g,i%2?PAL.wood:PAL.woodL,36+Math.sin(i*.4)*4,24+i*9,9,9);} const fr=[[-1,-.2],[1,-.3],[-1,.5],[1,.6],[0,-1]]; fr.forEach(([dx,dy])=>{ g.save(); g.translate(40,26); g.rotate(Math.atan2(dy,dx)); E(g,PAL.leafD,18,2,20,6); E(g,PAL.leaf,18,0,18,4); g.restore(); }); E(g,PAL.woodD,36,30,4,4); E(g,PAL.woodD,44,31,4,4); });
}

/* ---------- TEGELS ---------- */
const TILE={};
function tileC(fn){ const c=mk(32,32); fn(c.getContext('2d')); return c; }
function buildTiles(){
  TILE.stone=[]; TILE.stoneTop=[];
  for(let v=0;v<4;v++){
    const brick=(g,top)=>{
      SEED=v*977+13; R(g,PAL.mortar,0,0,32,32);
      for(let row=0;row<4;row++){ const off=row%2?8:0; for(let bx=-16;bx<32;bx+=16){ const t=[PAL.stone,PAL.stoneM,'#d4c8b3'][Math.floor(rnd()*3)]; R(g,t,bx+off+1,row*8+1,15,7); R(g,'#e8dfcf',bx+off+1,row*8+1,15,1);} }
      for(let i=0;i<8;i++) R(g,PAL.stoneD,Math.floor(rnd()*32),Math.floor(rnd()*32),1,1);
      if(top){ R(g,PAL.terraD,0,0,32,8); R(g,PAL.terra,0,0,32,6); for(let x=0;x<32;x+=8){ R(g,PAL.terraL,x+1,1,5,2); R(g,PAL.terraD,x+7,0,1,6);} R(g,'rgba(80,40,20,0.15)',0,8,32,2); }
    };
    TILE.stone.push(tileC(g=>brick(g,0))); TILE.stoneTop.push(tileC(g=>brick(g,1)));
  }
  TILE.sand=[]; TILE.sandTop=[];
  for(let v=0;v<3;v++){
    const s=(g,top)=>{ SEED=v*331+7; R(g,PAL.sand,0,0,32,32); for(let i=0;i<22;i++) R(g,rnd()<.5?PAL.sandD:PAL.sandL,Math.floor(rnd()*31),Math.floor(rnd()*31),2,1);
      if(top){ R(g,PAL.sandL,0,0,32,4); for(let x=0;x<32;x+=4) R(g,PAL.sandL,x,4,2,1); if(v===1){ R(g,PAL.woodD,20,7,6,2); } } };

<script>/* js/core.js */
// core.js — invoer, geluid, physics en Milo zelf

const KEY={}, PRESS={};
const KMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:['up','jump'],KeyW:['up','jump'],ArrowDown:'down',KeyS:'down',
  Space:'jump',KeyZ:'jump',KeyJ:'staff',KeyX:'staff',KeyK:'s1',KeyC:'s1',KeyL:'s2',KeyV:'s2',KeyE:'act',Enter:'ok',Escape:'esc',KeyM:'mute',KeyN:'new',Digit2:'w2',Digit3:'w3',Digit4:'w4',Digit5:'w5',Digit6:'w6'};
addEventListener('keydown',e=>{ const m=KMAP[e.code]; if(!m) return; e.preventDefault(); for(const k of [].concat(m)){ if(!KEY[k]) PRESS[k]=true; KEY[k]=true; } initAudio(); });

function initAudio(){
  if(AC) return;
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); MASTER=AC.createGain(); MASTER.gain.value=0.35; MASTER.connect(AC.destination);
    NOISE=AC.createBuffer(1,AC.sampleRate*0.6,AC.sampleRate); const d=NOISE.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    startMusic(); }catch(e){}
}
function tone(type,f0,f1,dur,vol=0.3,delay=0){
  if(!AC||MUTED) return; const t=AC.currentTime+delay, o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur); o.connect(g); g.connect(MASTER); o.start(t); o.stop(t+dur+0.02);
}
function noise(dur,vol=0.3,freq=800){
  if(!AC||MUTED) return; const t=AC.currentTime, s=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain();
  s.buffer=NOISE; f.type='lowpass'; f.frequency.value=freq; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(f); f.connect(g); g.connect(MASTER); s.start(t); s.stop(t+dur);

  // trage, mineur-achtige loop: A-mineur pentatonisch
  const scale=[220,262,294,330,392,440,523], bass=[110,98,87,82];

    if(!AC||MUTED||GAME.state==='title') { step++; return; }

  if(c==='#'||c==='S'||c==='C'||c==='L'||c==='G'||c==='b'||c==='F'||c==='f'||c==='Y'||c==='I'||c==='K') return true;
  if(c==='J') return DUELLOCK;
  if(c==='R') return ghost!=='form';
  if(c==='H') return GATE4_LOCKED;
  if(c==='B') return !ghost;
  return false;
}
function rectSolid(x,y,w,h,ghost){
  const x0=Math.floor(x/T), x1=Math.floor((x+w-1)/T), y0=Math.floor(y/T), y1=Math.floor((y+h-1)/T);
  for(let ty=y0;ty<=y1;ty++) for(let tx=x0;tx<=x1;tx++) if(solidAt(tx,ty,ghost)) return true;
  return false;
}
function rectTile(x,y,w,h,ch){
  const x0=Math.floor(x/T), x1=Math.floor((x+w-1)/T), y0=Math.floor(y/T), y1=Math.floor((y+h-1)/T);
  for(let ty=y0;ty<=y1;ty++) for(let tx=x0;tx<=x1;tx++) if(tileAt(tx,ty)===ch) return true;
  return false;
}
function moveBody(b,dt){
  b.hitWall=false;
  b.x+=b.vx*dt;
  const y0=Math.floor(b.y/T), y1=Math.floor((b.y+b.h-1)/T);
  if(b.vx>0){ const tx=Math.floor((b.x+b.w-1)/T); for(let ty=y0;ty<=y1;ty++) if(solidAt(tx,ty)){ b.x=tx*T-b.w; b.vx=0; b.hitWall=true; break; } }
  else if(b.vx<0){ const tx=Math.floor(b.x/T); for(let ty=y0;ty<=y1;ty++) if(solidAt(tx,ty)){ b.x=(tx+1)*T; b.vx=0; b.hitWall=true; break; } }
  const prevBottom=b.y+b.h; b.y+=b.vy*dt; b.onGround=false; b.bonk=false;
  const x0=Math.floor(b.x/T), x1=Math.floor((b.x+b.w-1)/T);
  if(b.vy>=0){ const ty=Math.floor((b.y+b.h)/T);
    for(let tx=x0;tx<=x1;tx++){ const c=tileAt(tx,ty);
      if((solidAt(tx,ty)&&b.y+b.h>ty*T) || (c==='-'&&!(b.drop>0)&&prevBottom<=ty*T+1&&b.y+b.h>=ty*T)){ b.y=ty*T-b.h; b.vy=0; b.onGround=true; break; } } }
  else { const ty=Math.floor(b.y/T); for(let tx=x0;tx<=x1;tx++) if(solidAt(tx,ty)){ b.y=(ty+1)*T; b.vy=0; b.bonk=true; break; } }
}
function overlap(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }

/* ---------- Milo ---------- */
const PL={ w:22, h:46 };
function resetPlayer(x,y){
  Object.assign(PL,{x,y,vx:0,vy:0,face:1,onGround:false,coyote:0,jbuf:0,cut:false,drop:0,hp:PL.maxHp||5,maxHp:PL.maxHp||5,inv:0,ghost:0,
    hurtT:0,castT:0,swingT:0,slam:false,anim:0,cds:{bolt:0,blink:0,clap:0,shield:0,grip:0,leap:0,charge:0,form:0},hitList:[],dead:0,shieldT:0,zip:null,attach:null,onPlat:null,qs:false,push:0,form:null});
}
function initPlayerSpells(){ PL.unlocked=['bolt']; PL.slots=['bolt',null]; }
function playerCenter(){ return {x:PL.x+PL.w/2, y:PL.y+PL.h/2}; }

function updatePlayer(dt){
  const p=PL;
  for(const k in p.cds) p.cds[k]=Math.max(0,p.cds[k]-dt);
  p.inv=Math.max(0,p.inv-dt); p.ghost=Math.max(0,p.ghost-dt); p.hurtT=Math.max(0,p.hurtT-dt);
  p.castT=Math.max(0,p.castT-dt); p.swingT=Math.max(0,p.swingT-dt); p.drop=Math.max(0,p.drop-dt);
  p.shieldT=Math.max(0,(p.shieldT||0)-dt);
  if(p.zip||p.attach){ w2Special(p,dt); p.anim+=dt; return; }
  if(p.form){ w5Form(p,dt); p.anim+=dt; return; }
  const ctrl = GAME.mode==='play' && p.hurtT<=0;
  let dir=0; if(ctrl){ if(KEY.left) dir-=1; if(KEY.right) dir+=1; }
  if(p.slam){ p.vx=0; p.vy=1100; }
  else {
    const target=dir*235, acc=p.onGround?(p.ice?420:2600):1700;
    p.launchT=Math.max(0,(p.launchT||0)-dt); if(p.onGround) p.launchT=0;
    // na een Magneetgreep-lancering houd je je vaart, tenzij je zelf de andere kant op stuurt
    const keepLaunch=p.launchT>0 && !(dir&&Math.sign(dir)!==Math.sign(p.vx));
    if(p.hurtT<=0&&!keepLaunch){ if(p.vx<target) p.vx=Math.min(target,p.vx+acc*dt); else if(p.vx>target) p.vx=Math.max(target,p.vx-acc*dt); }
    if(dir && p.swingT<=0) p.face=dir;
    p.vy=Math.min(900,p.vy+1900*dt);
  }
  if(WORLD>=2) w2PrePhys(p,dt);
  if(WORLD===3) w3PrePhys(p,dt);
  if(WORLD===4) w4PrePhys(p,dt);
  if(WORLD===6) w6PrePhys(p,dt);
  // springen
  p.coyote = p.onGround ? 0.1 : p.coyote-dt;
  if(ctrl && pressed('jump')) p.jbuf=0.13; else p.jbuf-=dt;
  if(p.jbuf>0 && p.coyote>0 && !p.slam){
    if(KEY.down && onOneWay()){ p.drop=0.25; p.jbuf=0; }
    else { p.vy=p.qs?-440:-650; p.coyote=0; p.jbuf=0; p.cut=false; SFX.jump(); dust(p.x+p.w/2,p.y+p.h,6); }
  }
  // Stormsprong: nog een keer springen in de lucht (als hij in een slot zit)
  else if(ctrl && pressed('jump') && !p.onGround && !p.slam && p.slots.includes('leap') && !p.shielding) doLeap(p);
  if(!KEY.jump && p.vy<-220 && !p.cut){ p.vy*=0.5; p.cut=true; }
  const wasAir=!p.onGround;
  moveBody(p,dt);
  if(WORLD>=2) w2PostPhys(p,dt);
  if(WORLD===4) w4PostPhys(p);
  if(p.onGround && wasAir){ if(p.slam){ p.slam=false; shockwave(p.x+p.w/2,p.y+p.h,true); } else dust(p.x+p.w/2,p.y+p.h,4); }
  if(p.onGround && !p.slam && !p.onPlat && !p.qs && !rectTile(p.x,p.y+p.h,p.w,2,'~')) { const tb=Math.floor((p.y+p.h)/T); if(tileAt(Math.floor((p.x+p.w/2)/T),tb)!=='C') p.safe={x:p.x,y:p.y}; }
  // acties
  // Stormschild: zolang je de toets ingedrukt houdt. Dan kun je niets anders gebruiken (wel lopen en springen).
  const shSlot=p.slots.indexOf('shield');
  const wasSh=p.shielding; p.shielding = ctrl && shSlot>=0 && !!KEY[shSlot?'s2':'s1'];
  if(p.shielding){ if(!wasSh){ SFX.blink(); RINGS.push({x:p.x+p.w/2,y:p.y+p.h-6,r:10,life:0.3,max:60}); } p.shieldT=Math.max(p.shieldT,0.06); p.vx*=0.9; }
  if(ctrl && !p.shielding){
    if(pressed('staff') && p.swingT<=0){ p.swingT=0.24; p.hitList=[]; SFX.swing(); }
    if(pressed('s1') && p.slots[0]!=='shield') castSpell(0);
    if(pressed('s2') && p.slots[1]!=='shield') castSpell(1);
  }
  if(p.swingT>0.08) staffHit();
  // gevaren
  if(rectTile(p.x+4,p.y+10,p.w-8,p.h-10,'~')){ splash(p.x+p.w/2,p.y+p.h); hurtPlayer(1,null,true); }
  if(p.ghost<=0) for(const b of BEAMS){ if(overlap(p,b)){ hurtPlayer(1,b.x+b.w/2); break; } }
  if(p.y>LH*T+100) hurtPlayer(1,null,true);
  p.anim+=dt;
}
function onOneWay(){ const ty=Math.floor((PL.y+PL.h)/T); const a=tileAt(Math.floor(PL.x/T),ty), b=tileAt(Math.floor((PL.x+PL.w-1)/T),ty); return (a==='-'||a==='.')&&(b==='-'||b==='.')&&(a==='-'||b==='-'); }

function hurtPlayer(n,fromX,respawn){
  const p=PL;
  if(GAME.dying) return;
  if(respawn){ p.hp-=n; SFX.hurt(); shake(6); if(p.hp<=0) return playerDie(); const s=p.safe||GAME.checkpoint; p.x=s.x; p.y=s.y; p.vx=p.vy=0; p.inv=1.2; p.slam=false; snapCompanion(); return; }
  if(p.inv>0||p.ghost>0) return;
  p.hp-=n; p.inv=1.4; p.hurtT=0.28; p.slam=false; SFX.hurt(); shake(5);
  const d = fromX==null ? -p.face : Math.sign(p.x+p.w/2-fromX)||1;
  if(WORLD===4&&p.w4air&&p.w4air.kind==='cart'){ p.hurtT=0; } else { p.vx=d*260; p.vy=-320; }
  for(let i=0;i<8;i++) PARTS.push({x:p.x+p.w/2,y:p.y+20,vx:(Math.random()-.5)*200,vy:-Math.random()*200,life:0.5,col:'#ffffff',s:3,g:600});
  if(p.hp<=0) playerDie();
}
// Dood: een korte sequentie (Milo zakt in elkaar, beeld wordt donker), daarna terug naar het laatste Stormaltaar.
function playerDie(){
  if(GAME.dying) return;
  PL.hp=0; PL.slam=false; PL.vx=0; PL.vy=Math.min(PL.vy,-180); PL.hurtT=0; PL.inv=0;
  GAME.dying={t:2.0,done:false};
  SFX.boss();
}
function respawnAfterDeath(){
  const c=GAME.checkpoint;
  resetPlayerKeep(c.x,c.y); PL.safe=null;
  BOLTS=[]; WAVES=[];
  if(BOSS&&BOSS.active&&BOSS.state!=='dead') resetBoss(true);
  if(WORLD===2) w2ResetBoss();
  if(WORLD===3) w3ResetBoss();
  if(WORLD===4) w4ResetBoss();
  if(WORLD===5) w5ResetBoss();
  if(WORLD===6) w6ResetBoss();
  snapCompanion();
}
function resetPlayerKeep(x,y){ const u=PL.unlocked, s=PL.slots; resetPlayer(x,y); PL.hp=PL.maxHp; PL.unlocked=u; PL.slots=s; PL.inv=1.5; }

function castSpell(i){
  const p=PL, id=p.slots[i];
  if(!id){ toast('Dit slot is leeg. Vind nieuwe spreuken en wissel ze bij een Stormaltaar.'); return; }
  if(p.cds[id]>0) return;
  p.cds[id]=SPELLS[id].cd;
  const cx=p.x+p.w/2, cy=p.y+p.h/2-4;
  npcFlinch(cx);
  if(id==='bolt'){
    const up=KEY.up; p.castT=0.22;
    BOLTS.push({x:up?cx-5:cx+p.face*20-8,y:up?p.y-10:cy-4,w:up?10:16,h:up?16:10,vx:up?0:p.face*760,vy:up?-760:0,life:0.85,up});
    SFX.bolt();
  }
  if(id==='blink'){
    let best=p.x, step=p.face*4;
    for(let d=4; d<=136; d+=4){
      const nx=p.x+p.face*d;
      if(rectSolid(nx,p.y,p.w,p.h,true)) break;
      if(!rectSolid(nx,p.y,p.w,p.h,false) && !BEAMS.some(b=>overlap({x:nx,y:p.y,w:p.w,h:p.h},b))) best=nx;
    }
    const from=p.x;
    for(let i2=0;i2<14;i2++){ const t=i2/13; PARTS.push({x:from+(best-from)*t+p.w/2,y:p.y+10+Math.random()*30,vx:0,vy:-20,life:0.35+t*0.2,col:i2%2?PAL.boltC:PAL.bolt,s:4,g:0}); }
    AFTER.push({x:from,y:p.y,face:p.face,life:0.3});
    p.x=best; p.ghost=0.32; p.vy=Math.min(p.vy,0)*0.3; p.castT=0.15; SFX.blink();
  }
  if(id==='shield'||id==='grip') w2Cast(id);
  if(id==='charge') w4Cast();
  if(id==='form') w5Cast();
  if(id==='leap'){ if(!p.onGround&&!p.slam) doLeap(p); else toast('Stormsprong werkt in de lucht: spring, en druk dan nog een keer.'); }
  if(id==='clap'){
    if(p.onGround) { p.castT=0.25; shockwave(cx,p.y+p.h,false); }
    else { p.slam=true; p.vy=1100; SFX.swing(); }
  }
}
function staffHit(){
  const p=PL, hb={x:p.face>0?p.x+p.w-2:p.x-36,y:p.y+4,w:38,h:34};
  damageArea(hb,1,'staff');
}

<script>/* js/entities.js */
// entities.js — vijanden, objecten, effecten en de Bronzen Kolos
let COLLECT=[], PARTS=[], BOLTS=[], AFTER=[], RINGS=[], ENEMIES=[], SWITCHES=[], ORBS=[], ALTARS=[], NPCS=[], DECOR=[], BEAMS=[], PICKUPS=[], WAVES=[];
let BOSS=null, SHAKE=0;
function shake(n){ SHAKE=Math.max(SHAKE,n); }
function dust(x,y,n){ for(let i=0;i<n;i++) PARTS.push({x:x+(Math.random()-.5)*16,y:y-2,vx:(Math.random()-.5)*120,vy:-Math.random()*60,life:0.35,col:'#fff6e0',s:3,g:200}); }
function splash(x,y){ for(let i=0;i<14;i++) PARTS.push({x,y,vx:(Math.random()-.5)*220,vy:-Math.random()*320,life:0.6,col:i%2?PAL.seaL:'#ffffff',s:3,g:900}); }
function sparks(x,y,n,col){ for(let i=0;i<n;i++){ const a=Math.random()*6.28,s=80+Math.random()*220; PARTS.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.3+Math.random()*0.25,col:col||(i%2?PAL.boltC:PAL.bolt),s:3,g:0}); } }

function spawnEntities(){
  w2Init(); COLLECT=[];PARTS=[];BOLTS=[];AFTER=[];RINGS=[];ENEMIES=[];SWITCHES=[];ORBS=[];ALTARS=[];NPCS=[];DECOR=[];BEAMS=[];PICKUPS=[];WAVES=[];
  for(const e of ENTS){
    const fx=e.tx*T+16, fy=(e.ty+1)*T;
    if(e.type==='player'){ GAME.start={x:fx-PL.w/2,y:fy-PL.h}; }
    if(e.type==='crab') ENEMIES.push({kind:'crab',x:fx-18,y:fy-26,w:36,h:26,vx:0,vy:0,dir:-1,hp:2,flash:0,t:Math.random()});
    if(e.type==='armor') ENEMIES.push({kind:'armor',x:fx-18,y:fy-26,w:36,h:26,vx:0,vy:0,dir:-1,hp:3,flash:0,flip:0,t:0});
    if(e.type==='wisp') ENEMIES.push({kind:'wisp',x:fx-15,y:fy-26,w:30,h:26,hx:fx-15,hy:fy-26,hp:1,flash:0,t:Math.random()*6});
    if(e.type==='switch') SWITCHES.push({x:fx-14,y:e.ty*T+2,w:28,h:28,group:e.group,on:false});
    if(e.type==='orb') ORBS.push({x:fx-12,y:fy-44,w:24,h:24,spell:e.spell,taken:false,t:0});
    if(e.type==='altar') ALTARS.push({x:fx-24,y:fy-64,w:48,h:64,lit:false});
    if(e.type==='npc') NPCS.push({x:fx-32,y:fy-72,w:64,h:72,id:e.id,spr:e.spr,talked:false});
    if(e.type==='decor') DECOR.push({x:fx,y:fy,spr:e.spr});
    if(e.type==='boss') makeBoss(e.tx,e.ty);
    if(WORLD>=2) w2Spawn(e,fx,fy);
    if(WORLD===3) w3Spawn(e,fx,fy);
    if(WORLD===4) w4Spawn(e,fx,fy);
    if(WORLD===5) w5Spawn(e,fx,fy);
    if(WORLD===6) w6Spawn(e,fx,fy);
    if(e.type==='shard'||e.type==='heartc') COLLECT.push({kind:e.type,id:e.id,x:fx-12,y:fy-30,w:24,h:28,t:Math.random()*6,taken:false});
    if(e.type==='tablet') NPCS.push({x:fx-32,y:fy-72,w:64,h:72,id:e.id,spr:'tablet',talked:false,tablet:true});
  }
  for(let ty=0;ty<LH;ty++) for(let tx=0;tx<LW;tx++) if(MAP[ty][tx]==='L'){
    let y2=ty+1; while(y2<LH && !solidAt(tx,y2)) y2++;
    BEAMS.push({x:tx*T+8,y:(ty+1)*T,w:16,h:(y2-ty-1)*T});
  }
}

function activateGroup(g){
  SFX.sw(); shake(4);
  for(const k in GROUP){ if(GROUP[k]!==g) continue; const [x,y]=k.split(',').map(Number);
    if(MAP[y][x]==='G'){ MAP[y][x]='.'; dust(x*T+16,y*T+28,3); }
    if(MAP[y][x]==='D'){ MAP[y][x]='b'; sparks(x*T+16,y*T+6,3,PAL.gold); } }
  toast(g===2?'De ophaalbrug zakt neer.':'De poort schuift open.');
}
function crumble(tx,ty){
  const st=[[tx,ty]]; let n=0;
  while(st.length){ const [x,y]=st.pop(); if(tileAt(x,y)!=='C') continue; MAP[y][x]='.'; n++;
    for(let i=0;i<6;i++) PARTS.push({x:x*T+Math.random()*32,y:y*T+Math.random()*32,vx:(Math.random()-.5)*160,vy:-Math.random()*200,life:0.9,col:[PAL.stone,PAL.stoneD,PAL.mortar][i%3],s:5,g:1100});
    st.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]); }
  if(n){ SFX.crumble(); shake(12); }
}
function shockwave(x,y,air){
  SFX.clap(); shake(air?12:9); RINGS.push({x,y,r:10,life:0.4,max:air?150:125}); dust(x,y,14);
  const rad=air?150:125;
  const ty=Math.floor(y/T);
  for(let tx=Math.floor((x-40)/T);tx<=Math.floor((x+40)/T);tx++){ if(tileAt(tx,ty)==='C') crumble(tx,ty); if(tileAt(tx,ty+1)==='C') crumble(tx,ty+1); }
  for(let yy=ty-2;yy<=ty+1;yy++) for(let tx=Math.floor((x-70)/T);tx<=Math.floor((x+70)/T);tx++) if('FfK'.includes(tileAt(tx,yy))) breakSecret(tx,yy);
  for(const e of ENEMIES){ const ex=e.x+e.w/2, ey=e.y+e.h/2; if(Math.abs(ex-x)>rad||Math.abs(ey-y)>(e.kind==='wisp'?rad:80)) continue;
    if(e.kind==='armor'){ if(!e.flip){ e.flip=4.5; e.vy=-280; sparks(ex,ey,8,PAL.gold); } else hitEnemy(e,1); }
    else hitEnemy(e,2); }
  if(WORLD===3) w3Shock(x,y,rad);
  if(WORLD===4) w4Shock(x,y,rad);
  if(WORLD===5) w5Shock(x,y,rad);
  if(WORLD===6) w6Shock(x,y,rad);
  if(BOSS&&BOSS.state==='stunned'&&!BOSS.plate&&Math.abs(x-BOSS.x)<200){ BOSS.plate=true; SFX.boss(); shake(14); sparks(BOSS.x,BOSS.y-74,30,PAL.gold); toast('De borstplaat barst open! Raak de kern!'); }
}
function hitEnemy(e,dmg){
  const ex=e.x+e.w/2, ey=e.y+e.h/2;
  if(e.kind==='armor'&&!e.flip){ SFX.tink(); sparks(ex,ey,6,PAL.gold); hint('armor','Dat schild is te hard... misschien kan iets zwaars hem omgooien?'); return 'deflect'; }
  e.hp-=dmg; e.flash=0.12; SFX.hit(); sparks(ex,ey,6);
  if(e.kind!=='wisp') e.vx=Math.sign(ex-PL.x-PL.w/2)*120;
  if(e.hp<=0){ e.dead=true; for(let i=0;i<14;i++) PARTS.push({x:ex,y:ey,vx:(Math.random()-.5)*260,vy:-Math.random()*260,life:0.6,col:e.kind==='wisp'?'#ffffff':(e.kind==='armor'?PAL.bronze:PAL.terra),s:4,g:700});
    if(Math.random()<0.3) PICKUPS.push({x:ex-8,y:ey-8,w:16,h:16,vx:0,vy:-200,t:0}); }
  return 'hit';
}
function damageArea(hb,dmg,src){
  let any=false;
  for(const e of ENEMIES){ if(e.dead||e.under||!overlap(hb,e)) continue; if(src==='staff'){ if(PL.hitList.includes(e)) continue; PL.hitList.push(e); }
    const r=hitEnemy(e,dmg); any=true; if(r==='deflect'&&src==='staff'){ PL.vx=-PL.face*120; } }
  if(BOSS&&BOSS.active) any = bossHit(hb,dmg,src) || any;
  if(WORLD===3) any = w3Hit(hb,dmg,src) || any;
  if(WORLD===4) any = w4Hit(hb,dmg,src) || any;
  if(WORLD===5) any = w5Hit(hb,dmg,src) || any;
  if(WORLD===6) any = w6Hit(hb,dmg,src) || any;
  return any;
}

function updateEntities(dt){
  // bliksemschichten
  for(const b of BOLTS){
    b.life-=dt; b.x+=b.vx*dt; b.y+=b.vy*dt;
    if(Math.random()<0.9) PARTS.push({x:b.x+b.w/2,y:b.y+b.h/2,vx:(Math.random()-.5)*40,vy:(Math.random()-.5)*40,life:0.2,col:Math.random()<.5?PAL.boltC:PAL.bolt,s:3,g:0});
    if(WORLD===2) w2BoltStep(b);
    if(rectSolid(b.x,b.y,b.w,b.h,true)){ if(!(WORLD===2&&w2BoltReflect(b))){ b.life=0; breakSecretRect(b.x-2,b.y-2,b.w+4,b.h+4); sparks(b.x+b.w/2,b.y+b.h/2,8); } }
    for(const s of SWITCHES){ if(!s.on && overlap({x:b.x-8,y:b.y-6,w:b.w+16,h:b.h+12},s)){ s.on=true; b.life=0; sparks(s.x+14,s.y+14,16,PAL.gold); activateGroup(s.group); } }
    if(b.life>0 && damageArea(b,1,'bolt')) b.life=0;
  }

  // vijanden

const SHARDS_TOTAL=6;
function breakSecret(tx,ty){
  const st=[[tx,ty]]; let n=0, ice=0;
  while(st.length){ const [x,y]=st.pop(); const c=tileAt(x,y); if(c!=='F'&&c!=='f'&&c!=='K') continue; MAP[y][x]='.'; if(c==='K'){ ice++; for(let i=0;i<6;i++) PARTS.push({x:x*T+Math.random()*32,y:y*T+Math.random()*32,vx:(Math.random()-.5)*160,vy:-Math.random()*200,life:0.7,col:i%2?'#ffffff':'#a9d4e6',s:4,g:1100}); st.push([x,y+1],[x,y-1]); continue; } n++;
    for(let i=0;i<6;i++) PARTS.push({x:x*T+Math.random()*32,y:y*T+Math.random()*32,vx:(Math.random()-.5)*160,vy:-Math.random()*200,life:0.9,col:c==='f'?[PAL.sand,PAL.sandD][i%2]:[PAL.stone,PAL.stoneD][i%2],s:5,g:1100});
    st.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]); }
  if(ice&&!n){ SFX.tink(); SFX.crumble(); shake(4); }
  if(n){ SFX.crumble(); SFX.unlock(); shake(8); if(!GAME.hints.secret1){ GAME.hints.secret1=true; compBark('Hol. Daar zit iets achter.'); } }
}
function breakSecretRect(x,y,w,h){
  for(let ty=Math.floor(y/T);ty<=Math.floor((y+h)/T);ty++) for(let tx=Math.floor(x/T);tx<=Math.floor((x+w)/T);tx++) if('FfK'.includes(tileAt(tx,ty))) breakSecret(tx,ty);
}
function shardCount(){ return COLLECT.filter(c=>c.kind==='shard'&&c.taken).length; }
function collectSecret(c){
  sparks(c.x+12,c.y+14,24,c.kind==='shard'?PAL.goldL:PAL.boltC); SFX.unlock();
  if(c.kind==='heartc'){ PL.maxHp++; PL.hp=PL.maxHp;
    GAME.banner={title:'Stormkristal',sub:'Je maximale gezondheid gaat omhoog.',extra:'Hartjes: '+PL.maxHp,icon:'bolt',t:3.5};
    compBark('Dat kristal trekt je bliksem aan. Je voelt sterker, toch?'); }
  else { const n=shardCount(); toast('Zonnescherf gevonden ('+n+'/'+SHARDS_TOTAL+')');
    compBark(n===1?'Een zonnescherf. Vroeger lagen ze overal in Aurelis.':n===SHARDS_TOTAL?'Allemaal. Zelfs de Raad heeft er nooit zoveel gezien.':'Nog een scherf.'); }

<script>/* js/companion.js */
// companion.js — Lyra loopt mee, en de wantrouwige inwoners van Aurelis
const COMP={active:false,x:0,y:0,face:1,trail:[],bark:'',barkT:0,done:{},moving:false,anim:0,near:false};
const LAG=30;

function resetCompanion(){ Object.assign(COMP,{active:false,trail:[],bark:'',barkT:0,done:{},moving:false,near:false}); }
function joinCompanion(n){
  NPCS=NPCS.filter(q=>q!==n);
  Object.assign(COMP,{active:true,x:n.x+32,y:n.y+72,face:1,trail:[]});
}
function snapCompanion(){
  if(!COMP.active) return;
  COMP.trail=[]; COMP.x=Math.min(PL.x+PL.w/2-PL.face*48, (WORLD===2?240:WORLD>=3?251:260)*T); COMP.y=PL.y+PL.h;
  for(let i=0;i<10;i++) PARTS.push({x:COMP.x,y:COMP.y-30,vx:(Math.random()-.5)*80,vy:-Math.random()*80,life:0.4,col:'#e6dcc8',s:3,g:0});
}
function compBark(s,t=4){ if(!COMP.active) return; COMP.bark=s; COMP.barkT=t; }

function updateCompanion(dt){
  if(!COMP.active) return;
  COMP.barkT-=dt; COMP.anim+=dt;
  const fx=PL.x+PL.w/2, fy=PL.y+PL.h, last=COMP.trail[COMP.trail.length-1];
  if(PL.onGround||!last||Math.hypot(fx-last.x,fy-last.y)>2){
    if(!last||Math.hypot(fx-last.x,fy-last.y)>2) COMP.trail.push({x:fx,y:fy});
  }
  if(COMP.trail.length>LAG){
    const tgt=COMP.trail.shift();
    const arenaStop = WORLD===6 ? (tgt.x>251*T && MOTHER && MOTHER.state!=="endA" && MOTHER.state!=="endB") : WORLD===5 ? (tgt.x>251*T && HD && HD.state!=='done') : WORLD===4 ? (tgt.x>251*T && BR && BR.state!=='done') : WORLD===3 ? (tgt.x>251*T && EAGLE && EAGLE.state!=='dead') : WORLD===2 ? (tgt.x>241*T && SERP && SERP.state!=='dead') : (tgt.x>259*T && BOSS && BOSS.state!=='dead');
    if(!arenaStop){
      const jump=Math.hypot(tgt.x-COMP.x,tgt.y-COMP.y);
      if(jump>60) for(let i=0;i<6;i++) PARTS.push({x:COMP.x,y:COMP.y-30,vx:(Math.random()-.5)*60,vy:-40,life:0.3,col:'#e6dcc8',s:3,g:0});
      if(Math.abs(tgt.x-COMP.x)>0.5) COMP.face=Math.sign(tgt.x-COMP.x);
      COMP.moving=Math.abs(tgt.x-COMP.x)>0.5; COMP.x=tgt.x; COMP.y=tgt.y;
    } else { COMP.trail=[]; COMP.moving=false; COMP.face=1; }
  } else COMP.moving=false;
  if(!COMP.moving) COMP.face = PL.x+PL.w/2>COMP.x?1:-1;
  COMP.near=Math.abs(PL.x+PL.w/2-COMP.x)<60&&Math.abs(PL.y+PL.h-COMP.y)<50;
  const tx=PL.x/T;
  for(const [bx,txt2] of (WORLD===6?BARKS6:WORLD===5?BARKS5:WORLD===4?BARKS4:WORLD===3?BARKS3:WORLD===2?BARKS2:BARKS)){ if(!COMP.done[bx]&&tx>=bx){ COMP.done[bx]=true; compBark(txt2); } }
}
function lyraDialog(){
  return {id:'lyra',spr:'lyra',x:COMP.x-32,y:COMP.y-72,lines:(WORLD===6?LYRA_TALK6:WORLD===5?LYRA_TALK5:WORLD===4?LYRA_TALK4:WORLD===3?LYRA_TALK3:WORLD===2?LYRA_TALK2:LYRA_TALK)[GAME.area]||["Blijf bij me in de buurt."]};
}
function drawCompanion(cx,cy){
  if(!COMP.active) return;
  const spr=COMP.moving?NPCSPR.lyraWalk[Math.floor(COMP.anim*8)%2]:NPCSPR.lyra;
  const X=Math.round(COMP.x-32-cx), Y=Math.round(COMP.y-71-cy);
  ctx.save(); if(COMP.face>0){ ctx.translate(X+64,Y); ctx.scale(-1,1); ctx.drawImage(spr,0,0); } else ctx.drawImage(spr,X,Y); ctx.restore();
  if(COMP.near&&GAME.mode==='play'&&COMP.barkT<=0) bubble(X+32,Y-6,'E');
  if(COMP.barkT>0){
    const lines=wrap(COMP.bark,230,12), w=250, h=lines.length*16+12;
    const bx=Math.max(8,Math.min(VW-w-8,X+32-w/2)), by=Y-h-10;

    panel(bx,by,w,h,'#efe6d4'); lines.forEach((l,i)=>txt(l,bx+10,by+7+i*16,12,PAL.ink,'left',null));
    ctx.globalAlpha=1;
  }
}

/* inwoners: draaien Milo de rug toe, deinzen terug als hij dichtbij komt en schrikken van spreuken */
function updateNPCs(dt){
  for(const n of NPCS){
    if(n.home==null){ n.home=n.x; n.ox=0; n.hop=0; n.hopV=0; }
    if(n.id==='lyra'||n.tablet||WORLD>=2) continue;
    const d=PL.x+PL.w/2-(n.home+32);
    const want = !n.talked && Math.abs(d)<140 ? -Math.sign(d)*22 : 0;
    n.ox+=(want-n.ox)*Math.min(1,dt*4); n.x=n.home+n.ox;
    if(n.hop>0||n.hopV){ n.hopV+=1400*dt; n.hop-=n.hopV*dt; if(n.hop<=0){ n.hop=0; n.hopV=0; } }
  }
}
function npcFlinch(x){
  if(WORLD>=2) return;
  for(const n of NPCS) if(!n.tablet && n.id!=='lyra' && Math.abs(n.x+32-x)<260 && n.hop===0){ n.hop=0.01; n.hopV=-260; }
}

<script>/* js/save.js */
// save.js — voortgang bewaren bij elk Stormaltaar (localStorage)
const SAVE_KEY='milo_stormloper_w1';
function storage(){ try{ const s=window.localStorage; s.setItem('__t','1'); s.removeItem('__t'); return s; }catch(e){ return null; } }
function hasSave(){ const s=storage(); return !!(s&&s.getItem(SAVE_KEY)); }
function clearSave(){ const s=storage(); if(s) s.removeItem(SAVE_KEY); }
function saveGame(){
  const s=storage(); if(!s){ hint('nosave','Let op: deze browseromgeving staat opslaan niet toe.'); return; }
  const data={v:1, world:WORLD,
    altar:ALTARS.indexOf(GAME.checkpointAltar),
    unlocked:PL.unlocked, slots:PL.slots,
    groups:SWITCHES.filter(w=>w.on).map(w=>w.group),
    map:MAP.map(r=>r.join('')), found:COLLECT.filter(c=>c.taken).map(c=>c.id), maxHp:PL.maxHp,
    orbs:ORBS.filter(o=>o.taken).map(o=>o.spell),
    talked:NPCS.filter(n=>n.talked).map(n=>n.id).concat(COMP.active?['lyra']:[]),
    comp:COMP.active, barks:Object.keys(COMP.done),
    hints:GAME.hints, seenAltar:GAME.seenAltar, time:GAME.time, w3:GAME.w3||null, w4:GAME.w4||null, w5:GAME.w5||null, w6:GAME.w6||null};
  try{ s.setItem(SAVE_KEY,JSON.stringify(data)); GAME.savedT=2.2; }catch(e){}
}
function loadGame(){
  const s=storage(); if(!s) return false;
  let d; try{ d=JSON.parse(s.getItem(SAVE_KEY)); }catch(e){ return false; }
  if(!d||d.v!==1) return false;
  WORLD=d.world||1; GAME.w3=d.w3||null; GAME.w4=d.w4||null; GAME.w5=d.w5||null; GAME.w6=d.w6||null;
  newGame();
  for(const g of d.groups){
    for(const k in GROUP){ if(GROUP[k]!==g) continue; const [x,y]=k.split(',').map(Number);
      if(MAP[y][x]==='G') MAP[y][x]='.'; if(MAP[y][x]==='D') MAP[y][x]='b'; }
    for(const w of SWITCHES) if(w.group===g) w.on=true;
  }
  // alleen tegels die tijdens het spelen veranderen (poorten, bruggen, gebarsten en holle stenen) uit de save halen
  if(d.map&&d.map.length===LH) for(let y=0;y<LH;y++) for(let x=0;x<LW;x++) if('GDCFf'.includes(MAP[y][x])&&d.map[y][x]&&'.b'.includes(d.map[y][x])) MAP[y][x]=d.map[y][x];
  for(const c of COLLECT) if((d.found||[]).includes(c.id)) c.taken=true;
  if(d.maxHp) PL.maxHp=d.maxHp;
  for(const o of ORBS) if(d.orbs.includes(o.spell)) o.taken=true;
  for(const n of NPCS) if(d.talked.includes(n.id)) n.talked=true;
  PL.unlocked=d.unlocked; PL.slots=d.slots;
  const a=ALTARS[d.altar];
  if(a){ GAME.checkpointAltar=a; a.lit=true; GAME.checkpoint={x:a.x+13,y:a.y+64-PL.h}; resetPlayerKeep(GAME.checkpoint.x,GAME.checkpoint.y); PL.inv=0; }
  if(d.comp){ const ly=NPCS.find(n=>n.id==='lyra'); joinCompanion(ly||{x:PL.x-90,y:PL.y+PL.h-72}); for(const b of d.barks) COMP.done[b]=true; snapCompanion(); }
  GAME.hints=d.hints||{}; GAME.seenAltar=!!d.seenAltar; GAME.time=d.time||0;
  GAME.cam.x=Math.max(0,Math.min(LW*T-VW,PL.x-VW/2)); GAME.cam.y=Math.max(0,Math.min(LH*T-VH,PL.y-300));
  return true;
}
function saveWorld(){ const s=storage(); if(!s) return 1; try{ const d=JSON.parse(s.getItem(SAVE_KEY)); return (d&&d.world)||1; }catch(e){ return 1; } }
</script>

<script>/* js/world2.js */
// world2.js — Wereld 2: nieuwe spreuken, storm, drijfzand, karavaan, vijanden en de Spiegelslang
Object.assign(SPELLS,{
  shield:{name:'Stormschild', icon:'shield', cd:0, desc:'Houd de toets ingedrukt. Kaatst splinters en licht terug en houdt de storm tegen. Geen andere spreuken zolang hij aan staat.'},
  grip:{name:'Magneetgreep', icon:'grip', cd:0.35, desc:'Trek jezelf naar een bronzen ring in de buurt. Werkt ook in de lucht.'}
});
let ANCHORS=[], DMIRS=[], STORMS=[], PLATS=[], EPROJ=[], SERP=null, TILE1=null;
const ARENA2={x0:243*T, x1:296*T};

function applyWorldTiles(){
  if(!TILE1) TILE1={stone:TILE.stone,stoneTop:TILE.stoneTop,sand:TILE.sand,sandTop:TILE.sandTop,crack:TILE.crack,plank:TILE.plank,back:BACKTILE};
  const s=WORLD===6?TILE6:WORLD===5?TILE5:WORLD===4?TILE4:WORLD===3?TILE3:WORLD===2?TILE2:TILE1;
  TILE.stone=s.stone; TILE.stoneTop=s.stoneTop; TILE.sand=s.sand; TILE.sandTop=s.sandTop; TILE.crack=s.crack; TILE.plank=s.plank||TILE1.plank; BACKTILE=s.back;
}
function startWorld2(){
  const keep={unlocked:[...PL.unlocked], slots:[...PL.slots], maxHp:PL.maxHp};
  GAME.w1Shards=GAME.finalShards||0; GAME.w1Time=GAME.finalTime||0;
  WORLD=2; newGame(true);
  PL.unlocked=keep.unlocked; PL.slots=keep.slots; PL.maxHp=keep.maxHp; PL.hp=PL.maxHp;
  joinCompanion({x:PL.x-90,y:PL.y+PL.h-72});
  GAME.state='play';
  GAME.banner={title:'WERELD 2',sub:'De Glasvlakte',t:3.2,boss:true};
  saveGame();
}

/* ---------- spawnen ---------- */
function w2Init(){ ANCHORS=[];DMIRS=[];STORMS=[];PLATS=[];EPROJ=[];SERP=null; if(WORLD>=2) BOSS=null; if(typeof w3Init==='function') w3Init(); if(typeof w4Init==='function') w4Init(); if(typeof w5Init==='function') w5Init(); if(typeof w6Init==='function') w6Init(); }
function w2Spawn(e,fx,fy){
  if(e.type==='beetle') ENEMIES.push({kind:'beetle',x:fx-20,y:fy-26,w:40,h:26,vx:0,vy:0,dir:-1,hp:3,flash:0,t:Math.random()*2,fire:1+Math.random()});
  if(e.type==='shark') ENEMIES.push({kind:'shark',x:fx-30,y:fy-28,w:60,h:28,x0:e.x0*T,x1:e.x1*T,floor:fy,vx:0,vy:0,hp:2,flash:0,t:0,under:true,cool:1,ldir:1});
  if(e.type==='cwisp') ENEMIES.push({kind:'cwisp',x:fx-15,y:fy-26,w:30,h:26,hx:fx-15,hy:fy-26,hp:1,flash:0,t:Math.random()*6});
  if(e.type==='anchor') ANCHORS.push({x:fx,y:e.ty*T+16});
  if(e.type==='dmir') DMIRS.push({x:fx,y:e.ty*T+16,d:e.d});
  if(e.type==='storm') STORMS.push({x0:e.tx*T,x1:e.x1*T+T,dir:e.dir});
  if(e.type==='turtle') PLATS.push({x:e.x0*T,y:400,w:148,x0:e.x0*T,x1:e.x1*T,vx:55,pause:1,dx:0,t:0});
  if(e.type==='serpent') makeSerpent();
}

/* ---------- Milo: storm, drijfzand, karavaan ---------- */
function stormActive(){ return (GAME.time%2.8)<2.2; }
function w2PrePhys(p,dt){
  p.pb=p.y+p.h;
  if(p.onPlat) p.x+=p.onPlat.dx;
  p.onPlat=null; p.push=0;
  const cx=p.x+p.w/2;
  for(const s of STORMS) if(cx>s.x0&&cx<s.x1&&stormActive()){
    if(p.shieldT>0) continue;
    p.push=s.dir*300; p.vx+=p.push;
    hint('storm', PL.unlocked.includes('shield')&&!PL.slots.includes('shield') ? 'De storm duwt je terug. Zet Stormschild in een slot bij het altaar.' : 'De storm duwt je terug. Houd je Stormschild ingedrukt en loop door.');
  }
  p.qs=rectTile(p.x+3,p.y+p.h-4,p.w-6,6,'Q');
  if(p.qs){ if(p.vy>45) p.vy=45; p.vx=Math.max(-110,Math.min(110,p.vx)); p.coyote=0.12; hint('qs','Drijfzand! Blijf springen om eruit te komen.'); }
  if(rectTile(p.x+6,p.y+6,p.w-12,6,'Q')){ hurtPlayer(1,null,true); }
}
function w2PostPhys(p,dt){
  if(p.push) p.vx-=p.push; p.push=0;
  for(const pl of PLATS){
    if(p.vy>=0 && p.x+p.w>pl.x+4 && p.x<pl.x+pl.w-4 && p.pb<=pl.y+6 && p.y+p.h>=pl.y){ p.y=pl.y-p.h; p.vy=0; p.onGround=true; p.onPlat=pl; }
  }
}

/* ---------- spreuken ---------- */
function w2Cast(id){
  const p=PL;
  if(id==='shield'){ p.shieldT=1.2; p.castT=0.18; SFX.blink(); tone('triangle',220,660,0.3,0.15); RINGS.push({x:p.x+p.w/2,y:p.y+p.h-6,r:10,life:0.3,max:60}); }
  if(id==='grip'){
    const c=playerCenter(); let best=null, bd=1e9;
    const cands=ANCHORS.concat(SERP&&SERP.collar?[SERP.collar]:[]);
    for(const a of cands){ const dx=a.x-c.x, dy=a.y-c.y, d=Math.hypot(dx,dy);

/* ---------- bliksem en spiegels ---------- */
function w2BoltStep(b){

      b.up=b.vy!==0; b.w=b.up?10:16; b.h=b.up?16:10; b.x=m.x-b.w/2; b.y=m.y-b.h/2;

function w2BoltReflect(b){

/* ---------- elke frame ---------- */
function w2Update(dt){
  for(const pl of PLATS){ pl.t+=dt; const ox=pl.x;
    if(pl.pause>0) pl.pause-=dt;
    else { pl.x+=pl.vx*dt; if(pl.x>pl.x1){ pl.x=pl.x1; pl.vx=-Math.abs(pl.vx); pl.pause=1.6; } if(pl.x<pl.x0){ pl.x=pl.x0; pl.vx=Math.abs(pl.vx); pl.pause=1.6; } }
    pl.dx=pl.x-ox; }
  const c=playerCenter();
  for(const p of EPROJ){
    p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(rectSolid(p.x,p.y,p.w,p.h,true)) p.life=0;
    if(!p.friendly){
      if(PL.shieldT>0&&Math.hypot(p.x+p.w/2-c.x,p.y+p.h/2-c.y)<50){ p.vx=-p.vx*1.4; p.vy=-p.vy; p.friendly=true; SFX.tink(); sparks(p.x+8,p.y+4,8,PAL.boltC); }
      else if(overlap(PL,p)){ hurtPlayer(1,p.x+p.w/2); p.life=0; }
    } else if(damageArea(p,2,'bolt')) p.life=0;
  }
  EPROJ=EPROJ.filter(p=>p.life>0);
  if(SERP) updateSerpent(dt);
}

/* ---------- DE SPIEGELSLANG ---------- */
function makeSerpent(){ SERP={state:'sleep',t:0,cycle:1,hp:4,rip:270*T,bx:0,bdir:1,breaches:0,fires:0,side:1,sx:0,hx:0,hy:0,collar:null,beam:null,refl:false,flash:0,tgt:{x:0,y:0},segs:[]}; }
function w2ResetBoss(){ if(!SERP||SERP.state==='dead') return; const c=SERP.cycle; makeSerpent(); SERP.cycle=c; GATE4_LOCKED=false; EPROJ=[]; HAZ=[]; PL.attach=null; PL.zip=null; }
const SFLOOR=15*T;
function serpTo(state,t){ SERP.state=state; SERP.t=t; }
function updateSerpent(dt){
  const S=SERP; S.t-=dt; S.flash=Math.max(0,S.flash-dt);
  const px=PL.x+PL.w/2, mid=(ARENA2.x0+ARENA2.x1)/2;
  S.collar=null; S.segs=[];

  if(S.state==='intro'){ if(S.t<=0){ S.rip=mid; serpTo('burrow',1.2); hint('serp','Kijk naar het zand: waar het opbolt, schiet ze omhoog. Spring weg!'); } return; }
  // ---- onder de grond: kiest elke keer willekeurig een aanval ----
  if(S.state==='burrow'){ S.rip+=Math.sign(px-S.rip)*Math.min(Math.abs(px-S.rip),(S.fast?320:170+S.cycle*30)*dt); S.rip=Math.max(ARENA2.x0+80,Math.min(ARENA2.x1-80,S.rip));
    if(Math.random()<0.5) PARTS.push({x:S.rip+(Math.random()-.5)*50,y:SFLOOR-2,vx:(Math.random()-.5)*80,vy:-60-Math.random()*60,life:0.4,col:P2.gsL,s:3,g:300});
    if(S.t<=0) serpChoose(); }
  else if(S.state==='warn'){ shake(2); if(Math.random()<0.8) PARTS.push({x:S.bx+(Math.random()-.5)*90,y:SFLOOR-2,vx:(Math.random()-.5)*120,vy:-120-Math.random()*120,life:0.5,col:P2.gsD,s:4,g:500});
    if(S.t<=0){ serpTo('breach',S.fast?0.95:1.2); S.bt=S.t; SFX.boss(); shake(10); } }
  else if(S.state==='breach'){
    const prog=(1-S.t/S.bt)*1.9;
    for(let i=0;i<12;i++){ const u=prog-i*0.075; if(u<0||u>1) continue; S.segs.push({x:S.bx+S.bdir*320*u,y:SFLOOR+30-Math.sin(Math.PI*u)*250,r:i===0?30:22,head:i===0,dir:S.bdir,tilt:-0.6*Math.cos(Math.PI*u)}); }
    if(S.t<=0){ S.breaches++; S.rip=S.bx+S.bdir*320;
      if(S.combo>0){ S.combo--; S.fast=true; S.rip=Math.max(ARENA2.x0+80,Math.min(ARENA2.x1-80,px)); startWarn(0.6); }
      else afterUnder(); } }
  else if(S.state==='spikes'){
    for(const k of S.spk){ const lt=S.st-S.t-k.d; k.on=lt>0.75&&lt<1.0;
      if(lt>0.75&&!k.boom){ k.boom=true; SFX.tink(); shake(3); for(let i=0;i<6;i++) PARTS.push({x:k.x+(Math.random()-.5)*20,y:SFLOOR-4,vx:(Math.random()-.5)*160,vy:-Math.random()*260,life:0.5,col:i%2?'#ffffff':P2.glM,s:4,g:800}); }
      if(k.on&&Math.abs(px-k.x)<24&&PL.y+PL.h>SFLOOR-86) hurtPlayer(1,k.x); }
    if(S.t<=0){ S.breaches++; afterUnder(); } }
  // ---- boven de grond: beam (terugkaatsen!), glasregen of splinterwaaier ----
  else if(['rise','aim','fire','rain','volley','stunned','grabbed','dive','dying'].includes(S.state)){
    let e=1, hyT=SFLOOR-235;
    if(S.state==='rise') e=1-Math.max(0,S.t)/0.9;
    if(S.state==='dive') e=Math.max(0,S.t)/0.8;
    if(S.state==='stunned'||S.state==='grabbed'||S.state==='dying') hyT=SFLOOR-150;
    const sway=Math.sin(GAME.time*(S.state==='grabbed'?7:2))*(S.state==='grabbed'?22:10)+(S.state==='rain'?Math.sin(GAME.time*9)*14:0);
    S.hx=S.sx-S.side*70+sway; S.hy=SFLOOR+40-(SFLOOR+40-hyT)*e;
    const bx=S.sx, by=SFLOOR+30, cx2=S.sx, cy2=(by+S.hy)/2;
    for(let i=0;i<=9;i++){ const u=i/9, x=(1-u)*(1-u)*bx+2*(1-u)*u*cx2+u*u*S.hx, y=(1-u)*(1-u)*by+2*(1-u)*u*cy2+u*u*S.hy; S.segs.push({x,y,r:i===9?30:22,head:i===9,dir:-S.side,tilt:0}); }
    S.segs.reverse();
    if(S.state==='stunned'||S.state==='grabbed'){ const n=S.segs[2]; S.collar={x:n.x,y:n.y,boss:true,side:S.side}; }
    if(S.state==='rise'&&S.t<=0){ S.fires=0; S.didBeam=false; S.maxFires=1+S.cycle+(Math.random()<.5?1:0); surfaceNext(); }
    if(S.state==='aim'){ if(S.t>S.lock){ S.tgt={x:px,y:PL.y+PL.h/2}; } if(S.t<=0){ serpTo('fire',0.5); S.refl=false; SFX.bolt(); shake(6); } }
    if(S.state==='fire'){
      const dx=S.tgt.x-S.hx, dy=S.tgt.y-S.hy, d=Math.hypot(dx,dy)||1, ux=dx/d, uy=dy/d;
      S.beam={x0:S.hx,y0:S.hy,ux,uy,len:1300};
      if(!S.refl){ for(let s=40;s<1300;s+=10){ const bx2=S.hx+ux*s, by2=S.hy+uy*s;
          if(bx2>PL.x-6&&bx2<PL.x+PL.w+6&&by2>PL.y-6&&by2<PL.y+PL.h+6){
            if(PL.shieldT>0){ S.refl=true; S.beam.len=s; SFX.unlock(); shake(10); sparks(bx2,by2,20,'#ffffff'); }
            else { hurtPlayer(1,S.hx); S.beam.len=s; } break; } } }
      else S.beam.len=Math.min(S.beam.len,Math.hypot(PL.x+PL.w/2-S.hx,PL.y+PL.h/2-S.hy));

          if(!PL.slots.includes('grip')) hint('needgrip','Je hebt Magneetgreep nodig. Het altaar in de arena kan helpen.',true); }
        else { S.fires++; surfaceNext(); } } }
    if(S.state==='rain'){ if(S.t<=0){ S.fires++; surfaceNext(); } }
    if(S.state==='volley'){ if(S.vol>0&&S.t<S.nextVol){ S.vol--; S.nextVol-=0.45; shardFan(S.vol%2?0.11:0); } if(S.t<=0){ S.fires++; surfaceNext(); } }
    if(S.state==='stunned'&&S.t<=0) serpTo('dive',0.8);
    if(S.state==='grabbed'&&S.t<=0){ detachPlayer(); serpTo('dive',0.8); }
    if(S.state==='dive'&&S.t<=0){ S.breaches=0; S.fast=false; S.rip=S.sx; serpTo('burrow',0.5+Math.random()*0.9); }
    if(S.state==='dying'){ if(Math.random()<0.5){ sparks(S.hx+(Math.random()-.5)*160,SFLOOR-Math.random()*200,10,Math.random()<.5?'#ffffff':P2.puL); SFX.tink(); } shake(4);
      if(S.t<=0){ serpTo('dead',0); GATE4_LOCKED=false; GAME.winT=3; HAZ=[]; compBark('Ze is stil. Het glas zingt niet meer.',3); for(let i=0;i<60;i++) sparks(S.hx,S.hy,1,P2.puL); } }
  }
  updateHazards(dt,SFLOOR);
  // aanraken doet pijn, behalve als ze verdoofd is
  if(!['stunned','grabbed','dying','dead','sleep','intro','burrow','warn','spikes'].includes(S.state))
    for(const g of S.segs){ if(Math.hypot(px-g.x,PL.y+PL.h/2-g.y)<g.r+12){ hurtPlayer(1,g.x); break; } }
}
function startWarn(w){ const S=SERP; S.bx=S.rip;
  S.bdir=S.rip+320>ARENA2.x1-40?-1:S.rip-320<ARENA2.x0+40?1:(Math.random()<.5?-1:1);
  serpTo('warn',w); SFX.crumble(); tone('sawtooth',120,60,w,0.12); }

  const S=SERP, r=Math.random();

function doLeap(p){
  if(p.leapUsed||p.zip||p.attach) return false;
  p.leapUsed=true; p.vy=-600; p.cut=false; p.jbuf=0; p.slam=false;
  for(let i=0;i<12;i++) PARTS.push({x:p.x+p.w/2+(Math.random()-.5)*20,y:p.y+p.h,vx:(Math.random()-.5)*160,vy:Math.random()*120,life:0.35,col:i%2?PAL.boltC:PAL.bolt,s:3,g:0});

  return true;
}
function w3PrePhys(p){
  p.ice = p.onGround && rectTile(p.x,p.y+p.h,p.w,3,'I');

}

function w3Tile(c,X,Y,open){
  if(c==='I'){ ctx.drawImage(TILE3.ice,X,Y); return true; }
  if(c==='K'){ ctx.drawImage(TILE3.wall,X,Y); return true; }
  if(c==='J'){ if(DUELLOCK){ ctx.globalAlpha=0.85; ctx.drawImage(TILE3.wall,X,Y); ctx.globalAlpha=1; } return true; }
  if(c==='~'){ ctx.fillStyle='#2c4a63'; ctx.fillRect(X,Y,T,T); ctx.fillStyle='rgba(120,170,200,0.35)'; for(let i=0;i<3;i++) ctx.fillRect(X+((i*11+Math.floor(GAME.time*8))%30),Y+6+i*9,5,2); return true; }
  return false;
}
function isaRect(){ return {x:ISA.x-12,y:ISA.y-48,w:24,h:48}; }
function w3Hit(hb,dmg,src){
  if(ISA&&ISA.mode==='duel'&&ISA.inv<=0&&overlap(hb,isaRect())){ hurtIsa(dmg>1?2:1); return true; }
  if(EAGLE&&EAGLE.state==='frozen'){ const r={x:EAGLE.x-60,y:EAGLE.y-70,w:120,h:100};
    if(overlap(hb,r)){ if(src==='staff'){ if(PL.hitList.includes(EAGLE)) return false; PL.hitList.push(EAGLE); } hurtEagle(1); return true; } }
  if(EAGLE&&['fly','feathers','gust','diveWarn'].includes(EAGLE.state)&&src==='bolt'&&overlap(hb,{x:EAGLE.x-50,y:EAGLE.y-50,w:100,h:90})){
    SFX.tink(); sparks(hb.x+hb.w/2,hb.y+hb.h/2,6,'#e6dcc8'); hint('eagleair','In de lucht is hij te snel. Wacht tot Isa hem bevriest na zijn duikvlucht.'); return true; }
  return false;
}
function w3Shock(x,y,rad){
  if(ISA&&ISA.mode==='duel'&&ISA.inv<=0&&Math.abs(ISA.x-x)<rad&&Math.abs(ISA.y-y)<80){ hurtIsa(2); }
  if(EAGLE&&EAGLE.state==='frozen'&&Math.abs(EAGLE.x-x)<rad+60&&Math.abs(EAGLE.y-y)<140){ hurtEagle(3); }
}

/* ---------- vijanden ---------- */
function w3Enemy(e,dt){
  if(e.kind!=='wolf') return;
  e.cool-=dt; e.lunge=Math.max(0,e.lunge-dt);
  const dx=PL.x+PL.w/2-(e.x+e.w/2), dy=PL.y+PL.h-(e.y+e.h);
  if(e.lunge<=0){
    if(Math.abs(dx)<240&&Math.abs(dy)<70){ e.dir=Math.sign(dx)||e.dir; if(e.cool<=0&&e.onGround){ e.lunge=0.7; e.cool=1.8; e.vx=e.dir*400; e.vy=-320; tone('sawtooth',300,160,0.15,0.08); } else e.vx+=(e.dir*40-e.vx)*Math.min(1,dt*6); }
    else e.vx+=(e.dir*60-e.vx)*Math.min(1,dt*6);
  }
  e.vy=Math.min(900,e.vy+1900*dt); moveBody(e,dt);
  if(e.lunge<=0){ if(e.hitWall) e.dir*=-1;
    const ax=Math.floor((e.dir>0?e.x+e.w+2:e.x-2)/T), ay=Math.floor((e.y+e.h+4)/T);
    if(e.onGround&&!solidAt(ax,ay)&&tileAt(ax,ay)!=='-'){ e.dir*=-1; e.vx=0; } }
  else if(e.onGround&&e.lunge<0.5) e.lunge=0;
}
function w3DrawEnemy(e,X,Y,f){
  if(e.kind==='cwisp'&&e.hue==='frost'){ ctx.filter=e.flash>0?'brightness(2.2)':'saturate(0.3) brightness(1.35)'; ctx.drawImage(ENEMY.wisp[f],X-7,Y-8); ctx.filter='none'; return true; }
  if(e.kind!=='wolf') return false;
  const s=e.lunge>0?ENEMY3.wolfLunge:ENEMY3.wolf[Math.floor(e.t*(Math.abs(e.vx)>80?10:5))%2]; if(e.flash>0) ctx.filter='brightness(2.2)';
  ctx.save(); if(e.dir<0){ ctx.translate(X+e.w/2,0); ctx.scale(-1,1); ctx.drawImage(s,-33,Y-12); } else ctx.drawImage(s,X+e.w/2-33,Y-12); ctx.restore(); ctx.filter='none';
  return true;
}

/* ---------- Isa ---------- */
function groundTop(x,fallback){ const tx=Math.floor(x/T); for(let ty=5;ty<LH;ty++){ const c=tileAt(tx,ty); if(c==='~') return fallback; if(solidAt(tx,ty)||c==='-') return ty*T; } return fallback; }
function isaDialog(lines,onEnd){ openDialog({id:'isa',spr:'isa',x:ISA.x-32,y:ISA.y-72,lines,onEnd}); }
function w3Count(dt){
  RACE.t-=dt; const n=Math.ceil(RACE.t);
  if(n!==RACE.last){ RACE.last=n; if(n>0) tone('square',440,440,0.12,0.12); else tone('square',880,880,0.25,0.15); }
  if(RACE.t<=0){ GAME.mode='play'; ISA.mode='race'; RACE.go=true; RACE.goT=0.8; }
}
function raceStart(){
  PL.x=ISA.x-60; PL.vx=0; PL.face=1; ISA.face=1;
  RACE={t:3.2,last:4,go:false,winner:null,goT:0,doneT:0}; GAME.mode='count';
}
function startDuel(){ ISA.mode='duel'; ISA.hp=10; ISA.st='idle'; ISA.stT=1.0; ISA.spikes=[]; DUELLOCK=true; SFX.boss(); shake(6); }
function clearIceWalls(){ for(let y=0;y<LH;y++) for(let x=96;x<=128;x++) if(MAP[y][x]==='K') MAP[y][x]='.'; }
function hurtIsa(n){
  ISA.hp-=n; ISA.inv=0.55; ISA.flash=0.15; SFX.hit(); sparks(ISA.x,ISA.y-24,10,'#cfeefc');
  if(Math.random()<0.4) isaBark(['Au!','Niet slecht!','Hé! Mijn mantel!','Oké, die was goed.'][Math.floor(Math.random()*4)],1.4);
  if(ISA.hp<=0){ ISA.mode='yield'; ISA.spikes=[]; EPROJ=EPROJ.filter(p=>!p.ice); clearIceWalls();
    const S=w3State(); const lines=[...DIALOG.isa3]; if(S.race==='isa') lines.splice(2,0,"En hier. Die scherf. Eerlijk is eerlijk.");
    isaDialog(lines,()=>{ DUELLOCK=false; S.duel=true; S.score[0]++; if(S.race==='isa') giveShard('w3s1'); ISA.mode='leave'; }); }
}
function giveShard(id){ let c=COLLECT.find(q=>q.id===id); if(!c){ c={kind:'shard',id,x:-999,y:-999,w:24,h:28,t:0}; COLLECT.push(c); } if(c.taken) return; c.taken=true; c.x=PL.x; c.y=PL.y; collectSecret(c); c.x=-999; }
function isaUpdate(dt){
  const I=ISA; if(!I) return; const S=w3State(), px=PL.x+PL.w/2;
  I.anim+=dt; I.barkT-=dt; I.inv=Math.max(0,I.inv-dt); I.flash=Math.max(0,I.flash-dt); I.castT=Math.max(0,I.castT-dt);
  if(I.mode==='idle'){ I.face=px<I.x?-1:1; if(Math.abs(px-I.x)<120&&GAME.mode==='play'){ PL.vx=0; isaDialog(DIALOG.isa1,raceStart); } }
  else if(I.mode==='race'){
    I.face=1; RACE.goT-=dt;
    if(I.x<FINISH+40){ I.x+=(205+Math.sin(GAME.time*3)*15)*dt; const gt=groundTop(I.x,I.y); I.y+=(gt-I.y)*Math.min(1,dt*14); }
    if(!RACE.winner){ if(px>=FINISH){ RACE.winner='milo'; SFX.unlock(); } else if(I.x>=FINISH){ RACE.winner='isa'; tone('triangle',660,330,0.4,0.15); isaBark('Eerste!',2); } }
    if(RACE.winner){ RACE.doneT+=dt;
      if((I.x>=FINISH+40||RACE.doneT>4)&&px>FINISH-200&&GAME.mode==='play'){ I.mode='hut'; const win=RACE.winner==='milo'; S.race=RACE.winner; S.score[win?0:1]++;
        isaDialog(win?DIALOG.isaWin:DIALOG.isaLose,()=>{ if(win) giveShard('w3s1'); I.mode='leave'; }); } }
  }
  else if(I.mode==='leave'){ I.face=1; I.x+=180*dt; I.y=groundTop(I.x,I.y); if(I.x-GAME.cam.x>VW+80||I.x<GAME.cam.x-80||I.x>94*T){ sparks(I.x,I.y-30,10,'#cfeefc'); I.mode='gone'; } }
  else if(I.mode==='gone'){ if(S.race&&!S.duel&&DUELSPOT&&px>86*T&&px<100*T){ Object.assign(I,{mode:'duelwait',x:DUELSPOT.x,y:DUELSPOT.y,hp:10}); }
    else if(S.duel&&TOPSPOT&&px>236*T){ Object.assign(I,{mode:S.top?'ally':'top',x:TOPSPOT.x,y:TOPSPOT.y}); } }
  else if(I.mode==='duelwait'){ I.face=px<I.x?-1:1; if(px>101*T&&GAME.mode==='play'){ PL.vx=0; if(!I.talked2){ I.talked2=true; isaDialog(DIALOG.isa2,startDuel); } else { isaBark('Nog een keer? Kom maar op.',2); startDuel(); } } }
  else if(I.mode==='duel') isaDuel(dt);
  else if(I.mode==='top'){ I.face=1; if(Math.abs(px-I.x)<140&&GAME.mode==='play'){ I.mode='ally'; S.top=true; isaDialog(DIALOG.isa4); } }
  else if(I.mode==='ally'){ I.face=EAGLE&&EAGLE.x<I.x?-1:1; }
}
function isaDuel(dt){
  const I=ISA, px=PL.x+PL.w/2;
  I.stT-=dt;
  for(const k of I.spikes){ k.t+=dt; k.on=k.t>0.7&&k.t<0.95; if(k.t>0.7&&!k.boom){ k.boom=true; SFX.tink(); for(let i=0;i<6;i++) PARTS.push({x:k.x,y:FLOOR3-4,vx:(Math.random()-.5)*160,vy:-Math.random()*240,life:0.5,col:'#ffffff',s:3,g:800}); }
    if(k.on&&Math.abs(px-k.x)<22&&PL.y+PL.h>FLOOR3-80) hurtPlayer(1,k.x); }
  I.spikes=I.spikes.filter(k=>k.t<1.2);
  if(I.st==='skate'){ const d=I.tx-I.x; I.face=Math.sign(d)||I.face; I.x+=Math.sign(d)*Math.min(Math.abs(d),440*dt);
    if(Math.random()<0.7) PARTS.push({x:I.x,y:FLOOR3-2,vx:-I.face*60,vy:-30,life:0.3,col:'#ffffff',s:3,g:100});
    if(Math.abs(d)<4){ I.st='idle'; I.stT=0.45; } return; }
  I.face=px<I.x?-1:1;
  if(I.st==='aim'&&I.stT<=0){ I.castT=0.3; const n=I.hp<5?5:3;
    for(let i=0;i<n;i++){ const a=Math.atan2(PL.y+PL.h/2-(I.y-30),px-I.x)+(i-(n-1)/2)*0.16; EPROJ.push({x:I.x-8,y:I.y-34,w:16,h:8,vx:Math.cos(a)*330,vy:Math.sin(a)*330,life:2.5,friendly:false,ice:true}); }
    tone('triangle',1500,1000,0.12,0.08); I.st='idle'; I.stT=0.9; return; }
  if(I.st!=='idle'||I.stT>0) return;
  const r=Math.random(), walls=countIceWalls();
  if(r<0.28){ I.st='skate'; I.tx=I.x>(LAKE.x0+LAKE.x1)/2?LAKE.x0+80+Math.random()*120:LAKE.x1-80-Math.random()*120; }
  else if(r<0.6){ I.st='aim'; I.stT=0.5; I.castT=0.5; }
  else if(r<0.8&&walls<2){ const tx=Math.floor(((I.x+px)/2)/T); if(Math.abs(tx*T-px)>48&&Math.abs(tx*T-I.x)>48){ for(let y=12;y<=14;y++) if(MAP[y][tx]==='.') MAP[y][tx]='K'; I.castT=0.4; SFX.tink(); sparks(tx*T+16,13*T,14,'#ffffff'); hint('icewall','Ijsmuur! Breek hem met een Bliksemschicht of Donderslag, of spring eroverheen.'); }
    I.st='idle'; I.stT=0.8; }
  else { const n=I.hp<5?4:3; for(let i=0;i<n;i++) I.spikes.push({x:px+(i?(Math.random()-.5)*160:0),t:-i*0.32,boom:false,on:false}); I.castT=0.5; tone('sine',300,120,0.5,0.08); I.st='idle'; I.stT=1.4; }
}
function countIceWalls(){ let n=0; for(let x=96;x<=128;x++) if(MAP[14][x]==='K') n++; return n; }

/* ---------- lawine ---------- */
function avalUpdate(dt){
  const A=AVAL; if(!A||A.done) return;
  const px=PL.x+PL.w/2;
  if(!A.active){ if(px>153*T&&px<A.end){ A.active=true; A.x=A.x0; A.t=0; SFX.boss(); shake(10); GAME.banner={title:'LAWINE!',sub:'Rennen!',t:1.6,boss:true}; } return; }
  A.t+=dt; A.x+=(200+Math.min(40,A.t*6))*dt; shake(2);
  if(Math.random()<0.6) PARTS.push({x:A.x+Math.random()*20,y:FLOOR3-Math.random()*300,vx:120+Math.random()*120,vy:-Math.random()*60,life:0.5,col:'#ffffff',s:4,g:300});
  if(px>A.end+T){ A.done=true; A.active=false; shake(16); SFX.crumble(); compBark('Dat was... dichtbij.',2.5); return; }
  if(A.x>PL.x-6&&!GAME.dying){ A.active=false; PL.hp-=1; SFX.hurt(); shake(10);
    if(PL.hp<=0) playerDie(); else { const c=GAME.checkpoint; PL.x=c.x; PL.y=c.y; PL.vx=PL.vy=0; PL.inv=1.2; snapCompanion(); toast('De lawine haalde je in. Nog een keer!'); } }
}
function drawAvalanche(cx,cy){
  const A=AVAL; if(!A||!A.active) return; const X=Math.round(A.x-cx);
  if(X<-40) return;
  ctx.fillStyle='rgba(240,245,250,0.96)'; ctx.fillRect(0,0,Math.max(0,X-30),VH);
  for(let i=0;i<14;i++){ const y=i*42-((GAME.time*120)%42), r=34+Math.sin(GAME.time*6+i)*8; ctx.fillStyle=i%2?'#ffffff':'#e2eaf2'; ctx.beginPath(); ctx.arc(X-30+Math.sin(GAME.time*5+i*1.7)*10,y,r,0,7); ctx.fill(); }
  ctx.fillStyle=P3.snowS; for(let i=0;i<6;i++){ const y=FLOOR3-cy-20-i*55; ctx.fillRect(X-50+Math.round(Math.sin(GAME.time*9+i)*8),y,14,10); }
}

/* ---------- de Bergarend ---------- */
const EAGLE_HP=18;
function eaglePhase(hp){ return hp>12?1:hp>6?2:3; }
function eagleUpdate(dt){
  const E=EAGLE; if(!E) return; const px=PL.x+PL.w/2, mid=(ARENA3.x0+ARENA3.x1)/2;
  E.t-=dt; E.anim+=dt; E.flash=Math.max(0,E.flash-dt); GUST.t=Math.max(0,GUST.t-dt);
  const phase=eaglePhase(E.hp);
  if(E.state!=='sleep') updateHazards(dt,FLOOR3);
  // in fase 3 strooit hij af en toe losse veren terwijl hij rondvliegt
  if(phase===3&&E.state==='fly'&&Math.random()<dt*0.9){ const a=Math.atan2(PL.y+PL.h/2-E.y,px-E.x); EPROJ.push({x:E.x-12,y:E.y-6,w:22,h:10,vx:Math.cos(a)*320,vy:Math.sin(a)*320,life:3,friendly:false,feather:true}); }
  const fly=(tx,ty,k)=>{ E.x+=(tx-E.x)*Math.min(1,dt*k); E.y+=(ty-E.y)*Math.min(1,dt*k); E.face=tx<E.x-2?-1:tx>E.x+2?1:E.face; };
  if(E.state==='sleep'){ if(px>261*T&&GAME.mode==='play'){ GATE4_LOCKED=true; E.state='intro'; E.t=2.2; E.x=ARENA3.x1+120; E.y=-80; SFX.boss(); shake(12);
      GAME.banner={title:'DE BERGAREND',sub:'Koning van de top',t:2.8,boss:true}; isaBark('Daar is hij! Wacht tot hij duikt, Milo.',3); } return; }
  if(E.state==='intro'){ fly(mid+120,150,2); if(E.t<=0){ E.state='fly'; E.t=1.6; hint('eagle','Als hij duikt en landt, bevriest Isa hem. Sla hem dan met staf, bliksem of Donderslag, maar ga weg zodra het ijs rood knippert.'); } return; }
  if(E.state==='fly'){ const tx=mid+Math.sin(GAME.time*0.7)*300, ty=150+Math.sin(GAME.time*1.4)*40; fly(tx,ty,1.6);
    if(E.t<=0){ E.atk++; const r=Math.random(), last=E.last;
      // pas na een paar aanvallen duikt hij; in latere fases met schijnduiken ervoor
      if(E.atk>=(phase===1?3:4)||(E.atk>=2&&r<0.2)){ E.atk=0; E.combo=phase===1?0:phase===2?(Math.random()<0.5?1:0):1+(Math.random()<0.5?1:0); startDive(0.95); }
      else { const opts=['feathers','gust']; if(phase>=2) opts.push('swoop','rocks'); const pick=opts.filter(o=>o!==last); const o=pick[Math.floor(Math.random()*pick.length)]; E.last=o;
        if(o==='feathers'){ E.state='feathers'; E.vol=phase>=2?3:2; E.t=0.4+E.vol*0.45; E.next=E.t-0.25; }
        else if(o==='gust'){ E.state='gust'; E.t=phase===3?2.4:1.8; E.side=px<mid?1:-1; }
        else if(o==='swoop'){ E.state='swoopWarn'; E.t=0.9; E.side=Math.random()<0.5?1:-1; E.sy=FLOOR3-40; SFX.boss(); tone('sawtooth',700,1100,0.6,0.1); }
        else { E.state='rocks'; E.t=1.9; const n=phase===3?8:6; HAZ=HAZ.filter(h=>!h.ice);
          for(let i=0;i<n;i++){ const x=i===0?px:ARENA3.x0+60+Math.random()*(ARENA3.x1-ARENA3.x0-120); HAZ.push({type:'rock',ice:true,x,y:-40,vy:0,t:-i*0.16,warn:0.85,floor:FLOOR3}); }
          tone('sawtooth',500,300,0.4,0.1); } } } }
  else if(E.state==='swoopWarn'){ const sx=E.side>0?ARENA3.x1+140:ARENA3.x0-140; fly(sx,E.sy,4); E.face=-E.side; if(E.t<=0){ E.state='swoop'; E.x=sx; E.y=E.sy; SFX.bolt(); } }

<script>/* js/world4.js */
// world4.js — Wereld 4: Opladen, machines (liften, kar, pomp, lampen, hamers), duisternis, Isa's lampenwedstrijd en Voorman Brann
SPELLS.charge={name:'Opladen', icon:'charge', cd:0.35, desc:'Schiet een vonk in een machine in de buurt: liften, mijnkarren, pompen, lampen en hamers gaan draaien.'};
let MACH=[], BARRS=[], ISA4=null, CONTEST=null, BR=null, ARCS=[], SPIKES4=[], DARK=null;
const ARENA4={x0:253*T, x1:296*T}, FLOOR4=15*T;
function w4State(){ if(!GAME.w4) GAME.w4={lamps:[],pumped:false,contest:null,lifts:{},met:false,cleared:[]}; return GAME.w4; }

function startWorld4(){
  const keep={unlocked:[...PL.unlocked], slots:[...PL.slots], maxHp:PL.maxHp}, w3=GAME.w3;
  GAME.w4=null; WORLD=4; newGame(true); GAME.w3=w3; w3State();
  PL.unlocked=keep.unlocked; PL.slots=keep.slots; PL.maxHp=keep.maxHp; PL.hp=PL.maxHp;
  joinCompanion({x:PL.x-90,y:PL.y+PL.h-72});
  GAME.state='play';
  GAME.banner={title:'WERELD 4',sub:'De Diepmijn van Ravenrots',t:3.2,boss:true};
  saveGame();
}

/* ---------- spawnen ---------- */
function w4Init(){ MACH=[]; BARRS=[]; ISA4=null; CONTEST=null; BR=null; ARCS=[]; SPIKES4=[]; }
function w4Spawn(e,fx,fy){
  const S=w4State();
  if(e.type==='lift'){ const yA=e.ty*T, yB=e.y1*T, at=S.lifts[e.id]==='B'?yB:yA; MACH.push({kind:'lift',id:e.id,x:e.tx*T,w:96,yA,yB,y:at,dy:0,dx:0,target:null,glow:0}); }
  if(e.type==='lamp') MACH.push({kind:'lamp',id:e.id,x:fx,y:e.ty*T,lit:S.lamps.includes(e.id),contest:e.id[0]==='c',glow:0});
  if(e.type==='pump'){ const m={kind:'pump',x:fx,y:fy,x0:e.x0,x1:e.x1,y0:e.y0,y1:e.y1,state:'idle',t:0,row:e.y0,glow:0}; MACH.push(m); if(S.pumped){ for(let r=e.y0;r<=e.y1;r++) drainRow(m,r,true); m.state='done'; } }
  if(e.type==='cart') MACH.push({kind:'cart',x:e.tx*T,x0:e.tx*T,x1:e.x1*T,y:FLOOR4-36,w:88,vx:0,dx:0,state:'idle',t:0,glow:0,lone:0,rockT:1});
  if(e.type==='stamp') MACH.push({kind:'stamp',x:fx,yr:e.ty*T,hy:e.ty*T,state:'rest',t:0,glow:0});
  if(e.type==='barr') BARRS.push({x:fx-28,y:fy-120,w:56,h:120,hp:1,broken:S.cleared.includes(e.tx),tx:e.tx,flash:0});
  if(e.type==='mite') ENEMIES.push({kind:'crab',skin:'mite',x:fx-18,y:fy-26,w:36,h:26,vx:0,vy:0,dir:-1,hp:2,flash:0,t:Math.random()});
  if(e.type==='bat') ENEMIES.push({kind:'wisp',skin:'bat',x:fx-15,y:fy-20,w:30,h:22,hx:fx-15,hy:fy-20,hp:1,flash:0,t:Math.random()*6});
  if(e.type==='isa4') ISA4={mode:S.met?'gone':'town',x:fx,y:fy,face:-1,anim:0,bark:'',barkT:0,castT:0,tx:0,fade:1};
  if(e.type==='isaSplit'&&ISA4) ISA4.split={x:fx,y:fy};
  if(e.type==='isaJoin'&&ISA4) ISA4.join={x:fx,y:fy};
  if(e.type==='isaBoss'&&ISA4) ISA4.boss={x:fx,y:fy};
  if(e.type==='brann') BR={hx:fx,x:fx,y:fy,face:-1,state:'sleep',t:0,anim:0,flash:0,last:'',cr:[{n:'shoulder',hp:4},{n:'back',hp:4},{n:'arm',hp:4}],frz:false,dmgStun:0,inv:0,vx:0,throwN:0};
}
function drainRow(m,r,quiet){ for(let x=m.x0;x<=m.x1;x++) if(MAP[r][x]==='~'){ MAP[r][x]='.'; if(BACK[r]) BACK[r][x]=true;
    if(!quiet&&Math.random()<0.5) PARTS.push({x:x*T+16,y:r*T+8,vx:(Math.random()-.5)*40,vy:-60-Math.random()*60,life:0.5,col:'#6f98b8',s:3,g:300}); } }
function isa4Bark(s,t=2.5){ if(ISA4){ ISA4.bark=s; ISA4.barkT=t; } }
function scoreTxt(){ const s=w3State().score; return `Milo ${s[0]} – ${s[1]} Isa`; }

/* ---------- Opladen ---------- */
function machPoint(m){
  if(m.kind==='lift') return {x:m.x+48,y:m.y-20};
  if(m.kind==='lamp') return {x:m.x,y:m.y+16};
  if(m.kind==='pump') return {x:m.x,y:m.y-40};
  if(m.kind==='cart') return {x:m.x+m.w/2,y:m.y+8};
  return {x:m.x,y:m.hy+34};
}
function machRange(m){ return m.kind==='lift'?300:m.kind==='stamp'?360:215; }
function clearLine(x0,y0,x1,y1){ const d=Math.hypot(x1-x0,y1-y0), n=Math.floor(d/8);
  for(let i=1;i<n-1;i++){ const x=x0+(x1-x0)*i/n, y=y0+(y1-y0)*i/n; if(solidAt(Math.floor(x/T),Math.floor(y/T),true)) return false; } return true; }
function w4Cast(){
  const p=PL, c={x:p.x+p.w/2,y:p.y+p.h/2-6}; p.castT=0.2;
  let best=null, bs=1e9;
  for(const m of MACH){ const q=machPoint(m), d=Math.hypot(q.x-c.x,q.y-c.y); if(d>machRange(m)) continue;
    if(m.kind==='lamp'&&m.lit) continue;
    if(!clearLine(c.x,c.y,q.x,q.y)) continue;
    const s=d+(Math.sign(q.x-c.x)!==p.face&&Math.abs(q.x-c.x)>24?140:0); if(s<bs){ bs=s; best=m; } }
  if(!best){ for(let i=0;i<6;i++) PARTS.push({x:c.x+p.face*18,y:c.y,vx:p.face*80+(Math.random()-.5)*60,vy:(Math.random()-.5)*80,life:0.25,col:PAL.boltC,s:3,g:0});
    tone('square',300,200,0.08,0.05); hint('nocharge','Opladen werkt op machines in de buurt: liften, mijnkarren, pompen, lampen en hamers.'); return; }
  const q=machPoint(best); ARCS.push({x0:c.x,y0:c.y,x1:q.x,y1:q.y,t:0.25,seed:Math.floor(Math.random()*999)});
  SFX.bolt(); tone('sawtooth',220,880,0.25,0.06); sparks(q.x,q.y,10,PAL.boltC); best.glow=1;
  machCharge(best);
}
function machCharge(m){
  const S=w4State();
  if(m.kind==='lift'){ if(m.target!=null) return; m.target=Math.abs(m.y-m.yA)<4?m.yB:m.yA; tone('square',90,140,0.6,0.08); }
  if(m.kind==='lamp'){ m.lit=true; RINGS.push({x:m.x,y:m.y+16,r:6,life:0.35,max:70}); tone('triangle',520,780,0.2,0.08);
    if(m.contest&&CONTEST&&CONTEST.active){ CONTEST.milo++; CONTEST.pop={n:CONTEST.milo,t:1}; }
    else if(!S.lamps.includes(m.id)) S.lamps.push(m.id); }
  if(m.kind==='pump'){ if(m.state==='idle'){ m.state='drain'; m.t=0; tone('sawtooth',70,110,1.2,0.1); toast('De pomp slaat aan...'); } else if(m.state==='done') toast('De schacht is al leeg.'); }
  if(m.kind==='cart'){ if(m.state==='ride'||m.state==='wind') return; if(m.state==='end'){ toast('De kar staat tegen het eindblok.'); return; } m.state='wind'; m.t=0.45; tone('square',80,200,0.45,0.1); }
  if(m.kind==='stamp'){ if(m.state!=='rest'){ toast('De hamer moet eerst weer omhoog.'); return; } m.state='wind'; m.t=0.42; tone('sawtooth',120,60,0.4,0.12); }
}

/* ---------- Milo op liften en karren ---------- */
function w4PrePhys(p,dt){
  const pl=p.w4plat||p.w4air;
  if(p.w4plat&&p.w4plat.kind==='lift') p.y+=p.w4plat.dy;
  if(pl&&pl.kind==='cart'&&pl.vx){ p.push=(p.push||0)+pl.vx; p.vx+=pl.vx; }
  p.pb=p.y+p.h;
}
function w4PostPhys(p){
  let on=null;
  for(const m of MACH){
    if(m.kind!=='lift'&&m.kind!=='cart') continue;
    const top=m.y, x0=m.x+3, x1=m.x+m.w-3;
    if(p.vy>=0&&p.x+p.w>x0&&p.x<x1&&p.pb<=top+8&&p.y+p.h>=top-1){ p.y=top-p.h; p.vy=0; p.onGround=true; on=m; }
  }
  if(on){ p.w4plat=on; p.onPlat=on; p.w4air=on.kind==='cart'?on:null; }
  else { if(p.w4plat&&p.w4plat.kind==='cart'&&!p.onGround) p.w4air=p.w4plat; p.w4plat=null; if(p.onGround) p.w4air=null; }
}
function riding(m){ return PL.w4plat===m||PL.w4air===m; }

/* ---------- treffers ---------- */
function w4Hit(hb,dmg,src){
  let any=false;
  for(const b of BARRS){ if(b.broken||!overlap(hb,b)) continue; if(src==='staff'){ if(PL.hitList.includes(b)) continue; PL.hitList.push(b); }
    hurtBarr(b,dmg); any=true; }
  if(BR&&!['sleep','fall','done'].includes(BR.state)&&overlap(hb,brannBox())){
    if(src==='staff'){ if(PL.hitList.includes(BR)) return any; PL.hitList.push(BR); }
    if(BR.state==='stun'&&BR.frz) hurtCrystal(dmg);
    else { SFX.tink(); sparks(hb.x+hb.w/2,hb.y+hb.h/2,6,P2.puL); hint('brannhit','Het kristal is te hard. Laat hem onder een hamer vallen; dan bevriest Isa het.'); }
    return true; }
  return any;
}
function hurtBarr(b,n){ b.hp-=n; b.flash=0.12; SFX.tink(); sparks(b.x+28,b.y+30,8,P2.puL);
  if(b.hp<=0){ b.broken=true; SFX.crumble(); shake(5); w4State().cleared.push(b.tx); for(let i=0;i<18;i++) PARTS.push({x:b.x+28+(Math.random()-.5)*40,y:b.y+30,vx:(Math.random()-.5)*260,vy:-Math.random()*300,life:0.7,col:i%2?P2.pu:P2.puL,s:4,g:900}); } }
function w4Shock(x,y,rad){
  for(const b of BARRS) if(!b.broken&&Math.abs(b.x+28-x)<rad+30&&Math.abs(b.y+64-y)<80) hurtBarr(b,3);
  if(BR&&BR.state==='stun'&&BR.frz&&Math.abs(BR.x-x)<rad+60&&Math.abs(BR.y-y)<120) hurtCrystal(2);
}

/* ---------- vijanden ---------- */
function w4DrawEnemy(e,X,Y,f){
  if(e.skin==='mite'){ const s=ENEMY4.mite[Math.floor(e.t*8)%2]; if(e.flash>0) ctx.filter='brightness(2.2)';
    ctx.save(); if(e.dir>0){ ctx.translate(X+e.w/2,0); ctx.scale(-1,1); ctx.drawImage(s,-20,Y-4); } else ctx.drawImage(s,X+e.w/2-20,Y-4); ctx.restore(); ctx.filter='none'; return true; }
  if(e.skin==='bat'){ const s=ENEMY4.bat[Math.floor(e.t*10)%2]; if(e.flash>0) ctx.filter='brightness(2.2)'; ctx.drawImage(s,X-5,Y); ctx.filter='none'; return true; }
  return false;
}

/* ---------- Isa ---------- */
function isa4Dialog(lines,onEnd){ openDialog({id:'isa',spr:'isa',x:ISA4.x-32,y:ISA4.y-72,lines,onEnd}); }
function isa4Update(dt){
  const I=ISA4; if(!I) return; const S=w4State(), px=PL.x+PL.w/2;
  I.anim+=dt; I.barkT-=dt; I.castT=Math.max(0,I.castT-dt);
  const walk=(tx,sp)=>{ const d=tx-I.x; I.face=Math.sign(d)||I.face; I.x+=Math.sign(d)*Math.min(Math.abs(d),sp*dt); I.walking=Math.abs(d)>2; return Math.abs(d)<=2; };
  I.walking=false;
  if(I.mode==='town'){ I.face=px<I.x?-1:1; if(Math.abs(px-I.x)<110&&GAME.mode==='play'){ PL.vx=0; isa4Dialog([...DIALOG.isa5,`De stand blijft gewoon staan. ${scoreTxt()}.`],()=>{ S.met=true; I.mode='leaveTown'; }); } }
  else if(I.mode==='leaveTown'){ if(walk(40.5*T,170)){ sparks(I.x,I.y-30,10,'#cfeefc'); I.mode='gone'; } }
  else if(I.mode==='gone'){ if(!S.contest&&I.split&&px>96*T){ I.x=I.split.x; I.y=I.split.y; I.mode='split'; } else if(S.contest) I.mode='gone2'; }
  else if(I.mode==='split'){ I.face=px<I.x?-1:1;
    if(px>I.x-90&&GAME.mode==='play'){ PL.vx=0; isa4Dialog(I.tried?DIALOG.isa6b:DIALOG.isa6,()=>{ I.tried=true; CONTEST={active:true,t:0,milo:0,isa:0,pop:null}; I.mode='toTunnel'; tone('square',660,880,0.2,0.1); }); } }
  else if(I.mode==='toTunnel'){ I.fade=Math.max(0,I.fade-dt*1.6); walk(I.split.x+60,160); if(I.fade<=0){ I.mode='away'; } }
  else if(I.mode==='away'){ if(px>149*T&&GAME.mode==='play'){ I.x=I.join.x+40; I.y=I.join.y; I.fade=1; I.mode='join'; sparks(I.x,I.y-30,10,'#cfeefc'); contestEnd(); } }
  else if(I.mode==='joinLeave'){ if(walk(I.join.x+300,190)||I.x-GAME.cam.x>VW+60){ I.mode='gone2'; } }
  else if(I.mode==='gone2'){ if(I.boss&&px>253*T){ I.x=I.boss.x; I.y=I.boss.y; I.mode='boss'; } }
  else if(I.mode==='boss'){ I.face=1; if(px>I.x-120&&GAME.mode==='play'){ PL.vx=0; isa4Dialog(DIALOG.isa7,()=>{ I.mode='ally'; }); } }
  else if(I.mode==='ally'){
    const want=BR&&BR.x<(ARENA4.x0+ARENA4.x1)/2?ARENA4.x1-70:ARENA4.x0+70;
    if(BR&&Math.abs(BR.x-I.x)<170&&BR.state!=='stun') I.goal=want; if(I.goal!=null&&walk(I.goal,230)) I.goal=null;
    if(!I.walking&&BR) I.face=BR.x<I.x?-1:1; }
  if(CONTEST&&CONTEST.active){ CONTEST.t+=dt; CONTEST.isa=Math.min(6,Math.floor(CONTEST.t/7)); if(CONTEST.pop) CONTEST.pop.t-=dt; }
}
function contestEnd(){
  const C=CONTEST, S=w4State(); C.active=false; const win=C.milo>C.isa; S.contest=win?'milo':'isa';
  const sc=w3State().score; sc[win?0:1]++;
  for(const m of MACH) if(m.kind==='lamp'&&m.contest&&m.lit&&!S.lamps.includes(m.id)) S.lamps.push(m.id);
  const lines=win?[`Hoeveel? ${C.milo}? ...Ik had er ${C.isa}.`,"Oké. Jij wint. Maar mijn gang was donkerder.",`Punt voor jou. ${scoreTxt()}.`]
                 :[`${C.isa} lampen! En jij? ${C.milo}. Ach.`,`Punt voor mij. ${scoreTxt()}.`,"Niet zo kijken. Het is maar licht."];
  isa4Dialog(lines,()=>{ ISA4.mode='joinLeave'; saveGame(); });
}
function w4ResetContest(){
  if(!CONTEST||!CONTEST.active) return;
  CONTEST=null; for(const m of MACH) if(m.kind==='lamp'&&m.contest) m.lit=false;
  if(ISA4){ ISA4.mode='split'; ISA4.x=ISA4.split.x; ISA4.y=ISA4.split.y; ISA4.fade=1; }
}

/* ---------- machines elke frame ---------- */
function machUpdate(dt){
  for(const m of MACH){ m.glow=Math.max(0,m.glow-dt*1.5);
    if(m.kind==='lift'){ const oy=m.y; if(m.target!=null){ const d=m.target-m.y, st=Math.sign(d)*Math.min(Math.abs(d),120*dt); m.y+=st; m.glow=Math.max(m.glow,0.6);
        if(Math.random()<0.2) PARTS.push({x:m.x+(Math.random()<.5?6:90),y:m.y+18,vx:0,vy:40,life:0.3,col:PAL.boltC,s:2,g:0});
        if(Math.abs(m.target-m.y)<0.5){ m.y=m.target; w4State().lifts[m.id]=m.y===m.yB?'B':'A'; m.target=null; shake(3); tone('square',70,50,0.2,0.1); } }
      m.dy=m.y-oy; }
    if(m.kind==='pump'&&m.state==='drain'){ m.t+=dt; m.glow=0.8; shake(1);
      if(m.t>0.6){ m.t=0; drainRow(m,m.row); m.row++; SFX.crumble(); if(m.row>m.y1){ m.state='done'; w4State().pumped=true; toast('Het water is weggepompt. Er is een doorgang onder de rots.'); } } }
    if(m.kind==='cart') cartUpdate(m,dt);
    if(m.kind==='stamp') stampUpdate(m,dt);
  }
}
function cartUpdate(m,dt){
  const ride=riding(m);
  if(m.state==='wind'){ m.t-=dt; m.glow=1; if(Math.random()<0.5) PARTS.push({x:m.x+10+Math.random()*68,y:m.y+30,vx:(Math.random()-.5)*60,vy:-50,life:0.3,col:PAL.boltC,s:3,g:0}); if(m.t<=0){ m.state='ride'; m.lone=0; SFX.bolt(); } }
  else if(m.state==='ride'){ m.glow=0.7;
    if(ride){ m.lone=0; m.vx=Math.min(340,m.vx+520*dt); } else { m.lone+=dt; if(m.lone>1.0) m.vx=Math.max(0,m.vx-900*dt); else m.vx=Math.min(340,m.vx+520*dt); }
    m.x+=m.vx*dt;
    if(Math.random()<0.6) PARTS.push({x:m.x+(Math.random()<.5?20:68),y:FLOOR4-2,vx:-m.vx*0.2,vy:-40-Math.random()*60,life:0.3,col:Math.random()<.5?PAL.goldL:'#ffffff',s:2,g:400});
    if(Math.random()<0.15) tone('square',60,58,0.05,0.03);
    // kristal op het spoor: de kar ramt erdoorheen (kost een hartje) maar rijdt gewoon door
    for(const b of BARRS){ if(b.broken) continue; if(m.x+m.w>b.x+10&&m.x<b.x+b.w&&b.hp>0){ hurtBarr(b,99); m.vx=Math.min(m.vx,140); shake(12);
        if(ride){ hurtPlayer(1,b.x+40); hint('cartcrash','Au! Schiet de kristallen eerder kapot: één schicht is genoeg.'); } } }
    if(m.x>=m.x1){ m.x=m.x1; m.vx=0; m.state='end'; shake(8); tone('square',90,50,0.3,0.12); }
    if(m.state==='ride'&&m.vx<=0&&m.lone>1.0) m.state='stop';
    // vallend gesteente vlak voor de kar uit, met een schaduw op het spoor
    if(ride&&m.vx>150){ m.rockT-=dt; if(m.rockT<=0){ m.rockT=0.9+Math.random()*0.6; const x=m.x+m.w/2+m.vx*1.0+(Math.random()-.5)*50, tx=Math.floor(x/T);
        if(!solidAt(tx,10)&&solidAt(tx,15)) HAZ.push({type:'rock',cry:true,x,y:9*T+4,vy:0,t:0,warn:0.62,floor:FLOOR4}); } }
  }
  if(!ride&&m.state!=='wind'&&(m.state!=='ride'||m.vx<=0)) cartFollow(m);
}
function stampUpdate(m,dt){
  const bottom=FLOOR4-68;
  if(m.state==='wind'){ m.t-=dt; m.glow=1; if(m.t<=0){ m.state='drop'; } }
  else if(m.state==='drop'){ m.hy=Math.min(bottom,m.hy+1500*dt);
    if(m.hy>=bottom){ m.state='hold'; m.t=0.5; shake(16); SFX.crumble(); dust(m.x,FLOOR4,16); for(let i=0;i<14;i++) PARTS.push({x:m.x+(Math.random()-.5)*100,y:FLOOR4-4,vx:(Math.random()-.5)*300,vy:-Math.random()*200,life:0.5,col:P4.dustL,s:4,g:800});
      if(overlap(PL,{x:m.x-52,y:m.hy,w:104,h:68})) hurtPlayer(1,m.x);
      stampHitBrann(m); } }
  else if(m.state==='hold'){ m.t-=dt; stampHitBrann(m); if(m.t<=0) m.state='up'; }
  else if(m.state==='up'){ m.hy=Math.max(m.yr,m.hy-150*dt); if(m.hy<=m.yr) m.state='rest'; }
}

function brannUpdate(dt){

  if(B.state==='walk'){ B.face=px<B.x?-1:1; const sp=MACH.some(q=>q.kind==='stamp'&&(q.state==='wind'||q.state==='drop')&&Math.abs(q.x-B.x)<110)?0:60+ph*14; if(Math.abs(px-B.x)>40) B.x+=B.face*sp*dt; B.x=Math.max(ARENA4.x0+60,Math.min(ARENA4.x1-60,B.x));

      if(Math.abs(px-zx)<90&&PL.y+PL.h>FLOOR4-70) hurtPlayer(1,B.x);
      const n=1+ph*2; for(let i=1;i<=n;i++) for(const d of [-1,1]){ const x=B.x+d*(40+i*62); if(x>ARENA4.x0+10&&x<ARENA4.x1-10) SPIKES4.push({x,t:-i*0.09}); } } }
  else if(B.state==='throw'){ if(B.t<=0){ const n=2+ph; for(let i=0;i<n;i++){ const a=Math.atan2(PL.y+PL.h/2-(B.y-120),px-B.x)+(i-(n-1)/2)*0.17;
        EPROJ.push({x:B.x+B.face*30,y:B.y-124,w:18,h:10,vx:Math.cos(a)*320,vy:Math.sin(a)*320,life:3,friendly:false,cry:true}); }
      tone('triangle',900,500,0.12,0.08); B.throwN--; if(B.throwN>0) brannTo('throw',0.45); else brannTo('recover',0.6); } }
  else if(B.state==='chargeWarn'){ if(B.t<=0){ brannTo('charge',3); B.vx=B.face*(380+ph*30); SFX.bolt(); } }
  else if(B.state==='charge'){ B.x+=B.vx*dt; if(Math.random()<0.6) PARTS.push({x:B.x-B.face*30,y:FLOOR4-4,vx:-B.vx*0.2,vy:-60,life:0.3,col:P4.dustL,s:4,g:300});
    if(B.x<ARENA4.x0+56||B.x>ARENA4.x1-56){ B.x=Math.max(ARENA4.x0+56,Math.min(ARENA4.x1-56,B.x)); brannTo('dazed',1.0); shake(16); SFX.crumble();
      if(ph>=2) for(let i=0;i<4+ph;i++) HAZ.push({type:'rock',cry:true,x:ARENA4.x0+60+Math.random()*(ARENA4.x1-ARENA4.x0-120),y:4*T,vy:0,t:-i*0.12,warn:0.8,floor:FLOOR4}); } }
  else if(B.state==='rain'){ if(B.t<=0) brannTo('recover',0.5); }
