<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bio Blast</title>
<style>
  :root { --ink:#2a2230; --paper:#f3ecdc; --green:#3f9b4a; --gold:#d9a440; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--paper); color:var(--ink);
    font-family:"Chalkboard SE","Comic Sans MS","Marker Felt",cursive; overflow:hidden; }
  body { background-image:radial-gradient(rgba(42,34,48,.07) 1px, transparent 1px); background-size:14px 14px; }
  #wrap { height:100%; display:flex; flex-direction:column; align-items:center; padding:10px 12px 64px; gap:10px; }
  #bar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center; font-size:13px; }
  #bar b { font-size:16px; letter-spacing:.5px; }
  #bar .keys { opacity:.65; font-family:ui-monospace,Menlo,monospace; font-size:11px; }
  button { font:inherit; font-size:12px; border:2px solid var(--ink); background:#fff8d6; color:var(--ink);
    padding:4px 10px; border-radius:6px; box-shadow:2px 2px 0 var(--ink); cursor:pointer; outline:none; }
  button:active { transform:translate(2px,2px); box-shadow:none; }
  canvas { image-rendering:pixelated; image-rendering:crisp-edges; border:3px solid var(--ink);
    box-shadow:6px 6px 0 rgba(42,34,48,.85); border-radius:4px; background:#fbf6e9; touch-action:none; }
  #wrap:fullscreen { background:var(--paper); padding:10px; }
  @media print { #bar { display:none; } canvas { box-shadow:none; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="bar">
    <b>🧪 Bio Blast</b>
    <span class="keys">muis · spatie · ← → · 1 2 3 · ESC menu</span>
    <button id="mute">🔊 Geluid aan (M)</button>
    <button id="mus">♪ Muziek aan (N)</button>
    <button id="fs">⛶ Volledig scherm</button>
  </div>
  <canvas id="game"></canvas>
  <div id="err" style="display:none;max-width:90vw;font:12px ui-monospace,Menlo,monospace;background:#fde4e4;border:2px solid #d94040;color:#7a1a1a;padding:6px 10px;border-radius:6px;white-space:pre-wrap"></div>
</div>
<script>
  window.addEventListener('error', e => {
    const el = document.getElementById('err'); el.style.display = 'block';
    el.textContent += 'Fout: ' + e.message + ' (' + (e.filename || '').split('/').pop() + ':' + e.lineno + ')\n';
  });
</script>
<script>/* ===== engine.js ===== */
'use strict';
// ===== Basis =====
const C = document.getElementById('game'), X = C.getContext('2d');
const W = 320, H = 180, SC = 3;
C.width = W * SC; C.height = H * SC;
const FONT = '"Chalkboard SE","Comic Sans MS","Marker Felt",cursive';
const MONO = 'ui-monospace,"SF Mono",Menlo,monospace';

function fit() {
  const aw = innerWidth - 24, ah = innerHeight - 110;
  const s = Math.max(1, Math.min(aw / W, ah / H));
  C.style.width = Math.floor(W * s) + 'px';
  C.style.height = Math.floor(H * s) + 'px';
}
addEventListener('resize', fit); fit();

let REMIX = false;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// ===== Input =====
const I = { keys: {}, pressed: {}, mx: 160, my: 90, down: false, clicked: false, mv: 0 };
const nk = k => k.length === 1 ? k.toLowerCase() : k;
addEventListener('keydown', e => {
  const k = nk(e.key);
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' ', 'Enter'].includes(k)) e.preventDefault();
  if (document.activeElement && document.activeElement.tagName === 'BUTTON') document.activeElement.blur();
  if (!I.keys[k]) I.pressed[k] = true;
  I.keys[k] = true; audioInit();
  if (k === 'm') toggleMute();
});
addEventListener('keyup', e => { I.keys[nk(e.key)] = false; });
function ptr(e) {
  const r = C.getBoundingClientRect();
  const nx = (e.clientX - r.left - C.clientLeft) / C.clientWidth * W, ny = (e.clientY - r.top - C.clientTop) / C.clientHeight * H;
  I.mv += Math.hypot(nx - I.mx, ny - I.my); I.mx = nx; I.my = ny;
}
C.addEventListener('pointermove', ptr);
C.addEventListener('pointerdown', e => { ptr(e); I.mv = 0; I.down = true; I.clicked = true; audioInit(); });
addEventListener('pointerup', () => { I.down = false; });
const P = k => !!I.pressed[k], K = k => !!I.keys[k];
const LEFT = () => K('ArrowLeft') || K('a'), RIGHT = () => K('ArrowRight') || K('d');
const PL = () => P('ArrowLeft') || P('a'), PR = () => P('ArrowRight') || P('d');

// ===== Geluid =====
let AC = null, muted = localStorage.getItem('bio_mute') === '1';
function audioInit() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f, d, type = 'square', v = 0.05, slide = 0, delay = 0) {
  if (muted || !AC) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.linearRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + 0.03);
}
const SFX = {
  win() { tone(523, .09); tone(659, .09, 'square', .05, 0, .09); tone(988, .18, 'square', .05, 0, .18); },
  lose() { tone(330, .35, 'sawtooth', .05, -200); },
  tick() { tone(880, .03, 'square', .025); },
  blip() { tone(700, .06, 'triangle', .07); },
  jump() { tone(300, .14, 'square', .04, 300); },
  brush() { tone(rnd(1800, 2600), .03, 'triangle', .012); },
  splash() { tone(392, .07); tone(523, .07, 'square', .05, 0, .07); tone(784, .12, 'square', .05, 0, .14); },
  boss() { [262, 247, 233, 220].forEach((f, i) => tone(f, .16, 'sawtooth', .05, 0, i * .15)); },
  stamp() { tone(120, .2, 'square', .08, -60); },
};
function toggleMute() {
  muted = !muted; localStorage.setItem('bio_mute', muted ? '1' : '0');
  document.getElementById('mute').textContent = muted ? '🔇 Geluid uit (M)' : '🔊 Geluid aan (M)';
}
document.getElementById('mute').textContent = muted ? '🔇 Geluid uit (M)' : '🔊 Geluid aan (M)';
document.getElementById('mute').onclick = e => { audioInit(); toggleMute(); e.currentTarget.blur(); };
document.getElementById('fs').onclick = e => {
  e.currentTarget.blur();
  const el = document.getElementById('wrap');
  if (document.fullscreenElement) document.exitFullscreen(); else if (el.requestFullscreen) el.requestFullscreen();
};
document.addEventListener('fullscreenchange', () => setTimeout(fit, 50));

// ===== Tekenen (pixels) =====
function R(x, y, w, h, c) { X.fillStyle = c; X.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function E(cx, cy, rx, ry, c) {
  X.fillStyle = c; cx = Math.round(cx); cy = Math.round(cy);
  for (let dy = -ry; dy <= ry; dy++) {
    const w = Math.floor(rx * Math.sqrt(Math.max(0, 1 - (dy * dy) / (ry * ry + .01))));
    X.fillRect(cx - w, cy + dy, 2 * w + 1, 1);
  }
}
function O(cx, cy, r, c) { E(cx, cy, r, r, c); }
function Ln(x1, y1, x2, y2, c, w = 2) {
  const n = Math.max(1, Math.ceil(Math.hypot(x2 - x1, y2 - y1)));
  X.fillStyle = c;
  for (let i = 0; i <= n; i++) X.fillRect(Math.round(x1 + (x2 - x1) * i / n - w / 2), Math.round(y1 + (y2 - y1) * i / n - w / 2), w, w);
}
function T(s, x, y, sz = 8, c = '#2a2230', al = 'center', ol = null, font = FONT) {
  X.font = `bold ${sz}px ${font}`; X.textAlign = al; X.textBaseline = 'middle';
  if (ol) { X.lineWidth = sz / 3.5; X.strokeStyle = ol; X.lineJoin = 'round'; X.strokeText(s, x, y); }
  X.fillStyle = c; X.fillText(s, x, y);
}
function SPR(rows, pal, x, y, sc = 1, flip = false) {
  x = Math.round(x); y = Math.round(y);
  for (let j = 0; j < rows.length; j++) {
    const r = rows[j];
    for (let i = 0; i < r.length; i++) {
      const c = pal[r[i]]; if (!c) continue;
      X.fillStyle = c; X.fillRect(x + (flip ? r.length - 1 - i : i) * sc, y + j * sc, sc, sc);
    }
  }
}

// ===== Personages =====
const HAAS = [
  '     kkkkkk     ',
  '    ksHHsssk    ',
  '   kssHsssssk   ',
  '   gssssssssg   ',
  '   gbllbbllbg   ',
  '   gssssSsssg   ',
  '    smmmmmms    ',
  '    ssskksss    ',
  '     ssssss     ',
  '   wwwsGGswww   ',
  '  wwwwwGGwwwww  ',
  ' wwruwwGGwwwwww ',
  ' wWwwwwGGwwwwWw ',
  ' wWwwwwwGwwwwWw ',
  'ss wwwwwwwwww ss',
  '   wwwwwwwwww   ',
  '   wWwwwwwwWw   ',
  '   wWwwwwwwWw   ',
  '    pppppppp    ',
  '    ppp  ppp    ',
  '    ppp  ppp    ',
  '    ppp  ppp    ',
  '   hhhh  hhhh   ',
];
const HAAS_PAL = { k: '#2a2230', s: '#f2c29b', S: '#d79c78', H: '#fff4e8', g: '#a3a3b0', b: '#2a2230', l: '#bfe3ff', m: '#6b5a4a', w: '#f7f7f2', W: '#c9cdd6', G: '#3f9b4a', r: '#d94040', u: '#3d6fd9', p: '#44506a', h: '#2a2230' };
const MACI = [
  '      yyy       ',
  '     dyddyd     ',
  '    ddddddddy   ',
  '   ddnnnnnndd   ',
  '   dnssssssnd   ',
  '   dsksssskSd   ',
  '   dsssssssSd   ',
  '   ddsskksssdd  ',
  '    ddssssdd    ',
  '   dddddddddd   ',
  '  dddDddddDddd  ',
  '  ddDddyyddDdd  ',
  ' sddDddddddDdds ',
  ' s dddddddddd s ',
  '   dddddddddd   ',
  '    jjjjjjjj    ',
  '    jjj  jjj    ',
  '    jjj  jjj    ',
  '   hhhh  hhhh   ',
];
const MACI_PAL = { d: '#5cb85c', D: '#3d8b3d', y: '#f2c94c', s: '#f0c8a0', S: '#d8a880', n: '#6b4426', k: '#2a2230', j: '#3d5a9e', h: '#2a2230' };

function spoon(x, y, ang, sc = 1) {
  X.save(); X.translate(Math.round(x), Math.round(y)); X.rotate(ang);
  X.fillStyle = '#9aa0ae'; X.fillRect(-1 * sc, 0, 2 * sc, 7 * sc);
  X.fillStyle = '#c8ccd6'; X.beginPath(); X.ellipse(0, -2 * sc, 2.6 * sc, 3.4 * sc, 0, 0, 7); X.fill();
  X.fillStyle = '#eef0f4'; X.fillRect(-1 * sc, -4 * sc, 1 * sc, 2 * sc);
  X.restore();
}
function drawHaas(x, y, sc = 1, t = 0, flip = false) {
  SPR(HAAS, HAAS_PAL, x, y, sc, flip);
  const w = Math.sin(t * 6) * .25;
  spoon(x + 1 * sc, y + 14 * sc, -0.3 + w, sc);
  spoon(x + 15 * sc, y + 14 * sc, 0.3 - w, sc);
}
function drawMaci(x, y, sc = 1, flip = false) { SPR(MACI, MACI_PAL, x, y, sc, flip); }
function drawTeacher(name, x, y, sc, t) { if (name === 'Maciej') drawMaci(x, y + 4 * sc, sc); else drawHaas(x, y, sc, t); }

// ===== Gedeelde tekeningen =====
function paper(bg = '#fbf6e9') {
  R(0, 0, W, H, bg);
  for (let y = 14; y < H; y += 12) R(0, y, W, 1, 'rgba(90,130,200,.18)');
  R(22, 0, 1, H, 'rgba(217,64,64,.35)');
}
function board(x, y, w, h) {
  R(x - 3, y - 3, w + 6, h + 6, '#a8743f'); R(x - 3, y + h, w + 6, 3, '#8a5a2e');
  R(x, y, w, h, '#2f5d46');
  for (let i = 0; i < 6; i++) R(x + 8 + i * 37 % (w - 20), y + 6 + (i * 13) % (h - 10), 14, 1, 'rgba(255,255,255,.05)');
}
function flask(x, y, full) {
  const c = full ? '#64c0d9' : 'rgba(0,0,0,0)';
  R(x + 3, y, 4, 4, '#5a6070'); R(x + 4, y + 1, 2, 3, '#dfe8f2');
  E(x + 5, y + 9, 5, 5, '#5a6070'); E(x + 5, y + 9, 4, 4, '#dfe8f2');
  if (full) { E(x + 5, y + 10, 3, 3, c); R(x + 4, y + 7, 1, 1, '#fff'); }
}
</script>
<script>/* ===== games.js ===== */
'use strict';
// ===== LES 1: Haastregt — Cellen & het Lab =====
function cell(x, y) {
  E(x, y, 40, 30, '#5f9f52'); E(x, y, 38, 28, '#c8ecb0');
  O(x + 8, y - 3, 10, '#7a4fa8'); O(x + 8, y - 3, 8, '#9b6fd0'); O(x + 5, y - 6, 3, '#d2b6f2');
  for (const [a, b] of [[-20, 8], [-14, -14], [24, 12], [-4, 16]]) { E(x + a, y + b, 6, 3, '#c0602a'); E(x + a, y + b, 5, 2, '#e08a4a'); }
}

const G_SCHERP = {
  verb: 'STEL SCHERP!', hint: 'SPATIE (of klik) als de cel scherp is', time: 5, bg: '#e9f3ec',
  fact: 'Echt: de kern van een cel bewaart het DNA.',
  init() { return { t: 0, w: rnd(2.2, 3.1), ph: rnd(0, 6), blur: 8 }; },
  update(s, dt) {
    if (s.done) return;
    s.t += dt; s.blur = Math.abs(Math.sin(s.t * s.w + s.ph)) * 9;
    if (P(' ') || I.clicked) { s.done = true; if (s.blur < 1.7) { s.win = true; SFX.win(); } else { s.lose = true; SFX.lose(); } }
  },
  draw(s) {
    R(150, 160, 20, 10, '#5a6070'); R(120, 168, 80, 6, '#5a6070');
    O(160, 92, 64, '#3a3340'); O(160, 92, 60, '#fff9e6');
    const b = s.win ? 0 : s.blur;
    if (b < .6) cell(160, 92);
    else { X.globalAlpha = .4; cell(160 - b, 92); cell(160 + b, 92); cell(160, 92 + b * .6); X.globalAlpha = 1; }
    R(272, 36, 14, 112, '#5a6070'); R(274, 38, 10, 108, '#dfe3ea'); R(274, 38, 10, 18, '#9fdc8a');
    R(268, 38 + (s.blur / 9) * 100, 22, 8, '#3f9b4a'); R(268, 38 + (s.blur / 9) * 100, 22, 2, '#7fd06a');
    T('SCHERP', 279, 30, 7, '#3f9b4a');
    if (s.lose) T('WAZIG!', 160, 92, 16, '#d94040', 'center', '#fff');
  }
};

const G_VANG = {
  verb: 'VANG!', hint: 'KLIK op de bacterie', time: 4.5, bg: '#f3ece9',
  fact: 'Echt: in je mond wonen meer bacteriën dan er mensen op aarde zijn.',
  init() { const a = rnd(0, 6); return { x: 160, y: 95, vx: Math.cos(a) * 85, vy: Math.sin(a) * 85, wob: 0 }; },
  update(s, dt) {
    s.wob += dt; if (s.win) return;
    s.x += s.vx * dt; s.y += s.vy * dt;
    const dx = s.x - 160, dy = s.y - 95, d = Math.hypot(dx, dy);
    if (d > 52) { const nx = dx / d, ny = dy / d, dot = s.vx * nx + s.vy * ny; s.vx -= 2 * dot * nx; s.vy -= 2 * dot * ny; s.x = 160 + nx * 52; s.y = 95 + ny * 52; }
    if (Math.random() < dt * 1.8) { const a = Math.atan2(s.vy, s.vx) + rnd(-1.2, 1.2), sp = Math.hypot(s.vx, s.vy); s.vx = Math.cos(a) * sp; s.vy = Math.sin(a) * sp; }
    if (I.clicked) { if (Math.hypot(I.mx - s.x, I.my - s.y) < 12) { s.win = true; SFX.win(); } else SFX.tick(); }
  },
  draw(s) {
    O(160, 95, 66, '#9aa6b0'); O(160, 95, 62, '#fdf3c8');
    for (let i = 0; i < 9; i++) O(160 + Math.cos(i * 2.3) * 38, 95 + Math.sin(i * 1.7) * 32, 2, '#efe0a0');
    const x = s.x, y = s.y;
    for (let i = 0; i < 5; i++) R(x - 11 - i * 2, y + Math.round(Math.sin(s.wob * 22 + i) * 2), 2, 1, '#2a2230');
    E(x, y, 10, 6, '#2a2230'); E(x, y, 9, 5, '#d94a8a');
    R(x - 4, y - 2, 3, 3, '#fff'); R(x + 1, y - 2, 3, 3, '#fff'); R(x - 3, y - 1, 1, 1, '#000'); R(x + 2, y - 1, 1, 1, '#000');
    R(x - 5, y - 8, 10, 2, '#2a2230'); R(x - 3, y - 13, 6, 5, '#2a2230'); R(x - 3, y - 10, 6, 1, '#d94040');
    if (s.win) T('GEVANGEN!', x, y - 22, 9, '#3f9b4a', 'center', '#fff');
    T('(deze bacterie draagt een hoed, dat is normaal)', 160, 170, 6, '#8a7f70');
  }
};

const G_KOKEN = {
  verb: 'NIET OVERKOKEN!', hint: 'HOUD SPATIE (of muis) in om het vuur lager te zetten', time: 5, surviveWin: true, bg: '#eef0f6',
  fact: 'Echt: op de Mount Everest kookt water al bij ongeveer 70 °C.',
  init() { return { lv: .35, rate: rnd(.3, .4), bub: [], t: 0 }; },
  update(s, dt) {
    if (s.lose) return; s.t += dt;
    const cool = K(' ') || I.down;
    s.lv += (cool ? -.5 : s.rate + Math.sin(s.t * 5) * .15) * dt; s.lv = Math.max(.05, s.lv);
    if (Math.random() < dt * (cool ? 3 : 14)) s.bub.push({ x: rnd(-7, 7), y: 0, v: rnd(20, 40) });
    s.bub.forEach(b => b.y += b.v * dt); s.bub = s.bub.filter(b => b.y < 100);
    if (s.lv >= .9) { s.lose = true; SFX.lose(); }
  },
  draw(s) {
    const top = 36, bot = 136, h = bot - top, ly = bot - h * Math.min(1, s.lv);
    R(148, top, 24, h, '#e6eef6');
    R(150, ly, 20, bot - ly, s.lv > .7 ? '#e8708a' : '#64c0d9');
    for (const b of s.bub) if (bot - b.y > ly + 2) O(160 + b.x, bot - b.y, 2, '#d8f4fb');
    R(146, top, 2, h + 2, '#5a6070'); R(172, top, 2, h + 2, '#5a6070'); R(146, bot, 28, 2, '#5a6070'); R(142, top - 3, 36, 3, '#5a6070');
    R(138, top + 10, 44, 2, '#d94040'); T('MAX', 196, top + 11, 8, '#d94040');
    R(150, 150, 20, 16, '#5a6070'); R(140, 166, 40, 4, '#44495a');
    const cool = K(' ') || I.down, fh = cool ? 4 : 11 + Math.sin(s.t * 30) * 3;
    E(160, 146 - fh / 2, 5, Math.max(1, fh / 2), '#f2994a'); E(160, 147 - fh / 3, 3, Math.max(1, fh / 3), '#f2c94c');
    if (s.lose) { for (let i = 0; i < 7; i++) O(145 + i * 5, top - 6 - (i % 2) * 4, 5, '#f4c0cc'); T('KOOKT OVER!', 160, 20, 14, '#d94040', 'center', '#fff'); }
  }
};

const G_LEPEL = {
  verb: 'ONTWIJK!', hint: '← → (of A/D) om de lepels te ontwijken', time: 5, surviveWin: true, bg: '#f6efe3',
  fact: 'Niet waar: Haastregt heeft ooit een lepel laten ontkiemen.',
  init() { return { x: 160, sp: [], cd: .35, t: 0 }; },
  update(s, dt) {
    s.t += dt; if (s.lose) return;
    s.x = clamp(s.x + ((RIGHT() ? 1 : 0) - (LEFT() ? 1 : 0)) * 140 * dt, 16, 304);
    s.cd -= dt;
    if (s.cd <= 0) { s.cd = rnd(.22, .4); s.sp.push({ x: clamp(s.x + rnd(-55, 55), 12, 308), y: 34, r: rnd(0, 6), v: rnd(95, 135) }); SFX.tick(); }
    for (const p of s.sp) { p.y += p.v * dt; p.r += dt * 14; if (Math.abs(p.x - s.x) < 9 && p.y > 146 && p.y < 172) { s.lose = true; SFX.lose(); } }
    s.sp = s.sp.filter(p => p.y < 190);
  },
  draw(s) {
    R(0, 170, W, 10, '#c9b48a');
    drawHaas(152, 4, 1, s.t * 3);
    for (const p of s.sp) spoon(p.x, p.y, p.r, 1.4);
    drawMaci(s.x - 8, 151);
    if (s.lose) T('AU! LEPEL!', s.x, 140, 10, '#d94040', 'center', '#fff');
  }
};

const Q1 = [
  ['Waar zit het DNA in een cel?', 'In de kern', 'In de lepel'],
  ['Wat doet een mitochondrie?', 'Energie maken', 'Zingen'],
  ['Hoeveel poten heeft een insect?', '6', '8'],
  ['Wat is een amoebe?', 'Een eencellige', 'Een Pokémon'],
  ['Planten maken suiker met...', 'Zonlicht', 'Wifi'],
  ['Hoeveel lepels heeft Haastregt?', '2', '0'],
  ['Wat heeft een plantencel wel en jij niet?', 'Een celwand', 'Een snor'],
  ['Wat zie je door een microscoop?', 'Kleine dingen', 'De toekomst'],
  ['Wat is de grootste cel van je lichaam?', 'De eicel', 'Haastregts ego'],

const EXAM_LINES = {
  win: ['Goed.', 'Door.', 'Netjes.', 'Volgende.'],
  lose: ['Fout.', 'Au.', 'Hm.', 'Dat kost je.'],
};
let examSel = 0;

const menuItems = () => [...LESSONS, EXAM_ITEM];
const examPool = () => LESSONS.filter(L => L.open).flatMap(L => L.games.map(g => ({ g, L })));

function startExam(level) {
  S = { exam: true, level, L: LESSONS[0], q: [], i: 0, lives: 4, lost: 0, score: 0, last: null, phase: 'exam', pool: examPool() };
  REMIX = false;

}
function examNext() {
  const lv = EXAM_LEVELS[S.level], prev = S.q[S.q.length - 1];
  let it; do { it = pick(S.pool); } while (prev && it.g === prev.g && S.pool.length > 1);
  S.q.push({ g: it.g, L: it.L, spd: Math.min(2.4, lv.base + Math.floor(S.q.length / 6) * lv.step) });
}
function examFinish(win) {
  S.last = win; S.line = pick(EXAM_LINES[win ? 'win' : 'lose']);
  if (win) S.score++; else { S.lives--; S.lost++; }
  go('eresult');
}
function examEnd() {
  REMIX = false;
  const k = 'exam' + S.level;
  S.record = S.score > (best[k] || 0);
  if (S.record) { best[k] = S.score; localStorage.setItem('bio_best', JSON.stringify(best)); }

}
const examSplashDur = () => S.level === 2 ? .55 : .9 / S.q[S.i].spd;
function examTrack() {

    lead: seq('72 . 74 76 . 79 . 76 74 . 72 . 69 . 72 .  72 . 74 76 . 79 . 81 79 . 76 . 74 . . .'),

  if (S.level === 2) return ['remix', 1 + (it.spd - 1.45) * .5, true];
  return ['exam', 1 + (it.spd - 1) * .5, hot];
}

function examUpdate() {
  if (scene === 'examSel') {
    if (PL()) { examSel = (examSel + 2) % 3; SFX.tick(); }
    if (PR()) { examSel = (examSel + 1) % 3; SFX.tick(); }
    let start = P('Enter') || P(' ');
    if (I.clicked) for (let i = 0; i < 3; i++) {
      const x = 24 + i * 94;
      if (I.mx > x && I.mx < x + 84 && I.my > 62 && I.my < 140) { if (examSel === i) start = true; examSel = i; SFX.tick(); }
    }
    if (start && tS > .2) { SFX.splash(); startExam(examSel); }
    return true;
  }
  if (scene === 'ebetween') {
    if (tS > EXAM_LEVELS[S.level].gap || (tS > .3 && (P(' ') || P('Enter') || I.clicked))) {
      S.L = S.q[S.i].L; go('splash'); S.level === 2 ? SFX.tick() : SFX.splash();
    }
    return true;
  }
  if (scene === 'eresult') {
    if (tS > (S.level === 2 ? .4 : .7)) { if (S.lives <= 0) examEnd(); else { S.i++; examNext(); go('ebetween'); } }
    return true;
  }
  if (scene === 'ereport') {
    let again = P('Enter') || P(' '), menu = false;
    if (I.clicked && I.my > 150 && I.my < 168) { if (I.mx > 96 && I.mx < 156) again = true; if (I.mx > 164 && I.mx < 224) menu = true; }

  }

let lastT = performance.now(), lastErr = '';
