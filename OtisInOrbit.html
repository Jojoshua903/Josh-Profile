<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>De Mistmaan</title>
<style>
:root{
  --ink:#2b2440; --cream:#fff8ec; --gold:#ffc23d; --cosmic:#8b5cff;
  --font: ui-rounded, "SF Pro Rounded", "Avenir Next", "Nunito", system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--font);color:var(--ink);user-select:none;
  background:linear-gradient(180deg,#2e3550 0%,#4a5574 45%,#6d7891 75%,#7e88a0 100%)}
#c{position:fixed;inset:0;width:100vw;height:100vh;display:block;outline:none;cursor:grab}
#c:active{cursor:grabbing}
.hud{position:fixed;pointer-events:none}
.num{font-weight:900;color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;letter-spacing:-.01em;font-variant-numeric:tabular-nums}

/* counters, top left */
#counts{top:18px;left:20px;display:flex;flex-direction:column;gap:4px}
.count{display:flex;align-items:center;gap:8px}
.count svg{filter:drop-shadow(2px 3px 0 var(--ink))}
#rare .num{font-size:40px}
#rare .num small{font-size:24px;opacity:.85}
#coins .num{font-size:28px}
#coins.pop svg{animation:pop .25s ease-out}
@keyframes pop{50%{transform:scale(1.3) rotate(-12deg)}}

/* equipped skills, bottom left */
#skills{left:20px;bottom:64px;display:flex;align-items:flex-end;gap:12px}
.slot{display:flex;flex-direction:column;align-items:center;gap:4px}
.ring{width:62px;height:62px;border-radius:50%;border:4px solid var(--ink);background:var(--cream);
  display:grid;place-items:center;font-size:30px;box-shadow:inset 0 0 0 5px var(--c,transparent),3px 4px 0 var(--ink);transition:box-shadow .2s}
.slot.empty .ring{background:rgba(255,248,236,.55)}
.slot.locked .ring{width:46px;height:46px;font-size:18px;background:rgba(255,248,236,.4);border-style:dashed}
.slot .lbl{font-size:13px;font-weight:800;color:#fff;-webkit-text-stroke:3.5px var(--ink);paint-order:stroke fill}
#droneTag{align-self:center;margin-bottom:22px;font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;
  color:#fff;background:var(--ink);padding:3px 8px;border-radius:999px}

#prompt{left:50%;bottom:72px;transform:translateX(-50%);display:none;font-size:16px;font-weight:800;color:#fff;-webkit-text-stroke:3.5px var(--ink);paint-order:stroke fill}
#prompt kbd{font-family:inherit;display:inline-block;min-width:26px;text-align:center;background:var(--cream);color:var(--ink);-webkit-text-stroke:0;border:3px solid var(--ink);border-radius:8px;padding:0 6px;margin-right:4px}
#toast{left:50%;top:22px;transform:translate(-50%,-160%);font-size:17px;font-weight:800;color:#fff;-webkit-text-stroke:3.5px var(--ink);paint-order:stroke fill;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
#toast.show{transform:translate(-50%,0)}
#banner{left:50%;top:30%;transform:translate(-50%,-50%) scale(.6);opacity:0;text-align:center;transition:transform .35s cubic-bezier(.3,1.7,.5,1),opacity .2s}
#banner.show{transform:translate(-50%,-50%) scale(1);opacity:1}
#banner .big{font-size:46px;font-weight:900;color:#d9c8ff;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;letter-spacing:-.02em}
#banner .name{font-size:22px;font-weight:800;color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill}
#dialog{left:50%;bottom:64px;width:min(620px,calc(100vw - 40px));transform:translate(-50%,30px);opacity:0;transition:transform .25s cubic-bezier(.3,1.5,.5,1),opacity .2s;
  background:var(--cream);border:4px solid var(--ink);border-radius:20px;box-shadow:5px 6px 0 var(--ink);padding:16px 20px 14px}
#dialog.show{transform:translate(-50%,0);opacity:1}
#dialog .who{position:absolute;top:-18px;left:18px;background:var(--ink);color:var(--cream);font-weight:900;font-size:15px;padding:3px 12px;border-radius:999px;letter-spacing:.04em}
#dText{margin:4px 0 0;font-size:17px;line-height:1.45;font-weight:600;min-height:50px}
#dialog .more{position:absolute;right:16px;bottom:8px;font-size:12px;font-weight:800;opacity:.5}
#title{left:50%;top:26%;transform:translateX(-50%);text-align:center;transition:opacity 1.2s}
#title .t{font-size:58px;font-weight:900;color:#e6ebff;-webkit-text-stroke:8px var(--ink);paint-order:stroke fill;letter-spacing:-.02em}
#title .s{font-size:18px;font-weight:800;color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill}
#hp{top:20px;right:22px;display:flex;gap:8px;opacity:0;transform:translateY(-10px);transition:opacity .3s,transform .3s}
#hp.show{opacity:1;transform:none}
#hp i{width:30px;height:30px;border-radius:50%;background:#ff5a6e;border:4px solid var(--ink);box-shadow:2px 3px 0 var(--ink);transition:background .2s,transform .2s}
#hp i.off{background:rgba(255,248,236,.35);transform:scale(.8)}
/* passive speech bubbles above characters */
#bubbles{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.bubble{position:absolute;left:0;top:0;max-width:240px;padding:7px 12px 8px;background:var(--cream);border:3px solid var(--ink);border-radius:16px;
  font-size:14px;font-weight:700;line-height:1.3;text-align:center;box-shadow:3px 4px 0 var(--ink);opacity:0;transition:opacity .2s;white-space:normal;margin-top:-12px}
.bubble::after{content:"";position:absolute;left:50%;bottom:-11px;width:14px;height:14px;background:var(--cream);border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.bubble small,#dText small.tr{display:block;margin-top:3px;font-size:12px;font-weight:600;opacity:.65;font-style:italic}
#dText small.tr{font-size:14px;margin-top:6px}
/* cutscenes: letterbox bars, HUD out of the way */
#letterbox i{position:fixed;left:0;right:0;height:10vh;background:#14121f;z-index:5;transition:transform .45s cubic-bezier(.3,.9,.4,1);pointer-events:none}
#letterbox i:first-child{top:0;transform:translateY(-101%)}
#letterbox i:nth-child(2){bottom:0;transform:translateY(101%)}
#letterbox span{position:fixed;top:calc(5vh - 9px);right:22px;z-index:6;color:#fff8ec;font-size:13px;font-weight:800;opacity:0;transition:opacity .4s;pointer-events:none}
body.cutscene #letterbox i{transform:none}
body.cutscene #letterbox span{opacity:.55}
body.cutscene #counts,body.cutscene #skills,body.cutscene #prompt,body.cutscene #hp,body.cutscene #bubbles{opacity:0!important;transition:opacity .3s}
body.cutscene #dialog{bottom:calc(10vh + 16px);z-index:7}
@media print{.hud{display:none}}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>

<div id="counts" class="hud">
  <div class="count" id="rare" title="Kosmische koekjes">
    <svg width="54" height="38" viewBox="0 0 54 38" aria-hidden="true">
      <g stroke="#2b2440" stroke-width="3.5" fill="#8b5cff">
        <circle cx="10" cy="12" r="8"/><circle cx="10" cy="26" r="8"/><circle cx="44" cy="12" r="8"/><circle cx="44" cy="26" r="8"/>
        <rect x="10" y="12" width="34" height="14" rx="5"/>
      </g>
      <rect x="11" y="14.5" width="32" height="9" rx="3" fill="#8b5cff"/>
      <path d="M27 9 l2 5 5 1 -5 1 -2 5 -2 -5 -5 -1 5 -1z" fill="#ffe27a"/>
    </svg>
    <span class="num"><span id="rareN">0</span><small> / <span id="rareT">0</span></small></span>
  </div>
  <div class="count" id="coins" title="Koekjes">
    <svg width="40" height="28" viewBox="0 0 54 38" aria-hidden="true" style="margin-left:7px">
      <g stroke="#2b2440" stroke-width="4" fill="#ffc23d">
        <circle cx="10" cy="12" r="8"/><circle cx="10" cy="26" r="8"/><circle cx="44" cy="12" r="8"/><circle cx="44" cy="26" r="8"/>
        <rect x="10" y="12" width="34" height="14" rx="5"/>
      </g>
      <rect x="11" y="14.5" width="32" height="9" rx="3" fill="#ffc23d"/>
    </svg>
    <span class="num" id="coinN">0</span>
  </div>
</div>

<div id="skills" class="hud">
  <span id="droneTag"><span id="droneName">Byte</span></span>
  <div class="slot empty" id="slot1"><div class="ring" id="slot1Icon"></div><span class="lbl" id="slot1Name">Leeg</span></div>
  <div class="slot locked"><div class="ring">🔒</div><span class="lbl">Combo</span></div>
</div>

<div id="prompt" class="hud"></div>
<div id="toast" class="hud"></div>
<div id="banner" class="hud"><div class="big">KOSMISCH KOEKJE!</div><div class="name" id="bannerName"></div></div>

<div id="hp" class="hud"><i></i><i></i><i></i></div>
<div id="dialog" class="hud"><span class="who" id="dWho">MILO</span><p id="dText"></p><span class="more">E ▸</span></div>
<div id="title" class="hud"><div class="t">De Mistmaan</div><div class="s">Otis is neergestort. Kijk eens rond…</div></div>
<script>setTimeout(() => (document.getElementById('title').style.opacity = 0), 3500);</script>
<script src="js/errors.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
