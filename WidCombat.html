function cardFx(fx, k, n, cx, y, d) { // k = frame binnen de stap, n = lengte van de stap, d = kijkrichting
  const R = (x, yy, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(yy), w, h); };
  const fx0 = cx + d * 22, t = k / n;
  if (fx === "spark") for (let i = 0; i < 6; i++) { const a = i * 1.05, r = 4 + t * 10; R(fx0 + Math.cos(a) * r, y + 48 + Math.sin(a) * r, 2, 2, i % 2 ? "#fff36b" : "#ffffff"); }
  else if (fx === "ball") R(fx0 + d * t * 30, y + 46, 3, 3, "#ffffff");
  else if (fx === "pong") R(fx0, y + 40 - Math.sin(t * Math.PI) * 14, 2, 2, "#ff9f1c");
  else if (fx === "signal") { for (let r = 4; r <= 10; r += 3) if ((k >> 2) % 3 === (r - 4) / 3) R(fx0 + d * r, y + 42 - r, 1, r, "#7fe3ff"); }
  else if (fx === "zap") for (let i = 0; i < 4; i++) R(cx + d * 8 + ((k + i * 3) % 5) - 2, y + 18 + i * 3, 3, 2, i % 2 ? "#ffe066" : "#ffffff");
  else if (fx === "dust") for (let i = 0; i < 5; i++) R(fx0 + (i - 2) * 4, y + 76 - t * 6 - (i % 2) * 2, 2, 2, "#b07a45");
  else if (fx === "snow") for (let i = 0; i < 4; i++) R(cx - 26 + i * 17, y + 16 + ((game.t * .4 + i * 13) % 56), 1, 1, "#ffffff");
  else if (fx === "feather") R(cx - d * 10 + Math.sin(k * .2) * 3, y + 30 + t * 40, 3, 1, "#1d1d26");
  else if (fx === "note") { const x = fx0, yy = y + 30 - t * 12; R(x, yy, 1, 6, "#2a2a30"); R(x - 2, yy + 5, 3, 2, "#2a2a30"); R(x + 1, yy, 2, 1, "#2a2a30"); }
  else if (fx === "grumble" && (k >> 3) % 2) { ctx.font = "bold 7px monospace"; ctx.textAlign = "center"; ctx.fillStyle = "#e63946"; ctx.fillText("#!?", cx + d * 6, y + 26); }
  else if (fx === "drop") for (let i = 0; i < 3; i++) R(cx - 10 + i * 10, y + 20 + ((k * 1.5 + i * 9) % 30), 1, 2, "#3d8fd6");
  else if (fx === "sus" && (k >> 2) % 2) { ctx.font = "bold 9px monospace"; ctx.textAlign = "center"; ctx.fillStyle = "#ff3b4f"; ctx.fillText("!", cx, y + 22); }
}

// character op de select-kaart tekenen; flip = kaart van speler 2 (kijkt naar links), seed = eigen ritme per kaart
function drawCardChar(p, cx, y, flip, seed = 0) {
  const seq = CARD_ANIM[p.id] || [["idle", 60]], total = seq.reduce((s, x) => s + x[1], 0);
  let t = (game.t + seed) % total, step = seq[0];
  for (const s of seq) { if (t < s[1]) { step = s; break; } t -= s[1]; }
  const [pose, n, o = {}] = step;
  let fr = pose === "idle" ? ((game.t >> 5) % 2 ? "idle2" : "idle1") : pose === "run" ? "run" + (((game.t / 5) | 0) % 4 + 1) : pose;
  const id = o.sid || p.id, set = getSpr(id, p.skin);

  const look = o.flip ? !flip : flip, d = look ? -1 : 1;
  let dy = 0;

<script>// ----- world.js -----
// Wereld: meerdere maps. Elke map heeft een achtergrond (half zo scherp als de characters, iets wazig = diepte),
// een gedetailleerd podium en platforms (sommige bewegen rustig heen en weer).
// Achtergrond: 1 pixel = 1 wereldeenheid (= 2 schermpixels), opgeschaald met zachte overgang.
// Podium: 1 pixel = 1 schermpixel, net zo scherp als de characters.

function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function mkCanvas(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return [c, c.getContext("2d")]; }
function lerpCol(a, b, t) {
  const pa = parseCol(a), pb = parseCol(b);
  return "rgb(" + [0, 1, 2].map(i => Math.round(pa[i] + (pb[i] - pa[i]) * t)).join(",") + ")";
}
function blob(g, cx, cy, rx, ry, col) { // gevulde ellips met losse rects (pixelig)
  g.fillStyle = col;
  for (let y = -ry; y <= ry; y++) { const w = Math.round(rx * Math.sqrt(1 - (y / ry) ** 2)); g.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2 + 1, 1); }
}
function skyBands(g, stops, y0 = 0, y1 = H) { // lucht/muur in banden van 6 pixels
  for (let y = y0; y < y1; y += 6) {
    const t = (y - y0) / (y1 - y0); let i = 0; while (i < stops.length - 2 && t > stops[i + 1][0]) i++;
    g.fillStyle = lerpCol(stops[i][1], stops[i + 1][1], Math.min(1, (t - stops[i][0]) / (stops[i + 1][0] - stops[i][0])));
    g.fillRect(0, y, W, 6);
  }
}
const CLOUDS = [[20, 26, .12, 1], [140, 14, .08, .8], [230, 34, .15, 1.2], [330, 20, .1, .9], [80, 48, .18, .7]];
function drawClouds(g, t, tint = "#ffffff", shade = "#dbe7f5") {
  for (const [bx, y, sp, s] of CLOUDS) {
    const x = ((bx + t * sp) % (W + 100)) - 50;
    for (const [dx, dy, r] of [[0, 0, 9], [10, -5, 11], [22, -1, 9], [31, 2, 7]]) blob(g, x + dx * s, y + dy * s + 2, r * s, r * s * .75, shade);
    for (const [dx, dy, r] of [[0, 0, 9], [10, -5, 11], [22, -1, 9], [31, 2, 7]]) blob(g, x + dx * s, y + dy * s, r * s, r * s * .7, tint);
  }
}

// ---------- podium-stijlen (2x resolutie) ----------
// top(g, X1, X2, TOP, R): bovenlaag; body: kleurbanden; taper: hoe sterk het podium naar onder smaller wordt
const STYLES = {
  gras: {
    topH: 12, taper: 215, wobble: true, cols: ["#b9774a", "#ad6c41", "#c2825a"], dark: "#93542e", light: "#d39a6c",
    detail(g, inside, X1, X2, TOP, R, inset) {
      const DIRT = TOP + 12;
      for (let k = 0; k < 900; k++) { const x = X1 + R() * (X2 - X1) | 0, y = DIRT + R() * (430 - DIRT) | 0; if (!inside(x, y) || !inside(x + 2, y)) continue; g.fillStyle = R() < .5 ? "#8e5230" : "#d4996c"; g.fillRect(x, y, R() < .5 ? 1 : 2, 1); }
      for (let k = 0; k < 22; k++) {
        const x = X1 + 20 + R() * (X2 - X1 - 40), y = DIRT + 10 + R() * 80, rx = 3 + R() * 5 | 0, ry = 2 + R() * 3 | 0;
        if (!inside(x - rx - 2, y) || !inside(x + rx + 2, y)) continue;
        blob(g, x, y + 1, rx + 1, ry + 1, "#5e4030"); blob(g, x, y, rx, ry, "#8d8f99");
        blob(g, x - 1, y - 1, rx * .5, ry * .45, "#b5b7c2"); g.fillStyle = "#6b6d78"; g.fillRect(x - rx + 1, y + ry - 1, rx * 2 - 1, 1);
      }
      for (let k = 0; k < 10; k++) { let x = X1 + 30 + R() * (X2 - X1 - 60), y = DIRT; const len = 12 + R() * 24; for (let j = 0; j < len; j++) { x += (R() - .5) * 1.6; y += 1; if (inside(x, y)) { g.fillStyle = "#6e4426"; g.fillRect(x | 0, y | 0, 1, 1); } } }
      for (const [x0, dir] of [[X1 + 6, 1], [X1 + 22, 1], [X2 - 8, -1], [X2 - 26, -1]]) { // hangende ranken
        const len = 18 + R() * 26;
        for (let j = 0; j < len; j++) { const y = DIRT + j, x = x0 + Math.sin(j * .3) * 1.5 + dir * inset(y) * .9; g.fillStyle = j % 6 === 3 ? "#7fd65a" : "#3f8a2e"; g.fillRect(x | 0, y, 1, 1); }
      }
    },
    top(g, X1, X2, TOP, R) {
      g.fillStyle = "#5fb544"; g.fillRect(X1, TOP, X2 - X1, 12);

const MAP_BY = Object.fromEntries(MAPS.map(m => [m.id, m]));

// ---------- bouwen (per map één keer, pas als hij nodig is) ----------
function buildMap(m) {
  if (m.built) return m;
  const R = rng(7 + m.id.length * 13);
  [m.skyC, m.skyX] = mkCanvas(W, H); [m.landC, m.landX] = mkCanvas(W, H);
  m.sky(m.skyX, R); m.land(m.landX, R);
  // podium

  const [c, g] = mkCanvas(W * 2, H * 2);
  const mm = m.main, X1 = mm.x1 * 2, X2 = mm.x2 * 2, TOP = mm.y * 2, BOT = 430, BODY = TOP + st.topH;
  const inset = y => y < BODY ? 0 : Math.round((st.taper ? 4 : 0) + ((y - BODY) / (BOT - BODY)) ** 1.7 * st.taper + (st.wobble ? Math.sin(y * .7) * 2 : 0));
  const inside = (x, y) => y >= TOP && y < BOT && x >= X1 + inset(y) && x < X2 - inset(y);
  if (m.deco) m.deco(g, mm);
  for (let y = TOP - 2; y < BOT + 2; y++) { const i = inset(Math.min(BOT - 1, y)); g.fillStyle = OUTLINE; g.fillRect(X1 + i - 2, y, X2 - X1 - i * 2 + 4, 1); }
  for (let y = BODY; y < BOT; y++) {
    const i = inset(y), band = ((y - BODY) / 14 | 0) % 3;
    g.fillStyle = st.cols[band]; g.fillRect(X1 + i, y, X2 - X1 - i * 2, 1);
    g.fillStyle = st.dark; g.fillRect(X1 + i, y, 6, 1); g.fillStyle = st.light; g.fillRect(X2 - i - 3, y, 2, 1);
  }
  st.detail(g, inside, X1, X2, TOP, RS, inset);
  st.top(g, X1, X2, TOP, RS);
  // vaste platforms in het podiumplaatje, bewegende krijgen een eigen plaatje
  for (const p of m.plats) {
    if (p.mv) {
      const w = (p.x2 - p.x1) * 2 + 8, h = p.y * 2 + 30;
      const [pc, pg] = mkCanvas(w, h); st.plat(pg, 4, w - 4, h - 26, RS, TOP); p.img = pc; p.imgH = h;
    } else st.plat(g, p.x1 * 2, p.x2 * 2, p.y * 2, RS, TOP);
  }
  m.stageC = c; m.built = true;
  return m;
}

// huidige map: STAGE wijst naar zijn podium + platforms (met een eigen kopie zodat platforms kunnen bewegen)
let CUR_MAP = MAPS[0];
const [BGC, bgx] = mkCanvas(W, H);
function setMap(id) {
  const m = buildMap(MAP_BY[id] || MAPS[0]); CUR_MAP = m;
  STAGE.main = { ...m.main };
  STAGE.plats = m.plats.map(p => ({ ...p, bx: p.x1, by: p.y, src: p }));
  STAGE.mt = 0;
}
setMap("weiland");

// bewegende platforms een stapje verder zetten; wie erop staat beweegt mee
function moveStage(fighters) {
  STAGE.mt++;
  for (const p of STAGE.plats) {
    if (!p.mv) continue;
    const s = Math.sin(STAGE.mt * p.mv.sp + (p.mv.ph || 0)), nx = p.bx + s * p.mv.ax, ny = p.by + s * p.mv.ay;
    const dx = nx - p.x1, dy = ny - p.y;
    p.x1 += dx; p.x2 += dx; p.y = ny;
    for (const f of fighters) if (f.alive && f.ground && f.onPlat === p) { f.x += dx; f.y = p.y; }
  }
}

function drawBg() {
  const m = CUR_MAP, t = game.t;
  bgx.drawImage(m.skyC, 0, 0);
  m.mid(bgx, t);
  bgx.drawImage(m.landC, 0, 0);
  m.top(bgx, t);
  ctx.imageSmoothingEnabled = true; // zachte opschaling = achtergrond iets wazig
  ctx.drawImage(BGC, 0, 0, W, H);
  ctx.imageSmoothingEnabled = false;
}

function drawStage() {
  const m = CUR_MAP;
  ctx.drawImage(m.stageC, 0, 0, W, H);
  for (const p of STAGE.plats) {
    if (!p.mv) continue;
    if (p.pillar) { // hydraulische poot van de autobrug
      const x = Math.round((p.x1 + p.x2) / 2), y0 = Math.round(p.y + 5), y1 = STAGE.main.y;
      ctx.fillStyle = OUTLINE; ctx.fillRect(x - 5, y0, 10, y1 - y0); ctx.fillStyle = "#c3cad2"; ctx.fillRect(x - 4, y0, 8, y1 - y0); ctx.fillStyle = "#eef2f6"; ctx.fillRect(x - 3, y0, 2, y1 - y0);
      ctx.fillStyle = OUTLINE; ctx.fillRect(x - 9, y1 - 3, 18, 3); ctx.fillStyle = "#5d6670"; ctx.fillRect(x - 8, y1 - 3, 16, 2);
    }
    const src = p.src;
    ctx.drawImage(src.img, p.x1 - 2, p.y - (src.imgH - 26) / 2, src.img.width / 2, src.imgH / 2);
  }
  if (m.front) m.front(game.t);
}

// klein voorbeeldplaatje van een map (voor het kiesscherm), platforms op hun startplek
function drawMapThumb(id, x, y, w, h) {
  const m = buildMap(MAP_BY[id]), sx = w / W, sy = h / H;
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(m.skyC, x, y, w, h); ctx.drawImage(m.landC, x, y, w, h);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(m.stageC, x, y, w, h);
  for (const p of m.plats) if (p.mv) ctx.drawImage(p.img, x + (p.x1 - 2) * sx, y + (p.y - (p.imgH - 26) / 2) * sy, p.img.width / 2 * sx, p.imgH / 2 * sy);
}

const AMB = {
  list: [], props: [], duos: [], next: 20,
  prop(p) { this.props.push(p); return p; },
  dust(x, y, col, n = 1, sp = .5, dirx = 0) {
    for (let i = 0; i < n; i++) this.props.push({ type: "dust", x, y, vx: (Math.random() - .5) * sp + dirx * .8, vy: -Math.random() * sp, g: .02, life: 16 + Math.random() * 8, col, s: 2 });
  },
  burst(x, y, col, n) {
    for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = .8 + Math.random() * 2; this.props.push({ type: "dust", x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - .5, g: .08, life: 18 + Math.random() * 10, col, s: 2 }); }
  },
  update() {
    if (--this.next <= 0 && this.list.length < 3) { if (!(this.list.length <= 1 && Math.random() < .45 && tryDuo())) this.spawn(); this.next = 70 + Math.random() * 160; }
    for (const d of this.duos) d.step(d);
    this.duos = this.duos.filter(d => [d.A, d.B].some(a => a && this.list.includes(a)));
    for (const a of this.list) this.step(a);
    this.list = this.list.filter(a => a.x > (a.ctrl ? -140 : -80) && a.x < W + (a.ctrl ? 140 : 80)); // duo-acteurs mogen verder buiten beeld starten
    for (const p of this.props) {
      if (p.stick) { p.x = p.stick.x + p.stick.dir * 16; p.y = p.stick.y - 22; }
      if (p.accel) { p.vx += Math.sign(p.vx) * .12; if (this.t % 2 === 0) this.dust(p.x - Math.sign(p.vx) * 8, p.y, "#d8d8d8", 1, .3); }
      p.vy += p.g || 0; p.x += p.vx; p.y += p.vy; p.life--;
      if (p.wob) p.y += Math.sin(p.life * .1) * .5;
      if (p.bounce && p.y > GROUND - 4) { p.y = GROUND - 4; p.vy = -Math.abs(p.vy) * p.bounce; if (Math.abs(p.vy) < .6) p.vy = 0; }

  },
  spawn() {
    const pool = playable().filter(id => !this.list.some(a => a.id === id || a.base0 === id));
    if (!pool.length) return;
    const id = pool[Math.random() * pool.length | 0], dir = Math.random() < .5 ? 1 : -1, B = AMBH[id] || {};
    const a = { id, base0: id, dir, x: dir > 0 ? -40 : W + 40, y: GROUND, vy: 0, t: 0, air: false, seq: [], fly: !!B.fly, n: 0 };
    if (id === "otis") a.y = 45 + Math.random() * 45;
    if (id === "byte") a.y = 70 + Math.random() * 35;
    a.base = a.y;
    if (B.start) B.start(a);
    this.list.push(a);
  },
  step(a) {
    if (a.ctrl) { a.t++; if (a.frozen > 0) a.frozen--; return; } // duo-acteur: de regie bepaalt alles
    const B = AMBH[a.base0] || {};

      const s = a.seq[0];
      if (s.k == null) { s.k = s.d; if (s.start) s.start(a); }
      s.k--;
      if (s.fire && s.d - s.k === s.at) s.fire(a);
      if (s.tick) s.tick(a);
      if (s.move) a.x += a.dir * s.move;

      if (a.vy !== 0 || a.y < GROUND) {

  frame(a) {

      const sink = a.sink || 0, seat = a.car && a.car.on ? 8 : 0; // Toon half in de grond, Casper zakt in zijn stoel
      if (sink > 0) { // scheur in de grond
        const x = Math.round(a.x), on = (a.t >> 3) % 2;
        ctx.fillStyle = OUTLINE; ctx.fillRect(x - 10, GROUND - 1, 20, 2);
        ctx.fillStyle = on ? "#ff3b4f" : "#9b1626"; ctx.fillRect(x - 6, GROUND - 1, 3, 1); ctx.fillRect(x + 2, GROUND - 1, 4, 1);
        if (sink >= 1) continue;

      const fd = a.look || a.dir, img = getSpr(a.id, "classic")[this.frame(a)][fd > 0 ? "r" : "l"]; // look: kant waar hij heen kijkt (krab loopt zijwaarts)
      ctx.drawImage(img, Math.round(a.x * 2 - (fd > 0 ? OX : SW - OX)) / 2, Math.round(a.y * 2 - OY) / 2 + Math.round(sink * 44) + seat, SW / 2, SH / 2);
      if (sink > 0) ctx.restore();
      if (a.car) { // auto (kan door Toon de grond in getrokken worden)
        const cs = a.car.sink || 0;
        if (cs) { ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, GROUND); ctx.clip(); }
        drawCar(a.car.x, GROUND + Math.round(cs * 24), a.car.dir);
        if (cs) ctx.restore();

      if (a.frozen > 0) { const x0 = Math.round(a.x) - 12, y0 = Math.round(a.y) - 36; ctx.fillStyle = "rgba(160,225,255,0.55)"; ctx.fillRect(x0, y0, 24, 36); ctx.fillStyle = "#5fb8e0"; ctx.strokeStyle = "#5fb8e0"; ctx.strokeRect(x0 + .5, y0 + .5, 23, 35); ctx.fillStyle = "rgba(255,255,255,.85)"; ctx.fillRect(x0 + 3, y0 + 3, 2, 8); }

    }
    ctx.globalAlpha = 1;
  },
};

}

          if (d.c === 12) AMB.burst(B.car.x + dir * 10, GROUND - 12, "#ff6b7a", 10);
          if (d.c > 18) { B.car.x += (B.x - B.car.x) * .06; } // tentakel sleurt de auto naar zich toe
          if (d.c > 30) { B.sink = Math.min(1, B.sink + 1 / 30); B.car.sink = Math.min(1, (B.car.sink || 0) + 1 / 30); }
          if (d.c > 62) { d.ph = 3; B.car = null; AMB.burst(B.x, GROUND - 2, "#8a5a2b", 10); }
        } else { B.x += B.dir * 1.2; B.pose = "idle1"; }
      }
    } };
  } },
  { ids: ["dih", "toon"], make() { // twee gravers botsen onder de grond: Dih schrikt zich rot
    const dir = rdir(), A = actor("dih", dir, edge(dir)), B = actor("toon", -dir, edge(-dir));
    A.burrow = true; B.sink = 1;
    return { A, B, ph: 0, c: 0, step(d) {
      d.c++;
      if (d.ph === 0) {
        A.x += dir * 1.5; B.x -= dir * 1.2;
        if (d.c % 6 === 0) AMB.dust(B.x, GROUND - 1, "#ff3b4f", 1, .4);
        if (Math.abs(A.x - B.x) < 44) { d.ph = 1; d.c = 0; A.burrow = false; A.vy = -4; A.air = true; AMB.burst(A.x, GROUND - 2, "#8a5a2b", 10); AMB.burst(B.x, GROUND - 2, "#8a5a2b", 10); }
      } else if (d.ph === 1) {
        if (A.air) { A.vy += .22; A.y += A.vy; A.pose = A.vy < 0 ? "jump" : "fall"; if (A.y >= GROUND) { A.y = GROUND; A.vy = 0; A.air = false; } }
        else A.pose = d.c > 50 && d.c < 72 ? "hurt" : "idle1";
        B.sink = Math.max(0, B.sink - 1 / 26);
        B.pose = d.c < 30 ? "spc_throw" : d.c < 60 ? ap(d.c - 30, 30) : "idle2";
        if (d.c === 46) AMB.burst(A.x, A.y - 14, "#ff6b7a", 8);
        if (d.c > 76) { d.ph = 2; d.c = 0; A.dir = -dir; }
      } else {
        hop(A, 2.6, 3.2, .22); // wegwezen
        if (d.c < 30) B.pose = (d.c >> 3) % 2 ? "idle2" : "idle1"; // lacht hem uit
        else { B.pose = "spc_wind"; B.sink = Math.min(1, B.sink + 1 / 26); if (B.sink >= 1) B.x += B.dir * 1.2; }
      }
    } };
  } },
  { ids: ["goonposter", "josh"], make() { // Goonposter sluipt achter Josh aan; draait Josh zich om, dan staat hij "onschuldig" stil
    const dir = rdir(), A = actor("josh", dir, edge(dir) + dir * 30), B = actor("goonposter", dir, edge(dir) - dir * 10);
    return { A, B, ph: 0, c: 0, turns: 0, step(d) {
      d.c++;

        walk(A, 1.4); B.dir = dir; walk(B, 1.6); if (B.x * dir > A.x * dir - 26) B.x = A.x - dir * 26;
        if (d.c > 40 && Math.random() < .03) { d.ph = 1; d.c = 0; A.dir = -dir; stand(A); stand(B); B.pose = "idle1"; d.turns++; }
      } else if (d.ph === 1) { // Josh kijkt om... Goonposter doet alsof er niks is
        stand(A); B.pose = "idle1";
        if (d.c === 30) { A.dir = dir; d.ph = d.turns >= 2 ? 2 : 0; d.c = 0; }
      } else if (d.ph === 2) { // derde keer: Goonposter haalt uit, Josh rent weg
        if (d.c < 20) { stand(A); B.pose = ap(d.c, 20); }
        else { walk(A, 3.2); if (d.c === 20) AMB.burst(A.x, A.y - 30, "#ffe066", 6); if (d.c === 30) { AMB.prop({ type: "vent", x: B.x, y: GROUND, vx: 0, vy: 0, life: 72 }); } if (d.c > 34) B.hidden = true; if (d.c > 90) B.x = -9999; }
      }
    } };
  } },
  { ids: ["fionn", "oela"], make() { // sporters onder elkaar: Fionn slaat de sliotar, Oela kopt hem terug
    const dir = rdir(), A = actor("fionn", dir, edge(dir)), B = actor("oela", -dir, edge(-dir));
    return { A, B, ph: 0, c: 0, n: 0, step(d) {

      else if (d.ph === 1) {

        if (k === 46) { AMB.prop({ type: "sliotar", x: B.x, y: B.y - 34, vx: -dir * 2.5, vy: -2, g: .08, life: 30 }); AMB.burst(B.x, B.y - 34, "#ffffff", 4); }

  { ids: ["ati", "josh"], make() { // Josh zit op zijn telefoon... ATI komt eraan. NEE!
    const dir = rdir(), A = actor("josh", dir, edge(dir)), B = actor("ati", dir, edge(dir) - dir * 30);
    return { A, B, ph: 0, c: 0, step(d) {

      if (d.ph === 0) { if (walkTo(A, W / 2, 1.6)) { A.pose = "spc_throw"; } walk(B, 1.4); if ((A.x - B.x) * dir < 40 && Math.abs(A.x - W / 2) < 3) { d.ph = 1; d.c = 0; } }
      else if (d.ph === 1) { // ATI staat achter hem, met de armen in de lucht
        stand(B); B.dir = dir; A.pose = d.c < 30 ? "spc_throw" : "hurt";
        B.pose = d.c < 40 ? "spc_wind" : "spc_throw";
        if (d.c === 30) { AMB.burst(B.x + dir * 16, B.y - 30, "#e63946", 10); AMB.prop({ type: "gen", kind: "shout", x: B.x + dir * 18, y: B.y - 40, vx: dir * .3, vy: 0, life: 40 }); }
        if (d.c >= 70) { d.ph = 2; d.c = 0; }

  } },
  { ids: ["sichen", "ruben"], make() { // Sichen vertelt Ruben een grap; Ruben kijkt niet eens op van zijn Switch
    const dir = rdir(), A = actor("sichen", dir, edge(dir)), B = actor("ruben", -dir, W / 2 + dir * 20);
    return { A, B, ph: 0, c: 0, step(d) {
      d.c++; B.pose = (d.c >> 5) % 2 ? "idle2" : "idle1"; B.dir = -dir;
      if (d.ph === 0) { if (walkTo(A, W / 2 - dir * 16, 1.6)) { d.ph = 1; d.c = 0; A.dir = dir; } }
      else if (d.ph === 1) {
        stand(A); A.pose = d.c < 40 ? "spc_wind" : "spc_throw";
        if (d.c === 40) AMB.prop({ type: "gen", kind: "joke", x: A.x + dir * 18, y: A.y - 34, vx: 0, vy: 0, life: 40 });
        if (d.c === 90) AMB.burst(B.x, B.y - 30, "#c3cad2", 4); // ...stilte
        if (d.c > 110) { d.ph = 2; d.c = 0; A.dir = -dir; }
      } else walk(A, 1.3);
    } };
  } },
  { ids: ["julie", "goonposter"], make() { // Julie onderzoekt Goonposter met haar vergrootglas... zó sus. Hij duikt een vent in.
    const dir = rdir(), A = actor("julie", dir, edge(dir)), B = actor("goonposter", -dir, W / 2 + dir * 30);
    return { A, B, ph: 0, c: 0, step(d) {

        if (d.c === 60) { AMB.burst(A.x + dir * 14, A.y - 44, "#ffe066", 6); B.look = 0; AMB.prop({ type: "vent", x: B.x, y: GROUND, vx: 0, vy: 0, life: 60 }); }
        if (d.c === 72) { B.hidden = true; B.x = -9999; }
        if (d.c > 110) { d.ph = 2; d.c = 0; A.dir = dir; }
      } else walk(A, 1.4);
    } };
  } },
  { ids: ["maat", "toon"], make() { // aartsvijanden: Maat gooit zinkfosfaat, Toon zakt terug de grond in
    const dir = rdir(), A = actor("maat", dir, edge(dir)), B = actor("toon", -dir, edge(-dir));
    return { A, B, ph: 0, c: 0, step(d) {
      d.c++;
      if (d.ph === 0) {
        const a = walkTo(A, W / 2 - dir * 34, 1.5), b = walkTo(B, W / 2 + dir * 34, 1.1);
        if (a) A.dir = dir; if (b) B.dir = -dir;
        if (a && b) { d.ph = 1; d.c = 0; AMB.burst(W / 2, GROUND - 40, "#e63946", 6); } // ze zien elkaar...
      } else if (d.ph === 1) {
        stand(A); stand(B); A.dir = dir; B.dir = -dir;
        if (d.c > 30) A.pose = d.c < 50 ? "spc_wind" : "spc_throw";
        if (d.c === 50) AMB.prop({ type: "gen", kind: "zinc", x: A.x + dir * 18, y: A.y - 22, vx: dir * 1.4, vy: 0, life: 36 });
        if (d.c >= 86) { B.pose = "hurt"; if (d.c === 86) AMB.burst(B.x, B.y - 20, "#e8eef2", 10); }
        if (d.c > 86) B.sink = Math.min(1, (B.sink || 0) + .03); // Toon verdwijnt de grond in
        if (d.c > 130) { d.ph = 2; d.c = 0; B.x = -9999; }
      } else walk(A, 1.4);
    } };
  } },
  { ids: ["grumbleclaw", "caiza"], make() { // de krab knipt naar Caiza, zij spoelt hem met een golf het beeld uit
    const dir = rdir(), A = actor("grumbleclaw", dir, edge(dir)), B = actor("caiza", -dir, edge(-dir));
    return { A, B, ph: 0, c: 0, step(d) {
      d.c++;
      if (d.ph === 0) {
        const a = walkTo(A, W / 2 - dir * 30, .9), b = walkTo(B, W / 2 + dir * 60, 1.3);
        if (a) A.dir = dir; if (b) B.dir = -dir;
        if (a && b) { d.ph = 1; d.c = 0; }
      } else if (d.ph === 1) {
        stand(A); stand(B);
        if (d.c < 24) A.pose = ap(d.c, 24);
        if (d.c === 10) AMB.burst(A.x + dir * 28, A.y - 18, "#dff6ff", 8); // knip in de lucht

        if (d.wave && Math.abs(d.wave.x - A.x) < 8) { d.ph = 2; d.c = 0; AMB.burst(A.x, A.y - 12, "#bfefff", 12); }
      } else {
        A.pose = "hurt"; A.x += -dir * 3; // surft mee op de golf
        if (d.c % 4 === 0) AMB.dust(A.x, GROUND - 6, "#ffffff", 2, .6);

  { ids: ["jorn", "renas"], make() { // twee kleintjes doen een wedstrijdje rennen; Jorn struikelt en rent er weer achteraan
    const dir = rdir(), A = actor("jorn", dir, edge(dir)), B = actor("renas", dir, edge(dir) - dir * 22);
    return { A, B, ph: 0, c: 0, step(d) {

      if (d.ph === 0) { walk(A, 2.4); walk(B, 2.3); if (Math.abs(A.x - W / 2) < 2.5) { d.ph = 1; d.c = 0; AMB.burst(A.x, GROUND - 2, "#f3ead8", 8); } }
      else if (d.ph === 1) { A.pose = "hurt"; walk(B, 2.5); if (d.c === 12) B.pose = "jump"; if (d.c > 34) { d.ph = 2; d.c = 0; } }
      else { walk(A, 3.2); walk(B, 2.5); }
    } };
  } },
];

function tryDuo() {
  const opts = DUOS.filter(D => D.ids.every(id => isUnlocked(id)) && !D.ids.some(id => AMB.list.some(a => a.base0 === id)));
  if (!opts.length) return false;
  AMB.duos.push(opts[Math.random() * opts.length | 0].make());
  return true;
}

<script>// ----- maat.js -----
// Maat als beschermengel die vecht met wapens van zinkfosfaat: een zwaard en armstuk van witte kristallen,
// een aureool van kristalpunten en veren vleugels met kristallen puntjes. Vervangt zijn uiterlijk uit sprites.js.

(() => {
  const ch = CHARS.maat, TUN = "#f7f8fc", TUNS = "#d3d9e6", STEEL = "#4a5562", STEELS = "#323a45";
  const C1 = "#eef6fb", C2 = "#b9d2e2", C3 = "#86a9c0", CORE = "#7fc8f0"; // zinkfosfaat: wit kristal met een blauwe gloed van binnen
  const SKIN = ["#f4d2b4", "#dcae88"];
  ch.longSleeve = false;
  ch.pal = { skin: SKIN, shirt: [TUN, TUNS], leg: ["#5d6f88", "#45546a"], sock: ["#e4e9f0", "#b8c2d0"], shoe: ["#f2f5fa", "#c4ccd8"] };
  ch.back = {}; for (const k in ch.pal) ch.back[k] = [ch.pal[k][1], darken(ch.pal[k][1])];
  ch.skinSet = new Set([...SKIN, ...ch.back.skin, darken(SKIN[1])]);
  ch.defaults = { item: { type: "zsword", a: 125 }, item2: { type: "zbr" } };

  // kristallen armstuk: kristallen groeien over de onderarm
  ITEMS.zbr = (g, h) => {
    const p = k => [h.ex + (h.hx - h.ex) * k, h.ey + (h.hy - h.ey) * k], [x1, y1] = p(.3), [x2, y2] = p(.85);
    g.sseg(x1, y1, x2, y2, 6, C1, C2);
    const fa = Math.atan2(h.hy - h.ey, h.hx - h.ex), nx = -Math.sin(fa), ny = Math.cos(fa);
    for (const [k, s] of [[.4, 1], [.62, -1], [.8, 1]]) { const [mx, my] = p(k); g.sseg(mx, my, mx + nx * s * 4 - Math.cos(fa) * 2, my + ny * s * 4 - Math.sin(fa) * 2, 1.8, C1, C3); }
  };
  // zwaard van zinkfosfaat: stalen greep, kristallen pareerstang en een kling vol uitstekende kristallen
  ITEMS.zsword = (g, h, it) => {
    ITEMS.zbr(g, h);
    const d = vec(it.a, 1), p = vec(it.a + 90, 1), at = t => [h.hx + d[0] * t, h.hy + d[1] * t];
    g.seg(h.hx - d[0] * 3, h.hy - d[1] * 3, h.hx + d[0] * 2, h.hy + d[1] * 2, 2, STEEL);
    const [gx, gy] = at(3); g.sseg(gx - p[0] * 4, gy - p[1] * 4, gx + p[0] * 4, gy + p[1] * 4, 2.4, C1, C3); // pareerstang
    const [bx, by] = at(4), [mx, my] = at(18), [tx, ty] = at(25);
    g.sseg(bx, by, mx, my, 5, C1, C2); g.sseg(mx, my, tx, ty, 3, C1, C2); // kling, smal naar de punt
    for (const [t, s, L] of [[8, 1, 4], [12, -1, 5], [16, 1, 4], [20, -1, 3]]) { // kristallen die uit de kling steken
      const [sx, sy] = at(t); g.sseg(sx, sy, sx + p[0] * s * L + d[0] * 3, sy + p[1] * s * L + d[1] * 3, 1.8, C1, C3);
    }
    const [cx, cy] = at(6), [ex, ey] = at(17); g.seg(cx, cy, ex, ey, 1, CORE); // blauwe kern
    g.set(Math.round(tx), Math.round(ty), "#ffffff");
  };

  ch.head = function (g, hx, hy, P) {
    const [S, s] = this.pal.skin, H = "#6b4224", Hs = "#4a2c14";
    g.sdisc(hx, hy, 10, 10, S, s);
    g.sdisc(hx - 1, hy - 6, 10, 5, H, Hs, hy - 3); g.rect(hx - 9, hy - 5, 4, 7, H); g.rect(hx + 3, hy - 6, 6, 2, H); g.set(hx + 8, hy - 4, H); // zijn eigen haar
    g.rect(hx - 3, hy, 2, 3, s);
    // aureool van kristalpunten
    const ay = hy - 17 + (P.halo || 0);
    g.rect(hx - 6, ay, 13, 1, C1); g.set(hx - 7, ay + 1, C1); g.set(hx + 7, ay + 1, C2); g.rect(hx - 6, ay + 2, 13, 1, C2);
    for (const px of [-5, -1, 3, 7]) g.set(hx + px - (px > 5 ? 1 : 0), ay - 1, C1);
    g.set(hx - 2, ay + 1, CORE); g.set(hx + 3, ay + 1, CORE);
    if (P.face === "hurt") { g.rect(hx + 4, hy, 4, 1, "#1d1d1d"); g.rect(hx + 5, hy + 5, 3, 2, "#5a1a1a"); }
    else {
      g.rect(hx + 4, hy - 1, 3, 3, "#3a6ad8"); g.set(hx + 5, hy - 1, "#ffffff"); g.rect(hx + 3, hy - 3, 4, 1, Hs);
      g.rect(hx + 4, hy + 6, 4, 1, "#c4465a"); g.set(hx + 8, hy + 5, "#c4465a");
    }
  };

  // veren vleugels met kristallen puntjes; P.wing: -1 = plat naar achteren, 0 = rust, 1+ = hoog opgeslagen
  const wing = (g, rx, ry, w, c, cs) => {
    const ab = -125 - w * 35, [wx, wy] = vec(ab, 11), ex = rx + wx, ey = ry + wy;
    for (let k = 6; k >= 0; k--) {
      const t = .25 + .75 * k / 6, bx = rx + wx * t, by = ry + wy * t, [dx, dy] = vec(ab + 100 - k * 13, 6 + k * 1.9);
      g.sseg(bx, by, bx + dx, by + dy, 3.4, c, cs);
      if (k >= 2) { const [ox, oy] = vec(ab + 100 - k * 13, 2.5); g.sseg(bx + dx, by + dy, bx + dx + ox, by + dy + oy, 1.6, C2, C3); } // kristalpunt
    }
    g.sseg(rx, ry, ex, ey, 5, c, cs);
    g.sdisc(rx + wx * .4, ry + wy * .4 + 2, 4, 3, c, cs);
  };
  ch.behind = function (g, x, y, P) {
    const w = P.wing ?? 0;
    wing(g, x + 8, y + 3, w + .15, "#d2d9e8", "#aab4ca");
    wing(g, x + 4, y + 5, w, "#ffffff", "#d0d7e6");
  };

  ch.torso = function (g, x, y, w, h) {
    g.srect(x, y, w, h, TUN, TUNS);
    for (let i = 0; i < 13; i++) g.rect(x + 2 + Math.round(i * (w - 6) / 13), y + i, 2, 1, STEEL); // draagriem voor het zwaard
    g.sdisc(x + 9, y + 6, 2.5, 2.5, C1, C3); g.set(x + 9, y + 6, CORE); // kristallen broche
    g.rect(x, y + 12, w, 3, STEEL); g.rect(x, y + 14, w, 1, STEELS); g.rect(x + w - 6, y + 12, 3, 3, C2);
  };

  ch.front = function (g, x, y, w, h, P) { // tuniek tot halverwege de dij, zilverblauwe zoom
    const sway = (P.lean || 0) * .4 + (P.skirt || 0), top = y + 15;
    for (let i = 0; i < 9; i++) {
      const rw = w + 1 + i * .5, x0 = Math.round(x + w / 2 - rw / 2 - sway * i * .15), RW = Math.round(rw);
      if (i < 7) { g.rect(x0, top + i, RW, 1, TUN); g.rect(x0 + RW - 2, top + i, 2, 1, TUNS); }
      else g.rect(x0, top + i, RW, 1, i === 7 ? C2 : C3);
    }
  };

  const SM = { r: 34, a0: 50, a1: 205, t: 6, col: "rgba(214,238,250,0.85)" };
  const sw = a => ({ type: "zsword", a });
  ch.poses = Object.assign({}, ch.poses, {
    idle1: { lean: 1, wing: .15, thF: 25, shF: 8, thB: -22, shB: -14, arF: [40, 80], arB: [-30, 20], item: sw(130) }, // zwaard schuin naar voren
    idle2: { lean: 1, bob: -1, wing: .45, halo: -1, thF: 25, shF: 8, thB: -22, shB: -14, arF: [42, 84], arB: [-32, 18], item: sw(134) },
    run1: { lean: 5, wing: -.9, thF: 45, shF: 10, thB: -40, shB: -85, arF: [-40, -20], arB: [55, 115], item: sw(-115), skirt: 2 }, // zwaard achter zich aan
    run2: { lean: 5, bob: -2, wing: -.7, thF: 10, shF: -35, thB: -5, shB: -20, arF: [-20, 0], arB: [10, 50], item: sw(-110), skirt: 3 },
    run3: { lean: 5, wing: -.9, thF: -40, shF: -85, thB: 45, shB: 10, arF: [-10, 20], arB: [-45, -15], item: sw(-105), skirt: 2 },
    run4: { lean: 5, bob: -2, wing: -.6, thF: -5, shF: -20, thB: 10, shB: -35, arF: [-20, 0], arB: [0, 40], item: sw(-110), skirt: 3 },
    jump: { lean: 1, wing: 1.5, halo: -1, thF: 65, shF: -5, thB: 15, shB: -55, arF: [150, 165], arB: [-70, -40], item: sw(120), skirt: -3 },
    fall: { wing: .7, thF: 15, shF: 0, thB: -20, shB: -35, arF: [100, 95], arB: [-100, -115], item: sw(120), skirt: -2 },
    hurt: { lean: -4, face: "hurt", wing: -1.2, thF: 35, shF: 15, thB: -25, shB: -40, arF: [150, 175], arB: [200, 215], item: sw(-160), skirt: -4 },
    look: { lean: 1, wing: .3, thF: 25, shF: 8, thB: -22, shB: -14, arF: [140, -140], arB: [-30, 20], item: { type: "zbr" }, item2: sw(160) }, // speurt rond, zwaard in de andere hand
    atk_wind: { lean: -3, wing: 1.5, thF: 30, shF: 10, thB: -30, shB: -20, arF: [-130, -160], arB: [50, 100], item: sw(-130), skirt: -2 },
    atk_hit: { lean: 5, wing: -.9, thF: 50, shF: 10, thB: -45, shB: -45, arF: [90, 90], arB: [-60, -30], item: sw(100), smear: SM, skirt: 4 },
    atk_end: { lean: 3, wing: -.4, thF: 40, shF: 10, thB: -35, shB: -30, arF: [70, 70], arB: [-40, 0], item: sw(60), skirt: 2 },
    spc_wind: { lean: -3, wing: 1.3, thF: 30, shF: 10, thB: -30, shB: -20, arF: [120, 150], arB: [90, 100], item: sw(160) }, // zwaard omhoog
    spc_throw: { lean: 5, bob: 2, wing: 1, thF: 55, shF: 0, thB: -40, shB: -40, arF: [70, 30], arB: [-50, -20], item: sw(20), skirt: 4 }, // zwaard de grond in
    duck: { bob: 8, lean: 3, wing: -1.2, thF: 80, shF: 0, thB: 10, shB: -90, arF: [150, 200], arB: [160, 210], item: sw(-90) },
    hang: { bob: 0, lean: 1, wing: 1, thF: 6, shF: 2, thB: -6, shB: -4, arF: [176, 180], arB: [170, 178], item: sw(-100) },
  });

  const feather = (f, n) => {
    for (let i = 0; i < n; i++) game.parts.push({ x: f.x - f.face * (6 + Math.random() * 10), y: f.y - 22 - Math.random() * 10, vx: (Math.random() - .5) * 1.2, vy: .3 + Math.random() * .5, life: 30 + Math.random() * 20 | 0, col: Math.random() < .8 ? "#ffffff" : C2, s: 2 });
  };
  const fd0 = Fighter.prototype.draw;
  Fighter.prototype.draw = function (g) {
    fd0.call(this, g);
    if (this.id !== "maat" || !this.alive || game.state !== "play" || game.freeze > 0) return;
    if (!this.ground && this.jumps < (this._mj ?? this.jumps)) feather(this, 6); // extra sprong in de lucht
    this._mj = this.jumps;
    if (this.atk === "up" && game.t % 3 === 0) feather(this, 1);
    if (this.frame() === "spc_wind" && game.t % 2 === 0) game.parts.push({ x: this.x + this.face * 4 + (Math.random() - .5) * 8, y: this.y - 36 + Math.random() * 4, vx: (Math.random() - .5) * .6, vy: -.2, life: 12, col: Math.random() < .5 ? C1 : CORE, s: 2 }); // kristal vormt zich boven het zwaard
  };
})();

// ---------- special: Beschermkristal ----------
// Maat steekt zijn zwaard in de grond en er schiet een muur van zinkfosfaatkristal omhoog voor hem.
// Bij het omhoogschieten lanceert hij tegenstanders; daarna is hij massief (terugstuiteren als je ertegenaan rent),
// blokkeert hij projectielen (3 stuks) en breekt na een tijdje. Staat altijd op de grond, nooit in de lucht.
(() => {
  const C1 = "#eef6fb", C2 = "#b9d2e2", C3 = "#86a9c0", CORE = "#7fc8f0";
  Object.assign(CHARS.maat, { spcName: "Beschermkristal", grav: 0.74, jump: 5.5, spcCd: 150 }); // zweeft langzaam omlaag, net als Raaf en Otis
  const LIFE = 170, RISE = 8, HGT = 36, HW = 8;
  const BLOCK = ["ball", "drone", "star", "pong", "ice", "bomb", "football", "feather", "note", "rocket", "rc", "plane", "sliotar", "gen"];
  const HIT = { dmg: 9, base: 3.4, scale: 0.05, ang: 75 };
  const box = w => ({ x1: w.x - HW, x2: w.x + HW, y1: w.y - HGT * Math.min(1, w.age / RISE), y2: w.y + 2 });

  const NEW = [], BUMP = 4; let CUR = []; // NEW: muren die deze frame gemaakt zijn, CUR: muren die er nu staan
  window.MAAT_WALLS = () => CUR; // voor de AI (tijdens de update staan de muren niet in game.projs)
  const sp0 = game.spawnProj;
  game.spawnProj = function (f) {
    if (f.c.special.type !== "zinc") return sp0.call(this, f);
    // altijd op de grond onder hem: in de lucht schiet de muur op de vloer eronder, boven de afgrond mislukt hij
    const below = x => [STAGE.main, ...STAGE.plats].filter(s => x >= s.x1 && x <= s.x2 && s.y >= f.y - 4).sort((a, b) => a.y - b.y)[0];
    let x = f.x + f.face * 20, s = below(x);
    const own = below(f.x);
    if (own && (!s || s.y > own.y)) { s = own; x = Math.max(s.x1 + HW, Math.min(s.x2 - HW, x)); } // niet over de rand heen
    if (!s) { this.sparks(x, f.y - 10, 6, C2); sfx("bounce"); return; }
    NEW.push({ type: "zwall", o: f, s, ox: x - s.x1, x, y: s.y, vx: 0, vy: 0, face: f.face, age: 0, life: LIFE, hp: 3, hitSet: [] }); // apart houden: het gewone projectielsysteem mag hem niet zien
    this.shake = Math.max(this.shake, 3); this.sparks(x, s.y, 12, C1); sfx("big");
  };

  // de muur is massief: tegenstanders kunnen er niet doorheen en stuiteren terug als ze ertegenaan rennen
  const collide = (g, w) => {
    const top = w.y - HGT * Math.min(1, w.age / RISE);
    for (const t of g.fighters) {
      if (t === w.o || !t.alive || t.hang > 0 || t.climb > 0) continue;
      if (t.y <= top + 3 || t.y - t.c.height >= w.y) continue; // eroverheen of eronder
      const dx = t.x - w.x; if (Math.abs(dx) >= HW + 9) continue;
      const side = Math.sign(t.x - t.vx - w.x) || Math.sign(dx) || -w.face;
      t.x = w.x + side * (HW + 9);
      if (t.vx * side < -1.2 && !(t.wallBump > 0) && !(t.stun > 0)) { // ertegenaan gerend: terugstuiteren
        t.vx = side * 3; t.vy = Math.min(t.vy, -2.4); t.wallBump = 20; t.ground = false; t.flash = 6;
        t.dmg = Math.min(999, t.dmg + BUMP); t.lastHit = { f: w.o, move: "spc", t: g.t }; // terugstuiteren kost ook %
        g.sparks(w.x + side * HW, t.y - 14, 8, C1); g.shake = Math.max(g.shake, 2); sfx("bounce");
      } else if (t.vx * side < 0) t.vx = 0;
    }
  };

  const shatter = (g, w) => { for (let i = 0; i < 14; i++) g.parts.push({ x: w.x + (Math.random() - .5) * 14, y: w.y - Math.random() * HGT, vx: (Math.random() - .5) * 2.4, vy: -1 - Math.random() * 1.5, life: 26, col: [C1, C2, CORE][i % 3], s: 2 }); sfx("hit"); };

  const up0 = game.update;
  game.update = function () {
    const ticking = this.freeze <= 0 && this.state === "play";
    let walls = this.projs.filter(p => p.type === "zwall"); CUR = walls;
    this.projs = this.projs.filter(p => p.type !== "zwall"); // het gewone projectielsysteem kent geen muren
    const r = up0.apply(this, arguments);
    walls = walls.filter(w => !NEW.some(n => n.o === w.o)).concat(NEW); NEW.length = 0; CUR = walls; // maar één muur per Maat
    for (const w of walls) {
      if (ticking) {
        w.age++; w.life--;
        w.x = w.s.x1 + w.ox; w.y = w.s.y; // beweegt mee met een bewegend platform
        for (const t of this.fighters) if (t.wallBump > 0) t.wallBump--;
        if (w.age > RISE + 2) collide(this, w); // eerst lanceren, daarna is hij massief
        if (w.age >= 2 && w.age <= RISE + 2) for (const t of this.fighters) { // omhoogschieten: lanceert
          if (t === w.o || !t.alive || t.inv > 0 || w.hitSet.includes(t)) continue;
          if (this.overlap(box(w), this.hurt(t, true))) { w.hitSet.push(t); this.hit(t, HIT, w.face, t.x, t.y - 16, w.o, "spc"); }
        }
        for (const p of this.projs) { // vijandelijke projectielen tegenhouden
          if (p.o === w.o || p.life <= 0 || !BLOCK.includes(p.type)) continue;
          if (this.overlap(box(w), { x1: p.x - 4, x2: p.x + 4, y1: p.y - 4, y2: p.y + 4 })) {
            p.life = 0; w.hp--; w.flash = 6; this.sparks(p.x, p.y, 8, C1); this.sparks(p.x, p.y, 4, CORE); sfx("bounce");
          }
        }
        if (w.flash > 0) w.flash--;
        if (w.hp <= 0 || !w.o.alive) w.life = 0;
        if (w.life <= 0) shatter(this, w);
      }
      if (w.life > 0) this.projs.push(w);
    }
    return r;
  };

  // tekenen: een cluster kristallen prisma's, scheurtjes na elke tegengehouden treffer
  const PR = [[-8, 5, .62], [-4, 6, 1], [1, 5, .84], [5, 4, .55]];
  const dp0 = drawProjs;
  drawProjs = function (list) {
    dp0(list);
    const L = list || game.projs;
    for (const w of L) {
      if (w.type !== "zwall") continue;
      if (w.life < 30 && (game.t >> 2) % 2) continue; // knippert als hij bijna breekt
      const k = Math.min(1, w.age / RISE), x = Math.round(w.x), y = Math.round(w.y), fl = w.flash > 0;
      const R = (dx, dy, ww, hh, c) => { ctx.fillStyle = c; ctx.fillRect(w.face > 0 ? x + dx : x - dx - ww, y + dy, ww, hh); };
      for (const pass of [0, 1]) for (const [dx, pw, hf] of PR) {
        const h = Math.max(3, Math.round(HGT * hf * k)), top = -h, cx = dx + Math.floor(pw / 2) - 1, F = fl ? "#ffffff" : C1;
        if (!pass) { R(dx - 1, top + 1, pw + 2, h, OUTLINE); R(dx, top, pw, 1, OUTLINE); R(dx + 1, top - 1, pw - 2, 1, OUTLINE); R(cx, top - 2, 2, 1, OUTLINE); continue; }
        R(cx, top - 1, 2, 1, F); R(dx + 1, top, pw - 2, 1, F); // punt
        R(dx, top + 1, pw, h - 1, F); R(dx + pw - 2, top + 1, 2, h - 1, fl ? "#e8f6ff" : C2);
        if (h > 10) R(dx + 1, top + 5, 1, h - 9, CORE);
        if (w.hp < 3) R(dx + 2, top + Math.round(h * .4), 1, Math.round(h * .3), C3); // scheurtjes
        if (w.hp < 2) R(dx + 1, top + Math.round(h * .55), 2, 1, C3);
      }
      R(-10, 0, 20, 2, w.air ? C2 : C3); // voet van de muur
      if (game.t % 10 < 2) R(-3 + (game.t % 7), -Math.round(HGT * k) + 4, 1, 1, "#ffffff"); // glinstering
    }
  };
})();

// AI kent de muur: springt eroverheen als jij erachter staat, en rent er anders niet tegenaan
(() => {
  const HW = 8, HGT = 36;
  const cpu0 = cpuInput;
  cpuInput = function (f, o) {
    const inp = cpu0(f, o);
    if (!f.alive || f.stun > 0 || f.hang > 0) return inp;
    const dir = inp.r ? 1 : inp.l ? -1 : 0; if (!dir) return inp;
    for (const w of MAAT_WALLS()) {
      if (w.o === f || w.age < 8) continue;
      const ahead = (w.x - f.x) * dir - (HW + 9); // afstand tot de muur in looprichting
      if (ahead < -4 || ahead > 26) continue;
      if (f.y <= w.y - HGT - 2 || f.y - f.c.height > w.y) continue; // al erboven of eronder
      const behind = (o.x - w.x) * dir > 0; // tegenstander staat aan de andere kant
      if (behind && f.ground && f.jumps !== 0) { inp.jump = 1; continue; }
      if (behind && !f.ground && f.vy > 0 && f.jumps > 0 && ahead < 14) { inp.jump = 1; continue; }
      if (ahead < 12) { inp.l = inp.r = 0; } // niet ertegenaan rennen
    }
    return inp;
  };
})();
</script>
<script>// ----- modes.js -----
// Menu's, arcade ladder, uitdagingen en opslag (localStorage).
const SAVE_KEY = "vgbrawl_save_v1";
let SAVE = { unlocked: [], skins: {} }, storageOK = false;
try {
  localStorage.setItem(SAVE_KEY + "_test", "1"); localStorage.removeItem(SAVE_KEY + "_test"); storageOK = true;
  const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s) SAVE = Object.assign(SAVE, s);
} catch (_) {}
function persist() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (_) {}
  const box = document.getElementById("savecode"); if (box) box.value = saveCode();
}
// savecode als back-up: werkt ook als de browser niets mag opslaan
const saveCode = () => btoa(unescape(encodeURIComponent(JSON.stringify(SAVE))));
function loadCode(code) {
  try {
    const s = JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
    if (!s || !Array.isArray(s.unlocked)) throw 0;
    SAVE = Object.assign({ unlocked: [], skins: {} }, s); persist();
    MODES.toast("Savecode geladen!"); game.state = "menu"; return true;
  } catch (_) { MODES.toast("Die savecode klopt niet"); return false; }
}

// characters met `locked: true` moet je via de ladder vrijspelen
const isUnlocked = id => !CHARS[id].locked || SAVE.unlocked.includes(id);
const playable = () => ROSTER.filter(isUnlocked);
const lockedChars = () => ROSTER.filter(id => !isUnlocked(id) && !CHARS[id].story && !CHARS[id].shop); // story-characters krijg je alleen via de story mode
const skinsFor = id => SKIN_ORDER.filter(s => s === "classic" || (SAVE.skins[id] || []).includes(s));
function unlockSkin(id, s) {
  SAVE.skins[id] = SAVE.skins[id] || [];
  if (SAVE.skins[id].includes(s)) return false;
  SAVE.skins[id].push(s); persist(); return true;
}

const tap = (...codes) => codes.some(c => pressed.has(c));
const OK = () => tap("Enter", "Space");
const BACK = () => tap("Escape", "Backspace");
const MENU = ["ARCADE LADDER", "STORY MODE", "VERSUS", "UITDAGINGEN"];

// maps: willekeurig, of de "eigen" map van een character (eindbaas)
const randomMap = () => MAPS[Math.random() * MAPS.length | 0].id;
const homeMap = id => (MAPS.find(m => (m.home || []).includes(id)) || {}).id || randomMap();

const MODES = {
  menuIdx: 0, mode: "versus", cpu: true, chPage: 0,
  pick: [{ id: "nathan", skin: "classic" }, { id: "josh", skin: "classic" }],
  ladder: null, unlockInfo: null, toastQ: [], toastT: 0, toastCur: "",

  toast(text) { this.toastQ.push(text); },

  onKO(killer, move, victim) {
    if (killer.cpu || killer === victim) return;
    const id = killer.baseId || killer.id, c = CHARS[id];
    const mv = killer.id === "bytemech" && move === "atk" ? "mech" : move; // Byte: KO in mech-vorm
    if (c.chMove === mv && unlockSkin(id, "alt")) { this.toast(c.name + ": skin " + c.altName.toUpperCase() + " vrijgespeeld!"); sfx("go"); }
  },

  // ---------- update ----------
  update() {
    AMB.update();
    const s = game.state;
    if (s === "menu") this.updMenu();
    else if (s === "select") this.updSelect();
    else if (s === "ladder") this.updLadder();
    else if (s === "unlock" && OK()) { game.state = "menu"; sfx("select"); }
    else if (s === "mapsel") this.updMapSel();
    else if (s === "challenges") {
      const pages = Math.ceil(ROSTER.length / 6);
      if (tap("KeyA", "ArrowLeft")) { this.chPage = (this.chPage + pages - 1) % pages; sfx("select"); }
      if (tap("KeyD", "ArrowRight")) { this.chPage = (this.chPage + 1) % pages; sfx("select"); }
      if (OK() || BACK()) { game.state = "menu"; sfx("select"); }
    }
  },

  updMenu() {
    // 2x2 raster: A/D wisselt kolom, W/S wisselt rij
    if (tap("KeyW", "ArrowUp", "KeyS", "ArrowDown")) { this.menuIdx ^= 2; sfx("select"); }
    if (tap("KeyA", "ArrowLeft", "KeyD", "ArrowRight")) { this.menuIdx ^= 1; sfx("select"); }
    if (!OK()) return;
    sfx("select");
    if (this.menuIdx === 1) { STORY.open(); return; }
    if (this.menuIdx === 3) { game.state = "challenges"; return; }
    this.mode = this.menuIdx === 0 ? "ladder" : "versus";
    if (this.mode === "ladder" && SAVE.ladder) { // halve ladder: verder waar je was
      this.ladder = SAVE.ladder; this.pick[0] = { ...SAVE.ladder.pick }; game.state = "ladder"; return;
    }
    for (const p of this.pick) if (!isUnlocked(p.id)) { p.id = playable()[0]; p.skin = "classic"; }
    game.state = "select";
  },

  cycleChar(i, d) {
    const l = playable(), p = this.pick[i];
    p.id = l[(l.indexOf(p.id) + d + l.length) % l.length]; p.skin = "classic"; sfx("select");
  },
  cycleSkin(i, d) {
    const p = this.pick[i], l = skinsFor(p.id);
    p.skin = l[(l.indexOf(p.skin) + d + l.length) % l.length]; sfx("select");
  },

  updSelect() {
    if (tap("KeyA")) this.cycleChar(0, -1); if (tap("KeyD")) this.cycleChar(0, 1);
    if (tap("KeyW")) this.cycleSkin(0, -1); if (tap("KeyS")) this.cycleSkin(0, 1);
    if (this.mode === "versus") {
      if (tap("ArrowLeft")) this.cycleChar(1, -1); if (tap("ArrowRight")) this.cycleChar(1, 1);
      if (tap("ArrowUp")) this.cycleSkin(1, -1); if (tap("ArrowDown")) this.cycleSkin(1, 1);
      if (tap("KeyC")) { this.cpu = !this.cpu; sfx("select"); }
    }
    if (BACK()) { game.state = "menu"; sfx("select"); return; }
    if (!OK()) return;
    if (this.mode === "versus") { game.state = "mapsel"; sfx("select"); } // eerst nog een map kiezen
    else { this.newLadder(); game.state = "ladder"; sfx("select"); }
  },

  // 4 gevechten tegen je roster, de 5e is een nieuwe vriend (of een gouden eindbaas als iedereen al vrij is).
  // De allereerste keer is de volgorde altijd Milo, Josh, Nathan, Lars.
  newLadder() {
    const me = this.pick[0].id, others = playable().filter(i => i !== me);
    const pool = (others.length ? others : [me]).sort(() => Math.random() - .5);
    const order = SAVE.runs ? [0, 1, 2, 3].map(i => pool[i % pool.length]) : ["milo", "josh", "nathan", "lars"];
    const opp = order.map((id, i) => ({ id, skin: "classic", lvl: i + 1 }));
    const L = lockedChars(), lock = L.includes("reshman") ? "reshman" : L[Math.random() * L.length | 0]; // eerste unlock altijd Reshman, daarna willekeurig
    if (lock) opp.push({ id: lock, skin: "classic", lvl: 5, tough: 1.1, newChar: true });
    else opp.push({ id: pool[Math.random() * pool.length | 0], skin: "goud", lvl: 5, tough: 1.25, boss: true });
    opp.forEach((o, i) => { o.map = i === 4 ? homeMap(o.id) : randomMap(); }); // eindbaas vecht op zijn eigen map
    this.ladder = { opp, i: 0, lost: false, pick: { ...this.pick[0] } };
    SAVE.ladder = this.ladder; persist();
  },

  // ---------- map kiezen (versus) ----------
  mapIdx: SAVE.mapIdx ?? -1, // -1 = willekeurig
  updMapSel() {
    const n = MAPS.length + 1;
    if (tap("KeyA", "ArrowLeft")) { this.mapIdx = (this.mapIdx + 1 + n - 1) % n - 1; sfx("select"); }
    if (tap("KeyD", "ArrowRight")) { this.mapIdx = (this.mapIdx + 2) % n - 1; sfx("select"); }
    if (BACK()) { game.state = "select"; sfx("select"); return; }
    if (!OK()) return;
    const map = this.mapIdx < 0 ? randomMap() : MAPS[this.mapIdx].id;
    SAVE.mapIdx = this.mapIdx; persist();
    game.start({ p1: this.pick[0], p2: { ...this.pick[1], cpu: this.cpu, lvl: 3 }, stocks: 3, map });
  },
  drawMapSel() {
    this.header("KIES EEN MAP");
    const i = this.mapIdx, m = MAPS[i];
    // groot voorbeeld
    ctx.fillStyle = OUTLINE; ctx.fillRect(W / 2 - 98, 44, 196, 112);
    if (m) drawMapThumb(m.id, W / 2 - 96, 46, 192, 108);
    else { ctx.fillStyle = "#3b2a1a"; ctx.fillRect(W / 2 - 96, 46, 192, 108); txt("?", W / 2, 112, 40, "#ffe066", "center"); }
    txt(m ? m.name : "WILLEKEURIG", W / 2, 170, 12, "#e63946", "center", null);
    ctx.font = "bold 7px monospace"; ctx.fillStyle = OUTLINE; ctx.textAlign = "center";
    ctx.fillText(m ? m.desc + (m.plats.some(p => p.mv) ? " · bewegende platforms" : "") : "Laat het lot beslissen", W / 2, 180);
    if ((game.t >> 4) % 2) { txt("◀", W / 2 - 112, 104, 12, OUTLINE, "center", null); txt("▶", W / 2 + 112, 104, 12, OUTLINE, "center", null); }
    // rijtje stipjes
    for (let k = -1; k < MAPS.length; k++) { const x = W / 2 - (MAPS.length + 1) * 6 + (k + 1) * 12 + 3; ctx.fillStyle = k === i ? "#e63946" : "#d8cbb2"; ctx.fillRect(x, 186, 6, 4); }
    this.hint("A/D of ←/→ kiezen · ENTER = vechten · ESC = terug");
  },

  updLadder() {
    if (BACK()) { game.state = "menu"; sfx("select"); return; }
    if (tap("KeyR")) { SAVE.ladder = null; persist(); this.mode = "ladder"; game.state = "select"; sfx("select"); return; }
    if (!OK()) return;
    const o = this.ladder.opp[this.ladder.i];
    if (!o.map) { o.map = randomMap(); persist(); } // oude opgeslagen ladder
    game.start({ p1: this.pick[0], p2: { id: o.id, skin: o.skin, cpu: true, lvl: o.lvl, tough: o.tough }, stocks: 2, map: o.map });
  },

  // trio-skin: win met elk lid van een trio minstens één keer
  recordWin(w) {
    if (w.cpu) return;
    const id = w.baseId || w.id, T = TRIO_OF[id];
    SAVE.wins = SAVE.wins || {};
    const first = !SAVE.wins[id]; SAVE.wins[id] = 1;
    if (!T || !first) { persist(); return; }
    const done = T.members.filter(m => SAVE.wins[m]).length;
    if (done === 3) {
      T.members.forEach(m => unlockSkin(m, "trio"));
      this.toast("TRIO " + T.label.toUpperCase() + " compleet! " + T.theme + "-kostuums voor alle drie!"); sfx("go");
    } else this.toast(T.label + "-trio: " + done + "/3 gewonnen (" + T.theme + "-kostuums)");

  afterMatch(w) {
    this.recordWin(w);
    if (this.mode === "versus") { game.state = "select"; return; }

    if (w.slot !== 0) { L.lost = true; persist(); game.state = "ladder"; return; }

    if (last.newChar && !SAVE.unlocked.includes(last.id)) SAVE.unlocked.push(last.id);

  overText(w) {

  // ---------- tekenen ----------
  card(cx, y, p, label, col, flip, arrows) {

  render() {
    const s = game.state;

    else if (s === "select") this.drawSelect();

    });
    // rij met alle vrienden onderaan
    const ids = ROSTER;

  drawSelect() {
    if (this.mode === "versus") {
      this.header("VERSUS");
      this.card(108, 48, this.pick[0], "SPELER 1", SLOT_COL[0], false, true);
      this.card(276, 48, this.pick[1], this.cpu ? "CPU" : "SPELER 2", SLOT_COL[1], true, true);

  drawLadder() {

    L.opp.forEach((o, i) => {
      const x = 40 + i * 64, y = 64 + (4 - i) * 10, cur = i === L.i, done = i < L.i;
      const boss = i === 4;

      ctx.fillStyle = cur ? "#ffe066" : boss ? "#3b2a1a" : "#fff8ea"; ctx.fillRect(x, y, 48, 58);
      if (boss && o.newChar && !done) txt("?", x + 24, y + 32, 22, "#fff8ea", "center", null);
      else drawHead(o.id, x + 7, y + 10, 2, o.skin);
      ctx.font = "bold 7px monospace"; ctx.textAlign = "center"; ctx.fillStyle = boss && !cur ? "#ffe066" : OUTLINE;
      ctx.fillText(boss ? "EINDBAAS" : "#" + (i + 1), x + 24, y + 8);
      ctx.fillText(boss && o.newChar && !done ? "???" : CHARS[o.id].name, x + 24, y + 52);
      if (done) { ctx.fillStyle = "rgba(42,26,16,.55)"; ctx.fillRect(x, y, 48, 58); txt("✓", x + 24, y + 36, 20, "#6cc24a", "center", null); }
      if (cur && (game.t >> 4) % 2) txt("▼", x + 24, y - 6, 10, "#e63946", "center", null);
    });
    const o = L.opp[L.i];
    const nm = o.newChar ? "??? (de eindbaas)" : (o.boss ? "GOUDEN " : "") + CHARS[o.id].name;
    txt("Volgende: " + nm + "  ·  niveau " + o.lvl + (o.map && MAP_BY[o.map] ? "  ·  " + MAP_BY[o.map].name : ""), W / 2, 172, 9, OUTLINE, "center", null);
    ctx.font = "bold 7px monospace"; ctx.fillStyle = "#7a6a55"; ctx.textAlign = "center";
    ctx.fillText(last.newChar ? "Versla de eindbaas en speel hem vrij! (nog " + lockedChars().length + " geheim)" : "Alle vrienden zijn vrij! Versla de eindbaas voor een GOUDEN skin.", W / 2, 184);

  drawUnlock() {

      ctx.fillStyle = ["#e63946", "#ffe066", "#2a6fdb", "#6cc24a"][i % 4]; ctx.fillRect(x, y, 3, 3);
    }
    if (u.newChar) this.card(W / 2, 46, { id: u.newChar, skin: "classic" }, "NIEUW!", "#e63946", false, false);
    else this.card(W / 2, 46, { id: u.me, skin: "goud" }, "BELONING", "#b8860b", false, false);
    const line = u.gold ? "+ GOUDEN skin voor " + CHARS[u.me].name + "!" : "Gouden skin had je al: respect.";
    txt(line, W / 2, 180, 9, "#b8860b", "center", null);

  drawChallenges() {
    this.header("UITDAGINGEN", "Speel skins vrij · KO's tellen alleen als jij (geen CPU) ze maakt");

      const c = CHARS[id], x = i % 2 ? 196 : 12, y = 56 + (i >> 1) * 48, own = skinsFor(id);
      ctx.fillStyle = OUTLINE; ctx.fillRect(x - 2, y - 2, 180, 46);
      ctx.fillStyle = "#fff8ea"; ctx.fillRect(x, y, 176, 42);
      if (!isUnlocked(id)) { // geheime vriend: wel de kaart, geen naam of uiterlijk
        ctx.fillStyle = OUTLINE; ctx.fillRect(x + 4, y + 10, 16, 16); txt("?", x + 12, y + 23, 10, "#fff8ea", "center", null);
        txt("???", x + 26, y + 9, 8, OUTLINE, "left", null);
        ctx.font = "bold 6px monospace"; ctx.textAlign = "left"; ctx.fillStyle = "#7a6a55";
        ctx.fillText(CHARS[id].shop ? "[ ] Te koop in de winkel" : CHARS[id].story ? "[ ] Speel vrij in de story mode" : "[ ] Speel vrij in de arcade ladder", x + 26, y + 19);
        ctx.fillText("[ ] ??? skin: geheime uitdaging", x + 26, y + 28);
        const T = TRIO_OF[id];

        return;
      }
      drawHead(id, x + 3, y + 8, 1, own.includes("goud") ? "goud" : "classic");
      txt(c.name, x + 26, y + 9, 8, OUTLINE, "left", null);

      row(y + 19, own.includes("alt"), c.altName + ": " + c.chText);
      row(y + 28, own.includes("goud"), "Goud: voltooi de ladder");
      const T = TRIO_OF[id], tw = T ? T.members.filter(m => (SAVE.wins || {})[m]).length : 0;
      const nm = m => isUnlocked(m) ? CHARS[m].name[0] + CHARS[m].name.slice(1).toLowerCase() : "???"; // geen spoilers
      if (T) row(y + 37, own.includes("trio"), MEMBER_SKIN[id].name + ": win met " + T.members.map(nm).join("/") + " " + tw + "/3");
    });
    this.hint((pages > 1 ? "A/D pagina " + (this.chPage + 1) + "/" + pages + " · " : "") + "ENTER / ESC = terug");
  },

  drawToast() {
    if (!this.toastT && this.toastQ.length) { this.toastCur = this.toastQ.shift(); this.toastT = 200; }
    if (this.toastT <= 0) return;
    this.toastT--;
    const y = Math.min(6, -20 + (200 - this.toastT) * 2);
    ctx.font = "bold 8px monospace";
    const w = ctx.measureText(this.toastCur).width + 20;
    ctx.fillStyle = OUTLINE; ctx.fillRect(W / 2 - w / 2 - 2, y - 2, w + 4, 18);
    ctx.fillStyle = "#ffe066"; ctx.fillRect(W / 2 - w / 2, y, w, 14);
    ctx.fillStyle = OUTLINE; ctx.textAlign = "center"; ctx.fillText(this.toastCur, W / 2, y + 10);
  },
};

// ---------- logo: pixelletters met outline, 3D-rand en kleurbanden ----------
const LOGO_FONT = s => `900 ${s}px "Arial Black", Impact, "Helvetica Neue", sans-serif`;
function newCanvas(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; }
// tekst als harde pixelmasker (geen anti-aliasing), op wereldresolutie
function maskText(s, size, spacing = 0) {
  const pad = 4, m0 = newCanvas(1, 1).getContext("2d"); m0.font = LOGO_FONT(size);
  if ("letterSpacing" in m0) m0.letterSpacing = spacing + "px";
  const w = Math.ceil(m0.measureText(s).width) + pad * 2 + spacing, h = Math.ceil(size * 1.2) + pad;
  const m = newCanvas(w, h), x = m.getContext("2d");
  x.font = LOGO_FONT(size); if ("letterSpacing" in x) x.letterSpacing = spacing + "px";
  x.textBaseline = "middle"; x.fillStyle = "#fff"; x.fillText(s, pad, h / 2 + 1);
  const d = x.getImageData(0, 0, w, h);
  for (let i = 0; i < d.data.length; i += 4) { const on = d.data[i + 3] > 120; d.data[i] = d.data[i + 1] = d.data[i + 2] = 255; d.data[i + 3] = on ? 255 : 0; }
  x.putImageData(d, 0, 0);
  return m;
}
function tint(m, fill) {
  const c = newCanvas(m.width, m.height), x = c.getContext("2d");
  x.drawImage(m, 0, 0); x.globalCompositeOperation = "source-in";
  if (typeof fill === "function") fill(x, c); else { x.fillStyle = fill; x.fillRect(0, 0, c.width, c.height); }
  return c;
}
// woord met dikke outline, 3D-extrusie naar beneden en horizontale kleurbanden
function logoWord(s, size, bands, ext, extCol, spacing = 0) {
  const m = maskText(s, size, spacing), o = tint(m, OUTLINE), e = tint(m, extCol), hl = tint(m, "#ffffff");
  const f = tint(m, (x, c) => {
    const y0 = c.height / 2 - size * .38, bh = size * .76 / bands.length;
    x.fillStyle = bands[bands.length - 1]; x.fillRect(0, 0, c.width, c.height);
    bands.forEach((col, i) => { x.fillStyle = col; x.fillRect(0, Math.round(y0 + i * bh), c.width, Math.ceil(bh)); });
  });
  const c = newCanvas(m.width + 6, m.height + ext + 6), x = c.getContext("2d");
  for (let dy = 0; dy <= ext; dy++) for (let ox = -2; ox <= 2; ox++) for (let oy = -2; oy <= 2; oy++)
    if (Math.abs(ox) + Math.abs(oy) <= 3) x.drawImage(o, 3 + ox, 3 + oy + dy);
  for (let dy = ext; dy >= 1; dy--) x.drawImage(e, 3, 3 + dy);
  x.drawImage(hl, 3, 3); x.drawImage(f, 3, 4); // 1 pixel witte glansrand bovenop de letters
  return c;
}
let LOGO = null;
function buildLogo() {
  const top = logoWord("WAT IN DE", 13, ["#ffffff", "#e8f4ff", "#bfe3ff", "#8fcaff"], 2, "#1f4fa8", 1);
  const big = logoWord("COMBAT", 34, ["#fff6b0", "#ffe066", "#ffc23a", "#ff9a2a", "#ff6a1f", "#e8401c"], 4, "#8a1424", 1);
  const pix = logoWord("PIXEL", 12, ["#ffffff", "#ffffff", "#ffe9ec"], 1, "#5a0f1a", 4);
  return { top, big, pix, shine: newCanvas(big.width, big.height) };
}

function drawLogo() {
  if (!LOGO) LOGO = buildLogo();
  const t = game.t, cx = W / 2, bob = Math.round(Math.sin(t * .05) * 1.5);
  // draaiende stralen achter het logo
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, 80); ctx.clip();
  ctx.translate(cx, 42);
  for (let i = 0; i < 16; i++) {
    const a = i / 16 * Math.PI * 2 + t * .004;
    ctx.fillStyle = i % 2 ? "rgba(255,224,102,.22)" : "rgba(255,255,255,.14)";
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * 260, Math.sin(a) * 260); ctx.lineTo(Math.cos(a + .2) * 260, Math.sin(a + .2) * 260); ctx.fill();
  }
  ctx.restore();

  const { top, big, pix, shine } = LOGO;
  const by = 14 + bob;
  // COMBAT met af en toe een glans die eroverheen schuift
  const sx = shine.getContext("2d"), ph = t % 260;
  sx.globalCompositeOperation = "copy"; sx.drawImage(big, 0, 0);
  if (ph < 40) {
    sx.globalCompositeOperation = "source-atop"; sx.fillStyle = "rgba(255,255,255,.75)";
    const p = -30 + ph / 40 * (big.width + 60);
    sx.beginPath(); sx.moveTo(p, 0); sx.lineTo(p + 10, 0); sx.lineTo(p - 6, big.height); sx.lineTo(p - 16, big.height); sx.fill();
  }
  ctx.drawImage(shine, Math.round(cx - big.width / 2), by + 4);
  ctx.drawImage(top, Math.round(cx - top.width / 2), by - 10);

  // lint met PIXEL, met omgevouwen uiteinden
  const rw = pix.width + 26, rx = Math.round(cx - rw / 2), ry = by + 48, rh = 15;
  const R = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); };
  for (const s of [-1, 1]) { // staarten
    const ex = s < 0 ? rx - 12 : rx + rw;
    R(ex - 1, ry + 3, 13, rh + 2, OUTLINE); R(ex, ry + 4, 11, rh, "#a51d2a");
    R(s < 0 ? ex : ex + 8, ry + 4, 3, 3, OUTLINE); R(s < 0 ? ex : ex + 8, ry + rh + 1, 3, 3, OUTLINE); // inkeping
    R(s < 0 ? ex + 9 : ex, ry + rh + 1, 3, 3, "#5a0f1a"); // vouw
  }
  R(rx - 1, ry - 1, rw + 2, rh + 2, OUTLINE); R(rx, ry, rw, rh, "#e63946");
  R(rx, ry, rw, 2, "#ff6b75"); R(rx, ry + rh - 2, rw, 2, "#a51d2a");
  ctx.drawImage(pix, Math.round(cx - pix.width / 2), ry - 6);

  // twinkelende sterretjes
  for (const [x, y, k] of [[cx - 112, by + 2, 0], [cx + 104, by + 12, 40], [cx - 92, by + 40, 80], [cx + 118, by + 44, 120], [cx + 70, by - 8, 160]]) {
    const ph2 = (t + k) % 200; if (ph2 > 40) continue;
    const s = ph2 < 20 ? ph2 / 7 : (40 - ph2) / 7, X = Math.round(x), Y = Math.round(y);
    R(X - Math.round(s), Y, Math.round(s) * 2 + 1, 1, "#ffffff"); R(X, Y - Math.round(s), 1, Math.round(s) * 2 + 1, "#ffffff");
    R(X - 1, Y - 1, 3, 3, "#fff6b0"); R(X, Y, 1, 1, "#ffffff");
  }
}

// savecode-balk onder het spel
(() => {
  const box = document.getElementById("savecode");
  if (!box) return;
  box.value = saveCode();
  document.getElementById("copySave").onclick = () => {
    box.select();
    (navigator.clipboard ? navigator.clipboard.writeText(box.value) : Promise.reject()).then(
      () => MODES.toast("Savecode gekopieerd!"),
      () => { try { document.execCommand("copy"); MODES.toast("Savecode gekopieerd!"); } catch (_) { MODES.toast("Selecteer en kopieer de code zelf"); } });
  };
  document.getElementById("loadSave").onclick = () => { if (loadCode(box.value)) box.value = saveCode(); };
  box.addEventListener("keydown", e => e.stopPropagation()); // typen telt niet als game-input
})();

fit();
requestAnimationFrame(loop);
</script>

const STORY = {
  at: 0, walk: null, retry: -1, scene: null, puffs: [], mapC: null,
  get reached() { return Math.min(CHAPTERS.length - 1, (SAVE.story || {}).reached || 0); },
  set reached(v) { SAVE.story = SAVE.story || {}; SAVE.story.reached = Math.max(this.reached, v); persist(); },

  open() { this.at = Math.min(this.at, this.reached); this.walk = null; game.state = "story"; },

  // ---------- wereldkaart ----------
  updMap() {
    if (BACK()) { game.state = "menu"; sfx("select"); return; }
    if (this.walk) { // Julie loopt naar het volgende punt
      this.walk.k += 1 / 40;
      if (this.walk.k >= 1) { this.at = this.walk.to; this.walk = null; }
      return;
    }
    const go = d => { const to = this.at + d; if (to < 0 || to > this.reached) return; this.walk = { from: this.at, to, k: 0 }; this.retry = -1; sfx("select"); };
    if (tap("KeyA", "ArrowLeft", "KeyS", "ArrowDown")) go(-1);
    if (tap("KeyD", "ArrowRight", "KeyW", "ArrowUp")) go(1);
    if (OK()) {
      sfx("select");
      if (this.retry === this.at) this.fight(this.at); // na verlies: meteen opnieuw
      else this.play(this.at, "intro");
    }
  },

  buildMap() {
    const [c, g] = mkCanvas(W, H);
    g.fillStyle = "#121730"; g.fillRect(0, 0, W, H);
    blob(g, 170, 120, 170, 96, "#1d2540"); // het land
    for (let x = 0; x < W; x++) { // zee rechtsonder
      const y = Math.round(176 - Math.max(0, x - 180) * .05 + Math.sin(x * .07) * 3);
      if (x > 170) { g.fillStyle = "#0c1d3a"; g.fillRect(x, y, 1, H - y); g.fillStyle = "#1e3a66"; g.fillRect(x, y, 1, 1); }
    }
    blob(g, 90, 152, 64, 30, "#1c3a30"); blob(g, 82, 148, 40, 16, "#22463a"); // dorp met gras
    blob(g, 228, 82, 54, 24, "#3e3236"); blob(g, 222, 78, 30, 12, "#4a3c3a"); // woestijn
    for (const [px, py, w] of [[300, 108, 34], [334, 96, 40], [366, 112, 30], [312, 70, 26]]) for (let j = 0; j < w; j++) { // bergen
      const hw = Math.round(j * .9); g.fillStyle = j < 7 ? "#c8d4ea" : "#3a4460"; g.fillRect(px - hw, py - w + j, hw * 2 + 1, 1);
    }
    for (let i = 0; i < 9; i++) { // stad rond het museum
      const x = 70 + i * 13, h = 10 + ((i * 7) % 5) * 4; g.fillStyle = "#171b30"; g.fillRect(x, 70 - h, 11, h);
      for (let k = 0; k < h / 5; k++) if ((i + k) % 3) { g.fillStyle = "#ffd27a"; g.fillRect(x + 3, 72 - h + k * 5, 2, 2); }
    }
    for (let k = 0; k < 40; k++) { g.fillStyle = "rgba(255,255,255,.5)"; g.fillRect((k * 97) % W, (k * 37) % 40, 1, 1); } // sterren
    blob(g, 352, 22, 9, 9, "#efe6c8"); blob(g, 356, 19, 8, 8, "#121730"); // maansikkel
    this.mapC = c;
  },

  // pad tussen twee punten (lichte bocht), t van 0 tot 1
  pathPt(a, b, t) {
    const A = CHAPTERS[a].node, B = CHAPTERS[b].node, mx = (A[0] + B[0]) / 2, my = (A[1] + B[1]) / 2 - 10;
    const u = 1 - t; return [u * u * A[0] + 2 * u * t * mx + t * t * B[0], u * u * A[1] + 2 * u * t * my + t * t * B[1]];
  },

  drawNodeIcon(i, x, y, open) {
    const R = (dx, dy, w, h, c) => { ctx.fillStyle = open ? c : "#2a2f48"; ctx.fillRect(x + dx, y + dy, w, h); };
    R(-11, -15, 22, 17, OUTLINE);
    if (i === 0) { R(-9, -13, 18, 14, "#3a3f5a"); R(-5, -10, 4, 4, "#ffd27a"); R(2, -10, 4, 4, "#2a2f48"); R(-2, -5, 4, 6, "#5e3c24"); }
    else if (i === 1) { R(-9, -11, 18, 12, "#b5553c"); R(-10, -13, 20, 2, "#4a2a20"); for (const dx of [-6, -1, 4]) R(dx, -8, 3, 3, "#9fd8ff"); R(-2, -4, 4, 5, "#3a5f8a"); }
    else if (i === 2) { R(-9, -11, 18, 12, "#7d8896"); R(-7, -8, 14, 9, "#5d6876"); for (let k = 0; k < 4; k++) R(-7, -7 + k * 2, 14, 1, "#47505c"); R(-10, -13, 20, 2, "#ffcc33"); }
    else if (i === 3) { R(-9, -4, 18, 5, "#5e3a1f"); R(-1, -14, 2, 10, "#8a5a2b"); R(1, -13, 7, 6, "#e8dcc4"); R(-6, -12, 5, 2, "#16161c"); }
    else if (i === 4) { R(-9, -1, 18, 2, "#e3f1ff"); for (let j = 0; j < 12; j++) R(-j * .7 | 0, -13 + j, (j * 1.4 | 0) + 1, 1, j < 4 ? "#ffffff" : "#8c97ab"); }
    else if (i === 5) { R(-9, -9, 18, 10, "#a8703f"); R(-9, -13, 18, 4, "#5e3c1c"); R(-3, -5, 6, 6, "#3a2a1a"); R(-7, -8, 3, 2, "#ffd27a"); R(4, -8, 3, 2, "#ffd27a"); }
    else { R(-10, -2, 20, 3, "#e8e0d0"); for (const dx of [-8, -3, 2, 7]) R(dx, -10, 2, 8, "#e8e0d0"); R(-10, -13, 20, 3, "#d9a514"); }
  },

  drawMap() {
    if (!this.mapC) this.buildMap();
    const t = game.t, top = this.reached;
    ctx.drawImage(this.mapC, 0, 0);
    // paden met lantaarns
    for (let i = 0; i < CHAPTERS.length - 1; i++) {
      const open = i + 1 <= top;
      for (let k = 0; k <= 30; k++) {
        const [x, y] = this.pathPt(i, i + 1, k / 30);
        ctx.fillStyle = open ? (k % 2 ? "#6a6080" : "#3a3550") : "#22263c"; ctx.fillRect(Math.round(x) - 1, Math.round(y) - 1, 2, 2);
        if (open && k % 10 === 5) {
          const on = (t + i * 31 + k * 7) % 150 > 6; // af en toe flikkert er een lantaarn
          ctx.fillStyle = "#3a3f4a"; ctx.fillRect(Math.round(x) + 3, Math.round(y) - 8, 1, 8);
          if (on) { ctx.fillStyle = "rgba(255,210,122,.18)"; ctx.fillRect(Math.round(x) - 1, Math.round(y) - 12, 9, 9); }
          ctx.fillStyle = on ? "#ffd27a" : "#5e5640"; ctx.fillRect(Math.round(x) + 2, Math.round(y) - 10, 3, 3);
        }
      }
    }
    CHAPTERS.forEach((ch, i) => {
      const [x, y] = ch.node, open = i <= top, done = i < top || (SAVE.story || {}).done;
      this.drawNodeIcon(i, x, y, open);
      if (!open) txt("?", x, y - 3, 9, "#6a7090", "center", null);
      else if (done && i > 0) txt("✓", x + 12, y - 12, 8, "#6cc24a", "center", null);
    });
    // Julie op de kaart (klein)
    let jx, jy, dir = 1, fr = (t >> 5) % 2 ? "idle2" : "idle1";
    if (this.walk) { [jx, jy] = this.pathPt(Math.min(this.walk.from, this.walk.to), Math.max(this.walk.from, this.walk.to), this.walk.to > this.walk.from ? this.walk.k : 1 - this.walk.k); dir = this.walk.to > this.walk.from ? (CHAPTERS[this.walk.to].node[0] >= CHAPTERS[this.walk.from].node[0] ? 1 : -1) : (CHAPTERS[this.walk.to].node[0] >= CHAPTERS[this.walk.from].node[0] ? 1 : -1); fr = "run" + (((t / 4) | 0) % 4 + 1); }
    else [jx, jy] = CHAPTERS[this.at].node;
    const img = getSpr("julie", "classic")[fr][dir > 0 ? "r" : "l"];
    ctx.drawImage(img, Math.round(jx - OX / 4), Math.round(jy + 4 - OY / 4), SW / 4, SH / 4);
    this.rain(.5);
    // titel en info over het gekozen hoofdstuk
    txt("DE ZAAK VAN DE GOUDEN PEER", W / 2, 16, 12, "#ffe066", "center");
    if (!this.walk) {
      const ch = CHAPTERS[this.at];
      ctx.fillStyle = OUTLINE; ctx.fillRect(W / 2 - 112, 180, 224, 20); ctx.fillStyle = "rgba(18,23,48,.92)"; ctx.fillRect(W / 2 - 111, 181, 222, 18);
      const head = this.at === 0 ? "PROLOOG" : "HOOFDSTUK " + this.at;
      txt(head + " · " + ch.title, W / 2, 190, 8, "#ffe066", "center", null);
      ctx.font = "bold 6px monospace"; ctx.textAlign = "center"; ctx.fillStyle = "#c8cfe8";
      const sus = ch.opp ? (ch.final && !(SAVE.story || {}).done ? "???" : CHARS[ch.opp].name) : "";
      ctx.fillText(ch.name + (sus ? " · verdachte: " + sus : "") + (ch.rule ? " · " + ch.rule : "") + (this.retry === this.at ? " · ENTER = meteen opnieuw" : ""), W / 2, 197);
    }
    ctx.font = "bold 7px monospace"; ctx.fillStyle = "#c8cfe8"; ctx.textAlign = "center";
    ctx.fillText("A/D of ←/→ lopen · ENTER = onderzoeken · ESC = menu", W / 2, 210);
  },

  rain(a) {
    ctx.fillStyle = `rgba(170,190,230,${a})`;
    for (let i = 0; i < 60; i++) { const x = (i * 71 + game.t * 1.2) % (W + 20) - 10, y = (i * 53 + game.t * 4) % H; ctx.fillRect(Math.round(x), Math.round(y), 1, 4); }
  },

  // ---------- tussenscènes ----------
  play(i, part) {
    const ch = CHAPTERS[i], lines = ch[part];
    if (!lines) { part === "intro" ? this.fight(i) : this.finish(i); return; }
    if (ch.map) setMap(ch.map);
    this.scene = { i, part, lines, n: 0, k: 0, card: part === "intro" ? 110 : 0,
      actors: ch.actors.map(a => ({ ...a, pose: a.pose || "idle", hidden: !!a.hidden })) };
    this.puffs = [];
    this.applyLine();
    game.state = "scene";
  },

  applyLine() {
    const S = this.scene, L = S.lines[S.n]; if (!L) return;
    const by = id => S.actors.find(a => a.id === id);
    if (L.p) for (const id in L.p) { const a = by(id); if (a) a.pose = L.p[id]; }
    if (L.show) { const a = by(L.show); if (a) a.hidden = false; }
    if (L.hide) { const a = by(L.hide); if (a) a.hidden = true; }
    if (L.puff) { const a = by(L.puff); if (a) this.puff(a.x, this.groundY()); }
    S.k = 0;
  },

  puff(x, y) {
    sfx("throw");
    for (let i = 0; i < 26; i++) this.puffs.push({ x: x + (Math.random() - .5) * 40, y: y - Math.random() * 30, vx: (Math.random() - .5) * .6, vy: -Math.random() * .4, s: 4 + Math.random() * 6, life: 60 + Math.random() * 40 });
  },

  groundY() { return this.scene && CHAPTERS[this.scene.i].map ? CUR_MAP.main.y : 170; },

  updScene() {
    const S = this.scene;
    for (const p of this.puffs) { p.x += p.vx; p.y += p.vy; p.life--; }
    this.puffs = this.puffs.filter(p => p.life > 0);
    if (BACK()) { this.endScene(); return; } // overslaan
    if (S.card > 0) { S.card--; if (OK()) S.card = 0; return; }
    const L = S.lines[S.n];
    S.k += 1.2;
    if (!OK()) return;
    if (S.k < L.t.length) { S.k = L.t.length; return; } // eerst de zin afmaken
    S.n++; sfx("select");
    if (S.n >= S.lines.length) this.endScene(); else this.applyLine();
  },

  endScene() {
    const S = this.scene; this.scene = null;
    if (S.part === "intro") { if (CHAPTERS[S.i].opp) this.fight(S.i); else this.finish(S.i); }
    else this.finish(S.i);
  },

  fight(i) {
    const ch = CHAPTERS[i];
    MODES.mode = "story"; this.cur = i;
    game.start({ p1: { id: "julie", skin: (MODES.pick[0].id === "julie" && MODES.pick[0].skin) || "classic" }, p2: { id: ch.opp, skin: "classic", cpu: true, lvl: ch.lvl, tough: ch.tough }, stocks: ch.stocks || 2, map: ch.map });
    if (ch.startDmg) game.fighters[0].dmg = ch.startDmg;
  },

  afterMatch(w) {
    const i = this.cur;
    if (w.slot !== 0) { this.retry = i; this.at = i; game.state = "story"; return; }
    this.retry = -1; this.play(i, "outro");
  },

  overText(w) {
    if (w.slot === 0) return [CHAPTERS[this.cur].final ? "ZAAK OPGELOST!" : "VERDACHTE VERHOORD!", "ENTER = verder"];
    return ["VERLOREN...", "ENTER = terug naar de kaart"];
  },

  finish(i) {
    const nxt = i + 1;
    if (nxt < CHAPTERS.length) {
      if (nxt > this.reached) { this.reached = nxt; MODES.toast("Nieuwe locatie: " + CHAPTERS[nxt].name); }
      this.at = i; game.state = "story";
      if (nxt <= this.reached) this.walk = { from: i, to: nxt, k: 0 }; // loop alvast door naar de volgende plek
      return;
    }
    // einde van het verhaal: Julie en Enno worden speelbaar
    const first = !(SAVE.story || {}).done;
    SAVE.story = SAVE.story || {}; SAVE.story.done = true;
    for (const id of ["julie", "enno"]) if (!SAVE.unlocked.includes(id)) SAVE.unlocked.push(id);
    persist();
    this.endFirst = first; this.at = i; game.state = "storyend"; sfx("go");
  },

  drawActors() {
    const gy = this.groundY();
    for (const a of this.scene.actors) {
      if (a.hidden) continue;

      const img = set[fr][a.dir > 0 ? "r" : "l"];

    }
  },

  drawOffice() { // Julie's kantoor: jaloezieën, regen tegen het raam, een bureaulamp en een schaal peren
    const R = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); };

    for (let y = 0; y < 170; y += 6) R(0, y, W, 1, "#20243a");
    R(228, 30, 120, 96, OUTLINE); R(231, 33, 114, 90, "#0e1630");
    for (let i = 0; i < 12; i++) { const x = 236 + (i * 37) % 104, h = 20 + (i * 13) % 40; R(x, 123 - h, 8, h, "#151c38"); if (i % 2) R(x + 3, 126 - h, 2, 2, "#ffd27a"); }
    for (let i = 0; i < 20; i++) { const x = 232 + (i * 29 + game.t * .4) % 110, y = 34 + (i * 41 + game.t * 1.6) % 86; R(Math.round(x), Math.round(y), 1, 3, "rgba(170,200,255,.7)"); }
    for (let y = 36; y < 122; y += 8) R(231, y, 114, 3, "rgba(60,64,90,.85)"); // jaloezieën
    R(286, 33, 2, 90, OUTLINE);
    for (let y = 0; y < 60; y++) R(150 + y * .6, 126 + y * .7, 140 - y * .3, 1, "rgba(255,255,255,.025)"); // lichtstrepen op de vloer
    R(0, 170, W, H - 170, "#2a1e18"); for (let x = 0; x < W; x += 20) R(x, 170, 1, H - 170, "#22180f");
    R(40, 138, 104, 6, "#5e3c24"); R(40, 144, 104, 2, "#3a2616"); R(46, 146, 6, 24, "#4a2c14"); R(132, 146, 6, 24, "#4a2c14"); // bureau
    R(56, 118, 2, 20, "#3a3f4a"); R(50, 112, 16, 7, "#2f6a3a"); // lamp
    ctx.fillStyle = "rgba(255,220,140,.12)"; ctx.beginPath(); ctx.moveTo(50, 119); ctx.lineTo(66, 119); ctx.lineTo(96, 138); ctx.lineTo(32, 138); ctx.fill();
    R(100, 134, 22, 4, "#c3cad2"); for (let i = 0; i < 4; i++) { R(102 + i * 5, 128 + (i % 2), 4, 6, "#b8d23a"); R(103 + i * 5, 127 + (i % 2), 1, 1, "#6b4224"); } // schaal peren
    R(74, 132, 12, 6, "#16161c"); R(76, 130, 8, 2, "#16161c"); // telefoon
    if (this.scene && this.scene.n === 2 && (game.t >> 3) % 2) txt("RRRING!", 80, 124, 8, "#ffe066", "center", null);
    R(160, 40, 40, 56, "#2a2a3a"); R(163, 43, 34, 50, "#e8dcc4"); for (let k = 0; k < 6; k++) R(167, 48 + k * 7, 26 - (k % 3) * 5, 2, "#7a6a55"); R(178, 44, 3, 3, "#e63946"); // prikbord met aantekeningen
  },

  drawScene() {
    const S = this.scene, ch = CHAPTERS[S.i];
    if (ch.map) { drawBg(); drawStage(); ctx.fillStyle = "rgba(8,10,30,.6)"; ctx.fillRect(0, 0, W, H); }
    else this.drawOffice();
    this.drawActors();
    for (const p of this.puffs) { ctx.globalAlpha = Math.min(.8, p.life / 60); ctx.fillStyle = "#9a9aa8"; ctx.fillRect(Math.round(p.x - p.s / 2), Math.round(p.y - p.s / 2), Math.round(p.s), Math.round(p.s)); }
    ctx.globalAlpha = 1;
    this.rain(.35);
    for (let i = 0; i < 18; i++) { ctx.fillStyle = `rgba(0,0,0,${.35 - i * .02})`; ctx.fillRect(0, i, W, 1); ctx.fillRect(0, H - 1 - i, W, 1); } // vignet
    if (S.card > 0) { // titelkaart van het hoofdstuk
      const a = Math.min(1, S.card / 20, (110 - S.card) / 15 + .2);
      ctx.fillStyle = `rgba(6,8,20,${Math.min(1, a + .1)})`; ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = a;
      txt(S.i === 0 ? "PROLOOG" : "HOOFDSTUK " + S.i, W / 2, 96, 10, "#c8cfe8", "center", null);
      txt(ch.title.replace("Proloog: ", ""), W / 2, 118, 16, "#ffe066", "center");
      ctx.globalAlpha = 1;
      return;
    }
    const L = S.lines[S.n], shown = L.t.slice(0, Math.floor(S.k));
    if (L.w === "n") { // vertelstem: bovenin, zwart kader
      ctx.fillStyle = "#c8cfe8"; ctx.fillRect(10, 8, W - 20, 44); ctx.fillStyle = "#0b0d18"; ctx.fillRect(11, 9, W - 22, 42);
      ctx.font = "bold 6px monospace"; ctx.textAlign = "left"; ctx.fillStyle = "#8a90b0"; ctx.fillText("JULIE · VERTELLER", 18, 18);
      this.wrap(shown, L.t, 18, 30, W - 40, "#e8e0c8");
    } else { // iemand praat: onderin, met hoofdje
      const c = CHARS[L.w];
      ctx.fillStyle = OUTLINE; ctx.fillRect(8, 150, W - 16, 58); ctx.fillStyle = "#fff8ea"; ctx.fillRect(10, 152, W - 20, 54);
      ctx.fillStyle = "#2a2f48"; ctx.fillRect(14, 156, 38, 34); drawHead(L.w, 16, 158, 2, "classic");
      txt(c.name, 60, 164, 9, "#e63946", "left", null);
      this.wrap(shown, L.t, 60, 177, W - 84, OUTLINE);
    }
    if (S.k >= L.t.length && (game.t >> 4) % 2) txt("▼", W - 22, L.w === "n" ? 48 : 202, 8, L.w === "n" ? "#ffe066" : "#e63946", "center", null);
    ctx.font = "bold 6px monospace"; ctx.textAlign = "right"; ctx.fillStyle = "#8a90b0"; ctx.fillText("ESC = scène overslaan", W - 12, L.w === "n" ? 62 : 146);
  },

  // tekst over regels verdelen (op basis van de hele zin, zodat woorden niet verspringen tijdens het typen)
  wrap(shown, full, x, y, maxW, col) {
    ctx.font = "bold 8px monospace"; ctx.textAlign = "left"; ctx.fillStyle = col;
    const words = full.split(" "), lines = []; let cur = "";
    for (const w of words) { const t = cur ? cur + " " + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
    lines.push(cur);
    let left = shown.length;
    lines.forEach((l, i) => { if (left <= 0) return; ctx.fillText(l.slice(0, left), x, y + i * 10); left -= l.length + 1; });
  },

  // ---------- einde ----------
  drawEnd() {
    if (!this.mapC) this.buildMap();
    ctx.drawImage(this.mapC, 0, 0); ctx.fillStyle = "rgba(8,10,30,.55)"; ctx.fillRect(0, 0, W, H);
    txt("ZAAK GESLOTEN", W / 2, 26, 18, "#ffe066");
    MODES.card(W / 2 - 60, 44, { id: "julie", skin: "classic" }, this.endFirst ? "NIEUW!" : "SPEELBAAR", "#b8860b", false, false);
    MODES.card(W / 2 + 60, 44, { id: "enno", skin: "classic" }, this.endFirst ? "NIEUW!" : "SPEELBAAR", "#5d6876", true, false);
    txt("Julie en Enno zijn speelbaar in ladder en versus!", W / 2, 180, 8, "#ffe066", "center");
    ctx.font = "bold 8px monospace"; ctx.fillStyle = "#c8cfe8"; ctx.textAlign = "center"; ctx.fillText("ENTER = terug naar de kaart", W / 2, 204);
  },
};

// koppelen aan het menusysteem
(() => {
  const u0 = MODES.update, r0 = MODES.render, a0 = MODES.afterMatch, o0 = MODES.overText;
  MODES.update = function () {
    const s = game.state;
    if (s === "story") return STORY.updMap();

    if (s === "storyend") { if (OK()) { game.state = "story"; sfx("select"); } return; }

  };
  MODES.render = function () {
    const s = game.state;
    if (s === "story") return STORY.drawMap();
    if (s === "scene") return STORY.drawScene();

    r0.call(this);
  };
  MODES.afterMatch = function (w) { if (this.mode === "story") { this.recordWin(w); return STORY.afterMatch(w); } a0.call(this, w); };
  MODES.overText = function (w) { return this.mode === "story" ? STORY.overText(w) : o0.call(this, w); };
})();

// een opgeslagen halve ladder kan nog Julie als geheime eindbaas hebben: die wordt vervangen
if (SAVE.ladder && SAVE.ladder.opp && SAVE.ladder.opp[4]) {
  const o = SAVE.ladder.opp[4];
  if (o.newChar && CHARS[o.id] && CHARS[o.id].story) {
    const L = lockedChars();
    if (L.length) o.id = L[Math.random() * L.length | 0];
    else { o.newChar = false; o.boss = true; o.skin = "goud"; o.tough = 1.25; o.id = SAVE.ladder.pick.id; }
    o.map = homeMap(o.id); persist();
  }
}
