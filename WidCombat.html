<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Wat in de Combat: Pixel</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{--ink:#3b2a1a;--paper:#f6e7c8;--card:#fff8ea}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--paper)}
  body{display:flex;flex-direction:column;align-items:center;
    font-family:"Courier New",Courier,monospace;color:var(--ink);box-sizing:border-box;padding-bottom:52px;
    background-image:radial-gradient(#e9d3a8 1px,transparent 1px);background-size:8px 8px}
  .bar{height:34px;flex:none;display:flex;flex-wrap:nowrap;align-items:center;justify-content:center;gap:10px;font-size:11px;font-weight:bold;white-space:nowrap}
  .bar span.k{background:var(--card);border:2px solid var(--ink);padding:3px 7px}
  .bar b{color:#e63946}.bar .p2 b{color:#2a6fdb}
  .bar input{width:150px;font:11px "Courier New",monospace;border:2px solid var(--ink);background:var(--card);padding:3px 5px;color:var(--ink)}
  .bar button{font:bold 11px "Courier New",monospace;border:2px solid var(--ink);background:#ffe066;padding:3px 8px;box-shadow:2px 2px 0 var(--ink);cursor:pointer;color:var(--ink)}
  .bar button.off{background:#e63946;color:#fff}
  .bar button:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
  #stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
  #stage:fullscreen{background:#000}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;border:3px solid var(--ink);background:#9fd8ff;display:block}
  #stage:fullscreen canvas{border:0}
  @media (max-width:1100px){.bar .k{display:none}}
  @media print{.bar{display:none}}
</style>
</head>
<body>
<div class="bar">
  <span class="k"><b>P1</b> A/D · W spring · S hurken (2× = taunt) · F aanval · G special · W+G up-special</span>
  <span class="k p2"><b>P2</b> ←/→ · ↑ spring · ↓ hurken (2× = taunt) · K aanval · L special · ↑+L up-special</span>
  <span>Savecode</span>
  <input id="savecode" spellcheck="false" aria-label="Savecode">
  <button id="copySave">Kopieer</button>
  <button id="loadSave">Laad</button>
  <button id="mute" title="Alles stil (toets M)">🔊 Geluid: aan</button>
  <button id="mus" title="Alleen de muziek">♪ Muziek: aan</button>
  <button id="fs">⛶ Volledig scherm</button>
</div>
<div id="stage"><canvas id="c" width="768" height="432"></canvas></div>
<script>// ----- audio.js -----
// Geluid: alles wordt live gesynthetiseerd met Web Audio (geen bestanden nodig).
// Effecten = mix van oscillatoren + gefilterde ruis, met een kleine galm. Muziek = chiptune-sequencer.
let AC = null, MASTER = null, FX = null, ECHO = null, NOISE = null;

function audioInit() {
  try { AC = new AudioContext(); } catch (_) { return; }
  const comp = AC.createDynamicsCompressor();
  comp.threshold.value = -14; comp.ratio.value = 4;
  MASTER = AC.createGain(); MASTER.gain.value = MUTED ? 0 : .55; MASTER.connect(comp).connect(AC.destination);
  FX = AC.createGain(); FX.gain.value = 1; FX.connect(MASTER);
  // galm: korte echo met feedback en lowpass
  ECHO = AC.createDelay(); ECHO.delayTime.value = .11;
  const fb = AC.createGain(), lp = AC.createBiquadFilter();
  fb.gain.value = .28; lp.type = "lowpass"; lp.frequency.value = 2200;
  ECHO.connect(lp).connect(fb).connect(ECHO); lp.connect(MASTER);
  NOISE = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
  const d = NOISE.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  MUSIC.start();
}

function env(g, t, vol, dur, att = .004) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + att);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
}
// toon met toonhoogte-sweep; echo = ook naar de galm
function tone(type, f0, f1, dur, vol, when = 0, dest = FX, echo = false) {
  const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  env(g, t, vol, dur); o.connect(g).connect(dest); if (echo) g.connect(ECHO);
  o.start(t); o.stop(t + dur + .02);
}
// ruis door een filter met sweep (klap, whoosh, explosie)
function noise(dur, vol, ftype, f0, f1, q = 1, when = 0, dest = FX, echo = false) {
  const t = AC.currentTime + when, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = NOISE; s.loop = true; f.type = ftype; f.Q.value = q;
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  env(g, t, vol, dur); s.connect(f).connect(g).connect(dest); if (echo) g.connect(ECHO);
  s.start(t, Math.random()); s.stop(t + dur + .02);
}

const SFX = {
  jump() { tone("triangle", 330, 700, .12, .28); tone("square", 660, 1000, .05, .04); },
  swing() { noise(.13, .32, "bandpass", 500, 2600, 1.4); },
  hit() { noise(.09, .55, "lowpass", 3500, 400); tone("sine", 190, 60, .13, .55); tone("square", 1000, 300, .04, .08); },
  big() { noise(.28, .7, "lowpass", 3000, 110, 1, 0, FX, true); tone("sine", 150, 38, .32, .8); tone("sawtooth", 320, 70, .16, .12); },
  throw() { noise(.1, .28, "highpass", 1400, 4500); tone("triangle", 820, 420, .08, .12); },
  ko() { noise(.9, .8, "lowpass", 5000, 55, 1, 0, FX, true); tone("sine", 240, 28, 1, .9); tone("square", 900, 110, .5, .1, 0, FX, true); },
  select() { tone("square", 660, 660, .05, .09); tone("square", 990, 990, .08, .07, .05); },
  go() { [523, 659, 784, 1047].forEach((f, i) => tone("square", f, f, .14, .1, i * .07, FX, true)); },
  zap() { tone("sawtooth", 2000, 180, .28, .16, 0, FX, true); noise(.28, .35, "bandpass", 5000, 700, 3); },
  boom() { noise(.75, .9, "lowpass", 2000, 45, 1, 0, FX, true); tone("sine", 95, 28, .65, 1); },
  freeze() { [1568, 2093, 2637, 3136].forEach((f, i) => tone("sine", f, f * 1.01, .35, .07, i * .035, FX, true)); noise(.25, .15, "highpass", 6000, 9000); },
  bounce() { tone("sine", 900, 1250, .05, .18); },
  dig() { noise(.18, .35, "lowpass", 700, 160); tone("sine", 90, 60, .12, .25); },
  saber() { tone("sawtooth", 210, 330, .2, .08); tone("sawtooth", 213, 335, .2, .08); noise(.16, .18, "bandpass", 1100, 3200, 2); },
  transform() { tone("square", 180, 900, .32, .09); tone("square", 184, 910, .32, .09); tone("triangle", 90, 450, .32, .2, 0, FX, true); },
  erase() { noise(.3, .3, "bandpass", 2400, 900, 4); noise(.3, .2, "bandpass", 3000, 1200, 4, .05); },
  rocket() { noise(.45, .35, "bandpass", 600, 2400, 1.2); tone("sawtooth", 120, 260, .4, .06); },
  vroom() { tone("sawtooth", 140, 420, .32, .07); tone("square", 70, 210, .32, .04, .02); noise(.25, .12, "bandpass", 900, 1800, 2); }, // RC-auto trekt op
  rumble() { noise(.5, .4, "lowpass", 260, 80); tone("sine", 55, 38, .45, .3); }, // grond die openbreekt
  slurp() { noise(.2, .3, "bandpass", 500, 1400, 3); tone("sine", 260, 90, .18, .18, .04); }, // tentakel schiet omhoog
  snap() { noise(.06, .6, "highpass", 3000, 1500); tone("square", 900, 200, .08, .12); noise(.25, .25, "bandpass", 1200, 400, 2, .03); }, // klauw knipt dicht (pistoolgarnaal)
  splash() { noise(.45, .4, "bandpass", 900, 300, .8); noise(.3, .2, "highpass", 4000, 2500, 1, .05); }, // water
  pop() { tone("sine", 700, 1400, .06, .25); noise(.05, .3, "highpass", 2500, 2500); }, // kauwgombel knapt
};
const lastPlay = {};
function sfx(t) {
  if (!AC || MUTED) return;
  const now = AC.currentTime;
  if (lastPlay[t] && now - lastPlay[t] < .03) return; // niet stapelen in hetzelfde moment
  lastPlay[t] = now;
  (SFX[t] || SFX.hit)();
}

// ---------- muziek ----------
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function kick(t, dest) { const o = AC.createOscillator(), g = AC.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + .12); env(g, t, .9, .15, .002); o.connect(g).connect(dest); o.start(t); o.stop(t + .17); }
function hat(t, dest, vol = .12) { const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(); s.buffer = NOISE; f.type = "highpass"; f.frequency.value = 7000; env(g, t, vol, .04, .001); s.connect(f).connect(g).connect(dest); s.start(t, Math.random()); s.stop(t + .06); }
function snare(t, dest) { const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(); s.buffer = NOISE; f.type = "bandpass"; f.frequency.value = 1800; f.Q.value = .8; env(g, t, .45, .14, .002); s.connect(f).connect(g).connect(dest); s.start(t, Math.random()); s.stop(t + .16); }
function note(type, n, t, dur, vol, dest) {
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = midi(n);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01);
  g.gain.setValueAtTime(vol, t + dur * .6); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(dest); o.start(t); o.stop(t + dur + .02);
}

// Menu: rustig, Am - F - C - G, 8ste noten
const SONG_MENU = {
  bpm: 96, div: 2, len: 32,
  chords: [[57, 60, 64], [53, 57, 60], [60, 64, 67], [55, 59, 62]], roots: [45, 41, 48, 43],
  mel: [76, 0, 74, 72, 74, 0, 72, 69, 72, 0, 0, 69, 72, 74, 76, 0, 79, 0, 76, 0, 74, 72, 74, 76, 74, 0, 0, 0, 71, 72, 74, 0],
  play(s, t, sp, out) {
    const bar = (s >> 3) % 4, st = s % 8;
    if (st === 0 || st === 4) note("triangle", this.roots[bar], t, sp * 3.5, .5, out);
    note("square", this.chords[bar][st % 3] + 12, t, sp * .9, .04, out);
    const m = this.mel[s % this.len]; if (m) note("square", m, t, sp * 1.6, .07, out);
    if (st % 2 === 1) hat(t, out, .05);
  },
};
// Gevecht: snel, Am - F - G - E, 16de noten met drums
const SONG_FIGHT = {
  bpm: 140, div: 4, len: 64, roots: [45, 41, 43, 40],
  mel: [69, 0, 72, 0, 76, 0, 74, 72, 0, 69, 0, 72, 74, 0, 76, 0,
    77, 0, 76, 0, 74, 0, 72, 0, 69, 0, 72, 74, 0, 72, 69, 0,
    71, 0, 74, 0, 79, 0, 77, 76, 0, 74, 0, 71, 74, 0, 76, 0,
    76, 0, 80, 0, 83, 0, 81, 80, 0, 76, 0, 80, 81, 0, 80, 0],
  play(s, t, sp, out) {
    const bar = (s >> 4) % 4, st = s % 16, r = this.roots[bar];
    if (st % 2 === 0) note("square", r + ((st >> 1) % 2 ? 12 : 0), t, sp * 1.8, .09, out);
    if (st === 0 || st === 8 || st === 10) kick(t, out);
    if (st === 4 || st === 12) snare(t, out);
    if (st % 2 === 0) hat(t, out, st % 4 === 2 ? .1 : .06);
    const m = this.mel[s % this.len]; if (m) note("square", m, t, sp * 1.7, .065, out);
    if (st === 0) note("triangle", r + 24, t, sp * 15, .05, out); // zachte pad
  },
};

const MUSIC = {
  on: true, song: null, step: 0, next: 0, out: null,
  start() {
    this.out = AC.createGain(); this.out.gain.value = .32; this.out.connect(MASTER);
    setInterval(() => this.tick(), 25);
    this.label();
  },
  tick() {
    if (!AC || !this.out) return;
    const fight = typeof game !== "undefined" && (game.state === "play" || game.state === "over");
    const want = fight ? SONG_FIGHT : SONG_MENU;
    if (want !== this.song) { this.song = want; this.step = 0; this.next = AC.currentTime + .08; }
    const sp = 60 / this.song.bpm / this.song.div;
    if (this.next < AC.currentTime - .2) this.next = AC.currentTime + .02; // tab was weg: niet inhalen
    while (this.next < AC.currentTime + .12) {
      if (this.on && !MUTED) this.song.play(this.step, this.next, sp, this.out);
      this.step++; this.next += sp;
    }
  },
  toggle() { this.on = !this.on; this.label(); },
  label() { const b = document.getElementById("mus"); if (b) b.textContent = "♪ Muziek: " + (this.on ? "aan" : "uit"); },
};
document.addEventListener("DOMContentLoaded", () => {
  const b = document.getElementById("mus");
  if (b) b.onclick = () => { if (!AC) audioInit(); else MUSIC.toggle(); b.blur(); };
  const m = document.getElementById("mute");
  if (m) m.onclick = () => { toggleMute(); m.blur(); };
  muteLabel();
});

// ---------- mute: alles stil, wordt onthouden ----------
let MUTED = false;
try { MUTED = localStorage.getItem("wic_muted") === "1"; } catch (_) {}
function toggleMute() {
  MUTED = !MUTED;
  try { localStorage.setItem("wic_muted", MUTED ? "1" : "0"); } catch (_) {}
  if (MASTER) MASTER.gain.setTargetAtTime(MUTED ? 0 : .55, AC.currentTime, .02); // ook naklinkende geluiden meteen weg
  muteLabel();
}
function muteLabel() { const m = document.getElementById("mute"); if (m) { m.textContent = MUTED ? "🔇 Geluid: uit" : "🔊 Geluid: aan"; m.classList.toggle("off", MUTED); } }
</script>
<script>// ----- sprites.js -----
// Pixel sprites op een 64x64 lichaamsgrid (canvas 112x80 zodat knuppel/laptop erbuiten passen).
// Elk frame wordt uit een pose opgebouwd: hoeken voor armen en benen, plus een item.
const OUTLINE = "#2a1a10";
const SW = 112, SH = 80, OX = 48, OY = 72; // spritecanvas en voet-oorsprong
const D2R = Math.PI / 180;
// hoek 0 = recht omlaag, 90 = naar voren, 180 = omhoog, negatief = naar achter
const vec = (a, l) => [Math.sin(a * D2R) * l, Math.cos(a * D2R) * l];

function darken(hex, f = 0.78) {
  const n = parseInt(hex.slice(1), 16);
  const c = s => Math.round(((n >> s) & 255) * f).toString(16).padStart(2, "0");
  return "#" + c(16) + c(8) + c(0);
}

class Grid {
  constructor() { this.c = new Array(SW * SH).fill(null); }
  set(x, y, col) { x |= 0; y |= 0; if (x >= 0 && y >= 0 && x < SW && y < SH) this.c[y * SW + x] = col; }
  get(x, y) { return x < 0 || y < 0 || x >= SW || y >= SH ? null : this.c[y * SW + x]; }
  rect(x, y, w, h, col) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.set(x + i, y + j, col); }
  // ellips-ring (zoals Byte's hoepel); front = alleen de voorste helft
  band(cx, cy, rx, ry, w, col, front) {
    for (let y = Math.floor(cy - ry); y <= cy + ry; y++) for (let x = Math.floor(cx - rx); x <= cx + rx; x++) {
      const dx = x + .5 - cx, dy = y + .5 - cy;
      const o = (dx / rx) ** 2 + (dy / ry) ** 2, i = (dx / (rx - w)) ** 2 + (dy / Math.max(1, ry - w * .6)) ** 2;
      if (o <= 1 && i > 1 && (front ? dy >= 0 : dy < 0)) this.set(x, y, col);
    }
  }
  ring(cx, cy, r, w, col) {
    for (let y = Math.floor(cy - r); y <= cy + r; y++) for (let x = Math.floor(cx - r); x <= cx + r; x++) {
      const d = Math.hypot(x + .5 - cx, y + .5 - cy); if (d <= r && d >= r - w) this.set(x, y, col);
    }
  }
  disc(cx, cy, rx, ry, col, ymax = 1e9) {
    for (let y = Math.floor(cy - ry); y <= cy + ry && y <= ymax; y++)
      for (let x = Math.floor(cx - rx); x <= cx + rx; x++) {
        const dx = (x + .5 - cx) / rx, dy = (y + .5 - cy) / ry;
        if (dx * dx + dy * dy <= 1) this.set(x, y, col);
      }
  }
  seg(x1, y1, x2, y2, t, col) {
    const r = t / 2, dx = x2 - x1, dy = y2 - y1, L = dx * dx + dy * dy || 1;
    for (let y = Math.floor(Math.min(y1, y2) - r); y <= Math.max(y1, y2) + r; y++)
      for (let x = Math.floor(Math.min(x1, x2) - r); x <= Math.max(x1, x2) + r; x++) {
        const px = x + .5, py = y + .5;
        const k = Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / L));
        const ex = px - (x1 + dx * k), ey = py - (y1 + dy * k);
        if (ex * ex + ey * ey <= r * r) this.set(x, y, col);
      }
  }
  // schaduw aan de achter/onderkant, licht van voren/boven
  sdisc(cx, cy, rx, ry, base, shade, ymax) { this.disc(cx, cy, rx, ry, shade, ymax); this.disc(cx + 1, cy - 1, rx - 1.3, ry - 1.3, base, ymax); }
  sseg(x1, y1, x2, y2, t, base, shade) { this.seg(x1, y1, x2, y2, t, shade); this.seg(x1 + .8, y1 - .6, x2 + .8, y2 - .6, t - 1.8, base); }
  srect(x, y, w, h, base, shade) {
    this.rect(x + 1, y, w - 2, h, shade); this.rect(x, y + 1, w, h - 2, shade);
    this.rect(x + 3, y, w - 5, 1, base); this.rect(x + 2, y + 1, w - 3, h - 3, base);
  }
  arc(cx, cy, r, a0, a1, thick, col) {
    for (let a = a0; a <= a1; a += 1.5) {
      const t = thick * (a - a0) / (a1 - a0 || 1) + 1;
      for (let rr = r - t / 2; rr <= r + t / 2; rr += .7) { const v = vec(a, rr); this.set(cx + v[0], cy + v[1], col); }
    }
  }
}

// ---------- lichaamsdelen ----------
function leg(g, ch, hx, hy, th, sh, back, scale = 1) {
  const p = back ? ch.back : ch.pal, [TL, SL] = (ch.legLen || [10, 9]).map(v => v * scale); // scale: gestrekt been bij hoge trap
  const k = vec(th, TL), kx = hx + k[0], ky = hy + k[1];
  const s = vec(sh, SL), fx = kx + s[0], fy = ky + s[1];
  g.sseg(hx, hy, kx, ky, 7, ...p.leg);
  g.sseg(kx, ky, fx, fy, 6, ...p.leg);
  if (p.shorts) g.sseg(hx, hy, hx + k[0] * .75, hy + k[1] * .75, 8, ...p.shorts);
  if (p.sock) g.sseg(kx + s[0] * .5, ky + s[1] * .5, fx, fy, 5.5, ...p.sock);
  const f = vec(sh + 90, 6);
  g.sseg(fx - f[0] * .3, fy - f[1] * .3 + 1, fx + f[0], fy + f[1] + 1, 5, ...p.shoe);
  if (ch.stripe && !back) g.seg(fx, fy + 1, fx + f[0] * .6, fy + f[1] * .6 + 1, 1, ch.stripe);
}

function armPos(sx, sy, ua, fa, L = 8) {
  const u = vec(ua, L), f = vec(fa, L);
  return { ex: sx + u[0], ey: sy + u[1], hx: sx + u[0] + f[0], hy: sy + u[1] + f[1] };
}
function arm(g, ch, sx, sy, ua, fa, back) {
  const p = back ? ch.back : ch.pal, a = armPos(sx, sy, ua, fa, ch.armLen);
  if (ch.longSleeve) {
    g.sseg(sx, sy, a.ex, a.ey, 6, ...p.shirt); g.sseg(a.ex, a.ey, a.hx, a.hy, 5.5, ...p.shirt);
  } else {
    g.sseg(sx, sy, a.ex, a.ey, 5, ...p.skin); g.sseg(a.ex, a.ey, a.hx, a.hy, 5, ...p.skin);
    g.sseg(sx, sy, (sx + a.ex) / 2, (sy + a.ey) / 2, 7, ...p.shirt);
  }
  g.sdisc(a.hx, a.hy, 3, 3, ...p.skin);
}

// ---------- items ----------
const ITEMS = {
  bat(g, h, it) {
    const d = vec(it.a, 1), L = 26;
    g.seg(h.hx - d[0] * 3, h.hy - d[1] * 3, h.hx + d[0] * L * .45, h.hy + d[1] * L * .45, 3, "#a0682f");
    g.sseg(h.hx + d[0] * L * .4, h.hy + d[1] * L * .4, h.hx + d[0] * L, h.hy + d[1] * L, 5.5, "#e0a865", "#a0682f");
    g.disc(h.hx - d[0] * 4, h.hy - d[1] * 4, 2, 2, "#5a3a1a");
  },
  ball(g, h) { g.sdisc(h.hx + 1, h.hy - 1, 3.2, 3.2, "#ffffff", "#d0d0d0"); g.set(h.hx, h.hy - 2, "#d62828"); g.set(h.hx + 2, h.hy, "#d62828"); },
  laptopBack(g, h) { g.srect(h.hx - 4, h.hy - 11, 6, 16, "#c3cad2", "#7d8792"); g.rect(h.hx - 2, h.hy - 6, 2, 2, "#ffffff"); },
  laptopOpen(g, h) {
    g.srect(h.hx - 1, h.hy - 13, 14, 15, "#c3cad2", "#7d8792");
    g.rect(h.hx + 1, h.hy - 11, 10, 10, "#5fd4ff"); g.rect(h.hx + 2, h.hy - 10, 4, 2, "#c8f4ff");
    g.rect(h.hx + 7, h.hy - 5, 2, 2, "#ffffff");
  },
  laptopClosed(g, h) { g.srect(h.hx - 2, h.hy - 2, 12, 5, "#c3cad2", "#7d8792"); },
  controller(g, h) {
    g.srect(h.hx - 3, h.hy - 4, 11, 7, "#454552", "#26262e");
    g.set(h.hx + 5, h.hy - 2, "#ff4d4d"); g.set(h.hx + 6, h.hy - 1, "#4dd2ff"); g.rect(h.hx - 1, h.hy - 2, 3, 1, "#9a9aa8");
  },
  staff(g, h, it) {
    const d = vec(it.a, 1), L = 30;
    g.sseg(h.hx - d[0] * 8, h.hy - d[1] * 8, h.hx + d[0] * L, h.hy + d[1] * L, 3.5, "#b07a45", "#7a4f28");
    const tx = h.hx + d[0] * (L + 3), ty = h.hy + d[1] * (L + 3);
    g.sdisc(tx, ty, 4, 4, "#ffe066", "#e0a800"); g.rect(tx, ty - 2, 2, 2, "#fffbe0");
  },
  hammer(g, h, it) {
    const d = vec(it.a, 1), p = vec(it.a + 90, 1), L = 16;
    g.sseg(h.hx - d[0] * 3, h.hy - d[1] * 3, h.hx + d[0] * L, h.hy + d[1] * L, 3.5, "#b07a45", "#7a4f28");
    const tx = h.hx + d[0] * L, ty = h.hy + d[1] * L;
    g.sseg(tx - p[0] * 6, ty - p[1] * 6, tx + p[0] * 6, ty + p[1] * 6, 9, "#c3cad2", "#7d8792");
    g.sdisc(h.hx + d[0] * (L - 5), h.hy + d[1] * (L - 5), 2.5, 2.5, "#5e3c24", "#3a2616");
  },
  scepter(g, h, it) {
    const d = vec(it.a, 1), L = 24;
    g.sseg(h.hx - d[0] * 5, h.hy - d[1] * 5, h.hx + d[0] * L, h.hy + d[1] * L, 3, "#dfe6ee", "#8f9aa8");
    g.disc(h.hx + d[0] * (L - 1), h.hy + d[1] * (L - 1), 2.5, 2.5, "#e0b33a");
    const tx = h.hx + d[0] * (L + 5), ty = h.hy + d[1] * (L + 5);
    for (let j = -5; j <= 5; j++) { const w = 4 - Math.abs(j) * 0.7; g.rect(Math.round(tx - w), Math.round(ty + j), Math.max(1, Math.round(w * 2)), 1, j < 0 ? "#bfefff" : "#6fcff5"); }
    g.set(tx - 1, ty - 3, "#ffffff");
  },
  fist(g, h) {
    g.sdisc(h.hx + 2, h.hy, 5, 5, "#6e7782", "#454c55");
    g.rect(h.hx + 5, h.hy - 3, 2, 6, "#2ec4b6"); g.set(h.hx + 3, h.hy - 3, "#9aa3ad");
  },
  claw(g, h) { g.rect(h.hx + 2, h.hy - 3, 3, 1, "#ffffff"); g.rect(h.hx + 3, h.hy - 1, 3, 1, "#ffffff"); g.rect(h.hx + 2, h.hy + 1, 3, 1, "#ffffff"); },
  paddle(g, h, it) {
    const d = vec(it.a, 1);
    g.sseg(h.hx - d[0] * 2, h.hy - d[1] * 2, h.hx + d[0] * 5, h.hy + d[1] * 5, 3, "#d9a066", "#a8743f");
    g.sdisc(h.hx + d[0] * 11, h.hy + d[1] * 11, 6, 6, "#e63946", "#a51d2a");
    g.set(h.hx + d[0] * 11 + 2, h.hy + d[1] * 11 - 2, "#ff8a94");
  },
  saber(g, h, it) { // Beat Saber lichtzwaard: grijs handvat, gloeiend blad met witte kern
    const d = vec(it.a, 1), c = it.col === "blue" ? "#2e8bff" : "#ff3b4f";
    g.seg(h.hx - d[0] * 3, h.hy - d[1] * 3, h.hx + d[0] * 3, h.hy + d[1] * 3, 3.5, "#9aa3ad");
    g.seg(h.hx + d[0] * 3, h.hy + d[1] * 3, h.hx + d[0] * 24, h.hy + d[1] * 24, 4, c);
    g.seg(h.hx + d[0] * 4, h.hy + d[1] * 4, h.hx + d[0] * 23, h.hy + d[1] * 23, 1.4, "#ffffff");
  },
  leek(g, h, it) { // prei: witte schacht bij de hand, groene bladeren aan het eind
    const d = vec(it.a, 1), p = vec(it.a + 90, 1);
    for (const k of [-1, 0, 1]) g.seg(h.hx - d[0] * 7, h.hy - d[1] * 7, h.hx - d[0] * 9 + p[0] * k * 2, h.hy - d[1] * 9 + p[1] * k * 2, 1, "#c9b98f"); // worteltjes
    g.sseg(h.hx - d[0] * 7, h.hy - d[1] * 7, h.hx + d[0] * 10, h.hy + d[1] * 10, 5.5, "#f6f3e2", "#cfc9a8");
    g.sseg(h.hx + d[0] * 10, h.hy + d[1] * 10, h.hx + d[0] * 16, h.hy + d[1] * 16, 5.5, "#cde58a", "#a5c45e");
    for (const k of [-1.2, 0, 1.2]) g.sseg(h.hx + d[0] * 15, h.hy + d[1] * 15, h.hx + d[0] * 28 + p[0] * k * 3, h.hy + d[1] * 28 + p[1] * k * 3, 3, "#4f9e3f", "#2c6b1d");
  },
  katana(g, h, it) {
    const d = vec(it.a, 1), p = vec(it.a + 90, 1);
    g.seg(h.hx - d[0] * 5, h.hy - d[1] * 5, h.hx + d[0] * 2, h.hy + d[1] * 2, 3, "#8a1c2b");
    g.seg(h.hx + d[0] * 2 - p[0] * 3, h.hy + d[1] * 2 - p[1] * 3, h.hx + d[0] * 2 + p[0] * 3, h.hy + d[1] * 2 + p[1] * 3, 2, "#c9a227");
    g.sseg(h.hx + d[0] * 3, h.hy + d[1] * 3, h.hx + d[0] * 26, h.hy + d[1] * 26, 3, "#eef2f6", "#9aa6b2");
  },
  shuriken(g, h) {
    g.rect(h.hx - 1, h.hy - 5, 3, 9, "#9aa6b2"); g.rect(h.hx - 4, h.hy - 2, 9, 3, "#9aa6b2");
    g.set(h.hx, h.hy - 1, "#2b2d42");
  },
  bomb(g, h) {
    g.sdisc(h.hx + 1, h.hy - 2, 4.5, 4.5, "#4a4a56", "#26262e");
    g.rect(h.hx + 1, h.hy - 8, 1, 2, "#c9a26b"); g.set(h.hx + 2, h.hy - 9, "#ffb43a");
    g.rect(h.hx + 2, h.hy - 4, 2, 1, "#9a9aa8");
  },
  wrench(g, h, it) { // steeksleutel: rood handvat, stalen steel, open bek aan het eind
    const d = vec(it.a, 1), tx = h.hx + d[0] * 18, ty = h.hy + d[1] * 18;
    g.sseg(h.hx + d[0] * 3, h.hy + d[1] * 3, tx, ty, 3.5, "#c3cad2", "#7d8792");
    g.sseg(h.hx - d[0] * 4, h.hy - d[1] * 4, h.hx + d[0] * 4, h.hy + d[1] * 4, 4, "#e63946", "#a51d2a");
    g.sdisc(tx, ty, 4.5, 4.5, "#dfe6ee", "#8f9aa8");
    g.disc(tx + d[0] * 3.2, ty + d[1] * 3.2, 1.8, 1.8, null); // bek van de sleutel
  },
  rc(g, h) { // RC-autootje in de hand
    g.srect(h.hx - 2, h.hy - 3, 13, 5, "#e63946", "#a51d2a"); g.rect(h.hx + 3, h.hy - 5, 4, 2, "#7fe3ff");
    g.rect(h.hx - 2, h.hy - 1, 13, 1, "#ffffff");
    g.disc(h.hx + 1, h.hy + 2, 1.8, 1.8, "#2b2b30"); g.disc(h.hx + 8, h.hy + 2, 1.8, 1.8, "#2b2b30");
  },
  remote(g, h) { // afstandsbediening met antenne
    g.srect(h.hx - 2, h.hy - 4, 7, 8, "#454552", "#26262e");
    g.seg(h.hx + 3, h.hy - 4, h.hx + 5, h.hy - 12, 1, "#9a9aa8"); g.set(h.hx + 5, h.hy - 12, "#ff4d4d");
    g.set(h.hx, h.hy - 1, "#ff4d4d"); g.set(h.hx + 2, h.hy + 1, "#4dd2ff");
  },
  backpack(g, h, it) { // Jorn zwaait met zijn veel te grote schooltas
    const d = vec(it.a, 1), cx = h.hx + d[0] * 8, cy = h.hy + d[1] * 8;
    g.seg(h.hx, h.hy, cx, cy, 1.5, "#a8790a"); // hengsel
    g.srect(Math.round(cx - 6), Math.round(cy - 6), 12, 13, "#ffcc33", "#d9a514");
    g.rect(Math.round(cx - 4), Math.round(cy + 1), 8, 4, "#e0b020"); g.rect(Math.round(cx - 4), Math.round(cy - 4), 8, 1, "#a8790a");
    g.set(cx + 4, cy - 2, "#e63946"); // sleutelhanger
  },
  plane(g, h) { // papieren vliegtuigje
    g.rect(h.hx - 2, h.hy - 4, 10, 2, "#ffffff"); g.rect(h.hx, h.hy - 2, 6, 1, "#d8dde4"); g.set(h.hx + 8, h.hy - 4, "#ffffff");
  },
  hurley(g, h, it) { // Ierse hurley: houten stick met brede platte kop (bas)
    const d = vec(it.a, 1), p = vec(it.a + 90, 1), tx = h.hx + d[0] * 17, ty = h.hy + d[1] * 17;
    g.sseg(h.hx - d[0] * 3, h.hy - d[1] * 3, tx, ty, 2.6, "#d9b277", "#a8834a");
    g.sseg(h.hx - d[0] * 2, h.hy - d[1] * 2, h.hx + d[0] * 3, h.hy + d[1] * 3, 3, "#2a2a30", "#16161c"); // grip
    g.sdisc(tx + d[0] * 2 + p[0] * 1.5, ty + d[1] * 2 + p[1] * 1.5, 4, 4, "#e2c08a", "#a8834a");
    g.seg(tx + p[0] * 3, ty + p[1] * 3, tx + d[0] * 4 + p[0] * 3, ty + d[1] * 4 + p[1] * 3, 1, "#8a6a3a"); // metalen band
  },
  sliotar(g, h) { g.disc(h.hx + 1, h.hy - 1, 2.4, 2.4, "#f4f4f4"); g.set(h.hx, h.hy - 1, "#c43a3a"); g.set(h.hx + 2, h.hy - 2, "#c43a3a"); },
  pebble(g, h) { g.sdisc(h.hx + 1, h.hy - 1, 3, 2.5, "#9aa0ab", "#6b707a"); g.set(h.hx, h.hy - 2, "#c3cad2"); }, // Niffo's lievelingskiezel
  stick(g, h, it, len, w, c1, c2) { const d = vec(it.a, 1); g.sseg(h.hx - d[0] * 3, h.hy - d[1] * 3, h.hx + d[0] * len, h.hy + d[1] * len, w, c1, c2); return [h.hx + d[0] * len, h.hy + d[1] * len, d]; },
  shovel(g, h, it) { // klapschep van het leger
    const [tx, ty, d] = ITEMS.stick(g, h, it, 15, 2.4, "#6b5030", "#4a3820"), p = vec(it.a + 90, 1);
    g.sdisc(tx + d[0] * 3, ty + d[1] * 3, 4, 3.5, "#7d8792", "#5d6670"); g.seg(tx - p[0] * 3, ty - p[1] * 3, tx + p[0] * 3, ty + p[1] * 3, 1.5, "#5d6670");
  },
  radio(g, h) { g.srect(h.hx - 3, h.hy - 6, 6, 9, "#3a4422", "#262c16"); g.seg(h.hx + 2, h.hy - 6, h.hx + 3, h.hy - 13, 1, "#2a2a30"); g.set(h.hx - 1, h.hy - 3, "#7fe37a"); },
  cane(g, h, it) { // wandelstok met gekrulde zilveren knop
    ITEMS.stick(g, h, it, 18, 2.2, "#3a2616", "#24180c");
    const d = vec(it.a, 1); g.seg(h.hx - d[0] * 3, h.hy - d[1] * 3, h.hx - d[0] * 6 + 3, h.hy - d[1] * 6 - 2, 2.5, "#c3cad2"); g.set(h.hx - d[0] * 6 + 4, h.hy - d[1] * 6 - 1, "#eef2f6");
  },
  teacup(g, h) { g.srect(h.hx - 2, h.hy - 5, 6, 4, "#ffffff", "#d8dde4"); g.rect(h.hx - 3, h.hy - 1, 8, 1, "#d8dde4"); g.rect(h.hx + 4, h.hy - 4, 2, 2, "#d8dde4"); g.rect(h.hx - 1, h.hy - 5, 4, 1, "#a8703f"); g.set(h.hx, h.hy - 4, "#3a6ad8"); },
  slipper(g, h, it) { // pantoffel (het ultieme moederwapen)
    const d = vec(it.a, 1), cx = h.hx + d[0] * 7, cy = h.hy + d[1] * 7;
    g.sseg(h.hx + d[0] * 2, h.hy + d[1] * 2, cx + d[0] * 5, cy + d[1] * 5, 5, "#ff8fb0", "#d96a8a"); g.sseg(cx - d[0] * 2, cy - d[1] * 2, cx + d[0] * 3, cy + d[1] * 3, 3, "#ffd6e2", "#ffd6e2");
  },
  phone2(g, h) { g.srect(h.hx - 2, h.hy - 5, 5, 8, "#1d1d22", "#0e0e14"); g.rect(h.hx - 1, h.hy - 4, 3, 5, "#4dd2ff"); }, // afgepakte telefoon
  pole(g, h, it) { const [tx, ty] = ITEMS.stick(g, h, it, 20, 1.6, "#c3cad2", "#7d8792"); g.sdisc(tx, ty, 2.5, 1.2, "#e63946", "#a51d2a"); g.rect(h.hx - 1, h.hy - 2, 3, 3, "#1d1d22"); },
  revolver(g, h, it) {
    const [tx, ty, d] = ITEMS.stick(g, h, it, 9, 2.2, "#8a8f99", "#5d6670"); g.sdisc(h.hx + d[0] * 2, h.hy + d[1] * 2, 2.5, 2.5, "#6b707a", "#4a4f58");
    const q = vec(it.a - 90, 3); g.sseg(h.hx, h.hy, h.hx + q[0], h.hy + q[1], 2.2, "#8a5a2b", "#5e3c24"); g.set(tx, ty, "#2a2a30");
  },
  switch(g, h) { // Nintendo Switch in beide handen
    g.srect(h.hx - 8, h.hy - 5, 4, 7, "#3fa9f5", "#2a7fc0"); g.srect(h.hx + 6, h.hy - 5, 4, 7, "#ff4d4d", "#c92c42");
    g.srect(h.hx - 4, h.hy - 5, 10, 7, "#2a2a30", "#16161c"); g.rect(h.hx - 3, h.hy - 4, 8, 5, (h.hy | 0) % 2 ? "#7fe37a" : "#7fd0ff");
  },
  joycon(g, h) { g.srect(h.hx - 2, h.hy - 5, 4, 8, "#ff4d4d", "#c92c42"); g.set(h.hx, h.hy - 3, "#2a2a30"); },
  bone(g, h, it) { // grote dinobot als knots
    const [tx, ty, d] = ITEMS.stick(g, h, it, 15, 3, "#f4ead6", "#d8c8a8"), p = vec(it.a + 90, 1);
    for (const s of [1, -1]) g.sdisc(tx + d[0] * 2 + p[0] * s * 3, ty + d[1] * 2 + p[1] * s * 3, 3.2, 3.2, "#f4ead6", "#d8c8a8");
    for (const s of [1, -1]) g.sdisc(h.hx - d[0] * 4 + p[0] * s * 2.5, h.hy - d[1] * 4 + p[1] * s * 2.5, 2.5, 2.5, "#f4ead6", "#d8c8a8");
  },
  magnifier(g, h, it) { // vergrootglas
    const [tx, ty, d] = ITEMS.stick(g, h, it, 6, 1.6, "#6b4224", "#4a2c14");
    const cx = tx + d[0] * 4, cy = ty + d[1] * 4;
    g.disc(cx, cy, 4.5, 4.5, "#bfe8ff"); g.ring(cx, cy, 4.5, 1.6, "#d9a514"); g.set(cx - 1, cy - 2, "#ffffff");
  },
  pear(g, h) { // een peer (natuurlijk)
    g.sdisc(h.hx + 1, h.hy - 1, 3.5, 3.5, "#b8d23a", "#8aa82a"); g.sdisc(h.hx + 1, h.hy - 5, 2.2, 2.4, "#b8d23a", "#8aa82a");
    g.rect(h.hx + 1, h.hy - 9, 1, 2, "#6b4224"); g.rect(h.hx + 2, h.hy - 9, 2, 1, "#5fb544"); g.set(h.hx, h.hy - 2, "#e0f080");
  },
  jar(g, h) { // potje zinkfosfaat
    g.srect(h.hx - 3, h.hy - 7, 7, 9, "#e8eef2", "#c3cad2"); g.rect(h.hx - 3, h.hy - 9, 7, 2, "#5d6670");
    g.rect(h.hx - 2, h.hy - 4, 5, 3, "#3fa9f5"); g.set(h.hx, h.hy - 3, "#ffffff"); // etiket "Zn"
  },
  spoon(g, h, it) { // lepel van Haastregt
    const [tx, ty, d] = ITEMS.stick(g, h, it, 9, 1.3, "#d8dde4", "#8a939e");
    g.sdisc(tx + d[0] * 2, ty + d[1] * 2, 2.6, 2.6, "#eef2f6", "#9aa6b2"); g.set(Math.round(tx + d[0] * 2), Math.round(ty + d[1] * 2) - 1, "#ffffff");
  },
  tissue(g, h) { // zakdoekje (altijd nodig)
    g.srect(h.hx - 2, h.hy - 5, 6, 5, "#ffffff", "#d8dde4"); g.rect(h.hx - 1, h.hy - 7, 3, 2, "#ffffff"); g.set(h.hx + 1, h.hy - 3, "#bfe3ff");
  },
  briefcase(g, h) { // metalen koffer vol geld
    g.srect(h.hx - 6, h.hy - 1, 12, 9, "#9aa3b0", "#6b7380"); g.rect(h.hx - 2, h.hy - 3, 4, 2, "#3a3f4a");
    g.rect(h.hx - 6, h.hy + 3, 12, 1, "#5d6670"); g.rect(h.hx - 1, h.hy + 2, 2, 2, "#e0b33a"); g.set(h.hx + 5, h.hy + 6, "#6cc24a"); // briefje steekt eruit
  },
  rex(g, h) { g.srect(h.hx - 3, h.hy - 5, 8, 5, "#5fb544", "#3f8a2e"); g.rect(h.hx + 3, h.hy - 7, 4, 3, "#5fb544"); g.set(h.hx + 5, h.hy - 6, "#1d1d1d"); g.rect(h.hx - 2, h.hy, 2, 2, "#3f8a2e"); g.rect(h.hx + 2, h.hy, 2, 2, "#3f8a2e"); },
  hammer2(g, h, it) { // timmermanshamer met klauw
    const [tx, ty, d] = ITEMS.stick(g, h, it, 13, 2, "#c98b52", "#8a5a2b"), p = vec(it.a + 90, 1);
    g.sseg(tx - p[0] * 4, ty - p[1] * 4, tx + p[0] * 3, ty + p[1] * 3, 3.2, "#9aa0ab", "#5d6670"); g.seg(tx + p[0] * 3, ty + p[1] * 3, tx + p[0] * 5 - d[0] * 2, ty + p[1] * 5 - d[1] * 2, 1.4, "#5d6670");
  },
};

// propeller voor Byte: paaltje + wieken; spin wisselt tussen breed en kort (draait)
function propeller(g, x, y, spin) {
  g.rect(x - 1, y - 4, 2, 5, "#5d6670");
  if (spin) g.rect(x - 3, y - 7, 6, 2, "#3a3f4a");
  else g.rect(x - 6, y - 7, 12, 2, "#3a3f4a");
  g.rect(x - 1, y - 7, 2, 2, "#2ec4b6");
}

function renderPose(id, pose, trio) {
  const ch = CHARS[id], g = new Grid();
  const P = Object.assign({}, BASE, ch.defaults || {}, pose.stance ? STANCE : {}, pose); // defaults: items die hij altijd vasthoudt
  const b = P.bob + ch.dy, l = P.lean;
  const hipY = 51 + b, shY = 36 + b, shFx = 53 + l, shBx = 43 + l, hx = 50 + l, hy = 22 + b;
  const hand = armPos(shFx, shY, P.arF[0], P.arF[1], ch.armLen);

  if (ch.draw) ch.draw(g, P, l, b); else { // niet-menselijke characters tekenen zichzelf
  if (P.item && P.item.behind) ITEMS[P.item.type](g, hand, P.item);
  arm(g, ch, shBx, shY, P.arB[0], P.arB[1], true);
  if (P.item2) ITEMS[P.item2.type](g, armPos(shBx, shY, P.arB[0], P.arB[1], ch.armLen), P.item2); // item in de achterste hand
  leg(g, ch, 45 + l, hipY, P.thB, P.shB, true);
  if (ch.behind) ch.behind(g, 41 + l, 31 + b, P);
  ch.torso(g, 41 + l, 31 + b, 17, 22, P);
  ch.head(g, hx, hy, P);
  // hipF/hipFy: heup van het voorste been verschuiven (draaiende heup bij een kick)
  leg(g, ch, 51 + l + (P.hipF || 0), hipY + (P.hipFy || 0), P.thF, P.shF, false, P.legScale || 1);
  if (ch.front) ch.front(g, 41 + l, 31 + b, 17, 22, P);
  arm(g, ch, shFx, shY, P.arF[0], P.arF[1], false);
  if (P.item && !P.item.behind) ITEMS[P.item.type](g, hand, P.item);
  }

  // trio-kostuum (pompoen, krans, vizier...) bovenop het lichaam, krijgt ook een outline
  if (trio && TRIO_OF[id]) {
    const [ax, ay, r] = ch.headAt ? ch.headAt(P, l, b) : [hx, hy, 10];
    const ms = MEMBER_SKIN[id] || MEMBER_SKIN[TRIO_OF[id].members[0]];
    if (ms.acc) ms.acc(g, { ax, ay, r, P, hum: !ch.draw, l, b, tx: 41 + l, ty: 31 + b });
  }
  // outline rond alles
  const out = [];
  for (let y = 0; y < SH; y++) for (let x = 0; x < SW; x++)
    if (!g.get(x, y) && (g.get(x - 1, y) || g.get(x + 1, y) || g.get(x, y - 1) || g.get(x, y + 1))) out.push([x, y]);
  out.forEach(([x, y]) => g.set(x, y, OUTLINE));

  // effecten zonder outline
  if (P.smear) g.arc(shFx, shY, P.smear.r, P.smear.a0, P.smear.a1, P.smear.t, P.smear.col || "rgba(255,255,255,0.75)");
  if (P.signal) for (let r = 4; r <= 12; r += 4) g.arc(hand.hx + 9, hand.hy - 1, r, 50, 130, 0, ch.signalCol || "rgba(127,227,255,0.95)");
  return g;
}

const COLCACHE = {};
function parseCol(c) {
  if (COLCACHE[c]) return COLCACHE[c];
  let r;
  if (c[0] === "#") { const n = parseInt(c.slice(1), 16); r = [n >> 16 & 255, n >> 8 & 255, n & 255, 255]; }
  else { const m = c.match(/[\d.]+/g).map(Number); r = [m[0], m[1], m[2], Math.round((m[3] ?? 1) * 255)]; }
  return COLCACHE[c] = r;
}
function rgb2hsl([r, g, b]) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
  if (mx === mn) return [0, 0, l];
  const d = mx - mn, s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
  const h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [h / 6, s, l];
}
function hsl2rgb(h, s, l) {
  const f = n => { const k = (n + h * 12) % 12, a = s * Math.min(l, 1 - l); return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))); };
  return [f(0), f(8), f(4)];
}

      g.rect(x - 2, y, 5, 1, COS.snow); g.rect(x, y - 2, 1, 5, COS.snow); g.set(x - 1, y - 1, COS.snow); g.set(x + 1, y + 1, COS.snow); g.set(x + 1, y - 1, COS.snow); g.set(x - 1, y + 1, COS.snow);

  pumpkin(g, o) {

    g.rect(R_(ax - 4), R_(ay - R + 3), 1, R_(R * 2 - 5), COS.pumpS); g.rect(R_(ax + 3), R_(ay - R + 3), 1, R_(R * 2 - 5), COS.pumpS);

    g.rect(R_(ax), R_(ay + 3), 9, 2, COS.carve); g.set(ax + 2, ay + 3, COS.pump); g.set(ax + 6, ay + 3, COS.pump); g.set(ax + 4, ay + 4, COS.glow);

    g.rect(R_(o.ax + 6), R_(o.ay + 5), 5, 1, COS.bone); for (let i = 0; i < 3; i++) g.set(o.ax + 6 + i * 2, o.ay + 6, COS.bone);

  },
  shadowEyes(g, o) { g.rect(R_(o.ax + 3), R_(o.ay - 3), 3, 2, COS.eyeG); g.rect(R_(o.ax + 7), R_(o.ay - 3), 2, 2, COS.eyeG); },

  },
  patch(g, x, y, s = 5) { g.rect(R_(x), R_(y), s, s, COS.blk); g.seg(x - 6, y - 3, x + s + 3, y + 1, 1, COS.blk); }, // ooglapje
  bandana(g, x, y, r) { // rode piratenbandana met stippen en knoop achter

    g.sdisc(x, y - r + 3, r + 1, 3, COS.snow, "#cfd8e0"); g.disc(x - r - 5, y - r + 7, 2.8, 2.8, COS.snow);

      g.seg(bx, by, bx + s * 2 - 2, by - 9, 1.6, "#8a5a2b"); g.seg(bx + s * 1 - 1, by - 5, bx + s * 5 - 2, by - 8, 1.3, "#8a5a2b"); g.seg(bx - 1, by - 7, bx - 4, by - 11, 1.2, "#8a5a2b");

  monocle(g, o) { g.ring(o.ax + 6, o.ay, 2.6, 1, COS.gold); g.seg(o.ax + 6, o.ay + 3, o.ax + 3, o.ay + 11, .6, COS.gold); },
  bowtie(g, o) { const x = o.hum ? o.tx + 12 : o.ax + 2, y = o.hum ? o.ty + 1 : o.ay + o.r + 2; g.rect(R_(x - 4), R_(y - 2), 3, 4, COS.rib); g.rect(R_(x + 2), R_(y - 2), 3, 4, COS.rib); g.rect(R_(x - 1), R_(y - 1), 3, 2, COS.ribS); },
  shades(g, o) { g.rect(R_(o.ax + 2), R_(o.ay - 1), 5, 3, COS.blk); g.rect(R_(o.ax + 8), R_(o.ay - 1), 4, 3, COS.blk); g.rect(R_(o.ax - 3), R_(o.ay - 1), 5, 1, COS.blk); g.set(o.ax + 3, o.ay - 1, "#7fd0ff"); },
  lei(g, o) { const x = o.hum ? o.tx + 1 : o.ax - 8, y = o.hum ? o.ty + 1 : o.ay + o.r; for (let i = 0; i < 7; i++) g.disc(x + i * 2.6, y + Math.sin(i / 6 * Math.PI) * 3, 1.6, 1.6, ["#ff6b9a", "#ffe066", "#ff8a3d", "#9b6cff"][i % 4]); },
  strawhat(g, o) { g.sdisc(o.ax, o.ay - o.r + 2, o.r + 6, 2.5, "#f2d36b", "#c9a640"); g.sdisc(o.ax - 1, o.ay - o.r - 2, 8, 5, "#f2d36b", "#c9a640", o.ay - o.r - 1); g.rect(R_(o.ax - 8), R_(o.ay - o.r), 16, 2, COS.rib); },
  nightcap(g, o) { g.sseg(o.ax + 2, o.ay - o.r - 1, o.ax - 6, o.ay - o.r - 7, 6, "#3a6ad8", "#2a4a9a"); g.sseg(o.ax - 6, o.ay - o.r - 7, o.ax - o.r - 6, o.ay - o.r + 4, 3, "#3a6ad8", "#2a4a9a"); g.disc(o.ax - o.r - 6, o.ay - o.r + 6, 2.4, 2.4, COS.snow); for (let i = -4; i < 6; i += 4) g.set(o.ax + i, o.ay - o.r - 3, "#ffe066"); },

  curlers(g, o) { for (const [dx, dy] of [[-6, -1], [-1, -3], [4, -2], [-9, 4]]) { g.srect(R_(o.ax + dx), R_(o.ay - o.r + dy), 4, 3, "#ff8fd0", "#d96aa8"); g.set(o.ax + dx + 1, o.ay - o.r + dy + 1, COS.snow); } },
  partyhat(g, o) { for (let j = 0; j < 12; j++) { const w = R_(j * .55) + 1; g.rect(R_(o.ax - w), R_(o.ay - o.r - 12 + j), w * 2, 1, (j >> 1) % 2 ? "#ffe066" : "#e63946"); } g.disc(o.ax, o.ay - o.r - 13, 2, 2, "#3fa9f5"); },
  bow(g, o) { const y = o.ay - o.r - 1; g.sdisc(o.ax - 5, y, 4, 3, "#ff6b9a", "#d94a78"); g.sdisc(o.ax + 5, y, 4, 3, "#ff6b9a", "#d94a78"); g.disc(o.ax, y, 2, 2, "#ff8fb0"); },

const TRIOS = [

<script>// ----- alts.js -----
// Challenge-skins per character: in plaats van overal hetzelfde kleurwiel te draaien krijgt elk character
// een eigen kleurregel die bij de naam past (Duivel = rood en zwart, Albino raaf = wit met rode ogen, ...).
// f(h, s, l, C, huid, kleur) -> [h, s, l] of null (kleur blijft). C = hoe kleurrijk (0 = grijs/wit/zwart).
// Characters die hier niet staan houden de oude kleurdraai (Giuseppe, Byte, Grumbleclaw enz. waren al goed).

const ALT_SKIN = (() => {
  const grey = (C, l, lo = 0, hi = 1) => C < .12 && l >= lo && l <= hi; // wit/grijs/zwart
  const inv = l => Math.min(.97, .62 + l * 1.2); // donker -> licht met behoud van schaduw
  const blue = h => h > .5 && h < .75;
  return {
    nathan: { f: (h, s, l, C) => grey(C, l, .6) ? [.62, .45, l * .35 + .08] : null }, // wit tenue -> marineblauw
    josh: { f: (h, s, l, C) => grey(C, l, .7) ? [.36, .95, .55] : C > .12 ? [.62, .15, l * .35] : null }, // zwart met neongroen
    milo: { f: (h, s, l, C) => C < .12 ? null : blue(h) || h >= .75 ? [.01, Math.max(s, .8), Math.min(.55, l + .04)] : h > .1 && h < .2 ? [.07, 1, .55] : null }, // vuurrood, gele bliksem wordt oranje vuur
    lars: { f: (h, s, l, C) => C > .1 ? [.7, s * .8, l * .8] : null }, // indigo nacht
    reshman: { f: (h, s, l, C) => C > .04 && l < .7 ? [.33, Math.max(s, .35), l * 1.05] : null }, // bosgroen
    deniz: { f: (h, s, l, C) => grey(C, l, .7) ? [.02, .3, .14 + (l - .7) * .5] : blue(h) || (h > .45 && h < .5) ? [.03 + (l > .6 ? .06 : 0), .9, Math.max(.35, l * .9)] : null }, // lava + obsidiaan
    otis: { f: (h, s, l, C) => grey(C, l, .4) ? [.04, .65, l * .72] : grey(C, l) ? [.02, .4, l * .7] : blue(h) ? [.12, .9, l] : null }, // roestrood marspak met gouden vizier
    adam: { f: (h, s, l, C) => C > .12 && blue(h) ? [.13, .88, l * .95] : null }, // gouden kampioensshirt
    dih: { skin: true, f: (h, s, l, C) => C > .06 && (h > .85 || h < .05) ? [.27, .8, l * .85] : null }, // gifgroene worm
    raaf: { f: (h, s, l, C, sk, col) => col === "#1d1d1d" ? [0, .85, .45] : l < .4 && !sk ? [.75, .12, inv(l)] : null }, // wit met rode ogen
    toon: { f: (h, s, l, C) => C > .12 ? [.76, .6, l * .6] : null }, // diepzeepaars
    jorn: { f: (h, s, l, C) => C > .12 && blue(h) && l > .4 ? [.14, .95, .55] : null }, // gele regenjas
    fionn: { f: (h, s, l, C) => C > .12 && h > .25 && h < .45 ? [(h + .36) % 1, .7, .55 + l * .35] : null }, // pastel paasei
    niffo: { skin: true, f: (h, s, l, C) => C > .06 ? [h, s * .55, l * .72] : null }, // donkerbruine zeeotter
    daniel: { f: (h, s, l, C) => C > .08 && h > .1 && h < .3 ? [.1, .4, l + .2] : null }, // zandkleurig camo
    jenna: { f: (h, s, l, C) => C > .12 && (h > .85 || h < .03) ? [.13, .9, l * .9] : null }, // goud
    lawrence: { f: (h, s, l, C) => C > .1 && h > .03 && h < .15 ? [.99, .6, l * .85] : null }, // rode tweed
    enno: { f: (h, s, l, C, sk, col) => col !== "#1d1d1d" && l > .08 && l < .8 && !(C > .3) ? [.78, .45, l * 1.05] : null }, // paars pak
    ati: { f: (h, s, l, C) => C > .12 && (h > .85 || h < .03) ? [.92, .7, Math.min(.8, l + .18)] : null }, // roze moederdag
    thomas: { f: (h, s, l, C) => C > .12 ? [.53, .6, .55 + l * .4] : null }, // ijsblauw/wit
    dean: { f: (h, s, l, C) => C > .06 && h > .02 && h < .14 ? [h, .15, l * .45] : null }, // alles zwart
    jeanmarco: { f: (h, s, l, C) => C > .12 && (h > .9 || h < .05) ? [.66, .6, l * .8] : null }, // bosbes
    ruben: { f: (h, s, l, C) => C > .4 ? [h < .1 || h > .9 ? .42 : .52, .55, Math.min(.75, l + .1)] : null }, // mintgroene speciale editie
    sichen: { f: (h, s, l, C) => C > .12 ? (h > .1 && h < .2 ? [0, .85, .5] : blue(h) ? [.14, .95, .55] : null) : null }, // rood en geel
    julie: { f: (h, s, l, C) => C > .06 && !(h < .03 || h > .97) ? [0, 0, l * .85] : null }, // zwart-wit (rood blijft)
    maat: { skin: true, f: (h, s, l, C, sk, col) => { // duivel: rode huid, zwarte vleugels en tuniek, kristallen van vuur

    } },
    haastregt: { f: (h, s, l, C) => grey(C, l, .7) ? [.38, .45, l * .9] : C > .1 && h > .03 && h < .14 ? [.78, .45, l] : null }, // mintgroene labjas
    robin: { f: (h, s, l, C) => C > .12 && blue(h) ? [.8, .6, l * .8] : null }, // toneelpaars
    alexander: { f: (h, s, l, C, sk, col) => col !== "#1d1d1d" && grey(C, l, 0, .32) && C < .08 ? [.58, .15, inv(l)] : null }, // wit bontpak
  };
})();

(() => {
  const sc0 = skinColor;
  skinColor = function (id, skin, col) {
    const A = ALT_SKIN[id];
    if (skin !== "alt" || !A) return sc0(id, skin, col);
    const c = parseCol(col);
    if (c[3] < 255 || col === OUTLINE) return c;
    const sk = CHARS[id].skinSet.has(col);
    if (sk && !A.skin) return c;
    const [h, s, l] = rgb2hsl(c), C = (Math.max(c[0], c[1], c[2]) - Math.min(c[0], c[1], c[2])) / 255;
    const r = A.f(h, s, l, C, sk, col);

    const cl = v => Math.max(0, Math.min(1, v));
    return [...hsl2rgb(((r[0] % 1) + 1) % 1, cl(r[1]), cl(r[2])), 255];
  };
})();

<script>// ----- fighter.js -----
// Fighter: beweging, physics, aanvallen en tekenen.
const STAGE = {
  main: { x1: 72, x2: 312, y: 150 },
  plats: [{ x1: 100, x2: 170, y: 108 }, { x1: 214, x2: 284, y: 108 }],
};
const GRAV = 0.32, MAXFALL = 5, FASTFALL = 7.5;
const SLOT_COL = ["#e63946", "#2a6fdb"];

class Fighter {
  constructor(id, slot, x, skin = "classic", stocks = 3) {
    this.id = id; this.baseId = id; this.c = CHARS[id]; this.slot = slot; this.spawnX = x; this.skin = skin;
    this.stocks = stocks; this.maxStocks = stocks; this.cpu = false; this.lvl = 3; this.tough = 1; this.reset();
  }
  reset() {
    if (this.id !== this.baseId) { this.id = this.baseId; this.c = CHARS[this.id]; } // Byte begint weer als drone
    this.burrow = 0;
    this.lastHit = null; this.fellThrough = null; this.frozenBy = null; this.shaft = null;
    this.x = this.spawnX; this.y = 20; this.vx = 0; this.vy = 0; this.dmg = 0;
    this.face = this.spawnX < 192 ? 1 : -1; this.ground = false; this.onPlat = false;
    this.jumps = this.c.airJumps || 1; this.atk = null; this.atkT = 0; this.cd = 0; this.stun = 0;
    this.inv = 120; this.animT = 0; this.drop = 0; this.flash = 0; this.fast = false; this.ko = 0; this.frozen = 0;
    this.rise = 0;
    this.helpless = false; this.upUsed = false; this.glide = 0; this.tether = null; this.hide = 0; this.jumpT = -99; this.jumpAir = false; this.upDir = 0;
    if (this.c.rises) { this.y = STAGE.main.y; this.ground = true; this.rise = 34; } // Toon rijst uit de grond op in plaats van te vallen
  }
  get alive() { return this.ko === 0 && this.stocks > 0; }

  update(inp, game) {
    if (this.ko > 0) { this.ko--; if (this.ko === 0 && this.stocks > 0) this.reset(); return; }
    if (this.stocks <= 0) return;
    if (this.inv > 0) this.inv--;
    if (this.cd > 0) this.cd--;
    if (this.flash > 0) this.flash--;
    this.animT++;
    const c = this.c;

    if (this.burrow > 0) { // Dih graaft onder de grond: snel bewegen, onraakbaar
      this.burrow--; this.atk = null;
      const mv = (inp.r ? 1 : 0) - (inp.l ? 1 : 0);
      if (mv) this.face = mv;
      this.vx = mv * 3.2;
      if (this.burrow % 4 === 0) game.dust(this.x, this.y);
      if (this.burrow === 0 || !this.ground || (this.burrow < 38 && (inp.spc || inp.atk))) { this.burrow = 0; game.popUp(this); }
    } else if (this.rise > 0) {
      this.rise--; this.vx = 0; this.atk = null;
      if (this.rise % 5 === 0) game.dust(this.x, this.y);
      if (this.rise === 30) sfx("rumble");
    } else if (this.stun > 0) {
      this.stun--; this.vx *= 1 - 0.012 * this.c.weight; // zware characters remmen sneller af
      this.vx += ((inp.r ? 1 : 0) - (inp.l ? 1 : 0)) * 0.05; // bijsturen tijdens het wegvliegen
    } else if (this.frozen > 0) {
      this.frozen--; this.vx *= 0.9; this.atk = null; // bevroren: niks doen
    } else {
      // taunt: twee keer snel omlaag. Even kwetsbaar; na een halve seconde kun je hem afbreken.
      if (this.taunt > 0) { this.taunt--; if (this.taunt < 34 && (inp.atk || inp.spc || inp.jump || inp.l || inp.r)) this.taunt = 0; else inp = { ...inp, l: false, r: false, atk: false, spc: false, jump: false, d: false }; }
      if (inp.dp && this.ground && !this.atk && !(this.taunt > 0)) { if (this.animT - (this.lastD ?? -99) < 14) { this.startTaunt(); this.lastD = -99; inp = { ...inp, d: false }; } else this.lastD = this.animT; }
      this.crouch = !!inp.d && this.ground && !this.onPlat && !this.atk && !(this.taunt > 0); // hurken: projectielen vliegen over je heen
      const mv = (inp.r ? 1 : 0) - (inp.l ? 1 : 0);
      if (!this.atk && mv) this.face = mv;
      const locked = (this.atk && this.ground) || this.crouch || this.taunt > 0;
      // zweefvlieger: altijd een beetje vooruit; hulpeloos: minder sturen
      const target = locked ? 0 : this.glide > 0 ? (mv || this.face) * 2.4 : mv * c.speed * (this.helpless ? .6 : 1);
      const acc = this.ground ? 0.5 : 0.2;
      this.vx += Math.max(-acc, Math.min(acc, target - this.vx));

      // up special: omhoog + special, één keer per sprong
      const wantUp = inp.spc && inp.u && c.up && !this.atk && !this.helpless && !this.upUsed && this.glide <= 0;
      if (wantUp && this.jumpAir && this.animT - this.jumpT <= 4) { this.jumps++; this.jumpAir = false; } // tegelijk ingedrukt: dubbele sprong niet verspillen
      if (inp.jump && !this.atk && !wantUp && !this.helpless && this.glide <= 0) {
        if (this.ground) { this.vy = -c.jump; this.ground = false; game.dust(this.x, this.y); sfx("jump"); }
        else if (this.jumps > 0) { this.jumps--; this.vy = -c.jump * 0.9; this.fast = false; game.dust(this.x, this.y); sfx("jump"); this.jumpT = this.animT; this.jumpAir = true; }
      }
      if (inp.d) {
        if (this.glide > 0) { this.glide = 0; this.helpless = !this.ground; } // zweefvlieger loslaten
        else if (this.ground && this.onPlat) { this.drop = 10; this.ground = false; this.y += 1; }
        else if (!this.ground && this.vy > 0) this.fast = true;
      }
      const busy = this.helpless || this.glide > 0;
      if (wantUp) { this.atk = "up"; this.atkT = 0; this.hitDone = false; this.upUsed = true; this.upDir = mv; if (mv) this.face = mv; }
      else if (inp.atk && !this.atk && !busy) { this.atk = "atk"; this.atkT = 0; this.hitDone = false; }
      else if (inp.spc && !inp.u && !this.atk && !busy && this.cd <= 0 && !(c.special.type === "dash" && this.dashUsed)) { this.atk = "spc"; this.atkT = 0; this.cd = c.spcCd; }
    }

    if (this.atk === "up") {
      const u = c.up; this.atkT++;
      if (this.atkT < u.start) { this.vy *= .6; this.vx *= .85; } // even inhouden in de lucht
      if (this.atkT === u.start) game.upStart(this);
      if (this.atkT >= u.start) game.upTick(this);
      if (this.atk === "up" && this.atkT >= u.start + u.dur) { this.atk = null; if (!this.ground && u.type !== "glide") this.helpless = true; }
    } else if (this.atk) {
      this.atkT++;
      const a = this.atk === "atk" ? c.attack : c.special;
      if (this.atk === "atk" && this.atkT === a.start) sfx(this.c.swingSfx || "swing");
      if (this.atk === "atk" && this.atkT >= a.start && this.atkT < a.start + a.active && !this.hitDone) game.tryHit(this);
      if (this.atk === "spc" && this.atkT === a.start) game.spawnProj(this);
      if (this.atkT >= a.start + a.active + a.end) this.atk = null;
    }

    // physics
    if (this.drop > 0) this.drop--;
    this.vy += GRAV * (c.grav || 1); // Otis zweeft (lage zwaartekracht)
    if (this.glide > 0) { this.glide--; if (this.glide === 0 && !this.ground) this.helpless = true; }
    const mf = this.glide > 0 && this.atk !== "up" ? 0.6 : (this.fast ? FASTFALL : MAXFALL) * (c.grav || 1);
    if (this.vy > mf && this.stun <= 0) this.vy = mf;
    const oy = this.y, wasGround = this.ground, fallV = this.vy;
    this.x += this.vx; this.y += this.vy;
    this.ground = false; this.onPlat = false;

    const m = STAGE.main;
    if (this.vy >= 0) {
      if (this.x > m.x1 - 4 && this.x < m.x2 + 4 && oy <= m.y && this.y >= m.y && !game.holeAt(this, m, this.x)) this.land(m.y, wasGround, game);
      else if (this.drop <= 0) for (const p of STAGE.plats) {
        if (this.x > p.x1 - 2 && this.x < p.x2 + 2 && oy <= p.y && this.y >= p.y && !game.holeAt(this, p, this.x)) { this.land(p.y, wasGround, game); this.onPlat = p; break; } // onPlat = op welk platform (bewegende platforms nemen je mee)
      }
    }
    // zijkanten van het eiland zijn massief
    if (this.y > m.y + 2 && this.y < m.y + 66 && this.x > m.x1 - 6 && this.x < m.x2 + 6 && !this.shaft && !game.holeAt(this, m, this.x, true)) {
      this.x = this.x < (m.x1 + m.x2) / 2 ? m.x1 - 6 : m.x2 + 6; this.vx = 0;
    }
    if (this.ground && this.stun > 4 && fallV > 2.2) { this.vy = -fallV * .55; this.ground = false; this.onPlat = false; this.y -= 1; } // hard tegen de grond geslagen: stuiteren in plaats van stilliggen
    else if (this.ground && this.stun > 0) this.vx *= 0.85;
    if (this.shaft) { // door een gat gevallen: binnen het eiland recht naar beneden blijven, niet opzij geduwd worden
      if (this.y > this.shaft.y + 72 || this.ground) this.shaft = null;
      else if (this.y > this.shaft.y + 1) this.x = Math.max(this.shaft.x1 + 1, Math.min(this.shaft.x2 - 1, this.x));
    }

    if (this.x < -50 || this.x > 434 || this.y > 290 || this.y < -90) game.koFighter(this);
  }

  land(y, wasGround, game) {
    if (!wasGround && this.vy > 2.5) game.dust(this.x, y);
    this.y = y; this.vy = 0; this.ground = true; this.dashUsed = false; this.jumps = this.c.airJumps || 1; this.fast = false;
    this.helpless = false; this.upUsed = false; this.glide = 0; this.jumpAir = false;
  }

  frame() {
    if (this.stun > 0) return "hurt";
    if (this.atk === "up") { const p = this.c.up.pose; return this.atkT < this.c.up.start ? p[0] : p[1]; }
    if (this.glide > 0) return "jump";
    if (this.atk === "atk") {
      const a = this.c.attack;
      if (this.atkT < a.start) return this.c.poses.atk_spin && this.atkT >= a.start / 2 ? "atk_spin" : "atk_wind";
      return this.atkT < a.start + a.active + 4 ? "atk_hit" : "atk_end";
    }
    if (this.atk === "spc") return this.atkT < this.c.special.start ? "spc_wind" : "spc_throw";
    if (!this.ground) return this.vy < 0 ? "jump" : "fall";
    if (Math.abs(this.vx) > 0.4) return "run" + (((this.animT / 5) | 0) % 4 + 1);
    return (this.animT >> 5) % 2 ? "idle2" : "idle1";
  }

  draw(ctx) {
    if (!this.alive || this.hide > 0) return; // hide: even weg tijdens een teleport
    if (this.burrow > 0) { // alleen een bewegend hoopje aarde
      const x = Math.round(this.x), y = Math.round(this.y), w = (this.animT >> 2) % 2;
      ctx.fillStyle = OUTLINE; ctx.fillRect(x - 10, y - 6, 20, 6); ctx.fillRect(x - 6, y - 8, 12, 2);
      ctx.fillStyle = "#8a5a2b"; ctx.fillRect(x - 9, y - 5, 18, 5); ctx.fillRect(x - 5, y - 7, 10, 2);
      ctx.fillStyle = "#b07a45"; ctx.fillRect(x - 5 + w, y - 6, 4, 1); ctx.fillRect(x + 2 - w, y - 4, 3, 1);
      return;
    }
    if (this.rise > 0) { // half in de grond: scheur tekenen en alles onder de vloer wegknippen
      const x = Math.round(this.x), y = Math.round(this.y);
      ctx.fillStyle = OUTLINE; ctx.fillRect(x - 12, y - 1, 24, 2);
      ctx.fillStyle = "#9b1626"; ctx.fillRect(x - 8, y - 1, 4, 1); ctx.fillRect(x + 3, y - 1, 5, 1);
      ctx.save(); ctx.beginPath(); ctx.rect(x - 40, y - 60, 80, 60); ctx.clip();
    }
    if (this.inv > 0 && this.inv % 8 < 3 && this.rise <= 0) return; // knipperen na respawn
    const set = getSpr(this.id, this.skin)[this.frame()], white = this.flash > 0;
    const img = this.face > 0 ? (white ? set.w : set.r) : (white ? set.wl : set.l);
    // spritecanvas 112x80 op halve wereldschaal; voeten liggen op (48,72)
    const ox = this.face > 0 ? OX : SW - OX, sink = Math.round(this.rise * 1.1);
    const sq = 1, hop = this.taunt > 0 ? -Math.round(Math.abs(Math.sin(this.taunt * .25)) * 3) : 0, duck = this.crouchOn(); // taunt = huppelen
    if (duck) { ctx.save(); ctx.beginPath(); ctx.rect(this.x - 60, this.y - 80, 120, 80.5); ctx.clip(); } // hurken: niks onder de vloer tekenen
    ctx.drawImage(img, Math.round(this.x * 2 - ox) / 2, Math.round(this.y * 2 - OY * sq) / 2 + sink + hop, SW / 2, SH / 2 * sq);
    if (duck) ctx.restore();
    if (this.rise > 0) { ctx.restore(); return; }
    drawUpFx(this); // zweefvlieger, drone, tentakel...

    if (this.frozen > 0 && this.cringe) { // bevroren van een flauwe grap: zweetdruppel en "-_-"
      const yy = Math.round(this.y - this.c.height - 10);
      txt("-_-", Math.round(this.x), yy, 8, "#5a5a66", "center", null);
      ctx.fillStyle = "#7fd0ff"; ctx.fillRect(Math.round(this.x) + 8, yy - 4 + ((this.frozen >> 3) % 3), 2, 3);
    } else if (this.frozen > 0) { // ijsblok eromheen
      const h = this.c.height + 4, x0 = Math.round(this.x) - 12, y0 = Math.round(this.y) - h;
      ctx.fillStyle = "rgba(160,225,255,0.55)"; ctx.fillRect(x0, y0, 24, h);
      ctx.fillStyle = "rgba(255,255,255,0.85)"; ctx.fillRect(x0 + 3, y0 + 3, 2, 8); ctx.fillRect(x0 + 6, y0 + 3, 4, 1);
      ctx.fillStyle = "#5fb8e0"; ctx.fillRect(x0, y0, 24, 1); ctx.fillRect(x0, y0 + h - 1, 24, 1); ctx.fillRect(x0, y0, 1, h); ctx.fillRect(x0 + 23, y0, 1, h);
    }

    const lx = Math.round(this.x), ly = Math.round(this.y - 44 + this.c.dy / 2);
    ctx.fillStyle = SLOT_COL[this.slot];
    ctx.fillRect(lx - 3, ly + 6, 6, 2); ctx.fillRect(lx - 1, ly + 8, 2, 2);
    ctx.font = "bold 8px monospace"; ctx.textAlign = "center";
    ctx.fillText(this.cpu ? "CPU" : "P" + (this.slot + 1), lx, ly + 4);
  }
}
</script>
<script>// ----- game.js -----
// Game: input, projectielen, treffers, stage, HUD en schermen.
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;
const W = 384, H = 216;

// wereld is 384x216, canvas is 2x zo groot; daarna vullen we het hele beschikbare vlak (16:9)
const stageEl = document.getElementById("stage");
function fit() {
  const fs = document.fullscreenElement === stageEl;
  const aw = fs ? innerWidth : stageEl.clientWidth - 16, ah = fs ? innerHeight : stageEl.clientHeight - 12;
  const s = Math.max(0.5, Math.min(aw / (W * 2), ah / (H * 2)));
  cv.style.width = Math.floor(W * 2 * s) + "px"; cv.style.height = Math.floor(H * 2 * s) + "px";
}
addEventListener("resize", fit);
document.addEventListener("fullscreenchange", fit);
document.getElementById("fs").onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else if (stageEl.requestFullscreen) stageEl.requestFullscreen().catch(() => {});
};

// ---------- input ----------
const held = new Set(), pressed = new Set();
addEventListener("keydown", e => {
  if (!AC) audioInit();
  if (e.code === "KeyM" && !e.repeat && e.target.tagName !== "INPUT") toggleMute(); // alles stil (muziek + effecten)
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
  if (!held.has(e.code)) pressed.add(e.code);
  held.add(e.code);
});
addEventListener("keyup", e => held.delete(e.code));
const MAP = [
  { l: "KeyA", r: "KeyD", u: "KeyW", d: "KeyS", atk: "KeyF", spc: "KeyG" },
  { l: "ArrowLeft", r: "ArrowRight", u: "ArrowUp", d: "ArrowDown", atk: "KeyK", spc: "KeyL" },
];
function humanInput(slot) {
  const k = MAP[slot];
  return { l: held.has(k.l), r: held.has(k.r), d: held.has(k.d), dp: pressed.has(k.d), u: held.has(k.u), jump: pressed.has(k.u), atk: pressed.has(k.atk), spc: pressed.has(k.spc) };
}

// Wanneer is de special van een bot nuttig? dx/dy = afstand tot wat hij van jou "ziet".
// Geeft een kans per frame terug (0 = niet doen).
function cpuSpecialWish(f, dx, dy, lv) {
  const ax = Math.abs(dx), ay = Math.abs(dy), base = 0.03 + lv * 0.012, T = f.c.special.type;
  switch (T) {
    case "ball": case "ice": case "star": case "football": // rechte projectielen: op afstand, zelfde hoogte
      return ax > 40 && ax < 170 && ay < 26 ? base : 0;
    case "zap": return ax > 30 && ax < 115 && ay < 18 ? base * 1.3 : 0;
    case "drone": return ax > 50 && ay < 60 ? base * .8 : 0; // drone zoekt zelf de hoogte op
    case "pong": return ax > 30 && ax < 140 && ay < 40 ? base : 0;
    case "bomb": return ax > 40 && ax < 120 && dy > -40 && dy < 20 ? base : 0; // boog: iets lager of gelijk
    case "dino": case "goons": return ax > 35 && ax < 200 && dy > -8 && dy < 45 ? base : 0;
    case "joke": return ax > 30 && ax < 170 && ay < 30 ? base : 0;
    case "dash": return ax > 45 && ax < 110 && ay < 22 ? base * .7 : 0;
    case "burrow": return f.ground && ax > 35 && ax < 130 && ay < 20 ? base : 0;
    case "erase": return ax > 25 && ax < 60 && ay < 6 ? base * 2 : 0; // gat valt ~40 px voor hem
    case "feather": return ax > 30 && ax < 150 && dy > -12 && dy < 50 ? base : 0; // veren vallen schuin omlaag
    case "note": return ax > 40 && ax < 180 && ay < 24 ? base : 0;
    case "rocket": return ax > 55 && ax < 220 && ay < 20 ? base * .9 : 0;
    case "rc": return ax > 35 && ax < 200 && dy > -8 && dy < 45 ? base : 0; // rijdt over de vloer: jij staat even hoog of lager
    case "tentacle": return ax > 42 && ax < 82 && ay < 30 ? base * 1.6 : 0; // komt ~60 px voor hem uit de grond
    case "snap": return ax > 25 && ax < 120 && ay < 20 ? base : 0; // korte schokgolf
    case "wave": return f.ground && ax > 30 && ax < 150 && dy > -10 && dy < 24 ? base : 0; // golf over de vloer
    case "plane": return ax > 40 && ax < 210 && ay < 30 ? base * .9 : 0;
    case "sliotar": return ax > 45 && ax < 200 && ay < 30 ? base : 0;
    case "stone": case "tea": case "joycon": case "pear": case "zinc": case "spoon": case "tears": case "squirt": return ax > 40 && ax < 180 && ay < 30 ? base : 0;
    case "shout": return ax > 25 && ax < 130 && ay < 30 ? base * 1.1 : 0;
    case "bullet": return ax > 50 && ay < 16 ? base * 1.1 : 0;
    case "crumbs": return ax < 70 && ay < 24 ? base * 1.2 : 0;
    case "air": return ax > 40 && ax < 220 ? base * .9 : 0;
    case "sprint": return f.ground && ax > 30 && ax < 120 && ay < 20 ? base : 0;
    case "smoke": case "avalanche": return f.ground && ax > 25 && ax < 150 && dy > -10 && dy < 24 ? base : 0;
    case "vent": return f.ground && ax > 70 ? base * .7 : 0; // van ver weg achter je opduiken
    case "transform": // drone wordt mech als je dichtbij komt, mech wordt drone als je wegloopt
      return f.id === "byte" ? (ax < 45 && ay < 30 ? base : 0) : (ax > 140 ? base * .6 : 0);
  }
  return 0;
}

// Bots ontwijken de gaten van Guiseppe: eroverheen springen, stoppen aan de rand, of in de lucht wegsturen.
function cpuAvoidHoles(f, o, inp) {
  for (const h of game.holes) {
    if (h.owner === f) continue;
    const s = h.s, near = f.x > h.x1 - 28 && f.x < h.x2 + 28;
    if (!near) continue;
    if (!f.ground) { // vallend boven (of vlak bij) het gat: naar de dichtstbijzijnde rand sturen
      if (f.vy >= 0 && f.y <= s.y + 2 && s.y - f.y < 70 && f.x > h.x1 - 6 && f.x < h.x2 + 6) {
        const left = f.x - h.x1 < h.x2 - f.x;
        inp.l = left ? 1 : 0; inp.r = left ? 0 : 1;
        if (f.jumps > 0 && s.y - f.y < 14) inp.jump = 1;
      }
      continue;
    }
    if (Math.abs(f.y - s.y) > 1) continue; // staat op een andere vloer
    const dir = inp.r ? 1 : inp.l ? -1 : 0;
    const ahead = dir > 0 ? h.x1 - f.x : f.x - h.x2; // afstand tot de rand van het gat in looprichting
    if (!dir || ahead < -2 || ahead > 18) continue;
    if (o.x > h.x1 && o.x < h.x2) { if (ahead < 10) inp.l = inp.r = 0; } // Guiseppe staat op het gat: niet achterna lopen
    else inp.jump = 1; // gat is max 36 breed: een sprong haalt de overkant
  }
}

const DODGE_PROJ = ["ball", "ice", "star", "pong", "football", "feather", "note", "rocket", "rc", "drone", "bomb", "snap", "plane", "wave", "sliotar", "gen"];
function cpuInput(f, o) {
  const inp = { l: 0, r: 0, d: 0, jump: 0, atk: 0, spc: 0 };
  if (!f.alive) return inp;
  const m = STAGE.main, T = f.c.special.type, lv = f.lvl || 3;
  if (f.stun > 0) { // bijsturen tijdens het wegvliegen (vanaf niveau 2): richting het midden
    if (lv >= 2) f.x < 192 ? inp.r = 1 : inp.l = 1;
    return inp;
  }
  if (f.burrow > 0) { // onder de grond: naar je toe kruipen en onder je opduiken
    const ddx = o.x - f.x;
    if (Math.abs(ddx) > 8) ddx > 0 ? inp.r = 1 : inp.l = 1; else inp.spc = 1;
    return inp;
  }
  // terugkomen: naast het podium, of eronder (bijv. door een gat gevallen)
  if (f.x < m.x1 + 4 || f.x > m.x2 - 4 || (!f.ground && f.y > m.y + 4)) {
    const toR = f.x < 192, out = toR ? m.x1 - f.x : f.x - m.x2; // out > 0 = buiten het podium
    toR ? inp.r = 1 : inp.l = 1; f.face = toR ? 1 : -1;
    // dubbele sprong op tijd: zodra hij valt en onder de rand zakt, of eerder als hij ver weg is
    if (!f.ground && f.jumps > 0 && f.vy > 0.3 && (f.y > m.y - 25 || (out > 40 && f.y > m.y - 70))) inp.jump = 1;
    // up special als laatste redmiddel (Toon wacht tot de rand binnen tentakelbereik is)
    const U = f.c.up;
    if (U && !f.ground && f.jumps <= 0 && !f.upUsed && !f.helpless && f.glide <= 0 && !f.atk && f.vy > 0 &&
        (U.type === "tether" ? Math.hypot(Math.max(0, out), f.y - m.y) < U.len : f.y > m.y - 30 || out > 70)) { inp.spc = 1; inp.u = 1; return inp; }
    if (!f.ground && f.jumps <= 0 && f.cd <= 0 && f.vy > 0 && f.y > m.y - 30) {
      if (T === "dash" || T === "burrow") inp.spc = 1; // jetpack / opduik geeft hoogte
      if (T === "transform" && f.id === "bytemech") inp.spc = 1; // terug naar drone om te vliegen
    }
    return inp;
  }
  if (!o.alive) { if (Math.abs(f.x - 192) > 10) (f.x < 192 ? inp.r = 1 : inp.l = 1); return inp; }
  // Reactietijd: de CPU "ziet" waar jij een tijdje geleden was (niveau 1 ≈ 0,5 s, niveau 5 ≈ 0,22 s)
  const delay = Math.round(34 - lv * 4);
  f.hist = f.hist || [];
  f.hist.push({ x: o.x, y: o.y });
  while (f.hist.length > delay + 1) f.hist.shift();
  const seen = f.hist[0];
  f.cpuCd = f.cpuCd || 0;
  if (f.cpuCd > 0) f.cpuCd--;
  const away = o.x > f.x ? -1 : 1, safeAway = away < 0 ? f.x > m.x1 + 30 : f.x < m.x2 - 30;
  const dodge = () => { // wegspringen, of een stapje terug als er achter hem nog podium is
    if (f.ground && (!safeAway || Math.random() < .6)) inp.jump = 1;
    if (safeAway) away > 0 ? inp.r = 1 : inp.l = 1;
    f.cpuCd = Math.max(f.cpuCd, 8); return inp;
  };

  // ontwijken: jouw aanval zien aankomen (eerst een paar frames "doorhebben")
  const oa = o.c.attack, swingId = game.t - o.atkT;
  if (o.atk === "atk" && o.atkT >= 9 - lv && o.atkT < oa.start && f.dodged !== swingId &&
      Math.abs(o.x - f.x) < oa.w + 14 && Math.abs(o.y - f.y) < 30) {
    f.dodged = swingId;
    if (Math.random() < 0.08 + lv * 0.1) return dodge();
  }
  // projectielen en grondtentakels ontwijken
  for (const p of game.projs) {
    if (p.o !== o || p.cpuSeen) continue;
    const incoming = DODGE_PROJ.includes(p.type) && Math.sign(p.vx) === Math.sign(f.x - p.x) && Math.abs(f.x - p.x) < 70 && Math.abs(p.y - (f.y - 14)) < 20;
    const below = ((p.type === "tentacle" && p.life > 22) || (p.type === "strike" && p.life > 10)) && Math.abs(p.x - f.x) < 16;
    if (!incoming && !below) continue;
    p.cpuSeen = true;
    if (Math.random() < 0.1 + lv * 0.11) {
      if (below) { p.x > f.x ? inp.l = 1 : inp.r = 1; return inp; }
      if (f.ground) { inp.jump = 1; return inp; }
    }
  }

  if (Math.random() < 0.2 - lv * 0.04) { cpuAvoidHoles(f, o, inp); return inp; } // lagere levels twijfelen vaker (maar lopen geen gat in)
  const dx = seen.x - f.x, dy = seen.y - f.y, adx = Math.abs(dx), ady = Math.abs(dy);
  const A = f.c.attack, reach = A.w + 4;
  // afstand houden die bij zijn eigen wapen past (korte wapens moeten dichterbij komen)
  if (adx > reach * .75) dx > 0 ? inp.r = 1 : inp.l = 1;
  if ((f.x < m.x1 + 14 && inp.l) || (f.x > m.x2 - 14 && inp.r)) inp.l = inp.r = 0;
  if (dy < -24 && adx < 60 && f.ground && Math.random() < 0.04 + lv * 0.02) inp.jump = 1; // achter je aan naar boven
  if (dy > 30 && f.onPlat && Math.random() < 0.05 + lv * 0.02) inp.d = 1;
  const inRange = adx < reach && ady < 26;
  cpuAvoidHoles(f, o, inp);
  // special: als hij klaar is en het nu zin heeft
  if (f.cd <= 0 && f.cpuCd <= 0 && !f.atk && Math.random() < cpuSpecialWish(f, dx, dy, lv)) {
    f.face = dx > 0 ? 1 : -1; inp.spc = 1; inp.l = inp.r = 0; f.cpuCd = 20; f.react = null;
    return inp;
  }
  // up special als anti-air: jij hangt vlak boven hem
  const U = f.c.up;
  if (U && U.hit && f.ground && !f.atk && f.cpuCd <= 0 && dy < -20 && dy > -60 && adx < 20 && Math.random() < 0.02 * lv) {
    f.face = dx > 0 ? 1 : -1; inp.spc = 1; inp.u = 1; inp.l = inp.r = 0; f.cpuCd = 24; return inp;
  }
  if (inRange) {
    // afstraffen: jij zit nog in de naloop van een (gemiste) aanval
    const oMove = o.atk === "atk" ? oa : o.atk === "spc" ? o.c.special : null;
    const punish = oMove && o.atkT >= oMove.start + oMove.active && f.punished !== game.t - o.atkT;
    if (punish && !f.atk && f.cpuCd <= 0) {
      f.punished = game.t - o.atkT;
      if (Math.random() < 0.25 + lv * 0.12) { f.face = dx > 0 ? 1 : -1; inp.atk = 1; f.cpuCd = Math.max(14, 28 - lv * 3); f.react = null; return inp; }
    }
    // eerst "doorhebben" dat je dichtbij bent, dan pas slaan
    if (f.react == null) f.react = Math.round(delay * (0.3 + Math.random() * 0.7));
    else if (f.react > 0) f.react--;
    else if (f.cpuCd <= 0 && !f.atk) {
      f.react = null; f.cpuCd = Math.max(16, 32 - lv * 3);
      if (Math.random() < 0.55 + lv * 0.08) { f.face = dx > 0 ? 1 : -1; inp.atk = 1; }
    }
  } else f.react = null;
  return inp;
}

// eerste vloer op of onder hoogte fromY bij positie x
function groundAt(x, fromY = -1e9) {
  let best = H + 40;
  for (const s of [STAGE.main, ...STAGE.plats]) if (x >= s.x1 && x <= s.x2 && s.y >= fromY - 1 && s.y < best) best = s.y;
  return best;
}

// ---------- spelstaat ----------
const game = {
  state: "menu",
  fighters: [], projs: [], parts: [], holes: [], freeze: 0, shake: 0, t: 0, overT: 0, winner: null, goT: 0,

  // opts: { p1: {id, skin}, p2: {id, skin, cpu, lvl, tough}, stocks }
  start(opts) {
    const s = opts.stocks || 3;
    setMap(opts.map || "weiland");
    const a = new Fighter(opts.p1.id, 0, 132, opts.p1.skin, s), b = new Fighter(opts.p2.id, 1, 252, opts.p2.skin, s);
    b.cpu = !!opts.p2.cpu; b.lvl = opts.p2.lvl || 3; b.tough = opts.p2.tough || 1;
    this.fighters = [a, b];
    this.projs = []; this.parts = []; this.holes = []; this.state = "play"; this.goT = 70; sfx("go");
  },

  // Guiseppe gumt stukken podium weg: anderen vallen erdoor, hijzelf (en wie net respawnt) niet
  holeAt(f, surf, x, wall) {
    for (const h of this.holes) {
      if (h.warn > 0 || h.s !== surf || x < h.x1 || x > h.x2 || h.owner === f || f.inv > 0) continue;
      if (!wall) { f.fellThrough = { f: h.owner, t: this.t }; if (surf === STAGE.main) f.shaft = { x1: h.x1, x2: h.x2, y: surf.y }; } // shaft: recht naar beneden door het eiland
      return true;
    }
    return false;
  },

  dust(x, y) {
    for (let i = 0; i < 5; i++) this.parts.push({ x: x + (Math.random() - .5) * 12, y: y - 2, vx: (Math.random() - .5) * 1.2, vy: -Math.random() * .6, life: 18, col: "#f3ead8", s: 3 });
  },
  sparks(x, y, n, col) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 3;

  hit(t, a, dir, x, y, src, move) {
    t.dmg = Math.min(999, t.dmg + a.dmg);
    t.lastHit = { f: src, move, t: this.t };
    // vaste knockback klein, procenten tellen zwaarder: lage % = kleine tikjes, gewicht maakt echt verschil
    const kb = (a.base * 0.55 + t.dmg * a.scale * 1.25) / (t.c.weight * t.tough), ang = a.ang * Math.PI / 180;
    const ta = t.c.attack;
    if (t.atk === "atk" && ta.armor && t.atkT < ta.start && kb < ta.armor) {
      // super armor: schade wel, wegvliegen niet
      t.flash = 6; this.freeze = 4; this.shake = 2;
      this.sparks(x, y, 6, "#9fd8ff"); sfx("hit");

    }
    t.vx = dir * kb * Math.cos(ang); t.vy = -kb * Math.sin(ang);
    t.helpless = false; t.upUsed = false; t.glide = 0; t.tether = null; t.hide = 0; // geraakt worden geeft je recovery terug
    t.stun = Math.floor(kb * 3.5); t.atk = null; t.flash = 8; t.ground = false; t.jumps = t.c.airJumps || 1; t.fast = false;
    t.cringe = !!a.cringe; // Sichen: bevroren van ongemak, niet van ijs
    if (a.freeze) { t.frozenBy = { f: src, t: this.t }; t.stun = 0; t.frozen = a.freeze; t.vx *= 0.3; t.vy *= 0.3; this.sparks(x, y, 12, "#bfefff"); sfx("freeze"); }
    this.freeze = Math.min(12, 3 + a.dmg * 0.5 + kb * 0.3);
    this.shake = Math.min(8, kb * 0.7);
    this.sparks(x, y, 8 + kb | 0, kb > 7 ? "#ff8a3d" : "#fff36b");
    sfx(kb > 7 ? "big" : "hit");
  },

  box(f) {
    const a = f.c.attack;
    return { x1: f.face > 0 ? f.x : f.x - a.w, x2: f.face > 0 ? f.x + a.w : f.x, y1: f.y + a.oy, y2: f.y + a.oy + a.h };
  },
  hurt(t, full) { const h = !full && t.crouchOn() ? t.c.height * .5 : t.c.height; return { x1: t.x - 9, x2: t.x + 9, y1: t.y - h, y2: t.y }; }, // full = slagen raken ook als je hurkt
  overlap(a, b) { return a.x1 < b.x2 && a.x2 > b.x1 && a.y1 < b.y2 && a.y2 > b.y1; },

  tryHit(f) {
    const box = this.box(f);
    for (const t of this.fighters) {
      if (t === f || !t.alive || t.inv > 0) continue;
      if (this.overlap(box, this.hurt(t, true))) {
        f.hitDone = true; this.hit(t, f.c.attack, f.face, t.x, t.y - 18, f, "atk");
      }
    }
    // Adam slaat projectielen terug met zijn batje
    if (f.c.reflect) for (const p of this.projs) {
      if (p.o === f || !["ball", "drone", "star", "pong", "ice", "bomb", "football", "feather", "note", "rocket", "rc", "plane", "sliotar", "gen"].includes(p.type)) continue;
      if (!this.overlap(box, { x1: p.x - 6, x2: p.x + 6, y1: p.y - 6, y2: p.y + 6 })) continue;
      p.o = f; p.refl = true; p.vx = f.face * Math.max(2.5, Math.abs(p.vx) * 1.2); p.life = Math.max(p.life, 60);
      if (p.type === "bomb") p.vy = -3;
      this.sparks(p.x, p.y, 10, "#ffffff"); this.freeze = 5; sfx("big");

  },

  koFighter(f) {
    const lh = f.lastHit, ft = f.fellThrough;
    if (ft && ft.f !== f && this.t - ft.t < 300) MODES.onKO(ft.f, "hole", f);
    else if (lh && lh.f && this.t - lh.t < 300) {
      const fz = f.frozenBy, combo = fz && fz.f === lh.f && this.t - fz.t < 240; // Deniz: bevroren en binnen 4 sec KO
      MODES.onKO(lh.f, combo ? "freeze" : lh.move, f);
    }
    f.stocks--; f.ko = 70; f.stun = 0; f.atk = null;
    const x = Math.max(10, Math.min(W - 10, f.x)), y = Math.max(10, Math.min(H - 10, f.y - 10));
    this.sparks(x, y, 40, SLOT_COL[f.slot]); this.sparks(x, y, 20, "#ffffff");

  update() {
    this.t++;
    if (this.state !== "play" && this.state !== "over") return MODES.update();

function txt(s, x, y, size, col, align = "center", shadow = OUTLINE) {

    const r = (game.t >> 1) % 2; R(r ? -20 : -14, -7, r ? 38 : 26, 1, "#d8d8d8"); R(-1, -7, 2, 3, OUTLINE); // rotor
    R(-8, 8, 16, 1, OUTLINE); // landingsski
  }
  if (f.atk === "up" && f.c.up.bomber) { // Daniel hangt aan een bommenwerper
    const px = x - f.face * 2, py = y - 44, R = (dx, dy, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(f.face > 0 ? px + dx : px - dx - w, py + dy, w, h); };
    ctx.fillStyle = "#3a3f4a"; ctx.fillRect(x - 1, py + 5, 1, 9); ctx.fillRect(x + 2, py + 5, 1, 9);
    R(-16, -3, 34, 8, OUTLINE); R(-6, -9, 14, 20, OUTLINE); R(-18, -6, 5, 7, OUTLINE);
    R(-15, -2, 32, 6, "#6b7380"); R(-15, -2, 32, 1, "#9aa3b0"); R(-5, -8, 12, 18, "#5d6670"); R(-5, -8, 12, 1, "#9aa3b0"); R(-17, -5, 3, 5, "#5d6670");
    R(13, -1, 3, 2, "#7fe3ff"); R(-2, 1, 4, 2, "#e63946"); R(18, -3 + ((game.t >> 1) % 2) * 5, 1, 4, "#d8d8d8"); // ruit, rondeel, propeller
  }
  if (f.atk === "up" && f.c.up.type === "fly" && f.baseId === "ati") { // ATI zwaait haar handtas als propeller
    const a = game.t * .5, hx = x + Math.cos(a) * 10, hy = y - 46 + Math.sin(a) * 2;
    ctx.fillStyle = "#5e3c24"; ctx.fillRect(x, y - 44, 1, 12);
    ctx.fillStyle = OUTLINE; ctx.fillRect(Math.round(hx) - 5, Math.round(hy) - 4, 10, 8); ctx.fillStyle = "#9a3a5a"; ctx.fillRect(Math.round(hx) - 4, Math.round(hy) - 3, 8, 6); ctx.fillStyle = "#e0b33a"; ctx.fillRect(Math.round(hx) - 1, Math.round(hy) - 2, 2, 1);
  }
  if (f.atk === "up" && f.c.up.type === "fly" && f.baseId === "josh") { // drone tilt Josh op
    ctx.fillStyle = "#9a9aa8"; ctx.fillRect(x, y - 38, 1, 7);
    drawProjs([{ type: "drone", x: f.x, y: f.y - 41, vx: f.face }]);
  }
  if (f.atk === "up" && f.c.up.gum && f.atkT >= f.c.up.start) { // roze kauwgombel die Jorn omhoog tilt
    const k = f.atkT - f.c.up.start, r = Math.round(Math.min(11, 3 + k * .8)), bx = x + f.face * 4, by = Math.round(y - 30 - r);
    ctx.fillStyle = OUTLINE; ctx.fillRect(bx - r - 1, by - r + 1, r * 2 + 2, r * 2 - 2); ctx.fillRect(bx - r + 1, by - r - 1, r * 2 - 2, r * 2 + 2);
    ctx.fillStyle = "#ff8fd0"; ctx.fillRect(bx - r, by - r + 2, r * 2, r * 2 - 4); ctx.fillRect(bx - r + 2, by - r, r * 2 - 4, r * 2);
    ctx.fillStyle = "#ffc2e6"; ctx.fillRect(bx - r + 3, by - r + 2, 3, 2);
    ctx.fillStyle = "#ff8fd0"; ctx.fillRect(bx - 1, by + r, 2, Math.max(0, y - 26 - by - r)); // draadje naar zijn mond
  }
  const T = f.tether;
  if (T) { // rode tentakel met zuignapjes, van Toon naar het punt waar hij zich heen trekt
    const x0 = f.x + f.face * 6, y0 = f.y - 20, e = Math.min(1, T.t / 5);
    const ex = T.t <= 5 ? x0 + (T.tx - x0) * e : T.tx, ey = T.t <= 5 ? y0 + (T.ty - y0) * e : T.ty;
    const L = Math.hypot(ex - x0, ey - y0), n = Math.max(1, Math.ceil(L / 2));
    for (const pass of [0, 1]) for (let i = 0; i <= n; i++) {
      const px = Math.round(x0 + (ex - x0) * i / n), py = Math.round(y0 + (ey - y0) * i / n), w = Math.max(2, 4 - i / n * 2);

      else { ctx.fillStyle = f.c.up.col || "#d8263a"; ctx.fillRect(px - w / 2, py - w / 2, w, w); if (i % 4 === 2) { ctx.fillStyle = "#ff9aa8"; ctx.fillRect(px, py, 1, 1); } }
    }
  }
}

function drawUpFxList() {
  for (const p of UPFX) {
    if (p.k === "pillar") { // ijspilaar groeit onder Deniz omhoog
      if (p.life > 22) p.top = Math.max(p.y0 - 50, Math.min(p.y0, p.o.y));
      const top = Math.round(p.top), h = Math.round(p.y0 - top), x = Math.round(p.x);
      if (h <= 0) continue;
      ctx.globalAlpha = Math.min(1, p.life / 8);
      ctx.fillStyle = OUTLINE; ctx.fillRect(x - 8, top - 1, 16, h + 1);
      ctx.fillStyle = p.water ? "#3d8fd6" : "#6fcff5"; ctx.fillRect(x - 7, top, 14, h); // ijs of water (Caiza)
      ctx.fillStyle = p.water ? "#7fc4f5" : "#bfefff"; ctx.fillRect(x - 6 + (p.water ? (game.t >> 1) % 3 : 0), top, 4, h); ctx.fillRect(x - 7, top, 14, 2);
      ctx.fillStyle = "#ffffff"; ctx.fillRect(x - 5, top + 3, 1, Math.max(0, h - 6));
      ctx.globalAlpha = 1;
    } else if (p.k === "airbag") { // witte airbag die openknalt en weer leegloopt
      const s = p.life > 9 ? (14 - p.life) * 2.2 + 4 : p.life * 1.6, x = Math.round(p.x), y = Math.round(p.y - 3);
      ctx.fillStyle = OUTLINE; ctx.fillRect(x - s - 1, y - s * .6 - 1, s * 2 + 2, s * 1.2 + 2);
      ctx.fillStyle = "#f4f4f4"; ctx.fillRect(x - s, y - s * .6, s * 2, s * 1.2);
      ctx.fillStyle = "#c9c9d2"; ctx.fillRect(x - s, y + s * .3, s * 2, s * .3);
    } else if (p.k === "zap") { // bliksemspoor van Milo
      ctx.globalAlpha = Math.min(1, p.life / 6);
      const n = 8; let px = p.x1, py = p.y1;
      for (let i = 1; i <= n; i++) {
        const nx = p.x1 + (p.x2 - p.x1) * i / n + (i < n ? ((i * 7 + game.t * 5) % 7) - 3 : 0), ny = p.y1 + (p.y2 - p.y1) * i / n;
        for (let j = 0; j <= 4; j++) {
          const qx = Math.round(px + (nx - px) * j / 4), qy = Math.round(py + (ny - py) * j / 4);
          ctx.fillStyle = "#ffe066"; ctx.fillRect(qx - 2, qy - 2, 4, 4); ctx.fillStyle = "#ffffff"; ctx.fillRect(qx - 1, qy - 1, 2, 2);
        }
        px = nx; py = ny;
      }
      ctx.globalAlpha = 1;
    } else if (p.k === "arc") { // VR-teleportboog met doelcirkel
      ctx.globalAlpha = Math.min(1, p.life / 6);
      for (let i = 0; i <= 16; i++) {
        const t = i / 16, bx = p.x1 + (p.x2 - p.x1) * t, by = p.y1 + (p.y2 - p.y1) * t - Math.sin(t * Math.PI) * 16;
        if (i % 2 === 0) { ctx.fillStyle = "#2e8bff"; ctx.fillRect(Math.round(bx) - 1, Math.round(by) - 1, 3, 3); ctx.fillStyle = "#c8f4ff"; ctx.fillRect(Math.round(bx), Math.round(by), 1, 1); }
      }
      const cx = Math.round(p.x2), cy = Math.round(p.y2 + 14);
      ctx.fillStyle = "#2e8bff"; ctx.fillRect(cx - 8, cy, 16, 1); ctx.fillRect(cx - 6, cy - 1, 12, 1); ctx.fillRect(cx - 6, cy + 1, 12, 1);
      ctx.globalAlpha = 1;
    }
  }
}

// inhaken op de bestaande spel-loop: effecten mee laten lopen, wissen bij een nieuw gevecht
(() => {
  const start = game.start, update = game.update;
  game.start = function (o) { UPFX.length = 0; return start.call(this, o); };
  game.update = function () {
    const r = update.call(this);
    if ((this.state === "play" || this.state === "over") && this.freeze <= 0) for (let i = UPFX.length - 1; i >= 0; i--) if (--UPFX[i].life <= 0) UPFX.splice(i, 1);
    return r;
  };
  const dp = drawProjs;
  drawProjs = function (list) { dp(list); if (!list) drawUpFxList(); };
})();

// tekstballon (wereldpixels), punt aan de linkerkant naar het hoofdje
function bubble(s, x, y, col = OUTLINE, bg = "#ffffff") {
  ctx.font = "bold 8px monospace";
  const w = Math.ceil(ctx.measureText(s).width) + 10;
  ctx.fillStyle = OUTLINE; ctx.fillRect(x - 1, y - 1, w + 2, 14); ctx.fillRect(x - 4, y + 5, 4, 3);
  ctx.fillStyle = bg; ctx.fillRect(x, y, w, 12); ctx.fillRect(x - 2, y + 6, 3, 1);
  ctx.fillStyle = col; ctx.textAlign = "left"; ctx.fillText(s, x + 5, y + 9);
  return w;
}

(() => {

    if (game.state === "over" && game.winner === this && this.stun <= 0 && !this.atk) {
      const k = game.overT >> 4;
      return k % 2 ? (this.c.poses.spc_throw ? "spc_throw" : "jump") : "idle2";

// op het GAME!-scherm: icoontje boven de winnaar op het podium, quote onder zijn grote hoofd, de verliezer onderaan
function drawOverEmotes() {
  const w = game.winner, l = game.fighters.find(f => f !== w), t = game.overT;
  if (!w) return;
  if (!game.emo || game.emo.w !== w) { const e = emoOf(w); game.emo = { w, wq: pick(e[0]), ic: e[2], lq: l ? pick(emoOf(l)[1]) : "" }; } // per gevecht één keer kiezen
  const { wq, ic } = game.emo;
  if (w.alive) drawEmote(ic, w.x, w.y - w.c.height - 14 - Math.abs(Math.sin(t * .1)) * 4); // springend icoontje boven de winnaar
  if (t <= 40) return;
  drawEmote(ic, W / 2 + 26, 92 - Math.abs(Math.sin(t * .12)) * 3);
  ctx.font = "bold 8px monospace";
  const ww = Math.ceil(ctx.measureText("“" + wq + "”").width) + 10;
  bubble("“" + wq + "”", Math.round(W / 2 - ww / 2), 134);
  if (l && t > 60) { // verliezer baalt
    const lq = game.emo.lq, lw = Math.ceil(ctx.measureText(lq).width) + 10 + 22, x0 = Math.round(W / 2 - lw / 2);

}
