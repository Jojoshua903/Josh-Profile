<script>// ----- progress.js -----
// Voortgang per character: XP, rangen en stats. Alleen gevechten van echte spelers (geen CPU) tellen.
// Alleen ladder-gevechten tellen (anders kun je in versus een makkelijke matchup farmen).
// XP per gevecht: meedoen 10, winnen 25, per KO 5, zonder leven te verliezen winnen 10.

const RANKS = [
  { name: "NIEUW", xp: 0, col: "#9a8a70" },
  { name: "BRONS", xp: 250, col: "#c07a3a" },
  { name: "ZILVER", xp: 750, col: "#9aa6b4" },
  { name: "GOUD", xp: 1750, col: "#e0b33a" },
  { name: "PLATINA", xp: 3500, col: "#4fc4bc" },
  { name: "DIAMANT", xp: 6000, col: "#5fa8ff" },
  { name: "LEGENDE", xp: 10000, col: "#b56bff" },
];

const PROG = {
  tab: 0, page: 0, // tab 0 = rangen, 1 = uitdagingen

  of(id) { SAVE.prog = SAVE.prog || {}; return SAVE.prog[id] = SAVE.prog[id] || { xp: 0, games: 0, wins: 0, kos: 0, perfect: 0, streak: 0, best: 0 }; },
  rankIdx(xp) { let i = 0; while (i < RANKS.length - 1 && xp >= RANKS[i + 1].xp) i++; return i; },
  rankOf(id) { return RANKS[this.rankIdx(((SAVE.prog || {})[id] || {}).xp || 0)]; },
  // 0..1 tussen de huidige en de volgende rang
  frac(xp) { const i = this.rankIdx(xp); if (i === RANKS.length - 1) return 1; return (xp - RANKS[i].xp) / (RANKS[i + 1].xp - RANKS[i].xp); },

  // aan het eind van een gevecht (zodra "GAME!" in beeld komt)
  matchEnd() {
    const w = game.winner; game.xpInfo = [];
    if (MODES.mode !== "ladder") return;
    for (const f of game.fighters) {
      if (f.cpu) continue;
      const id = f.baseId || f.id, p = this.of(id), won = f === w, before = this.rankIdx(p.xp);
      let xp = 10;
      const kos = f.mkos || 0;
      xp += kos * 5;
      if (won) { xp += 25; if (f.stocks === f.maxStocks) { xp += 10; p.perfect++; } }
      p.xp += xp; p.games++; p.kos += kos;
      if (won) { p.wins++; p.streak++; p.best = Math.max(p.best, p.streak); } else p.streak = 0;
      const after = this.rankIdx(p.xp);
      game.xpInfo.push({ id, xp, perfect: won && f.stocks === f.maxStocks, up: after > before ? RANKS[after] : null, p });
      if (after > before) { this.pay(id, true); sfx("go"); }
    }
    persist();
  },

  badge(id, x, y) { // klein rang-labeltje
    const r = this.rankOf(id);
    ctx.font = "bold 6px monospace"; const w = Math.ceil(ctx.measureText(r.name).width) + 6;
    ctx.fillStyle = OUTLINE; ctx.fillRect(x - 1, y - 1, w + 2, 9); ctx.fillStyle = r.col; ctx.fillRect(x, y, w, 7);
    ctx.fillStyle = "#ffffff"; ctx.textAlign = "left"; ctx.fillText(r.name, x + 3, y + 6);
    return w;
  },

  bar(x, y, w, f, col) { ctx.fillStyle = OUTLINE; ctx.fillRect(x - 1, y - 1, w + 2, 5); ctx.fillStyle = "#d8cbb2"; ctx.fillRect(x, y, w, 3); ctx.fillStyle = col; ctx.fillRect(x, y, Math.round(w * f), 3); },

  drawOver() { // XP-regel op het GAME!-scherm
    const L = game.xpInfo; if (!L || !L.length || game.overT <= 70) return;
    L.forEach((e, i) => {
      const y = 170 + i * 9 - (L.length - 1) * 4, r = RANKS[this.rankIdx(e.p.xp)];
      const s = CHARS[e.id].name + "  +" + e.xp + " XP" + (e.perfect ? " (perfect!)" : "") + (e.up ? "  ▲ " + e.up.name + "!" : "");
      ctx.font = "bold 7px monospace"; const w = Math.ceil(ctx.measureText(s).width), x = Math.round(W / 2 - (w + 46) / 2);
      ctx.fillStyle = OUTLINE; ctx.textAlign = "left"; ctx.fillStyle = e.up && (game.t >> 3) % 2 ? r.col : "#fff8ea"; ctx.fillText(s, x, y + 5);
      this.bar(x + w + 6, y + 2, 40, this.frac(e.p.xp), r.col);
    });
  },

  // ---------- profielen-scherm (tab rangen) ----------
  updRanks() {
    const pages = Math.ceil(ROSTER.length / 12);
    if (tap("KeyA", "ArrowLeft")) { this.page = (this.page + pages - 1) % pages; sfx("select"); }
    if (tap("KeyD", "ArrowRight")) { this.page = (this.page + 1) % pages; sfx("select"); }
    if (OK() || BACK()) { game.state = "menu"; sfx("select"); }
  },

  drawRanks() {
    MODES.header("PROFIELEN", "Alleen gevechten in de arcade ladder tellen mee voor je rang");
    this.tabs();
    const pages = Math.ceil(ROSTER.length / 12);
    ROSTER.slice(this.page * 12, this.page * 12 + 12).forEach((id, i) => {
      const x = 8 + (i % 3) * 124, y = 56 + (i / 3 | 0) * 34;
      ctx.fillStyle = OUTLINE; ctx.fillRect(x - 1, y - 1, 122, 32); ctx.fillStyle = "#fff8ea"; ctx.fillRect(x, y, 120, 30);
      if (!isUnlocked(id)) {
        ctx.fillStyle = OUTLINE; ctx.fillRect(x + 4, y + 7, 16, 16); txt("?", x + 12, y + 20, 10, "#fff8ea", "center", null);
        txt("???", x + 26, y + 13, 8, "#7a6a55", "left", null); return;
      }
      const p = (SAVE.prog || {})[id] || { xp: 0, games: 0, wins: 0, kos: 0, best: 0 }, ri = this.rankIdx(p.xp), r = RANKS[ri];
      ctx.fillStyle = r.col; ctx.fillRect(x, y, 3, 30);
      drawHead(id, x + 4, y + 7, 1, "classic");
      txt(CHARS[id].name, x + 25, y + 9, 7, OUTLINE, "left", null);
      this.badge(id, x + 117 - (ctx.font = "bold 6px monospace", Math.ceil(ctx.measureText(r.name).width) + 6), y + 3);
      this.bar(x + 25, y + 14, 90, this.frac(p.xp), r.col);
      ctx.font = "bold 6px monospace"; ctx.textAlign = "left"; ctx.fillStyle = "#7a6a55";
      const nxt = RANKS[ri + 1], pct = p.games ? Math.round(p.wins / p.games * 100) : 0;
      ctx.fillText(nxt ? p.xp + "/" + nxt.xp + " XP" : p.xp + " XP · max!", x + 25, y + 24);
      ctx.textAlign = "right"; ctx.fillText(p.games ? p.wins + "W " + pct + "% · " + p.kos + " KO" : "nog niet gespeeld", x + 117, y + 24);
    });
    this.hint2((pages > 1 ? "A/D pagina " + (this.page + 1) + "/" + pages + " · " : "") + "W/S tab wisselen · ENTER/ESC terug");
  },

  tabs() {
    ["RANGEN", "UITDAGINGEN"].forEach((s, i) => {
      const x = W / 2 + (i ? 4 : -84), on = i === this.tab;
      ctx.fillStyle = OUTLINE; ctx.fillRect(x - 1, 41, 82, 12); ctx.fillStyle = on ? "#e63946" : "#fff8ea"; ctx.fillRect(x, 42, 80, 10);
      ctx.font = "bold 7px monospace"; ctx.textAlign = "center"; ctx.fillStyle = on ? "#ffffff" : OUTLINE; ctx.fillText(s, x + 40, 50);
    });
  },

  hint2(s) { ctx.font = "bold 7px monospace"; ctx.fillStyle = OUTLINE; ctx.textAlign = "center"; ctx.fillText(s, W / 2, 206); },
};

// ---------- koppelen ----------
MENU[3] = "PROFIELEN";
(() => {
  // KO's per gevecht bijhouden
  const ko0 = MODES.onKO;
  MODES.onKO = function (killer, move, victim) { if (killer && killer !== victim) killer.mkos = (killer.mkos || 0) + 1; return ko0.call(this, killer, move, victim); };
  // einde van een gevecht vangen
  const up0 = game.update;
  game.update = function () { const was = this.state; up0.call(this); if (was === "play" && this.state === "over") PROG.matchEnd(); };
  const st0 = game.start;
  game.start = function (o) { this.xpInfo = null; return st0.call(this, o); };
  const oe0 = drawOverEmotes;
  drawOverEmotes = function () { oe0(); PROG.drawOver(); };
  // profielen: tab rangen of de oude uitdagingen
  const u0 = MODES.update, r0 = MODES.render;
  MODES.update = function () {
    if (game.state === "challenges") {
      if (tap("KeyW", "ArrowUp", "KeyS", "ArrowDown", "KeyQ", "KeyE")) { PROG.tab = (PROG.tab + (tap("KeyW", "ArrowUp", "KeyQ") ? 2 : 1)) % 3; sfx("select"); return; }
      if (PROG.tab === 0) return PROG.updRanks();
    }
    u0.call(this);
  };
  MODES.render = function () {
    if (game.state === "challenges") { if (PROG.tab === 0) return PROG.drawRanks(); r0.call(this); PROG.tabs(); return; }
    r0.call(this);
  };
  // rang op de select-kaart
  const c0 = MODES.card;
  MODES.card = function (cx, y, p, label, col, flip, arrows) { c0.call(this, cx, y, p, label, col, flip, arrows); if (isUnlocked(p.id)) PROG.badge(p.id, cx - 47, y + 15); };
})();

// oude saves (van vóór de nerf) omrekenen naar de nieuwe, tragere XP
if (SAVE.prog && !SAVE.progV2) { for (const id in SAVE.prog) SAVE.prog[id].xp = Math.round(SAVE.prog[id].xp * .4); SAVE.progV2 = true; persist(); }
else if (!SAVE.progV2) SAVE.progV2 = true;

// ---------- beloningen per rang ----------
// BRONS/ZILVER/GOUD/DIAMANT = munten (voor later), PLATINA = eigen KO-effect, LEGENDE = Legende-skin
const RANK_REWARD = [null, { coins: 50 }, { coins: 100 }, { coins: 200 }, { kofx: true }, { coins: 400 }, { skin: "legende" }];
SKIN_ORDER.push("legende");

// KO-effect per character: vorm van de deeltjes, kleuren en een woord
const KO_FX = {
  nathan: ["ball", ["#ffffff", "#e63946"], "HOMERUN!"], josh: ["pixel", ["#38fedb", "#3fa9f5"], "ALT+F4!"],
  milo: ["bolt", ["#ffe066", "#9fd8ff"], "ZAP!"], lars: ["fire", ["#ff8a3d", "#ffe066"], "KABOEM!"],
  reshman: ["star", ["#c3cad2", "#16161c"], "VERDWENEN."], deniz: ["flake", ["#bfe3ff", "#ffffff"], "BEVROREN!"],

  niffo: ["drop", ["#9aa0ab", "#3fa9f5"], "PLONS!"], daniel: ["fire", ["#ff8a3d", "#6b6b78"], "MISSIE GESLAAGD!"],
  jenna: ["crumb", ["#e8b880", "#6cc24a"], "TE TRAAG!"], lawrence: ["drop", ["#a8703f", "#ffffff"], "JOLLY GOOD!"],
  enno: ["smoke", ["#9a9aa8", "#c8c8d2"], "...POEF."], ati: ["pixel", ["#e63946", "#ffffff"], "TELEFOON WEG!"],

  julie: ["pear", ["#b8d23a", "#e0f080"], "ZAAK GESLOTEN."],

const KOFX = [];

Object.assign(PROG, {
  coins() { return SAVE.coins || 0; },
  hasKoFx(id) { return this.rankIdx(this.of(id).xp) >= 4; },

  // beloningen uitdelen voor elke rang die nog niet beloond is (werkt ook met terugwerkende kracht)
  pay(id, loud) {
    SAVE.paid = SAVE.paid || {};
    const now = this.rankIdx(this.of(id).xp);
    for (let r = (SAVE.paid[id] || 0) + 1; r <= now; r++) {

  },

<script>// ----- ledge.js -----
// Rand pakken: val of spring je net naast het hoofdpodium, dan grijp je de rand en klim je erop.
// Ook de poses voor hurken (door de knieën, handen boven het hoofd) en hangen aan de rand.

(() => {
  // ---------- poses per character ----------
  for (const id in CHARS) {
    const ch = CHARS[id], [TL] = ch.legLen || [10, 9];
    ch.poses = ch.poses || {};
    if (ch.draw) { // characters die zichzelf tekenen: lijf zakt door de pootjes
      ch.poses.duck = ch.poses.duck || { bob: 8, thF: 80, thB: -80, lean: 2 };
      ch.poses.hang = ch.poses.hang || { bob: -2, thF: 10, thB: -10 };
    } else {
      ch.poses.duck = ch.poses.duck || { bob: Math.round(TL * .83), lean: 3, thF: 80, shF: 0, thB: 10, shB: -90, arF: [150, 200], arB: [160, 210] };
      ch.poses.hang = ch.poses.hang || { bob: 0, lean: 1, thF: 6, shF: 2, thB: -6, shB: -4, arF: [176, 180], arB: [170, 178] };
    }
  }

  const HANG_MAX = 80, CLIMB_T = 12;
  const P = Fighter.prototype;
  const rs0 = P.reset;
  P.reset = function () { rs0.call(this); this.hang = 0; this.climb = 0; this.ledgeCd = 0; };

  P.climbUp = function () {
    const m = STAGE.main, s = this.hangSide;
    this.hang = 0; this.climb = CLIMB_T; this.climbFrom = [this.x, this.y]; this.climbTo = [s < 0 ? m.x1 + 10 : m.x2 - 10, m.y];
    this.inv = Math.max(this.inv, CLIMB_T + 4); sfx("jump");
  };
  P.dropLedge = function () { this.hang = 0; this.ledgeCd = 36; this.vy = 1; this.vx = -this.hangSide * .6; };

  const up0 = P.update;
  P.update = function (inp, g) {
    if (this.ledgeCd > 0) this.ledgeCd--;
    if (this.hang > 0 && (this.stun > 0 || !this.alive)) this.hang = 0; // geraakt: je laat los
    if (this.climb > 0 && !this.alive) this.climb = 0;
    if (this.climb > 0) { // omhoog klimmen (geen besturing)
      this.climb--; this.animT++; if (this.inv > 0) this.inv--; if (this.cd > 0) this.cd--;
      const k = 1 - this.climb / CLIMB_T, [x0, y0] = this.climbFrom, [x1, y1] = this.climbTo;
      this.x = x0 + (x1 - x0) * k; this.y = y0 + (y1 - y0) * Math.min(1, k * 1.4);
      this.vx = this.vy = 0;
      if (this.climb === 0) { this.x = x1; this.y = y1; this.ground = true; this.onPlat = false; this.ledgeCd = 30; this.jumps = this.c.airJumps || 1; }
      return;
    }
    if (this.hang > 0) { // aan de rand hangen
      this.hang--; this.animT++; if (this.inv > 0) this.inv--; if (this.cd > 0) this.cd--;
      this.vx = this.vy = 0;
      const s = this.hangSide, toward = s < 0 ? inp.r : inp.l, away = s < 0 ? inp.l : inp.r, waited = HANG_MAX - this.hang;
      if (this.cpu ? waited >= this.cpuHangWait : (waited > 4 && (inp.jump || inp.u || toward || inp.atk || inp.spc))) this.climbUp();
      else if (!this.cpu && waited > 4 && (inp.d || away)) this.dropLedge();
      else if (this.hang === 0) this.climbUp(); // te lang gehangen: vanzelf omhoog
      return;
    }
    up0.call(this, inp, g);
    this.tryLedge();
  };

  P.tryLedge = function () {
    if (this.ground || this.ledgeCd > 0 || !this.alive || this.stun > 0 || this.hide > 0 || this.burrow > 0 || this.rise > 0 || this.shaft || this.ko > 0) return;
    if (this.atk && this.atk !== "up") return;
    const m = STAGE.main;
    for (const s of [-1, 1]) {
      const ex = s < 0 ? m.x1 : m.x2, dx = (this.x - ex) * s; // dx > 0 = buiten het podium
      if (dx < -2 || dx > 16 || this.y < m.y + 2 || this.y > m.y + 36) continue;
      this.hang = HANG_MAX; this.hangSide = s; this.face = -s;
      this.x = ex + s * 5; this.y = m.y + 26; this.vx = this.vy = 0;
      this.atk = null; this.helpless = false; this.upUsed = false; this.glide = 0; this.tether = null; this.fast = false;
      this.jumps = this.c.airJumps || 1; this.inv = Math.max(this.inv, 24); // even onkwetsbaar als je de rand pakt
      this.cpuHangWait = 8 + (Math.random() * 22 | 0);
      game.dust(ex, m.y); sfx("select");
      return;
    }
  };

  const fr0 = P.frame;
  P.frame = function () {
    if (this.hang > 0) return "hang";
    if (this.climb > 0) return this.climb > CLIMB_T / 2 ? "hang" : "jump";
    return fr0.call(this);
  };
})();

    const n = this.list().length;
    if (tap("KeyA", "ArrowLeft")) { this.ci = (this.ci + n - 1) % n; this.pt = 0; KOFX.length = 0; sfx("select"); }
    if (tap("KeyD", "ArrowRight")) { this.ci = (this.ci + 1) % n; this.pt = 0; KOFX.length = 0; sfx("select"); }
    if (!OK()) return;

    if (this.owns(k)) { // aan/uit zetten
      SAVE.shopOff = SAVE.shopOff || {}; SAVE.shopOff[k] = !SAVE.shopOff[k]; persist(); sfx("select");

    drawSprite(id, "classic", (t >> 5) % 2 ? "idle2" : "idle1", x, y, 1);

// ---------- tekenhulpjes ----------
function drawSprite(id, skin, fr, x, y, face, sq = 1) {
  const set = getSpr(id, skin), img = (set[fr] || set.idle1)[face > 0 ? "r" : "l"], ox = face > 0 ? OX : SW - OX;
  ctx.drawImage(img, Math.round(x * 2 - ox) / 2, Math.round(y * 2 - OY * sq) / 2, SW / 2, SH / 2 * sq);
}
const easeOut = t => 1 - (1 - t) ** 3;
// deterministische "random" per deeltje, zodat de entrance geen eigen staat nodig heeft
const hrand = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

function drawEntrance(id, skin, x, y, face, p) {
  const d = ENT[id] || ["drop", "", "#ffffff"], [tpl, kind, col] = d, R = (xx, yy, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(xx), Math.round(yy), w, h); };
  const run = "run" + (((game.t / 4) | 0) % 4 + 1);
  if (tpl === "rise") { // komt omhoog uit de grond
    const e = easeOut(p), sink = Math.round((1 - e) * 46);
    R(x - 12, y - 1, 24, 2, OUTLINE); if (p < 1) { R(x - 8, y - 1, 4, 1, col); R(x + 3, y - 1, 5, 1, col); }
    for (let i = 0; i < 6 && p < .9; i++) R(x - 10 + hrand(i + (game.t >> 2)) * 20, y - 2 - hrand(i * 3 + game.t) * 8, 2, 2, col);
    ctx.save(); ctx.beginPath(); ctx.rect(x - 40, y - 80, 80, 80); ctx.clip();
    drawSprite(id, skin, p < 1 ? "jump" : "idle1", x, y + sink, face); ctx.restore(); return;
  }
  if (tpl === "drop") { // valt uit de lucht
    const e = easeOut(Math.min(1, p * 1.15)), yy = y - (1 - e) * 150;
    if (kind === "beam") { ctx.globalAlpha = Math.max(0, 1 - p) * .7 + .1; R(x - 8, 0, 16, y, col); R(x - 3, 0, 6, y, "#ffffff"); ctx.globalAlpha = 1; }
    drawSprite(id, skin, e < 1 ? "fall" : "idle1", x, yy, face);
    if (e < 1) {
      if (kind === "chute") { R(x - 15, yy - 58, 30, 4, OUTLINE); R(x - 13, yy - 62, 26, 4, OUTLINE); R(x - 14, yy - 57, 28, 2, col); R(x - 12, yy - 61, 24, 3, "#7a9a4a"); R(x - 12, yy - 54, 1, 22, "#3a3f4a"); R(x + 11, yy - 54, 1, 22, "#3a3f4a"); }
      if (kind === "glider") { R(x - 24, yy - 46, 48, 4, OUTLINE); R(x - 23, yy - 45, 46, 2, col); R(x - 16, yy - 48, 32, 2, "#ffd23f"); }
      if (kind === "rocket") for (let i = 0; i < 5; i++) R(x - 3 + hrand(i + game.t) * 6, yy + 1 + i * 3, 3, 3, i < 2 ? "#ffe066" : col);
    }
    return;
  }
  if (tpl === "slide" || tpl === "walk") { // komt vanaf de zijkant binnen
    const x0 = face > 0 ? -40 : W + 40, e = tpl === "walk" ? Math.min(1, p * 1.15) : easeOut(Math.min(1, p * 1.25)), xx = x0 + (x - x0) * e;
    if (kind === "car") {
      const cx = e < 1 ? xx : x - face * (p - .8) * 200; // auto rijdt na het afzetten weer weg
      if (e >= 1) drawSprite(id, skin, p < .9 ? "jump" : "idle1", x, y - Math.max(0, Math.sin(Math.min(1, (p - .8) * 5) * Math.PI) * 8), face);
      if (col === "#1d1d22") ctx.filter = "grayscale(1) brightness(.35)";
      drawCar(cx, y, face); ctx.filter = "none";
      return;
    }
    if (kind === "ski" && e < 1) for (let i = 0; i < 6; i++) R(xx - face * (6 + i * 5), y - 2 - hrand(i + game.t) * 6, 2, 2, "#ffffff");
    if (kind === "run" && e < 1 && game.t % 2 === 0) R(xx - face * 8, y - 3, 3, 3, "#d8cbb2");
    drawSprite(id, skin, e < 1 ? run : (kind === "look" ? "look" : "idle1"), xx, y, face);
    return;
  }
  // poof: eerst een opbouw, dan een knal en staat hij er
  const b = .45, k = Math.min(1, p / b);
  if (p < b) {
    if (kind === "smoke" || kind === "boom") { const c2 = kind === "boom" ? "#ffe066" : "#9a9aa8"; for (let i = 0; i < 7; i++) { const a = i * .9 + game.t * .05, r = 6 + k * 10, s = 4 + k * 6; R(x + Math.cos(a) * r * .6 - s / 2, y - 16 + Math.sin(a) * r * .5 - s / 2, s, s, i % 2 ? col : c2); } }
    else if (kind === "zap") { if (p > .3) { let zx = x; for (let yy = 0; yy < y; yy += 8) { const nx = x + (hrand(yy + (game.t >> 1)) - .5) * 10; R(Math.min(zx, nx), yy, Math.abs(nx - zx) + 2, 8, col); zx = nx; } } else R(x - 1, y - 2, 2, 2, col); }
    else if (kind === "ice") { R(x - 13, y - 40, 26, 40, OUTLINE); R(x - 12, y - 39, 24, 38, "#bfe3ff"); R(x - 9, y - 36, 3, 10, "#ffffff"); }
    else if (kind === "pixel") for (let i = 0; i < 24; i++) { const a = hrand(i) * 6.28, r = (1 - k) * 60 + 4; R(x + Math.cos(a) * r, y - 16 + Math.sin(a) * r * .7, 2, 2, i % 3 ? col : "#ffffff"); }
    else if (kind === "bubble") { const r = 4 + k * 16; ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y - 18, r, 0, Math.PI * 2); ctx.stroke(); R(x - r * .5, y - 18 - r * .6, 3, 2, "#ffffff"); }
    else if (kind === "egg") { const w = Math.round(Math.sin(game.t * .6) * k * 2); R(x - 11 + w, y - 30, 22, 30, OUTLINE); R(x - 10 + w, y - 29, 20, 28, col); R(x - 7 + w, y - 26, 4, 6, "#ffffff"); if (id === "maciej") { R(x + 2 + w, y - 18, 4, 3, "#3f8a2e"); R(x - 6 + w, y - 10, 3, 3, "#3f8a2e"); } if (p > .3) R(x - 6 + w, y - 16, 12, 1, OUTLINE); }
    else if (kind === "splash") { const r = 6 + k * 12; R(x - r, y - 2, r * 2, 3, col); R(x - r + 3, y - 3, r * 2 - 6, 1, "#ffffff"); }
    else if (kind === "vent") { R(x - 11, y - 2, 22, 3, OUTLINE); R(x - 10, y - 1, 20, 1, "#5d6670"); if (p > .35) R(x - 10, y - 10, 20, 2, "#9aa6b2"); }
    else if (kind === "feathers") for (let i = 0; i < 10; i++) { const a = i * .63 + game.t * .12, r = (1 - k) * 30 + 6; R(x + Math.cos(a) * r, y - 18 + Math.sin(a) * r * .6, 3, 1, col); }
    else if (kind === "notes") for (let i = 0; i < 4; i++) { const nx = x - 18 + i * 12, ny = y - 20 - ((game.t + i * 9) % 20); R(nx, ny, 1, 5, col); R(nx - 2, ny + 4, 3, 2, col); }
    return;
  }
  const q = (p - b) / (1 - b); // knal: deeltjes vliegen uit elkaar, character staat er
  drawSprite(id, skin, q < .3 ? "jump" : "idle1", x, y - (q < .3 ? Math.sin(q / .3 * Math.PI) * 6 : 0), face);
  ctx.globalAlpha = Math.max(0, 1 - q);
  for (let i = 0; i < 14; i++) { const a = i / 14 * 6.28, r = 6 + q * 34; R(x + Math.cos(a) * r, y - 16 + Math.sin(a) * r * .7, 3, 3, i % 2 ? col : "#ffffff"); }
  if (kind === "notes" && q < .8) txt("BA-DUM-TSS!", x, y - 46, 8, col, "center");
  ctx.globalAlpha = 1;
}

function spawnDeath(id, x, y) { // kleiner dan een kill-effect, met een woordje van de verliezer
  const d = DEATH[id]; if (!d) return;
  const [shape, cols, word] = d;
  for (let i = 0; i < 14; i++) {
    const a = -Math.PI / 2 + (Math.random() - .5) * 2.4, s = .8 + Math.random() * 1.8;
    KOFX.push({ shape, col: cols[i % cols.length], x: x + (Math.random() - .5) * 8, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 46 + Math.random() * 20, g: shape === "smoke" ? -.02 : .08 });
  }
  if (word) KOFX.push({ word, small: true, col: cols[0], x: Math.max(40, Math.min(W - 40, x)), y: Math.max(24, Math.min(H - 30, y + 18)), vx: 0, vy: -.25, life: 70, g: 0 });
}

    ctx.globalAlpha = 1;

    kf0.call(this, f);
    if (!f.cpu && SHOP.on("dth:" + id)) spawnDeath(id, x, y);

  // entrance tijdens "KLAAR..."

    }

<script>// ----- fx.js -----
// Eigen kill- en death-effecten per character: elk een klein getekend animatietje (geen gedeelde explosie).
// Een effect = { name, dur, fn(t, x, y, d, e) }: t = frame, d = richting naar het midden, e = t/dur.

const FXQ = [];
const KILLFX = {}, DIEFX = {};
const FXH = (() => {
  const R = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.max(1, Math.round(w)), Math.max(1, Math.round(h))); };
  const ln = (x1, y1, x2, y2, c, w = 1) => { const n = Math.max(1, Math.ceil(Math.max(Math.abs(x2 - x1), Math.abs(y2 - y1)))); for (let i = 0; i <= n; i++) R(x1 + (x2 - x1) * i / n - w / 2, y1 + (y2 - y1) * i / n - w / 2, w, w, c); };
  const disc = (x, y, r, c) => blob(ctx, Math.round(x), Math.round(y), Math.max(1, Math.round(r)), Math.max(1, Math.round(r)), c);
  const oval = (x, y, rx, ry, c) => blob(ctx, Math.round(x), Math.round(y), Math.max(1, Math.round(rx)), Math.max(1, Math.round(ry)), c);
  const ring = (x, y, r, c, w = 1) => { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.beginPath(); ctx.arc(Math.round(x), Math.round(y), Math.max(1, r), 0, Math.PI * 2); ctx.stroke(); };
  const T = (s, x, y, size, col) => txt(s, Math.round(x), Math.round(y), size, col, "center");
  const A = a => { ctx.globalAlpha = Math.max(0, Math.min(1, a)); };
  const fade = (t, dur, out = 14) => Math.min(1, (dur - t) / out);
  const blink = (t, n = 4) => (t / n | 0) % 2 === 0;
  return { R, ln, disc, oval, ring, T, A, fade, blink };
})();

function addFx(def, x, y, extra) {
  if (!def) return;
  const d = x < W / 2 ? 1 : -1;
  FXQ.push({ def, x, y, d, t: 0, ...extra });
}
function tickFx() { for (let i = FXQ.length - 1; i >= 0; i--) if (++FXQ[i].t >= FXQ[i].def.dur) FXQ.splice(i, 1); }
function drawFx() {
  for (const f of FXQ) { ctx.save(); FXH.A(1); f.def.fn(f.t, f.x, f.y, f.d, f.t / f.def.dur, f); ctx.restore(); }
  ctx.globalAlpha = 1;
}

<script>// ----- hires.js -----
// Hogere resolutie voor projectielen, treffers en KO-effecten. Die werden getekend op het wereldraster
// (1 blokje = 2 schermpixels) terwijl de characters 1 schermpixel per pixel hebben, dus ze zagen er grof uit.
// Nu tekenen ze eerst op een losse laag, die wordt met Scale2x verdubbeld (afgeronde hoeken en schuine randen
// in plaats van trapjes) en de dikke outline wordt 1 pixel, net als bij de characters. Tekst en sprites blijven scherp.
// Vonkjes en deeltjes worden direct op schermpixels getekend als kleine sterretjes.

(() => {
  const low = document.createElement("canvas"); low.width = W; low.height = H;
  const lc = low.getContext("2d", { willReadFrequently: true });
  const big = document.createElement("canvas"); big.width = W * 2; big.height = H * 2;
  const bc = big.getContext("2d"), out = bc.createImageData(W * 2, H * 2), o32 = new Uint32Array(out.data.buffer);
  const tx = document.createElement("canvas"); tx.width = W * 2; tx.height = H * 2;
  const tc = tx.getContext("2d");
  const oc = parseCol(OUTLINE), OL = ((255 << 24) | (oc[2] << 16) | (oc[1] << 8) | oc[0]) >>> 0;

  const proto = CanvasRenderingContext2D.prototype;
  const keys = Object.getOwnPropertyNames(proto).filter(k => k !== "constructor" && k !== "canvas");
  const STATE = ["fillStyle", "strokeStyle", "font", "textAlign", "textBaseline", "globalAlpha", "lineWidth", "lineJoin", "imageSmoothingEnabled", "globalCompositeOperation"];
  let dirty = false, txtDirty = false, busy = false;
  const toText = (k, a) => { // tekst op een scherpe laag met de transform van de lage laag x2
    const m = lc.getTransform(); tc.setTransform(m.a * 2, m.b * 2, m.c * 2, m.d * 2, m.e * 2, m.f * 2);
    for (const s of STATE) tc[s] = lc[s];
    tc[k](...a); txtDirty = true;
  };
  const redirect = on => {
    for (const k of keys) {
      if (!on) { delete ctx[k]; continue; }
      const d = Object.getOwnPropertyDescriptor(proto, k);
      if (typeof d.value === "function") ctx[k] = k === "fillText" || k === "strokeText" || k === "drawImage" ? (...a) => toText(k, a) : (...a) => { dirty = true; return lc[k](...a); };
      else if (d.get) Object.defineProperty(ctx, k, { configurable: true, get: () => lc[k], set: v => { lc[k] = v; } });
    }
  };

  const scale2x = () => {
    const src = new Uint32Array(lc.getImageData(0, 0, W, H).data.buffer), W2 = W * 2;
    o32.fill(0);
    let x0 = W, x1 = -1, y0 = H, y1 = -1;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (src[y * W + x]) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    if (x1 < 0) return null;
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const i = y * W + x, P = src[i]; if (!P && !(x > 0 && src[i - 1]) && !(x < W - 1 && src[i + 1]) && !(y > 0 && src[i - W]) && !(y < H - 1 && src[i + W])) continue;
      const A = y > 0 ? src[i - W] : P, B = x < W - 1 ? src[i + 1] : P, C = x > 0 ? src[i - 1] : P, D = y < H - 1 ? src[i + W] : P;
      const j = y * 2 * W2 + x * 2;
      o32[j] = C === A && C !== D && A !== B ? A : P;
      o32[j + 1] = A === B && A !== C && B !== D ? B : P;
      o32[j + W2] = D === C && D !== B && C !== A ? C : P;
      o32[j + W2 + 1] = B === D && B !== A && D !== C ? D : P;
    }
    // dikke outline (2 pixels) dunner maken: de binnenste helft krijgt de kleur van de vulling ernaast
    const X0 = Math.max(2, x0 * 2 - 2), X1 = Math.min(W2 - 3, x1 * 2 + 3), Y0 = Math.max(2, y0 * 2 - 2), Y1 = Math.min(H * 2 - 3, y1 * 2 + 3);
    for (let y = Y0; y <= Y1; y++) for (let x = X0; x <= X1; x++) {
      const i = y * W2 + x; if (o32[i] !== OL) continue;
      for (const d of [1, -1, W2, -W2]) {
        const n = o32[i + d], f = o32[i - d];
        if (n === OL && !o32[i + 2 * d] && f && f !== OL) { o32[i] = f; break; }
      }
    }
    return [x0 * 2, y0 * 2, (x1 - x0 + 1) * 2, (y1 - y0 + 1) * 2];
  };

  const hiRes = fn => function (...args) {
    const m = ctx.getTransform();
    if (busy || m.a !== 2 || m.d !== 2 || m.b || m.c) return fn.apply(this, args);
    busy = true; dirty = txtDirty = false;
    lc.setTransform(1, 0, 0, 1, 0, 0); lc.clearRect(0, 0, W, H); lc.setTransform(1, 0, 0, 1, m.e / 2, m.f / 2);
    lc.globalAlpha = 1; lc.globalCompositeOperation = "source-over"; lc.imageSmoothingEnabled = false;
    tc.setTransform(1, 0, 0, 1, 0, 0); tc.clearRect(0, 0, W * 2, H * 2);
    redirect(true);
    let r;
    try { r = fn.apply(this, args); } finally { redirect(false); busy = false; }
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.imageSmoothingEnabled = false;
    if (dirty) { const bb = scale2x(); if (bb) { bc.putImageData(out, 0, 0, ...bb); ctx.drawImage(big, bb[0], bb[1], bb[2], bb[3], bb[0], bb[1], bb[2], bb[3]); } }
    if (txtDirty) ctx.drawImage(tx, 0, 0);
    ctx.restore();
    return r;
  };

  drawProjs = hiRes(drawProjs);
  if (typeof PROG !== "undefined" && PROG.drawKoFx) PROG.drawKoFx = hiRes(PROG.drawKoFx);

  // vonkjes en deeltjes: kleine sterretjes op schermpixels in plaats van grove blokjes
  drawParts = function () {
    for (const p of game.parts) {
      ctx.globalAlpha = Math.min(1, p.life / 10); ctx.fillStyle = p.col;
      const r = Math.max(1, Math.round((p.s || 2) - 1)), cx = Math.round(p.x * 2 + (p.s || 2)), cy = Math.round(p.y * 2 + (p.s || 2));
      for (let j = -r; j <= r; j++) { const k = r - Math.abs(j); ctx.fillRect((cx - k) / 2, (cy + j) / 2, (2 * k + 1) / 2, .5); }
    }
    ctx.globalAlpha = 1;
    PROG.drawKoFx(); // KO-effecten werden hier al achteraan getekend
  };
})();
</script>
<script>// ----- guard.js -----
// Vangnet: één fout in een frame liet de hele game stoppen (bevriezen). Nu loopt de game door
// en staat de fout even linksboven in beeld, zodat je hem kunt doorgeven.

(() => {
  let err = null, errT = 0;
  const loop0 = loop;
  loop = function (now) {
    try { loop0(now); }
    catch (e) {
      console.error(e);
      const at = ((e.stack || "").split("\n").find(l => /\.js:\d+/.test(l)) || "").replace(/^.*\/([^/]+\.js:\d+):\d+.*$/, "$1").trim();
      err = (e.message || String(e)) + (at ? "  @ " + at : ""); errT = 600;
      ctx.restore(); // render kan halverwege een save() zijn gestopt
      for (const k of Object.keys(ctx)) delete ctx[k]; // tekenlaag van de projectielen opruimen
      pressed.clear(); acc = 0;
      requestAnimationFrame(loop);
    }
    if (err && errT > 0) {
      errT--;
      ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
      ctx.font = "bold 11px monospace"; const w = Math.min(760, ctx.measureText("FOUT: " + err).width + 12);
      ctx.fillStyle = "rgba(20,10,10,.85)"; ctx.fillRect(4, 4, w, 18);
      ctx.fillStyle = "#ff8a8a"; ctx.textAlign = "left"; ctx.textBaseline = "top"; ctx.fillText("FOUT: " + err, 10, 8, 748);
      ctx.restore();
    }
  };
})();
</script>
