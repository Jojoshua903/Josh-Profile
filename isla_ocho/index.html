<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>WIDR Sports Resort</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage"></div>
<div id="vignette"></div>

<div id="hud" class="hidden">
  <div id="hud-left"><div id="hud-title"></div><div id="hud-info"></div></div>
  <div id="hud-right"><div id="hud-score-label">Score</div><div id="hud-score">0</div></div>
  <div id="hud-buttons">
    <button id="hud-vr" class="hidden">🥽 Enter VR</button>
    <button data-set="music" title="Music (M)">🎵</button>
    <button id="hud-menu" title="Back to sports (Esc)">✕ Sports</button>
  </div>
  <div id="crosshair"></div>
  <div id="toast"></div>
  <div id="hud-host"><div class="av"></div><div class="bubble"><b></b><span></span></div></div>
  <div id="power"><div id="power-fill"></div><div id="power-mark"></div><span>Power</span></div>
</div>

<div id="menu">
  <header>
    <div class="brand">
      <span class="sun"></span>
      <div>
        <h1>WIDR Resort</h1>
        <p>Twelve sports on WIDR Island &middot; with the WIDR crew</p>
      </div>
    </div>
    <div class="menu-side">
      <div id="medal-count"></div>
      <div class="settings">
        <button data-set="music">🎵 Music</button>
        <button data-set="sfx">🔊 Sound</button>
        <button data-set="quality">✨ High</button>
      </div>
      <div id="vr-note">Checking for a VR headset…</div>
    </div>
  </header>
  <div id="menu-host"><div class="av"></div><div class="bubble"><b>Josh · resort owner</b><span></span></div></div>
  <div id="cast"></div>
  <div id="cards"></div>
  <footer>Aim with the mouse (or your finger), <b>hold</b> to charge, <b>release</b> to throw. <b>Esc</b> returns here · <b>M</b> toggles music.</footer>
</div>

<div id="end" class="hidden">
  <div class="end-card">
    <div class="end-kicker" id="end-sport"></div>
    <div class="end-medal" id="end-medal"></div>
    <div class="end-medal-name" id="end-medal-name"></div>
    <div class="end-score" id="end-score"></div>
    <div class="end-best" id="end-best"></div>
    <div class="end-quote" id="end-quote"></div>
    <div class="end-actions">
      <button id="end-again">Play again</button>
      <button id="end-menu" class="ghost">All sports</button>
    </div>
  </div>
</div>

<div id="fade"></div>
<script type="module" src="core.js"></script>
</body>
</html>
